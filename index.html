<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>칸 라이언즈 2026 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 고정 등급 탭 + 단일 컬럼 아카이브. 썸네일은 등급 색의 '트로피 플레이트'로 표현 */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15171C; --muted:#5A5F6A; --line:#D9DCE2;
  --accent:#A3262A;
  --gp:#1E2740; --gp-ink:#E3C77A;
  --gold:#A87C24; --silver:#737B86; --bronze:#94532F; --plate-ink:#FFFFFF;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:18px;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
nav.tiers{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tiers a{text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tiers a .dot{width:8px;height:8px;border-radius:50%}
nav.tiers a:hover{color:var(--ink);background:var(--bg)}
nav.tiers a[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:40px 80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* home */
.hero{display:grid;gap:14px;max-width:720px;margin-bottom:40px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tiertile{text-decoration:none;display:grid;gap:18px;padding:22px;border-radius:6px;color:var(--plate-ink);min-height:180px;align-content:space-between;position:relative;overflow:hidden}
.tiertile h2{font-size:26px;font-weight:900;color:inherit}
.tiertile .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.85}
.tiertile .bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.tiertile .bar i{display:block;height:100%;background:currentColor}
.tiertile:hover{filter:brightness(1.08)}
.tiertile.soon{opacity:.55}
.t-gp{background:var(--gp);color:var(--gp-ink)} .t-gold{background:var(--gold)} .t-silver{background:var(--silver)} .t-bronze{background:var(--bronze)}
.note{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:72ch}

/* tier list */
.listhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:18px}
.listhead h1{font-size:clamp(28px,4vw,38px);font-weight:900}
.listhead .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px}
.card{text-decoration:none;display:grid;gap:10px;min-width:0}
.card .ttl{font-weight:600;font-size:16px;line-height:1.4}
.card .sub{font-size:13px;color:var(--muted);line-height:1.5}
.card:hover .plate{transform:translateY(-2px)}
.card.pending .ttl{color:var(--muted)}

/* plate (thumbnail) */
.plate{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--plate-ink);transition:transform .2s}
.plate .cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.plate .mark{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,28px);line-height:1.15;letter-spacing:-.02em;position:relative;z-index:1;max-width:85%}
.plate .play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.9;z-index:1}
.plate .play::after{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.plate .rings{position:absolute;right:-30%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid currentColor;opacity:.16;box-shadow:0 0 0 18px transparent,0 0 0 19px currentColor}
.plate .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.plate.has-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45));z-index:0}
.plate.has-thumb{color:#fff}
.plate.has-thumb .mark,.plate.has-thumb .rings{display:none}
.plate.has-thumb .cat,.plate.has-thumb .play{z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.plate.has-thumb .play{background:rgba(0,0,0,.35)}
.vplay{all:unset;display:block;cursor:pointer;border-radius:5px}
.vplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vlink{display:block;text-decoration:none}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:5px;background:#000;display:block}
.vmeta a{color:inherit}
.p-gp{background:var(--gp);color:var(--gp-ink)} .p-gold{background:var(--gold)} .p-silver{background:var(--silver)} .p-bronze{background:var(--bronze)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.done{border-color:var(--accent);color:var(--accent)}

/* detail */
.back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:20px}
.back:hover{color:var(--ink)}
.dhead{display:grid;gap:12px;margin-bottom:28px;max-width:800px}
.dhead h1{font-size:clamp(28px,4.5vw,42px);font-weight:900;line-height:1.25}
.dhead .ko{font-size:17px;color:var(--muted);margin:0}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:13px;font-weight:600;padding:4px 10px;border-radius:3px;color:var(--plate-ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.vids{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:24px}
.media{max-width:720px;margin-bottom:8px}
.media.with-desc{max-width:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.media.with-desc .vdesc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);margin-bottom:24px}
.media.with-desc .vdesc[open] .vbody{max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:860px){.media.with-desc{display:block}.media.with-desc .vdesc{position:static}.media.with-desc .vdesc[open] .vbody{max-height:none}}
.video{display:grid;gap:8px;text-decoration:none;min-width:0}
.vmeta{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.5}
.vmeta b{color:var(--ink);font-size:14px}
.video:hover .vmeta span{color:var(--accent)}

.video .plate{aspect-ratio:16/9}
.video .plate .mark{font-size:clamp(28px,5vw,48px)}
.video .plate .play{width:56px;height:56px;right:22px;bottom:22px}
.video .plate .play::after{border-left-width:14px;border-top-width:9px;border-bottom-width:9px}
.vcap{font-size:13px;color:var(--muted);margin:0 0 20px}
.vdesc{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:36px}
.vdesc summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.vdesc summary::-webkit-details-marker{display:none}
.vdesc summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.vdesc[open] summary::after{content:"−"}
.vdesc .vbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.vdesc .vbody p{margin:14px 0 0;max-width:62ch}
.vdesc .vnote{font-size:13px;color:var(--muted)}
.vdesc h4{margin:22px 0 0;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent)}
.vdesc .flink{color:var(--accent);font-weight:600}
.vclose{margin-top:20px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.vclose:hover{color:var(--ink)}
.vcap a{color:var(--accent)}
article section{padding-block:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px}
@media (max-width:600px){article section{grid-template-columns:minmax(0,1fr);gap:8px}}
article section h2{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.02em;padding-top:2px}
article section p{margin:0 0 .8em;max-width:62ch}
article section p:last-child{margin-bottom:0}
article ul{margin:0;padding-left:1.1em;max-width:62ch;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{border-left:2px solid var(--accent);padding-left:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
aside.facts{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px}
@media (max-width:860px){aside.facts{position:static}}
aside.facts dl{margin:0;display:grid;gap:12px}
aside.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
aside.facts dd{margin:2px 0 0;font-size:15px;font-weight:500;line-height:1.5}
.sources{font-size:13px;color:var(--muted)}
.sources ol{padding-left:1.2em;margin:6px 0 0;display:grid;gap:4px}
.sources a{color:var(--muted)}
.pendingbox{border:1px dashed var(--line);border-radius:6px;padding:22px;color:var(--muted);max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;color:var(--muted);max-width:48%}
.pager a b{display:block;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#">칸 라이언즈 아카이브 <small>2026</small></a>
  <nav class="tiers" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const TIERS = {
  "grand-prix": {name:"그랑프리 · 티타늄", short:"그랑프리", cls:"gp", desc:"부문별 최고상인 그랑프리와, 업계의 방향을 바꾼 작품에 주는 티타늄 수상작."},
  "gold": {name:"골드", short:"골드", cls:"gold", desc:"골드 라이언 수상작."},
  "silver": {name:"실버", short:"실버", cls:"silver", desc:"실버 라이언 수상작."},
  "bronze": {name:"브론즈", short:"브론즈", cls:"bronze", desc:"브론즈 라이언 수상작."}
};

/* 출처 목록: Love The Work More 2026 페이지 기준 */
const E = [
 {id:"haven", tier:"grand-prix", title:"Haven", brand:"Suncorp Insurance", agency:"Leo Australia, Sydney", country:"호주", cat:"Titanium", awards:["티타늄 그랑프리"], video:"https://www.youtube.com/watch?v=Pwf50R9flkU",
  ko:"주소를 입력하면 '우리 집'이 직접 기상 위험을 알려주는 보험사의 디지털 툴",
  bg:[
   "호주에서 극한 기상은 점점 잦아지고 강해지는 중. 썬코프 자체 데이터로는 호주 주소 270만 곳 이상이 최소 한 가지 극한 기상(폭풍·산불·홍수·사이클론)의 고위험 지역에 있음. 그런데 보험 청구 10건 중 9건은 미리 대비했다면 막을 수 있었던 피해였음.",
   "문제는 사람들이 이를 자기 일로 여기지 않는다는 것. 호주인의 35%는 기후 재난이 자신에게는 영향을 주지 않을 거라고 믿었고, 이 믿음이 대비하지 않는 이유가 됨.",
   "썬코프는 2021년부터 보험사의 역할을 '사고 후 보상'에서 '사고 전 대비'로 넓히는 작업을 이어오고 있었음. 재난에 견디는 집을 설계·시험한 'One House'(2021, 2022 칸 이노베이션 그랑프리), 그 교훈을 재난 다발 지역 마을의 집 다섯 채에 적용한 'Resilience Road'(2022), 'If Your Home Could Talk'(2023)에 이은 것이 Haven."
  ],
  solIntro:["위험을 '내 집' 단위로 보여주기로 함. 주소를 입력하면 그 집이 직접 화자가 되어, 어떤 기상 위험에 취약하고 무엇을 고쳐야 하는지 설명하는 무료 디지털 툴."],
  sol:[
   "썬코프의 자연재해 위험 데이터에 CoreLogic(건물 연식·주택 유형), WillyWeather(실시간 날씨), Google(3D 지도·스트리트뷰·주변 철물점) 데이터를 API로 연결",
   "집마다 다른 맞춤 영상과 내려받을 수 있는 회복력 리포트를 생성. 리포트는 폭풍·사이클론·홍수·산불별 위험도와 보강 방법을 정리",
   "2025년 5월 출시. TV 주택 리노베이션 프로그램에 녹여 넣고 옥외·영화관·소셜·인플루언서·유튜브·스포티파이로 확산",
   "1,100만 채가 넘는 호주 주택의 위험을 각각 분석. 기술 개발에만 2년 소요"
  ],
  stats:[["28만+","출시 첫해 방문자"],["74%","이용 후 집 보강 의향"],["1위","썬코프 홈보험 순위"]],
  results:["이번 칸에서 티타늄 그랑프리를 포함해 사자상 4개를 받음."],
  analysis:[
   "보험 광고의 흔한 공식인 공포 소구를 쓰지 않았음. 같은 위험 정보라도 말하는 주체를 보험사에서 '내 집'으로 바꾸자, 경고가 아니라 내 집에 대한 진단처럼 받아들여짐. '나와는 상관없다'고 믿는 35%에게 가장 직접적으로 반박하는 방식.",
   "단발성 캠페인이 아니라 2021년부터 이어진 '대비' 전략의 네 번째 단계라는 점도 중요함. 보험사가 광고 문구가 아니라 실제로 쓸 수 있는 서비스로 역할 변화를 증명한 사례."

  videoDesc:[{"h": "케이스 영상 (약 2분 15초)", "p": ["'2035년이면 기후변화 때문에 호주 주택의 10%가 보험에 들 수 없게 될 수 있다'는 문장으로 시작.", "썬코프가 몇 년째 보험업계의 방향을 '피해 복구'에서 '미리 대비'로 이끌어왔다고 소개. 재난이 오기 전에 집을 튼튼하게 만드는 데 집중해야 한다는 관계자 인터뷰가 이어짐.", "그동안의 단계를 차례로 보여줌. 산불·홍수·사이클론을 견디는 집 한 채(One House)에서 거리 하나(Resilience Road)로, 이제는 나라 전체로. 이를 위해 1,100만 채가 넘는 집의 위험을 하나하나 파악해야 했다고 설명함.", "Haven 시연 장면. 주소를 입력하면 집이 '안녕, 나야, 너희 집. 드디어 얘기하게 됐네'라며 말을 걸고, 산불·폭풍·홍수 같은 위험과 대비책을 알려줌. 산불 위험이 있는 집이라면 창에 방충망을 달라고 권하는 식.", "작동 원리 설명. 썬코프 자체 재해 데이터를 포함한 12개의 대규모 데이터를 엮어 집마다 특성을 파악하고, 사용자마다 다른 영상을 만들어냄.", "출시 당일 뉴스 보도가 이어짐. 썬코프가 자기 데이터를 공개한 첫 보험사라는 점, 이사 갈 집 주변 환경을 미리 알 수 있다는 점, 정기 관리 일정과 지역 시공업체까지 알려준다는 점이 소개됨.", "'모두가 집을 더 튼튼하게 만들면, 기상 재해가 우리 삶과 지역사회에 주는 피해도 줄어든다'는 말로 마무리."]}, {"h": "메인 영상: About Suncorp Haven (약 1분 30초)", "p": ["썬코프가 직접 올린 툴 소개 영상.", "관계자가 재난 현장에 나가 보니 많은 집주인이 자기 집이 어떤 위험에 놓여 있는지 모르고 있었다는 이야기로 시작함.", "이어 집의 목소리가 직접 등장함. '안녕, 나야, 너희 집.' '나 같은 집은 폭풍 위험이 높아.'", "리포트와 영상이 폭풍·사이클론·산불·홍수별 위험도와 맞춤 대비책을 알려준다고 설명하며 마무리."]}],

  videoDesc:[{"h": "케이스 영상 (약 2분)", "p": ["나레이션 없이 음악과 화면 자막, 뉴스 보도 음성으로 진행됨.", "폐허가 된 가자지구 화면 위로 '가자에서는 인도적 지원과 의료가 차단됐다', '가장 큰 피해자는 전쟁 말고도 예방할 수 있는 병에 시달리는 아이들'이라는 자막이 나옴. 카리타스가 이 봉쇄 문제에 관심을 모으려 나섰다고 소개함.", "날짜 자막으로 과정을 보여줌. 2024년 11월 5일, 카리타스가 교황에게 포프모빌을 아동 이동 진료소로 바꾸자고 제안. 2024년 12월 18일, 교황이 답함. 화면에는 '교황께서 이 프로젝트를 승인하셨으며, 함께하는 모든 이를 위해 기도하신다'는 내용의 답신이 나옴.", "베들레헴에서 정비공들이 용접하며 차량을 개조하는 장면과, 완성된 진료실 내부가 이어짐. '교황이 앉던 자리에서 하루 200명의 아이들이' 치료받는다는 자막이 나옴.", "이후 CNN·BBC·뉴욕타임스 등 전 세계 언론 로고와 보도 장면이 몽타주로 이어짐. 앵커들은 이것이 교황의 마지막 소원 중 하나였다고 전하면서, 이 차가 봉쇄를 뚫고 들어갈 수 있을지는 아직 모른다고 말함.", "성과 수치: TV·라디오 보도 2,800건 이상, 기사 5,200건 이상, X 언급 94,000건, 전체 언급 103,000건.", "'이스라엘은 여전히 인도적 지원과 의료를 강하게 제한하고 있다'는 자막 뒤, 'The Vehicle of Hope' 타이틀로 마무리."]}],

  results:["야권이 확보한 결과지는 곤살레스의 큰 승리를 보여줬지만, 선관위는 마두로의 승리를 발표했고 결과지는 공개하지 않았음. 미국은 곤살레스의 승리를 인정했고, 브라질·콜롬비아 정상도 전체 결과지 공개를 요구함. 정권은 폭력으로 대응해 2,000명이 넘는 시민을 투옥했고, 정치범은 여전히 수감 중.",

  videoDesc:[{"h": "먼저 알아둘 맥락", "p": ["베네수엘라는 전자투표를 하는데, 투표가 끝나면 투표기마다 개표 결과를 영수증처럼 길게 출력함. 여기에는 후보별 득표수와 QR코드, 관계자 서명이 들어가고, 각 정당 참관인도 한 장씩 받을 수 있음. 선관위가 어떤 숫자를 발표하든, 이 종이가 실제 개표 결과의 원본 증거인 셈."]}, {"h": "케이스 영상 (약 2분)", "p": ["'탄압 속에서 치러진 대선, 선거 당국은 정권의 편이었다'는 나레이션으로 시작.", "표를 평화적으로 지키려면, 결과가 조작되기 전에 진짜 결과를 먼저 확보해야 했음. 수년간 준비한 끝에 정권이 모르고 열어둔 허점을 찾아냄. 바로 개표 결과지의 QR코드. 투표 테이블마다 출력되는 결과지에 그 테이블의 결과가 QR코드로 담겨 있었음.", "코만도 콘 베네수엘라는 휴대폰 하나로 시민 60만 명을 '검증자'로 만드는 앱을 만듦. 참관인들은 수개월 동안 위험을 무릅쓰고 교육받았고, 선거 당일 전국 1만 5천 개 투표소, 3만 개가 넘는 테이블에서 QR코드를 몰래 찍어 전송함.", "선관위가 10년 넘게 집권해온 인물(마두로)의 승리를 발표하자, 야권 지도자는 그날 밤 바로 카메라 앞에 섬.", "이틀 뒤 전체 결과지의 85%가 웹사이트에 공개됐고, 검증된 데이터는 국제 검증 기관과 외교 채널로 전달됨.", "정권은 폭력으로 대응했고, 2,000명이 넘는 시민이 투옥됨.", "2025년 노벨평화상이 진실을 지켜온 베네수엘라 사람들에게 돌아갔다는 내용과 함께, '투명성이 보장되지 않을 때, 시민들이 직접 그것을 만들었다'는 문장으로 마무리."]}],

  bg:[

  videoDesc:[{"h": "케이스 영상 (약 2분)", "p": ["'우유가 있는 곳엔 오레오가 있어야 한다. 그런데 멕시코 전체에 이걸 어떻게 증명할까?'라는 나레이션으로 시작.", "벨티드 갤로웨이 소를 소개하며 '우리는 이 소를 오레오 소라고 부른다. 일상 속에 숨어 있던 우리의 쿠키'라고 함.", "이어서 메인 필름 장면들이 나옴. 마을 사람들은 농부가 소에 페인트칠을 한 거라고 수군거리고, 농부는 '칠했으면 이렇게 똑같아 보이겠냐'고 받아침.", "'LEGEN-DAIRY'라는 자막이 나오는데, '전설적인(legendary)'과 '유제품(dairy)'을 합친 말장난.", "틱톡 인플루언서들이 오레오 소 우유병을 소개하는 장면, 마트 카트에 담긴 공동 브랜드 우유가 이어짐. 농부는 '이제 모두가 내 소들의 우유를 마신다'고 말함.", "성과 수치(언론 노출 가치 1,710만 달러 등)가 나온 뒤, '오레오 소 우유에 오레오를 찍어 먹다니, 완전 인셉션이네'라는 대사로 마무리."]}, {"h": "메인 필름: The man who believed (약 5분)", "p": ["다큐멘터리처럼 찍은 코미디. 마을 사람들이 '그 사람 소에 칠한 거야', '있다고 꿈만 꾸는 거지, 미쳤어'라고 수군거리는 장면으로 시작함.", "주인공의 자기소개. '친구들에겐 루피요, 안 믿는 사람들에겐 과달루페 로페스.' 루피요는 과달루페의 애칭. 멕시코에 목장은 많지만 자기 소들 같은 건 없다며, '얘네는 내 오레오예요. 소 모양일 뿐'이라고 함.", "그가 받는 혐의는 소에 페인트칠을 했다는 것. 그는 '칠했다면 이렇게 똑같아 보이겠냐, 이 무늬는 마법처럼 생긴 것'이라고 반박함.", "그가 내놓는 이론. 쿠키가 당겨서 외양간에 오레오 한 봉지를 뒀는데, 돌아와 보니 먹보 소 '클레타'가 다 먹어치웠다는 것. '아보카도를 뒀으면 초록색 소가 나왔겠죠. 제가 화성 소를 키우는 건 아니잖아요?'", "그는 소들을 '바키하스'라고 부름. 소(vaca)와 딸(hija)을 합친 말로, 딸처럼 아낀다는 뜻. 주변의 한 여성은 부끄럽다면서도, 자기를 아끼듯 소들을 아끼는 마음이라 좋다고 말함.", "아무도 믿어주지 않자 그는 오레오 본사에 이메일을 보냄. 오레오 사람들이 찾아와 소를 확인하고, 망설임 없이 '오레오 소'라고 인정함. 오레오 측은 '오레오가 보이는 곳엔 오레오가 있고, 오레오가 있는 곳엔 우유가 있다'고 말함.", "초페오가 무엇인지 설명하는 장면. 차갑거나 따뜻한 우유 한 잔에 오레오를 넣어 찍어 먹는 것.", "오레오 측의 권유로 그가 이 우유로 처음 초페오를 해보고, '왜 진작 안 먹어봤지' 하며 목장 사람 모두에게 맛보게 함.", "그를 비웃던 마을 사람은 '루피요요? 훌륭한 사람이죠'라고 말을 바꾸고, 어머니는 '난 늘 내 아들을 믿었다'고 함.", "마지막 개그. 루피요가 '소들이 유명해졌으니 아무도 이 우유로 찍어 먹는 아이디어를 훔치지 않길' 바라자, 옆에서 '루피요, 그건 원래 있던 거야. 네가 발명한 게 아니야'라고 핀잔을 줌."]}],

const isDone = e => !!e.bg;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try { const h = new URL(u).hostname.replace("www.",""); return h.includes("youtu") ? "YouTube" : h.includes("vimeo") ? "Vimeo" : h; } catch(e){ return "링크"; } };

/* 일반 웹사이트(깃허브)에서만 실제 썸네일·페이지 내 재생 사용. Claude 아티팩트는 외부 이미지·영상을 막기 때문 */
const LIVE = !/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname) && location.protocol.startsWith("http");
function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/)([\w-]{11})/); return m?m[1]:null; }
function vmId(u){ const m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m?m[1]:null; }
function thumbOf(u){ const y=ytId(u); if(y) return `https://i.ytimg.com/vi/${y}/hqdefault.jpg`; const v=vmId(u); if(v) return `https://vumbnail.com/${v}.jpg`; return null; }
function embedOf(u){ const y=ytId(u); if(y) return `https://www.youtube-nocookie.com/embed/${y}?autoplay=1&rel=0`; const v=vmId(u); if(v) return `https://player.vimeo.com/video/${v}?autoplay=1`; return null; }
function plate(e, big, label, url){
  const cls = TIERS[e.tier].cls;
  const th = LIVE ? thumbOf(url||e.video) : null;
  return `<div class="plate p-${cls} ${th?"has-thumb":""}">${th?`<img class="thumb" src="${esc(th)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-thumb');this.remove()">`:""}<span class="rings"></span>
    <span class="cat">${esc(label||e.cat)}</span>
    <span class="mark">${esc(e.brand)}</span>
    ${e.noVideo ? "" : '<span class="play" aria-hidden="true"></span>'}</div>`;
}

function renderNav(route){
  const nav = document.getElementById("nav");
  const cur = route.startsWith("c-") ? (E.find(x => "c-"+x.id === route)||{}).tier : route;
  nav.innerHTML = Object.entries(TIERS).map(([k,t]) =>
    `<a href="#${k}" ${cur===k?'aria-current="page"':""}><span class="dot" style="background:var(--${t.cls})"></span>${t.short}</a>`).join("");
}

function home(){
  const tiles = Object.entries(TIERS).map(([k,t]) => {
    const list = E.filter(e => e.tier===k), done = list.filter(isDone).length;
    const meta = list.length ? `${done} / ${list.length}편 정리 완료` : "정리 예정";
    const pct = list.length ? Math.round(done/list.length*100) : 0;
    return `<a class="tiertile t-${t.cls} ${list.length?"":"soon"}" href="#${k}">
      <span class="meta">${k==="grand-prix"?"GRAND PRIX · TITANIUM":k.toUpperCase()}</span>
      <h2>${t.name}</h2>
      <div><div class="meta" style="margin-bottom:8px">${meta}</div><div class="bar"><i style="width:${pct}%"></i></div></div></a>`;
  }).join("");
  return `<section class="hero">
    <span class="eyebrow">Cannes Lions International Festival of Creativity · 2026</span>
    <h1>2026 칸 라이언즈 수상작을<br>한국어로 읽는 아카이브</h1>
    <p>수상 등급별로 작품을 모았음. 각 작품은 영상, 브랜드와 캠페인명, 배경 및 문제, 해결, 성과, 분석 순서로 정리.</p>
  </section>
  <div class="tiergrid">${tiles}</div>
  <p class="note">수상작 목록은 Love The Work More의 2026 정리 페이지를 기준으로 함. 배경과 전략은 각 작품 페이지 하단에 표기한 업계 매체·심사 자료를 바탕으로 정리했음. 영상은 보안상 페이지 안에서 바로 재생되지 않아, 썸네일을 누르면 YouTube·Vimeo 원본이 새 탭으로 열림.</p>`;
}

let filter = "all";
function tierPage(k){
  const t = TIERS[k], list = E.filter(e => e.tier===k);
  if(!list.length) return `<div class="listhead"><h1>${t.name}</h1></div><div class="pendingbox">${t.name} 수상작은 그랑프리 정리가 끝난 뒤 순서대로 추가할 예정임.</div>`;
  const shown = filter==="done" ? list.filter(isDone) : list;
  const cards = shown.map(e => `<a class="card ${isDone(e)?"":"pending"}" href="#c-${e.id}">
      ${plate(e,false,null,e.video)}
      <div><div class="ttl">${esc(e.title)}</div><div class="sub">${esc(e.brand)} · ${esc(e.awards.join(", "))}</div></div>
      <div>${isDone(e)?'<span class="chip done">정리 완료</span>':'<span class="chip">정리 예정</span>'}</div></a>`).join("");
  return `<div class="listhead"><div><span class="eyebrow">${k==="grand-prix"?"Grand Prix · Titanium":k}</span><h1>${t.name}</h1></div>
    <span class="count">${list.filter(isDone).length} / ${list.length}편 정리 완료</span></div>
    <div class="filters" role="group" aria-label="보기">
      <button type="button" id="f-all" aria-pressed="${filter==="all"}" data-f="all">전체</button>
      <button type="button" id="f-done" aria-pressed="${filter==="done"}" data-f="done">정리 완료만</button>
    </div>
    <div class="cards">${cards}</div>`;
}

function paras(arr){ return arr.map(p => `<p>${esc(p)}</p>`).join(""); }
function detail(e){
  const t = TIERS[e.tier], list = E.filter(x => x.tier===e.tier), i = list.indexOf(e);
  const prev = list[i-1], next = list[i+1];
  const awards = e.awards.map(a => `<span class="award p-${t.cls}">${esc(a)}</span>`).join("");
  const vids = [{kind: e.noVideo ? "케이스 자료" : "케이스 영상", url:e.video}].concat(FILMS[e.id]||[]);
  let body;
  if(isDone(e)){
    body = `<article>
      <section><h2>배경 및 문제</h2><div>${paras(e.bg)}</div></section>
      <section><h2>해결</h2><div>${paras(e.solIntro)}<ul style="margin-top:4px">${e.sol.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
      <section><h2>성과</h2><div>${e.stats?`<div class="stats">${e.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}${paras(e.results)}</div></section>
      <section><h2>분석</h2><div>${paras(e.analysis)}</div></section>
    </article>`;
  } else {
    body = `<div class="pendingbox">이 작품의 배경과 전략은 아직 정리 전임. 영상과 수상 정보만 먼저 확인할 수 있음.</div>`;
  }
  const facts = `<aside class="facts"><dl>
      <div><dt>브랜드</dt><dd>${esc(e.brand)}</dd></div>
      <div><dt>캠페인</dt><dd>${esc(e.title)}</dd></div>
      <div><dt>에이전시</dt><dd>${esc(e.agency)}</dd></div>
      ${e.country?`<div><dt>국가</dt><dd>${esc(e.country)}</dd></div>`:""}
      <div><dt>수상</dt><dd>${esc(e.awards.join(" / "))}</dd></div>
    </dl>
    ${e.sources?`<div class="sources"><span class="eyebrow">출처</span><ol>${e.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ol></div>`:""}
  </aside>`;
  return `<a class="back" href="#${e.tier}">← ${t.name} 목록</a>
    <header class="dhead"><div class="awards">${awards}</div><h1>${esc(e.title)}</h1>${e.ko?`<p class="ko">${esc(e.ko)}</p>`:""}</header>
    <section class="media ${e.videoDesc?"with-desc":""}">
      <div class="vids ${vids.length>1?"two":""}">${vids.map(v=>{ const em = LIVE ? embedOf(v.url) : null; const meta=`<span class="vmeta"><b>${esc(v.kind)}</b><span>${v.title?esc(v.title)+" · ":""}<a href="${esc(v.url)}" target="_blank" rel="noopener">${host(v.url)}에서 보기 ↗</a></span></span>`; return em ? `<div class="video"><button type="button" class="vplay" data-embed="${esc(em)}" aria-label="${esc(v.kind)} 재생">${plate(e,true,v.kind,v.url)}</button>${meta}</div>` : `<div class="video"><a class="vlink" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(v.kind)} 열기">${plate(e,true,v.kind,v.url)}</a>${meta}</div>`; }).join("")}</div>
      ${e.videoDesc?`<details class="vdesc" id="vd-${e.id}"><summary>영상 내용</summary><div class="vbody">${e.videoDesc.map(sec=>typeof sec==="string"?`<p>${esc(sec)}</p>`:`<h4>${esc(sec.h)}</h4>${paras(sec.p)}`).join("")}${e.videoNote?`<p class="vnote">${esc(e.videoNote)}</p>`:""}<button type="button" class="vclose">접기 ▲</button></div></details>`:""}
    </section>
    <div class="dgrid"><div style="min-width:0">
      ${body}
      <nav class="pager">${prev?`<a href="#c-${prev.id}">← 이전<b>${esc(prev.title)}</b></a>`:"<span></span>"}${next?`<a href="#c-${next.id}" style="text-align:right">다음 →<b>${esc(next.title)}</b></a>`:""}</nav>
    </div>${facts}</div>`;
}

function route(keepScroll){
  const r = location.hash.replace("#","");
  const app = document.getElementById("app");
  let html;
  if(TIERS[r]) html = tierPage(r);
  else if(r.startsWith("c-") && E.find(e => "c-"+e.id===r)) html = detail(E.find(e => "c-"+e.id===r));
  else html = home();
  app.innerHTML = html;
  renderNav(r);
  if (matchMedia("(min-width: 861px)").matches) app.querySelectorAll(".media.with-desc .vdesc").forEach(d => d.open = true);
  app.querySelectorAll(".vclose").forEach(b => b.addEventListener("click", () => {
    const d = b.closest("details"); d.open = false;
    const r = d.getBoundingClientRect();
    if (r.top < 80) window.scrollBy({top: r.top - 90, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  app.querySelectorAll(".vplay").forEach(b => b.addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = b.dataset.embed; f.className = "vframe"; f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; f.title = b.getAttribute("aria-label");
    b.replaceWith(f);
  }));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; route(true); }));
  if(keepScroll !== true) window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => route());
route();
</script>

</body>
</html>
