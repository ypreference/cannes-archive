<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>칸 라이언즈 2026 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 고정 등급 탭 + 단일 컬럼 아카이브. 썸네일은 등급 색의 '트로피 플레이트'로 표현 */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15171C; --muted:#5A5F6A; --line:#D9DCE2;
  --accent:#A3262A;
  --gp:#1E2740; --gp-ink:#E3C77A;
  --gold:#A87C24; --silver:#737B86; --bronze:#94532F; --plate-ink:#FFFFFF;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:18px;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
nav.tiers{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tiers a{text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tiers a .dot{width:8px;height:8px;border-radius:50%}
nav.tiers a:hover{color:var(--ink);background:var(--bg)}
nav.tiers a[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:40px 80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* home */
.hero{display:grid;gap:14px;max-width:720px;margin-bottom:40px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tiertile{text-decoration:none;display:grid;gap:18px;padding:22px;border-radius:6px;color:var(--plate-ink);min-height:180px;align-content:space-between;position:relative;overflow:hidden}
.tiertile h2{font-size:26px;font-weight:900;color:inherit}
.tiertile .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.85}
.tiertile .bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.tiertile .bar i{display:block;height:100%;background:currentColor}
.tiertile:hover{filter:brightness(1.08)}
.tiertile.soon{opacity:.55}
.t-gp{background:var(--gp);color:var(--gp-ink)} .t-gold{background:var(--gold)} .t-silver{background:var(--silver)} .t-bronze{background:var(--bronze)}
.note{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:72ch}

/* tier list */
.listhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:18px}
.listhead h1{font-size:clamp(28px,4vw,38px);font-weight:900}
.listhead .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px}
.card{text-decoration:none;display:grid;gap:10px;min-width:0}
.card .ttl{font-weight:600;font-size:16px;line-height:1.4}
.card .sub{font-size:13px;color:var(--muted);line-height:1.5}
.card:hover .plate{transform:translateY(-2px)}
.card.pending .ttl{color:var(--muted)}

/* plate (thumbnail) */
.plate{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--plate-ink);transition:transform .2s}
.plate .cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.plate .mark{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,28px);line-height:1.15;letter-spacing:-.02em;position:relative;z-index:1;max-width:85%}
.plate .play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.9;z-index:1}
.plate .play::after{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.plate .rings{position:absolute;right:-30%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid currentColor;opacity:.16;box-shadow:0 0 0 18px transparent,0 0 0 19px currentColor}
.plate .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.plate.has-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45));z-index:0}
.plate.has-thumb{color:#fff}
.plate.has-thumb .mark,.plate.has-thumb .rings{display:none}
.plate.has-thumb .cat,.plate.has-thumb .play{z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.plate.has-thumb .play{background:rgba(0,0,0,.35)}
.vplay{all:unset;display:block;cursor:pointer;border-radius:5px}
.vplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vlink{display:block;text-decoration:none}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:5px;background:#000;display:block}
.vmeta a{color:inherit}
.p-gp{background:var(--gp);color:var(--gp-ink)} .p-gold{background:var(--gold)} .p-silver{background:var(--silver)} .p-bronze{background:var(--bronze)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.done{border-color:var(--accent);color:var(--accent)}

/* detail */
.back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:20px}
.back:hover{color:var(--ink)}
.dhead{display:grid;gap:12px;margin-bottom:28px;max-width:800px}
.dhead h1{font-size:clamp(28px,4.5vw,42px);font-weight:900;line-height:1.25}
.dhead .ko{font-size:17px;color:var(--muted);margin:0}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:13px;font-weight:600;padding:4px 10px;border-radius:3px;color:var(--plate-ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.vids{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:24px}
.media{max-width:720px;margin-bottom:8px}
.media.with-desc{max-width:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.media.with-desc .vdesc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);margin-bottom:24px}
.media.with-desc .vdesc[open] .vbody{max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:860px){.media.with-desc{display:block}.media.with-desc .vdesc{position:static}.media.with-desc .vdesc[open] .vbody{max-height:none}}
.video{display:grid;gap:8px;text-decoration:none;min-width:0}
.vmeta{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.5}
.vmeta b{color:var(--ink);font-size:14px}
.video:hover .vmeta span{color:var(--accent)}

.video .plate{aspect-ratio:16/9}
.video .plate .mark{font-size:clamp(28px,5vw,48px)}
.video .plate .play{width:56px;height:56px;right:22px;bottom:22px}
.video .plate .play::after{border-left-width:14px;border-top-width:9px;border-bottom-width:9px}
.vcap{font-size:13px;color:var(--muted);margin:0 0 20px}
.vdesc{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:36px}
.vdesc summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.vdesc summary::-webkit-details-marker{display:none}
.vdesc summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.vdesc[open] summary::after{content:"−"}
.vdesc .vbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.vdesc .vbody p{margin:14px 0 0;max-width:62ch}
.vdesc .vnote{font-size:13px;color:var(--muted)}
.vdesc h4{margin:22px 0 0;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent)}
.vdesc .flink{color:var(--accent);font-weight:600}
.vclose{margin-top:20px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.vclose:hover{color:var(--ink)}
.vcap a{color:var(--accent)}
article section{padding-block:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px}
@media (max-width:600px){article section{grid-template-columns:minmax(0,1fr);gap:8px}}
article section h2{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.02em;padding-top:2px}
article section p{margin:0 0 .8em;max-width:62ch}
article section p:last-child{margin-bottom:0}
article ul{margin:0;padding-left:1.1em;max-width:62ch;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{border-left:2px solid var(--accent);padding-left:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
aside.facts{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px}
@media (max-width:860px){aside.facts{position:static}}
aside.facts dl{margin:0;display:grid;gap:12px}
aside.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
aside.facts dd{margin:2px 0 0;font-size:15px;font-weight:500;line-height:1.5}
.sources{font-size:13px;color:var(--muted)}
.sources ol{padding-left:1.2em;margin:6px 0 0;display:grid;gap:4px}
.sources a{color:var(--muted)}
.pendingbox{border:1px dashed var(--line);border-radius:6px;padding:22px;color:var(--muted);max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;color:var(--muted);max-width:48%}
.pager a b{display:block;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#">칸 라이언즈 아카이브 <small>2026</small></a>
  <nav class="tiers" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const TIERS = {
  "grand-prix": {name:"그랑프리 · 티타늄", short:"그랑프리", cls:"gp", desc:"부문별 최고상인 그랑프리와, 업계의 방향을 바꾼 작품에 주는 티타늄 수상작."},
  "gold": {name:"골드", short:"골드", cls:"gold", desc:"골드 라이언 수상작."},
  "silver": {name:"실버", short:"실버", cls:"silver", desc:"실버 라이언 수상작."},
  "bronze": {name:"브론즈", short:"브론즈", cls:"bronze", desc:"브론즈 라이언 수상작."}
};

/* 출처 목록: Love The Work More 2026 페이지 기준 */
const E = [
 {id:"haven", tier:"grand-prix", title:"Haven", brand:"Suncorp Insurance", agency:"Leo Australia, Sydney", country:"호주", cat:"Titanium", awards:["티타늄 그랑프리"], video:"https://www.youtube.com/watch?v=Pwf50R9flkU",
  ko:"주소를 입력하면 '우리 집'이 직접 기상 위험을 알려주는 보험사의 디지털 툴",
  bg:[
   "호주에서 극한 기상은 점점 잦아지고 강해지는 중. 썬코프 자체 데이터로는 호주 주소 270만 곳 이상이 최소 한 가지 극한 기상(폭풍·산불·홍수·사이클론)의 고위험 지역에 있음. 그런데 보험 청구 10건 중 9건은 미리 대비했다면 막을 수 있었던 피해였음.",
   "문제는 사람들이 이를 자기 일로 여기지 않는다는 것. 호주인의 35%는 기후 재난이 자신에게는 영향을 주지 않을 거라고 믿었고, 이 믿음이 대비하지 않는 이유가 됨.",
   "썬코프는 2021년부터 보험사의 역할을 '사고 후 보상'에서 '사고 전 대비'로 넓히는 작업을 이어오고 있었음. 재난에 견디는 집을 설계·시험한 'One House'(2021, 2022 칸 이노베이션 그랑프리), 그 교훈을 재난 다발 지역 마을의 집 다섯 채에 적용한 'Resilience Road'(2022), 'If Your Home Could Talk'(2023)에 이은 것이 Haven."
  ],
  solIntro:["위험을 '내 집' 단위로 보여주기로 함. 주소를 입력하면 그 집이 직접 화자가 되어, 어떤 기상 위험에 취약하고 무엇을 고쳐야 하는지 설명하는 무료 디지털 툴."],
  sol:[
   "썬코프의 자연재해 위험 데이터에 CoreLogic(건물 연식·주택 유형), WillyWeather(실시간 날씨), Google(3D 지도·스트리트뷰·주변 철물점) 데이터를 API로 연결",
   "집마다 다른 맞춤 영상과 내려받을 수 있는 회복력 리포트를 생성. 리포트는 폭풍·사이클론·홍수·산불별 위험도와 보강 방법을 정리",
   "2025년 5월 출시. TV 주택 리노베이션 프로그램에 녹여 넣고 옥외·영화관·소셜·인플루언서·유튜브·스포티파이로 확산",
   "1,100만 채가 넘는 호주 주택의 위험을 각각 분석. 기술 개발에만 2년 소요"
  ],
  stats:[["28만+","출시 첫해 방문자"],["74%","이용 후 집 보강 의향"],["1위","썬코프 홈보험 순위"]],
  results:["이번 칸에서 티타늄 그랑프리를 포함해 사자상 4개를 받음."],
  analysis:[
   "보험 광고의 흔한 공식인 공포 소구를 쓰지 않았음. 같은 위험 정보라도 말하는 주체를 보험사에서 '내 집'으로 바꾸자, 경고가 아니라 내 집에 대한 진단처럼 받아들여짐. '나와는 상관없다'고 믿는 35%에게 가장 직접적으로 반박하는 방식.",
   "단발성 캠페인이 아니라 2021년부터 이어진 '대비' 전략의 네 번째 단계라는 점도 중요함. 보험사가 광고 문구가 아니라 실제로 쓸 수 있는 서비스로 역할 변화를 증명한 사례."

  videoDesc:[{"h": "케이스 영상 (약 2분 15초)", "p": ["'2035년이면 기후변화 때문에 호주 주택의 10%가 보험에 들 수 없게 될 수 있다'는 문장으로 시작.", "썬코프가 몇 년째 보험업계의 방향을 '피해 복구'에서 '미리 대비'로 이끌어왔다고 소개. 재난이 오기 전에 집을 튼튼하게 만드는 데 집중해야 한다는 관계자 인터뷰가 이어짐.", "그동안의 단계를 차례로 보여줌. 산불·홍수·사이클론을 견디는 집 한 채(One House)에서 거리 하나(Resilience Road)로, 이제는 나라 전체로. 이를 위해 1,100만 채가 넘는 집의 위험을 하나하나 파악해야 했다고 설명함.", "Haven 시연 장면. 주소를 입력하면 집이 '안녕, 나야, 너희 집. 드디어 얘기하게 됐네'라며 말을 걸고, 산불·폭풍·홍수 같은 위험과 대비책을 알려줌. 산불 위험이 있는 집이라면 창에 방충망을 달라고 권하는 식.", "작동 원리 설명. 썬코프 자체 재해 데이터를 포함한 12개의 대규모 데이터를 엮어 집마다 특성을 파악하고, 사용자마다 다른 영상을 만들어냄.", "출시 당일 뉴스 보도가 이어짐. 썬코프가 자기 데이터를 공개한 첫 보험사라는 점, 이사 갈 집 주변 환경을 미리 알 수 있다는 점, 정기 관리 일정과 지역 시공업체까지 알려준다는 점이 소개됨.", "'모두가 집을 더 튼튼하게 만들면, 기상 재해가 우리 삶과 지역사회에 주는 피해도 줄어든다'는 말로 마무리."]}, {"h": "메인 영상: About Suncorp Haven (약 1분 30초)", "p": ["썬코프가 직접 올린 툴 소개 영상.", "관계자가 재난 현장에 나가 보니 많은 집주인이 자기 집이 어떤 위험에 놓여 있는지 모르고 있었다는 이야기로 시작함.", "이어 집의 목소리가 직접 등장함. '안녕, 나야, 너희 집.' '나 같은 집은 폭풍 위험이 높아.'", "리포트와 영상이 폭풍·사이클론·산불·홍수별 위험도와 맞춤 대비책을 알려준다고 설명하며 마무리."]}],

  videoDesc:[{"h": "케이스 영상 (약 2분)", "p": ["나레이션 없이 음악과 화면 자막, 뉴스 보도 음성으로 진행됨.", "폐허가 된 가자지구 화면 위로 '가자에서는 인도적 지원과 의료가 차단됐다', '가장 큰 피해자는 전쟁 말고도 예방할 수 있는 병에 시달리는 아이들'이라는 자막이 나옴. 카리타스가 이 봉쇄 문제에 관심을 모으려 나섰다고 소개함.", "날짜 자막으로 과정을 보여줌. 2024년 11월 5일, 카리타스가 교황에게 포프모빌을 아동 이동 진료소로 바꾸자고 제안. 2024년 12월 18일, 교황이 답함. 화면에는 '교황께서 이 프로젝트를 승인하셨으며, 함께하는 모든 이를 위해 기도하신다'는 내용의 답신이 나옴.", "베들레헴에서 정비공들이 용접하며 차량을 개조하는 장면과, 완성된 진료실 내부가 이어짐. '교황이 앉던 자리에서 하루 200명의 아이들이' 치료받는다는 자막이 나옴.", "이후 CNN·BBC·뉴욕타임스 등 전 세계 언론 로고와 보도 장면이 몽타주로 이어짐. 앵커들은 이것이 교황의 마지막 소원 중 하나였다고 전하면서, 이 차가 봉쇄를 뚫고 들어갈 수 있을지는 아직 모른다고 말함.", "성과 수치: TV·라디오 보도 2,800건 이상, 기사 5,200건 이상, X 언급 94,000건, 전체 언급 103,000건.", "'이스라엘은 여전히 인도적 지원과 의료를 강하게 제한하고 있다'는 자막 뒤, 'The Vehicle of Hope' 타이틀로 마무리."]}],

  results:["야권이 확보한 결과지는 곤살레스의 큰 승리를 보여줬지만, 선관위는 마두로의 승리를 발표했고 결과지는 공개하지 않았음. 미국은 곤살레스의 승리를 인정했고, 브라질·콜롬비아 정상도 전체 결과지 공개를 요구함. 정권은 폭력으로 대응해 2,000명이 넘는 시민을 투옥했고, 정치범은 여전히 수감 중.",

  videoDesc:[{"h": "먼저 알아둘 맥락", "p": ["베네수엘라는 전자투표를 하는데, 투표가 끝나면 투표기마다 개표 결과를 영수증처럼 길게 출력함. 여기에는 후보별 득표수와 QR코드, 관계자 서명이 들어가고, 각 정당 참관인도 한 장씩 받을 수 있음. 선관위가 어떤 숫자를 발표하든, 이 종이가 실제 개표 결과의 원본 증거인 셈."]}, {"h": "케이스 영상 (약 2분)", "p": ["'탄압 속에서 치러진 대선, 선거 당국은 정권의 편이었다'는 나레이션으로 시작.", "표를 평화적으로 지키려면, 결과가 조작되기 전에 진짜 결과를 먼저 확보해야 했음. 수년간 준비한 끝에 정권이 모르고 열어둔 허점을 찾아냄. 바로 개표 결과지의 QR코드. 투표 테이블마다 출력되는 결과지에 그 테이블의 결과가 QR코드로 담겨 있었음.", "코만도 콘 베네수엘라는 휴대폰 하나로 시민 60만 명을 '검증자'로 만드는 앱을 만듦. 참관인들은 수개월 동안 위험을 무릅쓰고 교육받았고, 선거 당일 전국 1만 5천 개 투표소, 3만 개가 넘는 테이블에서 QR코드를 몰래 찍어 전송함.", "선관위가 10년 넘게 집권해온 인물(마두로)의 승리를 발표하자, 야권 지도자는 그날 밤 바로 카메라 앞에 섬.", "이틀 뒤 전체 결과지의 85%가 웹사이트에 공개됐고, 검증된 데이터는 국제 검증 기관과 외교 채널로 전달됨.", "정권은 폭력으로 대응했고, 2,000명이 넘는 시민이 투옥됨.", "2025년 노벨평화상이 진실을 지켜온 베네수엘라 사람들에게 돌아갔다는 내용과 함께, '투명성이 보장되지 않을 때, 시민들이 직접 그것을 만들었다'는 문장으로 마무리."]}],

  bg:[

   "실존하는 소라는 점이 설득력의 핵심. 억지로 갖다 붙인 연결이 아니라 '자연이 만든 증거'라서, 과장된 주장 없이도 '오레오엔 우유'라는 메시지가 성립함."

  videoDesc:[{"h": "케이스 영상 (약 2분)", "p": ["'우유가 있는 곳엔 오레오가 있어야 한다. 그런데 멕시코 전체에 이걸 어떻게 증명할까?'라는 나레이션으로 시작.", "벨티드 갤로웨이 소를 소개하며 '우리는 이 소를 오레오 소라고 부른다. 일상 속에 숨어 있던 우리의 쿠키'라고 함.", "이어서 메인 필름 장면들이 나옴. 마을 사람들은 농부가 소에 페인트칠을 한 거라고 수군거리고, 농부는 '칠했으면 이렇게 똑같아 보이겠냐'고 받아침.", "'LEGEN-DAIRY'라는 자막이 나오는데, '전설적인(legendary)'과 '유제품(dairy)'을 합친 말장난.", "틱톡 인플루언서들이 오레오 소 우유병을 소개하는 장면, 마트 카트에 담긴 공동 브랜드 우유가 이어짐. 농부는 '이제 모두가 내 소들의 우유를 마신다'고 말함.", "성과 수치(언론 노출 가치 1,710만 달러 등)가 나온 뒤, '오레오 소 우유에 오레오를 찍어 먹다니, 완전 인셉션이네'라는 대사로 마무리."]}, {"h": "메인 필름: The man who believed (약 5분)", "p": ["다큐멘터리처럼 찍은 코미디. 마을 사람들이 '그 사람 소에 칠한 거야', '있다고 꿈만 꾸는 거지, 미쳤어'라고 수군거리는 장면으로 시작함.", "주인공의 자기소개. '친구들에겐 루피요, 안 믿는 사람들에겐 과달루페 로페스.' 루피요는 과달루페의 애칭. 멕시코에 목장은 많지만 자기 소들 같은 건 없다며, '얘네는 내 오레오예요. 소 모양일 뿐'이라고 함.", "그가 받는 혐의는 소에 페인트칠을 했다는 것. 그는 '칠했다면 이렇게 똑같아 보이겠냐, 이 무늬는 마법처럼 생긴 것'이라고 반박함.", "그가 내놓는 이론. 쿠키가 당겨서 외양간에 오레오 한 봉지를 뒀는데, 돌아와 보니 먹보 소 '클레타'가 다 먹어치웠다는 것. '아보카도를 뒀으면 초록색 소가 나왔겠죠. 제가 화성 소를 키우는 건 아니잖아요?'", "그는 소들을 '바키하스'라고 부름. 소(vaca)와 딸(hija)을 합친 말로, 딸처럼 아낀다는 뜻. 주변의 한 여성은 부끄럽다면서도, 자기를 아끼듯 소들을 아끼는 마음이라 좋다고 말함.", "아무도 믿어주지 않자 그는 오레오 본사에 이메일을 보냄. 오레오 사람들이 찾아와 소를 확인하고, 망설임 없이 '오레오 소'라고 인정함. 오레오 측은 '오레오가 보이는 곳엔 오레오가 있고, 오레오가 있는 곳엔 우유가 있다'고 말함.", "초페오가 무엇인지 설명하는 장면. 차갑거나 따뜻한 우유 한 잔에 오레오를 넣어 찍어 먹는 것.", "오레오 측의 권유로 그가 이 우유로 처음 초페오를 해보고, '왜 진작 안 먹어봤지' 하며 목장 사람 모두에게 맛보게 함.", "그를 비웃던 마을 사람은 '루피요요? 훌륭한 사람이죠'라고 말을 바꾸고, 어머니는 '난 늘 내 아들을 믿었다'고 함.", "마지막 개그. 루피요가 '소들이 유명해졌으니 아무도 이 우유로 찍어 먹는 아이디어를 훔치지 않길' 바라자, 옆에서 '루피요, 그건 원래 있던 거야. 네가 발명한 게 아니야'라고 핀잔을 줌."]}],
  videoNote:"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리함. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮김.",

 {"id":"virginia-giuffre","tier":"grand-prix","title":"The Legacy of Virginia Giuffre","brand":"Virginia Giuffre","agency":"Dini von Mueffling Communications, New York","country":"미국","cat":"Titanium · PR","awards":["티타늄"],"video":"https://www.youtube.com/watch?v=J_45sFUTkhw","ko":"제프리 엡스타인 성착취 피해 생존자 버지니아 주프레가 세상을 떠난 뒤, 그녀의 이야기와 싸움을 이어간 1년간의 PR 활동","bg":["버지니아 주프레는 제프리 엡스타인과 길레인 맥스웰의 성착취 피해를 공개적으로 고발한 생존자이자 활동가. 엡스타인 일당을 상대로 증언했고, 영국 앤드루 왕자에게 소송을 제기했음. PR 에이전시 DVMC는 2019년부터 그녀의 대변인 역할을 맡아왔음.","문제는 그녀가 자기 이야기를 마음껏 할 수 없었다는 것. 진행 중인 소송 때문에 발언이 제한됐고, 파산에 이를 만한 명예훼손 소송과 가족을 향한 폭력의 위협에 계속 시달렸음.","2025년 4월 그녀는 스스로 생을 마감함. 그 직전 대리인에게 함께 준비한 회고록을 반드시 출간해달라고, 형제들에게는 자신의 뜻을 이어달라고 부탁했음. 남은 과제는 그녀의 죽음을 둘러싼 음모론과 잘못된 정보 속에서 그녀의 이야기를 정확히 전하고, 책임을 묻는 싸움이 그녀와 함께 사라지지 않게 하는 것이었음."],"solIntro":["광고나 영상 대신 1년 내내 이어진 언론 대응으로 풀었음. 예산은 0원, 전부 무상 작업. 에이전시 대표는 매주 새 사건이 터지는 상황이라 정해진 전략보다 그때그때 대응하는 쪽에 가까웠다고 설명함."],"sol":["그녀가 사망한 당일, 한 명의 기자와 함께 그녀의 삶을 정리한 결정판 기사를 내고 다른 언론은 이 기사를 참고하도록 안내. 사망을 둘러싼 왜곡을 초기에 차단","가족이 공개 발언자로 나설 수 있도록 뉴욕 주요 언론사 방문, 미디어 트레이닝, 인터뷰 일정 조율을 지원","2025년 10월 회고록 『Nobody's Girl』 출간을 조율","가을 내내 다른 생존자, 정치인들과 함께 미 의회 집회와 기자회견을 지원","엡스타인 수사 파일 공개를 요구하는 '엡스타인 파일 투명성법' 통과를 위해 목소리를 냄. 법은 2025년 11월 통과","2026년 1월, 성매매·인신매매 범죄에 대한 연방 공소시효를 없애는 '버지니아 법' 발의를 지원"],"stats":[["140만 부","회고록 영어판 판매"],["300만 건","공개된 엡스타인 파일"],["약 50명","사임한 권력자"],["119개국","보도된 국가"]],"results":["앤드루 왕자는 왕실 작위를 박탈당했고 이후 체포됨. 캠페인 측은 누적 순방문자(UVM) 1,130억 회를 기록했다고 밝힘. 이번 칸에서 티타늄과 PR 부문 브론즈를 받음."],"analysis":["영상도, 광고 지면도, 예산도 없이 티타늄을 받은 사례. 에이전시 대표 스스로 '우리는 영화를 만들지 않았다'고 말함. 크리에이티비티가 무엇을 만드느냐가 아니라 무엇을 바꾸느냐로 평가될 수 있다는 걸 보여줌.","PR의 핵심이 메시지를 만드는 일이 아니라 '누가 말하게 할 것인가'를 설계하는 일이라는 점이 드러남. 당사자가 더 이상 말할 수 없게 되자, 회고록과 가족이라는 두 개의 목소리를 세워 그녀의 이야기가 계속 들리게 만듦."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["에이전시 대표 디니 폰 뮈플링의 1인칭 나레이션으로 진행됨. '2019년부터 성착취 생존자 버지니아와 일했다'는 말로 시작함.","버지니아는 엡스타인, 맥스웰 등을 상대로 증언하고 앤드루 왕자를 고소했으며, 생존자가 믿음을 얻고 정의를 찾을 수 있도록 자기 이야기가 알려지길 간절히 원했다고 소개함.","하지만 소송 때문에 발언이 제한됐고, 명예훼손 소송과 폭력의 위협이 끊이지 않았다고 설명함.","이어 그녀가 2025년 4월 세상을 떠났다는 사실과, 그 직전 회고록 출간과 가족에게 자신의 뜻을 이어달라는 부탁을 남겼다는 이야기가 나옴.","그 후 1년간 한 일들이 차례로 나옴. 그녀의 삶을 정리한 결정판 기사, 가족이 공개 발언자로 서도록 돕기, 의회에서 생존자·정치인과 함께한 발언, 앤드루 왕자의 작위 박탈과 체포.","성과 정리: 회고록 『Nobody's Girl』 영어판 140만 부 판매, 엡스타인 파일 투명성법 시행과 300만 건의 파일 공개, 권력자 약 50명 사임, 공소시효를 없애는 '버지니아 법' 발의.","'버지니아가 자신과 생존자들을 위해 찾던 정의를 얻을 때까지 계속하겠다'는 말로 마무리."]}],"videoNote":"실제 영상의 자막·나레이션을 확인해 정리함. 이 캠페인은 별도 광고 필름이 없음.","sources":[["Campaign (사례 인터뷰)","https://campaignlive.com/article/0-earned-media-campaign-honoring-virginia-giuffre-won-big-cannes/1963256"],["Campaign (티타늄 발표)","https://campaignlive.com/article/cannes-lions-2026-oreo-cows-legacy-virginia-giuffre-win-titanium/1963008"],["AP (회고록 판매)","https://ny1.com/nyc/all-boroughs/ap-top-news/2025/12/16/virginia-roberts-guiffres-memoir-sells-1m-copies-worldwide"],["ABC7 (앤드루 체포)","https://abc7ny.com/post/britains-former-prince-andrew-arrested-suspicion-misconduct-public-office-police-say/18619779/"]]},
 {"id":"faroe-space-program","tier":"grand-prix","title":"The Faroe Islands Space Program","brand":"SKF","agency":"Nord DDB, Stockholm","country":"스웨덴 / 페로 제도","cat":"Creative B2B","awards":["크리에이티브 B2B 그랑프리"],"video":"https://www.youtube.com/watch?v=I182TbpuV0U","ko":"하늘이 아니라 바다 아래로 내려가는 '우주 프로그램'. 달의 인력이 만드는 조류로 전기를 만드는 기술을 우주 경쟁에 빗대 알린 B2B 캠페인","bg":["SKF는 1907년부터 마찰을 줄이는 제품을 만들어온 스웨덴 기업. 대표 제품은 베어링이고 130개국, 40개 산업에 진출해 있음. SKF에 따르면 전 세계에서 생산되는 에너지의 20%가 마찰을 이기는 데 쓰임. 마찰을 줄이면 그만큼 쓸 수 있는 에너지가 늘어난다는 것이 이 회사의 존재 이유.","문제는 사람들이 SKF를 '베어링 회사'로만 안다는 것. 회사가 보여주고 싶은 모습은 에너지를 아끼게 해주는 클린테크 기업이었음. 게다가 타깃은 기술 애호가부터 베어링이 뭔지도 모르는 사람까지 넓었고, B2B 광고는 보통 제품의 이성적 장점만 늘어놓는 방식이라 주목받기 어려웠음.","시기도 좋지 않았음. 에너지 수요는 커지는데 재생에너지에 대한 관심은 줄고 있었고, 강대국들은 자원을 찾아 달로 눈을 돌리는 '새로운 우주 경쟁'에 열중하던 때."],"solIntro":["우주 경쟁에 맞서는 대신 거기에 올라탔음. 북대서양의 작은 섬나라 페로 제도에서 '우주 프로그램'을 출범시킨 것. 단, 이 우주 프로그램은 절대 지구를 떠나지 않음.","핵심은 조력 에너지를 '달 에너지'로 다시 포장한 것. 바닷물이 밀려왔다 빠지는 조류는 달의 인력 때문에 생기니, 조류로 전기를 만드는 건 곧 지구에서 달의 힘을 쓰는 셈. 로켓 대신 바닷속으로 내려가는 수중 '우주선'이 그 역할을 함."],"sol":["SKF, 조력발전 기업 미네스토(Minesto), 페로 제도 국영 전력회사 SEV가 함께 참여. 미네스토의 수중 연 형태 조력발전기 '드래곤'을 SKF 기술과 결합","우주 프로그램에 있을 법한 요소를 모두 갖춤. 카운트다운, 발사, 우주선 도장까지. 수중 발전기에 칠한 페인트는 4개월간 3.5G의 힘을 견뎌야 했음","200개가 넘는 대본을 쓰고 그만큼의 편집본을 테스트. 날씨 때문에 촬영 일정이 2주 앞당겨져, 대형 제작사 없이 소규모 팀이 직접 섬으로 날아가 촬영","광고 캠페인이 아니라 실제 프로그램으로 보이게 PR을 운영. 기술을 깊이 다룬 영상도 별도로 제작","SKF의 장기 플랫폼 'Fighting Friction(마찰과의 싸움)'의 첫 번째 프로젝트"],"stats":[["8억+","노출"],["1,400건+","언론 보도"],["16개+","도입을 논의 중인 시장"],["40%","2030년 섬 전력 중 조력 목표 비중"]],"results":["BBC, CNBC, 이코노미스트 등이 보도했고, 기술 심층 영상은 2,500만 회 조회됨. SEV는 이 기술로 2030년까지 섬 전력의 40%를 만들 계획이라고 밝힘. 이번 칸에서 크리에이티브 B2B 그랑프리와 크리에이티브 전략 부문 골드를 받음."],"analysis":["B2B 기술을 설명하는 대신, 대중이 이미 관심 갖는 이야기(우주 경쟁)에 얹었음. '조력발전 기술'이라고 하면 아무도 안 보지만 '달의 힘을 쓰는 우주 프로그램'이라고 하면 뉴스가 됨. 뉴스의 흐름을 거꾸로 뒤집은 프레이밍이 핵심.","SKF는 자기 제품을 앞에 내세우지 않았음. 대신 '지금 있는 자원을 최대한 활용한다'는 회사의 철학을 실제 프로젝트로 보여줌. 베어링 회사에서 클린테크 기업으로 인식을 바꾸려는 목표에, 제품 광고보다 더 직접적으로 답한 방식.","B2B 구매자도 결국 사람이라는 에이전시의 관점이 깔려 있음. 이성적 장점 나열 대신 상상력을 건드리는 이야기로 엔지니어들까지 스스로 콘텐츠를 공유하게 만들었음."],"films":[{"kind":"메인 필름","title":"Launching The Faroe Islands Space Program","url":"https://www.youtube.com/watch?v=RpnyotHMOyQ"}],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["'에너지 수요는 그 어느 때보다 높고, 재생에너지에 대한 관심은 줄고 있다'는 뉴스 화면들로 시작함. 강대국들은 자원을 찾아 달을 바라보고, 화면 속 사람들은 '우주 경쟁'을 외침.","에이전시는 과제를 '사람들의 관심을 다시 지구로 돌리고, 새 기술로 지구의 자원을 더 잘 쓸 수 있다는 걸 보여주는 것'이라고 설명함.","그래서 세 파트너를 외딴 섬으로 불러 모았고, 우주 경쟁과 싸우는 대신 우주 프로그램을 출범시켜 거기에 합류했다고 함.","카운트다운 같은 우주 프로그램다운 장면이 이어지다가 반전이 나옴. 이 우주 프로그램은 지구를 떠나지 않고, SKF와 미네스토의 기술로 달의 인력이 만드는 조력 에너지를 붙잡는다는 것.","뉴스 앵커들이 '아이슬란드와 노르웨이 사이 작은 섬들이 세상에서 가장 멋진 우주 프로그램을 가졌다'고 보도하고, 한 인터뷰어는 '나는 늘 위를 보는데, 당신들은 로켓을 아래로 보낸다는 거냐'고 묻기도 함.","성과: SEV는 2030년까지 섬 전력의 40%를 이 기술로 만들 계획이고, 16개 이상의 시장이 도입을 논의 중.","'에너지에 굶주린 세상에서, 이 프로그램은 우리가 이미 가진 지구의 자원을 더 잘 쓸 수 있다는 걸 일깨워준다'는 말로 마무리."]},{"h":"메인 필름: Launching The Faroe Islands Space Program (약 1분 30초)","p":["미네스토 공식 채널 영상. 진지한 우주 발사 다큐멘터리처럼 연출됨.","'에너지 수요 증가가 새로운 우주 경쟁을 불러왔다. 강대국들이 달의 자원을 차지하려 경쟁하는 지금, 세계에서 가장 작은 나라 중 하나가 이 경쟁에 뛰어든다. 단 하나 다른 점이 있다'는 나레이션으로 시작함.","'이 우주 프로그램은 절대 지구를 떠나지 않는다. 우리에겐 이미 끝없는 달의 힘이 있다. 바로 조력 에너지다.'","'우리 우주선은 위로 올라가지 않고 아래로 내려가, 물속을 날 것이다.' 조류가 발전기를 통과하며 매일 지구에서 '달 에너지'를 만들어낸다고 설명함.","이 프로그램이 2030년까지 재생에너지 100%를 목표로 하는 페로 제도 계획의 일부라고 밝히며, '이미 가진 자원을 최대한 활용하는 일에 함께하자'로 마무리."]}],"videoNote":"실제 영상의 자막·나레이션을 확인해 정리함. 자동 생성 자막의 오류는 맥락에 맞게 바로잡음.","sources":[["LBB Online (제작 비하인드)","https://lbbonline.com/news/NORD-DDB-SKF-Minesto-Sev-Faroe-Islands-Space-Program"],["Minesto 보도자료 (수상)","https://www.inderes.fi/en/releases/minesto-ab-global-exposure-for-minestos-tidal-dragons-following-cannes-lions-grand-prix-win"]]},
 {"id":"abinbev-creativity-at-scale","tier":"grand-prix","title":"Creativity at Scale","brand":"AB InBev","agency":"Anheuser-Busch InBev (자사 출품)","country":"벨기에 (글로벌)","cat":"Creative Brand","awards":["크리에이티브 브랜드 그랑프리"],"video":"https://1drv.ms/i/c/4e9ba448a9f90a4d/IQBpy9w4o5vNQbTsYl5UqQRuAQ8lwGGLzZg_iLShKSkxaBg?e=6MDgRz","noVideo":true,"ko":"광고 한 편이 아니라 '크리에이티브를 꾸준히 만들어내는 회사의 시스템'에 준 상. 올해 신설된 크리에이티브 브랜드 부문의 첫 그랑프리","bg":["크리에이티브 브랜드 라이언즈는 2026년에 처음 생긴 부문. 캠페인 한 편이 아니라, 좋은 크리에이티브를 반복해서 만들어내는 회사의 시스템·문화·역량을 평가함. 출품작도 광고 영상이 아니라 조직 운영 방식과 제작 프로세스를 설명하는 전략 문서였음.","AB InBev는 버드와이저, 코로나, 스텔라 아르투아 등 수백 개 브랜드를 가진 세계 최대 맥주 회사. 이 정도 규모에서 크리에이티브의 품질을 브랜드와 나라마다 들쑥날쑥하지 않게 유지하는 것 자체가 과제임.","다만 공개된 자료에는 특정 시기에 회사가 겪은 비즈니스 문제나 수치는 나오지 않음. 출품의 초점은 문제 해결보다 '크리에이티브를 성장 수단으로 체계화한 방식'에 있음."],"solIntro":["크리에이티브를 담당 부서의 일이 아니라 회사 운영 방식 자체로 만들었음. 심사위원단은 크리에이티브가 조직 문화에 박혀 있고, 전 세계 사업에서 체계적인 성장 수단으로 쓰이고 있다는 점을 수상 이유로 들었음."],"sol":["크리에이티브를 최고경영진(C레벨) 차원의 우선순위로 둠","사내에 크리에이티브 효과를 측정하는 시스템을 운영해, 크리에이티브의 품질과 실제 매출 성과의 연결을 확인","이 방식을 수백 개 브랜드, 여러 나라에 걸쳐 확장 가능하고 측정 가능한 형태로 만듦","심사 기준은 크리에이티브 역량의 수준, 강한 아이디어를 만들어내는 능력, 비즈니스 효과, 지속성 네 가지"],"stats":[["3회","칸 올해의 크리에이티브 마케터 (최초)"],["37개","2025년 칸 수상 수"],["71편","이 부문 출품작 수"]],"results":["AB InBev는 2026년 칸 '올해의 크리에이티브 마케터'로도 선정됨. 세 번째 수상이며 처음 있는 일. 회사는 역대 최고 매출을 기록했다고 밝힘. 이 부문에서는 금·은·동상 없이 그랑프리 하나만 수여됨."],"analysis":["칸이 '결과물'뿐 아니라 '결과물을 만드는 구조'에도 상을 주기 시작했다는 점이 이 수상의 의미. 한 번 크게 터진 캠페인보다, 몇 년에 걸쳐 여러 브랜드와 나라에서 꾸준히 좋은 작업이 나오게 하는 능력이 평가 대상이 됨.","AB InBev가 내세우는 핵심은 '크리에이티브는 언제나 성장을 위해 존재한다'는 것. 크리에이티브를 감각의 영역이 아니라 측정하고 관리하는 경영 도구로 다뤘다는 점이 이 부문의 정의와 정확히 맞아떨어짐.","참고로 이 부문 심사위원장 마르셀 마르콘데스는 AB InBev의 글로벌 CMO임. 심사 회피 여부는 보도되지 않았음."],"sources":[["Cannes Lions 공식 발표","https://www.canneslions.com/news/73rd-cannes-lions-international-festival-of-creativity-announces-first-winners"],["The Stable","https://www.thestable.com.au/cannes-lions-ab-inbev-is-the-inaugural-winner-in-creative-brand/"],["CB News","https://www.cbnews.fr/node/101862"],["Campaign (올해의 마케터)","https://www.campaignlive.com/article/ab-inbev-wins-cannes-lions-creative-marketer-year-award-third-time/1957200"]]},
 {"id":"wedding-rice","tier":"grand-prix","title":"The Wedding Rice","brand":"Wikifarmer","agency":"McCann Athens","country":"그리스","cat":"Creative Business Transformation","awards":["크리에이티브 비즈니스 트랜스포메이션 그랑프리"],"video":"https://www.youtube.com/watch?v=Xop6AbopFeQ","ko":"판매 규격에서 탈락한 쌀을 결혼식 '쌀 던지기' 전용 쌀로 팔아, 버려지던 쌀을 농가의 새 수입원으로 바꾼 그리스 농산물 플랫폼의 사업","bg":["그리스에서는 결혼식이 끝나고 나오는 신혼부부에게 쌀을 뿌리는 전통이 있음. 풍요와 다산을 비는 의미로, 그리스에서 가장 아끼는 결혼 풍습 중 하나. 그리스의 결혼식은 한 해 5만 건이 넘음.","문제는 이 전통 때문에 매년 200톤이 넘는 먹을 수 있는 쌀이 버려진다는 것. 국내 쌀 생산자들은 이미 수요를 맞추기도 버거운 상황이었음.","반대편에는 농가의 문제가 있었음. 그리스 쌀 농가는 소득이 낮았고, 생산량의 약 30%는 상품 규격에 못 미친다는 이유로 팔지 못하는 쌀로 분류됐음.","위키파머는 농부가 직접 농산물을 올려 파는 그리스의 농산물 온라인 플랫폼. 이 두 문제를 한 번에 풀 방법을 찾았음."],"solIntro":["버려지는 전통에 버려지는 쌀을 연결했음. 규격 미달로 팔 수 없던 쌀을 모아 결혼식에서 뿌리는 용도 전용 상품 'The Wedding Rice(웨딩 라이스)'로 만들어 판매함. 결혼식 하객은 먹을 쌀을 버리지 않아도 되고, 농가는 팔 수 없던 쌀로 돈을 벌게 됨."],"sol":["위키파머와 칼라스트라 지역 농업협동조합이 함께 참여","위키파머 마켓플레이스에서 농부가 직접 웨딩 라이스를 등록하고 결혼식 플래너에게 바로 판매하는 구조. 일반 쌀보다 싼 값에 판매","그리스 정부가 이 사업을 공식 지지함","같은 전통을 가진 나라의 농부와 결혼식 플래너를 연결하는 열린 프로그램으로 확장"],"stats":[["3톤","출시 첫 주 판매량"],["+110%","위키파머 마켓플레이스 트래픽"],["15개국","같은 전통을 가진 확장 대상 국가"],["2,000만 건","이 나라들의 연간 결혼식 수"]],"results":["CNN, 포춘, 애드에이지, 허핑턴포스트 등 해외 매체가 보도함. 그리스가 칸 라이언즈에서 받은 첫 그랑프리. 이 부문에는 151편이 출품됐음."],"analysis":["심사위원장은 이 작품의 힘을 '단순함'으로 꼽았음. 복잡한 기술이나 운영 없이, 이미 있는 문화(쌀 던지기)를 활용해 큰 경제 문제(농가 소득과 음식 낭비)를 풀었다는 것.","이 부문은 광고가 아니라 사업 모델의 변화를 평가함. 웨딩 라이스는 메시지가 아니라 새 상품이자 새 유통 경로이고, 농가에는 없던 수입원을 만들어냄. 심사위원단이 아이디어와 결과 사이의 연결이 명확하다고 평가한 이유.","심사위원단은 결과를 증명하지 못한 혁신적인 출품작들은 탈락시켰다고 밝힘. 이 부문에서는 아이디어의 새로움보다 실제로 사업이 바뀌었다는 증거가 더 중요하다는 뜻."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["나레이션 없이 음악과 화면 자막으로 진행됨.","'그리스에서 가장 아끼는 전통 중 하나는 신혼부부에게 쌀을 뿌리는 것'이라는 자막과 함께 결혼식 장면으로 시작함.","이어서 문제가 나옴. '매년 200톤이 넘는 먹을 수 있는 쌀이 버려진다.' 동시에 '농부 생산량의 30%는 상품 규격에 맞지 않아 먹을 수 없는 쌀로 취급된다.' 바닥에 흩어진 쌀을 쓸어 담는 장면이 겹쳐짐.","위키파머가 '낭비하는 전통'을 바꾸기로 했다는 자막 뒤, 'The Wedding Rice' 출시가 소개됨.","위키파머 사이트 화면이 나오며 작동 방식을 보여줌. 농부가 마켓플레이스에 웨딩 라이스를 올리고 결혼식 플래너에게 직접 판매함.","정부가 이 사업을 지지했다는 자막과 함께, CNN·포춘·허핑턴포스트 등 언론 보도가 화면을 채움.","성과: 첫 주에 3톤 판매, 위키파머 마켓플레이스 트래픽 110% 증가.","마지막으로 세계 지도 위에 같은 전통을 가진 15개국, 연간 2,000만 건의 결혼식을 표시하며, 이 나라들의 농부와 결혼식 플래너를 연결하겠다고 밝힘."]}],"videoNote":"실제 영상의 화면 자막을 확인해 정리함. 이 캠페인은 별도 광고 필름이 확인되지 않음.","sources":[["CB News (심사평)","https://www.cbnews.fr/node/101984"],["Greek Reporter (그리스 첫 그랑프리)","https://greekreporter.com/2026/06/27/greece-secure-historic-first-grand-prix-cannes-lions-festival/"],["The Stable","https://www.thestable.com.au/mccann-worldgroup-greece-non-edible-rice-makes-a-greek-wedding-tradition-sustainable/"],["designboom","https://www.designboom.com/design/wedding-rice-non-edible-grains-ceremonial-use-against-food-waste-04-20-2025/"]]},
 {"id":"lucky-fan-index","tier":"grand-prix","title":"Lucky Fan Index","brand":"Wisła Kraków","agency":"VML Kraków / Warsaw","country":"폴란드","cat":"Creative Commerce","awards":["크리에이티브 커머스 그랑프리"],"video":"https://www.youtube.com/watch?v=7mswC-WeF-M","ko":"'내가 경기장에 가면 팀이 이긴다'는 축구팬의 미신을 데이터로 수치화해, 팬마다 '행운 지수'를 매긴 폴란드 축구 클럽","bg":["비스와 크라쿠프는 폴란드에서 가장 오래된 축구 클럽 중 하나이자 리그의 전통 강호. 그런 클럽이 1부 리그에서 강등되면서 재정에 큰 타격을 입었음.","강등된 클럽에게 경기장을 채우는 일은 분위기 문제가 아니라 생존 문제. 티켓 수입이 곧 클럽의 버팀목이었기 때문. 과제는 강등 후 멀어진 팬들을 다시 경기장으로 불러오는 것이었음."],"solIntro":["축구팬이라면 다 아는 미신에서 출발했음. '내가 경기장에 있으면 팀이 이긴다.' 이 미신을 진짜 숫자로 만들어, 팬 한 명 한 명이 팀에 가져다준 행운을 측정하는 세계 최초의 통계 'Lucky Fan Index(행운의 팬 지수)'를 만듦.","재료는 이미 클럽 손에 있었음. 폴란드에서는 법적으로 모든 클럽이 경기장에 들어오는 팬의 신원을 확인해야 함. 규제 때문에 쌓아두기만 하던 입장 기록을 상업적인 데이터로 바꾼 것."],"sol":["수년치 입장 기록을 골, 놓친 골, 기대 득점, 실점, 카드, 부상 등 200개가 넘는 경기 지표와 교차 분석. 22만 명이 넘는 팬, 홈경기 63경기를 분석함","팬마다 개인 행운 지수를 부여. 막내 선수가 130초 만에 두 골을 넣은 경기에 있었다면 지수가 오르고, 막판 역전패를 당한 경기에 있었다면 크게 떨어짐","웹 앱에서 자기 지수를 확인하고 다른 팬과 비교하거나 소셜에 공유할 수 있게 함","가장 운 좋은 팬은 VIP 박스석으로 업그레이드. 가장 운 없는 팬에게는 '더 운 좋은' 굿즈를 살 수 있게 팬숍 할인을 제공"],"stats":[["+42%","평균 관중 증가"],["1위","리그 내 관중 순위"],["22만+","분석한 팬 프로필"]],"results":["축구 매체들이 앞다퉈 소개했고, 관중 증가와 함께 팬 참여와 클럽 매출도 늘었다고 클럽 측은 밝힘. 이 시스템은 현재 유럽 다른 클럽에 판매할 솔루션으로 제안되고 있어, 클럽에 새로운 수익원이 생김. 이번 칸에서 크리에이티브 커머스 그랑프리를 받았고, 이 부문 유일한 골드도 함께 받음."],"analysis":["규제 때문에 의무로 모으던 데이터를 상업 자산으로 바꿨다는 점이 핵심. 새 데이터를 모으지 않고, 이미 가진 것을 다르게 쓰는 방식으로 문제를 풀었음.","팬의 미신을 비웃지 않고 진지하게 받아줬음. '당신이 오면 팀이 이긴다'는 말을 숫자로 증명해주니, 경기장에 가는 것이 개인적인 의미를 갖게 됨. 결과적으로 관중을 늘리려는 클럽의 목적과 팬의 감정이 같은 방향을 향함.","보상 설계도 영리함. 운 좋은 팬에게는 좋은 자리를, 운 없는 팬에게는 굿즈 할인을 줘서 지수가 낮아도 손해 보는 느낌이 없고, 어느 쪽이든 결국 클럽에서 돈을 쓰게 만드는 구조. 크리에이티브 '커머스' 부문에서 상을 받은 이유."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["'폴란드 축구의 전설 비스와 크라쿠프가 1부 리그에서 강등되자 재정이 큰 타격을 입었고, 경기장을 채우는 일은 갑자기 생존의 문제가 됐다'는 나레이션으로 시작함.","하지만 클럽에는 강력한 무기가 있었다고 함. 행운이 진짜 있다고, 자기가 경기장에 있으면 경기가 달라진다고 믿는 팬들.","이 미신을 바탕으로 '팬 한 명이 팀에 가져다주는 행운을 측정하는 첫 번째 통계', Lucky Fan Index를 소개함.","원리 설명. 폴란드 클럽은 법적으로 입장하는 모든 팬의 신원을 확인해야 하는데, 이 입장 기록을 골·놓친 골·기대 득점·카드·부상 같은 수년치 경기 기록과 교차 분석함. 그 복잡한 데이터에서 나만의 숫자 하나가 나옴.","예시가 이어짐. '막내 선수가 130초 만에 두 골을 넣던 날 거기 있었다면? 당신이 행운을 가져왔다. 지수 상승.' '막판에 역전패당한 날 거기 있었다면? 운이 없었다. 지수 폭락.'","이것이 단순한 재미가 아니라, 규제용 데이터베이스를 관중·팬 참여·매출을 끌어올리는 상업 데이터 플랫폼으로 바꾼 것이라고 강조함. 가장 운 좋은 팬은 VIP 박스로, 가장 운 없는 팬은 '더 운 좋은 굿즈'를 살 수 있게 팬숍 할인으로.","축구 매체들의 반응 뒤 결과가 나옴. 평균 관중 42% 증가, 리그 전체 관중 1위."]}],"videoNote":"실제 영상의 나레이션을 확인해 정리함. 자동 자막의 클럽 이름 표기 오류는 바로잡음. 이 캠페인은 별도 광고 필름이 확인되지 않음.","sources":[["WPP 케이스","https://www.wpp.com/en/case-studies/the-lucky-fan-index-how-wisla-krakow-used-ai-to-give-every-supporter-a-personal-stake-in-the-teams-success"],["Contagious (커머스 수상)","https://www.contagious.com/article/cannes-lions-2026-creative-commerce-winners-2b827a31c9d1442a996317e2fb246f07"],["VML 케이스","https://www.vml.com/work/lucky-fan-index"]]},
 {"id":"sos-pos","tier":"grand-prix","title":"SOS POS","brand":"BCP (Banco de Crédito del Perú)","agency":"Circus Grey, Lima","country":"페루","cat":"Creative Data","awards":["크리에이티브 데이터 그랑프리"],"video":"https://www.youtube.com/watch?v=GVdCoJEhO6M","ko":"휴대폰을 도둑맞으면 은행에 전화할 수도 없다는 모순을, 동네 가게의 카드 결제 단말기로 해결한 페루 최대 은행의 서비스","bg":["페루에서는 하루 4,000대가 넘는 휴대폰이 도난당함. 범죄자들은 몇 분이면 휴대폰 잠금을 풀고, 그 안의 은행 앱으로 계좌를 털어감.","그래서 은행마다 카드와 계좌를 바로 막을 수 있는 무료 긴급 전화가 있음. 문제는 정작 휴대폰을 도둑맞은 사람은 그 전화를 걸 휴대폰이 없다는 것. 계좌를 지켜야 할 가장 급한 순간에, 은행에 연락할 수단이 사라지는 구조였음.","BCP는 페루 최대 은행. 고객 계좌가 털리는 피해를 줄이는 것은 고객 보호이자 은행의 신뢰 문제였음."],"solIntro":["휴대폰 대신 동네 가게에 있는 카드 결제 단말기(POS)를 '긴급 차단 버튼'으로 바꿨음. 휴대폰을 도둑맞으면 가장 가까운 가게로 가서 단말기 키패드에 신분증 번호와 비밀번호만 누르면 계좌가 바로 차단됨. 전화도, 앱도, 기다림도 없이."],"sol":["결제 단말기와 은행 시스템을 연결하는 API를 새로 만들어, 단말기에서 바로 계좌 차단이 가능하게 함","휴대폰 도난이 가장 많은 지역을 데이터로 파악하고, 그곳에 1만 7,500곳이 넘는 차단 지점을 배치. 어디서든 2분 안에 걸어갈 수 있게 설계","동네 식료품점, 철물점, 약국 등 일상적인 가게를 차단 지점으로 활용","SOS POS를 오픈소스 프로젝트로 공개해 다른 은행도 쓸 수 있게 함"],"stats":[["-48%","월간 금전 도난 신고"],["780만 달러+","4개월간 차단으로 지킨 금액"],["1만 7,500곳+","초기 차단 지점"],["12만 곳+","2026년 목표 차단 지점"]],"results":["페루 일간지 엘 코메르시오 등 언론이 보도했고, 현지 인플루언서들도 자발적으로 서비스를 소개함. BCP는 2026년 안에 차단 지점을 12만 곳 이상으로 늘리겠다고 밝힘."],"analysis":["문제 정의가 날카로움. '보안 기능이 있다'에서 멈추지 않고 '그 기능을 쓰려면 정작 없어진 물건(휴대폰)이 필요하다'는 모순을 짚어냈음. 해결책은 이 모순을 피해 가는 다른 경로를 찾는 것.","새 인프라를 만들지 않고 이미 동네마다 깔린 결제 단말기를 재활용했음. 그리고 데이터로 '어디에 둬야 하는가'를 정해 실효성을 높였음. 심사위원장은 데이터를 활용해 데이터(개인 금융정보)를 지키는 방식이 인상적이라고 평가함.","휴대폰과 은행 계좌가 연결된 사람이라면 누구나 공감하는 보편적인 문제라는 점도 심사에서 높이 평가됨. 오픈소스로 공개해 한 은행의 마케팅을 넘어 사회 인프라처럼 만든 것도 같은 맥락."],"films":[{"kind":"메인 영상","title":"SOS POS - Bloqueo de Emergencia BCP","url":"https://www.youtube.com/watch?v=PGXK48_wIcE"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["'페루에서는 매일 4,000대가 넘는 휴대폰이 도난당한다'는 나레이션으로 시작. 범죄자들은 몇 분 만에 잠금을 풀고 은행 앱으로 계좌를 털어간다고 설명함.","그래서 은행마다 카드를 즉시 막을 수 있는 무료 긴급 전화가 있는데, '휴대폰이 없는데 어떻게 은행에 전화해서 계좌를 막느냐'는 질문이 화면 가득 나옴.","BCP가 SOS POS를 소개함. 담당자는 결제 단말기와 은행 시스템을 연결하는 API를 만든 것뿐이라며 아주 단순한 방법이었다고 설명함.","사용법 시연. 휴대폰을 도둑맞으면 가장 가까운 가게로 가서 단말기에 신분증 번호와 비밀번호를 입력. 그걸로 계좌 차단 끝.","도난이 가장 많은 지역을 찾아 1만 7,500곳이 넘는 차단 지점을 배치했고, 어디서든 단말기까지 2분이 안 걸리게 했다고 함.","현지 틱톡 크리에이터와 뉴스가 '이제 휴대폰 없이도 식료품점·철물점·약국에서 카드를 막을 수 있다'고 소개하는 장면이 이어짐.","성과: 월간 금전 도난 신고 48% 감소, 4개월간 780만 달러 이상을 지킴. BCP 관계자는 2026년까지 차단 지점을 12만 곳 이상으로 늘리겠다고 밝힘. SOS POS는 오픈소스 프로젝트로 공개됨.","'전화도, 앱도, 지체도 없이. 사람들이 가장 필요할 때의 보안'이라는 문장으로 마무리."]},{"h":"메인 영상: SOS POS - Bloqueo de Emergencia BCP (약 2분 45초)","p":["BCP 공식 채널의 서비스 소개 영상. 페루 배우 세사르 리테르가 파란 배경 앞에서 혼자 이야기하는 형식.","그는 휴대폰을 도둑맞으면 당연히 카드를 막으려고 은행에 전화할 방법이 없다는 상황을 짚고, 택시·배달 같은 앱이 다 들어 있는 휴대폰을 잃었을 때의 막막함을 유머러스하게 풀어냄.","그리고 그럴 땐 바로 긴급 차단을 하라며, 전국 1만 곳이 넘는 BCP 대리점(동네 가게)에서 모든 BCP 카드를 무료로, 즉시 막을 수 있다고 안내함."]}],"videoNote":"케이스 영상은 나레이션과 화면 자막을, 메인 영상은 화면 자막 일부와 영상 설명란을 확인해 정리함.","sources":[["CB News (심사평)","https://www.cbnews.fr/node/101940"],["Cannes Lions 공식 발표 (3일차)","https://www.canneslions.com/news/cannes-lions-international-festival-of-creativity-announces-lion-winners-on-day-three"]]},
 {"id":"three-words","tier":"grand-prix","title":"Three Words","brand":"AXA","agency":"Publicis Conseil, Paris","country":"프랑스","cat":"Creative Effectiveness","awards":["크리에이티브 이펙티브니스 그랑프리"],"video":"https://www.youtube.com/watch?v=pY-03zuV7mE","ko":"주택보험 약관의 '긴급 거처 제공' 조항에 '그리고 가정폭력'이라는 세 단어를 더해, 가정폭력 피해자가 집을 떠날 수 있게 만든 보험사","bg":["프랑스 경찰 기록상 매년 21만 명의 여성이 가정폭력 피해를 입음. 사람들은 흔히 '왜 그 집을 떠나지 않느냐'고 묻지만, 피해자들의 대답은 '갈 곳도, 돈도 없었다'는 것. 실제로 가정폭력 상담전화로 걸려오는 요청의 77%가 긴급 거처를 구하는 내용이었음.","한편 프랑스에서는 모든 가구가 주택보험에 의무적으로 가입해야 함. 이 보험에는 화재나 홍수로 집에서 살 수 없게 되면 임시 거처를 제공하는 조항이 이미 들어 있었음. 가정폭력 피해자에게 가장 필요한 것이 바로 그 '긴급 거처'였지만, 보험은 집이 물리적으로 망가진 경우만 보장했음.","AXA 입장에서는 누구나 의무로 드는, 그래서 회사 간 차이가 잘 느껴지지 않는 상품군에서 브랜드를 선택할 이유를 만드는 것도 과제였음. 캠페인 전 AXA의 브랜드 선호도는 2위였음."],"solIntro":["새 상품을 만들지 않고, 이미 있는 약관에 세 단어를 추가했음. '화재나 홍수로 집에서 살 수 없게 되면'이라는 조항 뒤에 '그리고 가정폭력'을 붙인 것. 이 세 단어로 가정폭력 피해자도 보험을 통해 긴급 거처를 받을 수 있게 됨."],"sol":["AXA의 주택보험 계약 250만 건 전체에 이 조항을 넣고, 기존 가입자에게도 소급 적용","7일간의 긴급 거처(연장 가능)와 함께 법률 지원(신고, 접근금지명령 안내), 가정폭력 전문 심리 상담, 전용 지원 번호를 제공","프랑스 내 80개 NGO와 협력해 피해자에게 이 보장이 닿을 수 있게 함","TV, 옥외광고, 소셜 미디어로 알림"],"stats":[["1,576명","첫해 지원받은 피해자"],["+113%","순신규 계약 증가"],["2위→1위","브랜드 선호도"],["250만 건","조항이 추가된 계약"]],"results":["이 작품은 2025년 칸에서 티타늄 그랑프리를 받았고(프랑스 최초), WARC가 집계한 세계 최다 수상 크리에이티브 1위에 올랐음. 2026년에는 실제 비즈니스 성과를 평가하는 크리에이티브 이펙티브니스 부문에서 그랑프리를 받음."],"analysis":["보험사가 가장 잘하는 일(긴급 거처 제공)을 가장 필요한 사람에게 연결했음. 피해자에게 필요한 건 위로의 메시지가 아니라 오늘 밤 갈 곳이라는 점을 정확히 짚었음.","'세 단어'라는 크기의 대비가 이야기의 힘. 약관 한 줄을 고치는 아주 작은 변화가 수천 명의 삶을 바꿨다는 구조라 설명이 쉽고 기억에 남음. 캠페인 이름 자체가 아이디어를 요약함.","사회적 선의가 사업 성과로 이어졌다는 점이 이펙티브니스 수상의 이유. 차별점이 없던 의무 보험에서 '선택할 이유'가 생기면서 신규 계약과 브랜드 선호도가 실제로 올라감."],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["'남자가 자기 집에서 아내를 살해한 혐의로 기소됐다', '여성이 집에서 파트너에게 살해된 채 발견됐다' 같은 뉴스 보도들로 시작함.","'다들 왜 그 여자가 떠나지 않았느냐고 묻는다'는 질문에 피해자들이 답함. '갈 곳이 없었다. 돈도 없었다. 기댈 수 있는 게 아무것도 없었다.' 한 전문가는 프랑스어로 '문제는 결국 어디로, 무슨 돈으로 가느냐'라고 정리함.","이어서 프랑스에서는 주택보험이 법적 의무이고, 화재나 홍수로 집이 살 수 없게 되면 긴급 거처를 제공한다는 설명이 나옴. 화면 가득 약관 문장이 크게 보이고, 그 끝에 '그리고 가정폭력'이라는 세 단어가 더해짐.","AXA 프랑스 CEO 알리스 홀츠만이 '보험사의 전문성을 가정폭력 피해 여성들을 위해 쓰겠다. 중요한 건 장기적인 해결책을 찾을 시간을 주는 것'이라고 말함.","피해자 지원 단체 대표들은 'AXA 같은 브랜드가 자기가 잘하는 일로 돕는다는 게 놀랍다', '긴급 거처는 피해자에게 최우선 과제이고, 생명을 구한다'고 평가함.","'여자로 산다는 것이 위험이 되어선 안 된다'는 문장으로 마무리."]}],"videoNote":"실제 영상의 나레이션(영어·프랑스어)과 화면 문구를 확인해 정리함. 자동 자막의 브랜드명 오류는 바로잡음.","sources":[["WARC (이펙티브니스)","https://www.warc.com/article/axa-france-three-words-ebfd758494b64d1393b96011e5602c3f"],["D&AD","https://www.dandad.org/work/annual-2026/behind-the-work/how-axa-used-creative-thinking-to-deliver-life-saving-support"],["Contagious","https://www.contagious.com/article/cannes-lions-2026-creative-effectiveness-winners-84a15deaad234bce86cfc8fe65a66f0e"],["CB News (WARC 랭킹)","https://www.cbnews.fr/node/99377"]]},
 {"id":"pub-that-refused-to-die","tier":"grand-prix","title":"The Pub That Refused to Die","brand":"Heineken Ireland","agency":"LePub Milan & Publicis Dublin","country":"아일랜드 / 이탈리아","cat":"Creative Strategy","awards":["크리에이티브 전략 그랑프리"],"video":"https://www.youtube.com/watch?v=c3dLfuq66bc","ko":"마을의 마지막 펍이 문을 닫으려 하자 주민 26명이 돈을 모아 펍을 사들인 이야기를 다큐로 만들고, 다른 마을도 따라 할 수 있게 도운 하이네켄","bg":["아일랜드 시골에서는 마을 펍이 사라지고 있음. 가게도 주유소도 없는 작은 마을에서 펍은 사람들이 모이는 마지막 공간인 경우가 많음. 하지만 물가가 오르면서 혼자 펍을 운영하기는 점점 어려워졌고, 리머릭주의 작은 마을 킬틸리(Kilteely)에 남은 마지막 펍 '더 스트리트 바'도 결국 매물로 나왔음.","하이네켄 아일랜드에게 펍은 맥주가 팔리는 곳이자 브랜드가 사람들과 만나는 곳. 펍이 사라지는 건 곧 사업 기반이 사라지는 일이기도 함. 하이네켄은 이미 'For the Love of Pubs(펍을 사랑하는 마음으로)'라는 장기 프로그램으로 아일랜드 펍 문화를 지원해오고 있었고, 'Pub Museums', 'Pub Succession' 같은 이전 캠페인도 칸에서 여러 상을 받았음."],"solIntro":["'혼자 운영하기 힘들다면, 마을이 함께 소유하면 어떨까?' 킬틸리 주민 26명이 실제로 그렇게 했음. 변호사, 목수, 농부, 간판 제작자, 건축업자 등 펍 운영 경험이 전혀 없는 사람들이 30만 유로를 모아 펍을 사들이고 다시 문을 열었음.","하이네켄은 이 이야기를 한 번의 미담으로 끝내지 않고, 다른 마을도 따라 할 수 있는 '모델'로 만들었음. 심사위원장은 '인사이트가 곧 아이디어이자 해결책'이라고 평가함."],"sol":["주민들이 펍 운영을 배울 수 있도록 리머릭에서 교육 과정을 마련","이 과정을 담은 다큐멘터리 'The Pub That Refused to Die(죽기를 거부한 펍)'를 제작","다큐 개봉 후 아일랜드 전국 마을을 돌며 상영회를 열고, 킬틸리 주민들이 직접 경험을 나누며 펍을 지키려는 다른 마을을 지원","펍 공동 인수를 원하는 마을을 위한 실용 가이드를 제공","PR과 언론 보도를 중심으로 이야기를 확산"],"stats":[["26명","펍을 산 주민 수"],["30만 유로","주민들이 모은 금액"],["1곳+","뒤따라 펍을 인수한 마을"]],"results":["투어로 찾아간 마을 중 한 곳이 실제로 자기 마을 펍을 사들였고, 여러 마을이 비슷한 시도를 시작함. 데일리 메일, 아이리시 타임스 등이 보도함. 이번 칸에서 크리에이티브 전략 그랑프리와 브론즈 4개(PR, 다이렉트, B2B, 엔터테인먼트)를 받음. 이 부문 출품작은 738편."],"analysis":["브랜드가 문제를 직접 해결하는 대신, 해결한 사람들의 이야기를 키워서 퍼뜨렸음. 하이네켄이 한 일은 교육, 다큐, 투어라는 '확산 장치'를 만든 것. 그래서 한 마을의 사례가 다른 마을의 행동으로 이어졌음.","'우리는 특별하지 않다, 다른 마을도 할 수 있다'는 주민의 말이 전략의 핵심. 이야기가 감동으로 끝나지 않고 '따라 할 수 있는 방법'으로 끝나도록 설계했음. 심사위원장이 말한 '마음에도 이성에도 말을 거는 작업'이라는 평가가 이 부분.","펍을 살리는 일이 곧 하이네켄의 판매 채널을 지키는 일이라, 사회적 명분과 사업적 이해가 정확히 겹침. 여러 해에 걸친 'For the Love of Pubs' 플랫폼 위에 쌓인 작업이라 진정성도 확보됨."],"films":[{"kind":"메인 필름","title":"The Pub That Refused to Die (다큐, 약 10분)","url":"https://www.youtube.com/watch?v=U0FNEVBwVi0"},{"kind":"예고편","title":"Official Trailer (30초)","url":"https://www.youtube.com/watch?v=9uwkOfqOijo"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["한 주민의 회상으로 시작함. '내가 십대일 땐 마을에 펍이 세 개 있었는데, 이제 하나 남았다. 가게도 주유소도 없으니 펍이 마을의 마지막 중심이다.'","펍 주인은 혼자 운영하기엔 비용이 너무 많이 들어 결국 팔기로 했다고 말함. '혼자 펍을 운영하는 일은 치솟는 비용 때문에 점점 어려워지고 있다'는 자막에 이어, '그렇다면 마을이 소유한다면?'이라는 질문이 나옴.","뉴스 보도로 이어짐. '주민 26명이 모여 펍을 샀다. 이제 공동체 펍이다. 30만 유로를 모아 다시 문을 열었다.' 변호사, 목수, 농부, 간판 제작자, 건축업자. 하지만 '펍을 운영해본 사람은?'이라는 질문에 아무도 없었음.","하이네켄 관계자는 주주들이 바 경험이 전혀 없다는 걸 알고 하이네켄이 할 수 있는 일을 찾았다고 말함. 주민들은 하이네켄이 마련한 리머릭의 교육 과정에 참여함.","이 모델은 어디서든 반복할 수 있다고 판단해 전국 투어를 시작함. 킬틸리 주민이 다른 마을 사람들 앞에서 '지키고 싶은 펍이 있나요?'라고 묻고, '우리는 특별하지 않다, 주변 어느 마을이든 할 수 있다'고 말함.","다른 마을 주민들은 '그들이 해냈다면 우리도 할 수 있다', '하이네켄 같은 큰 브랜드가 노하우를 나눠주는 건 값을 매길 수 없다'고 반응함.","'또 한 마을이 마지막 펍을 샀다'는 자막과 함께, 투어로 찾아간 마을 한 곳이 실제로 펍을 인수했다는 발표가 나옴. 각종 신문 보도로 마무리."]},{"h":"메인 필름: The Pub That Refused to Die (약 10분)","p":["하이네켄 공식 채널에 올라온 다큐멘터리. 킬틸리 마을의 마지막 펍이 사라질 위기에 처하자, 펍 운영을 전혀 모르던 주민 26명이 힘을 모아 불가능해 보이던 일을 해내는 과정을 담음.","이 영상에는 자막이 없어 세부 대사는 확인하지 못함. 위 내용은 영상 설명란과 케이스 영상에 나온 장면을 기준으로 함."]}],"videoNote":"케이스 영상은 나레이션과 화면 자막을 확인해 정리함.","sources":[["LBB Online","https://lbbonline.com/news/Heineken-Ireland-Cannes-Lions-Grand-Prix"],["CB News (심사평)","https://www.cbnews.fr/node/102002"],["Adweek","https://www.adweek.com/creativity/heineken-wins-big-again-among-7-grand-prix-winners-at-cannes-lions-2026-day-4/"]]},
 {"id":"apple-tv-rebrand","tier":"grand-prix","title":"Apple TV Rebrand","brand":"Apple TV","agency":"TBWA\\Media Arts Lab, Los Angeles","country":"미국","cat":"Design","awards":["디자인 그랑프리"],"video":"https://www.youtube.com/watch?v=NKSnmy8MwFQ","ko":"'Apple TV+'에서 '+'를 떼고, 진짜 유리로 깎은 로고를 CG 없이 카메라로 찍어 만든 애플 스트리밍 서비스의 새 브랜드 아이덴티티","bg":["애플의 스트리밍 서비스 'Apple TV+'는 〈테드 래소〉 같은 히트작을 냈지만, 정작 그 작품이 어느 서비스의 것인지 사람들이 잘 몰랐음. 조사에 따르면 구독자 중 〈테드 래소〉를 Apple TV+와 연결할 수 있는 사람은 33%뿐이었음.","이름도 문제를 키웠음. 'Apple TV'라는 이름이 셋톱박스 기기, 앱, 스트리밍 서비스(Apple TV+)에 모두 쓰이면서 브랜드가 흩어져 있었음. 좋은 작품을 만들어도 그 공이 브랜드에 쌓이지 않는 구조였음."],"solIntro":["2025년 10월, '+'를 빼고 서비스 이름을 'Apple TV' 하나로 통일하고, 브랜드 아이덴티티 전체를 새로 만들었음. 핵심은 작품이 시작될 때마다 나오는 새 로고 인트로. 사람들이 작품을 볼 때마다 이 서비스를 기억하게 만드는 장치."],"sol":["애플 로고를 투명한 유리로 직접 깎아 만들고, 색색의 조명을 비추며 회전시키는 모습을 실제 카메라로 촬영. 디지털 후반 작업, 3D 렌더링, AI를 쓰지 않음","유리에 맺히는 반사와 굴절, 빛 번짐이 촬영할 때마다 다르게 나와, 작품의 다양한 장르와 감정을 상징하도록 함","가수 겸 프로듀서 피니어스(Finneas)가 새 사운드 아이덴티티를 작곡. 로고의 빛 변화와 음악이 맞물리게 함","예고편용 2초, 시리즈용 5초, 극장용 12초 세 가지 길이로 제작","흑백 위주의 대담한 시각 시스템과 전용 서체를 만들어 107개 시장, 340개 작품에 적용. 크리에이티브 스튜디오 Buck이 제작에 참여"],"stats":[["33%","리브랜딩 전 〈테드 래소〉를 Apple TV+와 연결한 구독자"],["340편","새 아이덴티티가 적용된 작품"],["107개","적용된 시장"]],"results":["앱, 애플 기기 메뉴, 홍보물까지 새 아이덴티티로 바뀌었음. 이번 칸에서 디자인 그랑프리를 받음. 수상 이후의 브랜드 인지 변화 수치는 공개되지 않았음."],"analysis":["브랜드 문제를 광고가 아니라 '매번 반복되는 접점'으로 풀었음. 인트로는 사용자가 작품을 볼 때마다 반드시 보게 되는 몇 초. 이 몇 초에 브랜드의 인상을 각인시키는 것이 작품과 서비스를 연결하는 가장 확실한 방법.","AI로 만든 영상이 넘쳐나는 시기에 일부러 손으로 만든 방식을 택했다는 점이 메시지가 됨. 애플은 이를 실사처럼 보이는 가짜 영상과 AI 콘텐츠에 대한 반대 선언으로 설명함. '진짜 빛, 진짜 유리'라는 제작 방식 자체가 브랜드의 품질을 말해줌.","이름을 단순하게 정리한 것도 디자인의 일부. 기기·앱·서비스로 흩어져 있던 브랜드를 'Apple TV' 하나로 모아, 쌓이는 인지도가 한곳으로 모이게 했음."],"videoDesc":[{"h":"케이스 영상 (약 30초)","p":["나레이션 없이 음악과 화면만으로 구성된 짧은 영상.","어두운 스튜디오에서 사람들이 유리 조각과 조명, 카메라를 설치하는 제작 현장으로 시작함. 보라색 빛이 비치는 거대한 유리 애플 로고가 실루엣으로 보임.","카메라 모니터 화면 속에 유리 로고의 곡선이 잡히고, 빛이 유리 표면을 따라 흐르며 굴절되는 모습이 클로즈업으로 이어짐.","마지막에 빛을 머금은 유리 애플 로고와 'tv' 글자가 함께 나타나며 새 Apple TV 로고로 마무리됨. CG가 아니라 실제 유리를 찍었다는 걸 제작 과정으로 보여주는 구성."]}],"videoNote":"실제 영상 장면을 확인해 정리함. 참고 사이트에 연결된 원래 케이스 영상은 비공개로 바뀌어, 같은 캠페인의 공개 케이스 영상으로 대체함. 애플 공식 채널의 인트로 단독 영상은 찾지 못함.","sources":[["Contagious (디자인 수상)","https://www.contagious.com/article/cannes-lions-2026-design-winners-89077875a5ac43a7b3639bb95b9702ed"],["Reason Why (아이덴티티 소개)","https://www.reasonwhy.es/actualidad/apple-tv-estrena-identidad-nueva-intro-proceso-artesanal"],["MacRumors (리브랜딩 발표)","https://www.macrumors.com/2025/10/13/apple-tv-plus-rebrand"],["LBB Online","https://lbbonline.com/news/apple-cannes-lions-grand-prix-win"]]},
 {"id":"project-genie","tier":"grand-prix","title":"Project Genie","brand":"Google (Google DeepMind)","agency":"Google Creative Team, Mountain View","country":"미국","cat":"Digital Craft","awards":["디지털 크래프트 그랑프리"],"video":"https://www.youtube.com/watch?v=s40a06a5wIc","videoKind":"공식 소개 영상","ko":"글이나 그림 한 장으로 직접 걸어 다닐 수 있는 가상 세계를 만들어주는 구글 딥마인드의 AI '지니 3'를, 누구나 써볼 수 있는 웹 서비스로 만든 작업","bg":["구글 딥마인드는 2025년 8월 '지니 3(Genie 3)'라는 '월드 모델'을 일부 테스터에게 먼저 공개했음. 월드 모델은 어떤 환경이 시간에 따라, 그리고 사용자의 행동에 따라 어떻게 변하는지를 시뮬레이션하는 AI. 쉽게 말해 글로 설명하면 그 안을 직접 돌아다닐 수 있는 세계를 실시간으로 만들어내는 기술.","과제는 이 낯선 기술을 대중에게 소개하는 것. '월드 모델'은 연구실 용어라 설명만으로는 와닿지 않고, 직접 해봐야 무엇인지 알 수 있는 기술이었음. 동시에 아직 실험 단계라 세계가 현실과 다르게 보이거나, 프롬프트를 정확히 따르지 않거나, 조작 반응이 느린 한계도 있었음."],"solIntro":["기술을 설명하는 대신 직접 만져볼 수 있는 웹 서비스 'Project Genie'를 만들었음. 2026년 1월 29일 구글 랩스의 실험적 프로토타입으로 출시. 미국의 18세 이상 Google AI Ultra 구독자부터 쓸 수 있게 함."],"sol":["월드 스케치: 환경과 캐릭터를 글로 설명하거나 이미지를 올리면 세계가 만들어짐. 걷기, 타기, 날기, 운전하기 같은 이동 방식과 1인칭·3인칭 시점을 고를 수 있음","글만으로는 결과를 짐작하기 어렵다는 문제를 풀기 위해, 들어가기 전에 미리보기 이미지를 보여주고 말로 수정할 수 있게 함(이미지 생성 모델 Nano Banana Pro 활용)","월드 탐험: 사용자가 움직이는 대로 앞길이 실시간으로 생성됨. 한 번에 60초까지","월드 리믹스: 다른 사람이 만든 세계의 프롬프트를 바꿔 새 버전을 만들거나, 큐레이션된 갤러리와 랜덤 버튼으로 아이디어를 얻을 수 있음","출시 전 기술, 게임, 교육, 크리에이티브 분야 테스터를 먼저 초대하고, 제품 시연 영상과 소셜 콘텐츠로 출시를 알림"],"stats":[["만장일치","심사위원단 그랑프리 결정"],["60초","한 번에 탐험할 수 있는 시간"]],"results":["이용자 수 같은 성과 수치는 공개되지 않았음. 심사위원단은 만장일치로 그랑프리를 결정했고, 심사위원장은 이 작업이 '크리에이티비티의 미래'를 보여준다고 평가함."],"analysis":["디지털 크래프트 부문은 디지털 경험의 '만듦새'를 평가함. 이 작업의 크래프트는 최첨단 연구 기술을 일반인이 몇 번의 클릭으로 써볼 수 있게 만든 인터페이스 설계에 있음. 특히 '글만으로는 결과가 어떨지 모른다'는 사용자의 불안을 미리보기 단계로 풀어준 부분이 핵심.","한계가 분명한 실험 단계 기술을 감추지 않고 '실험적 프로토타입'으로 내놓았음. 완성품처럼 포장하는 대신 써보게 하고 사용 패턴을 다음 개발에 반영하겠다는 방식이라, 기대치 관리와 대중 소개를 동시에 해냄.","AI가 광고 업계의 큰 화두인 해에, AI를 광고 제작 도구가 아니라 '경험 자체'로 만든 작업이 디지털 크래프트 최고상을 받았다는 점도 상징적임."],"films":[{"kind":"추가 영상","title":"How world remixing works (45초)","url":"https://www.youtube.com/watch?v=dO0csRgxo_A"}],"videoDesc":[{"h":"공식 소개 영상: How world sketching works (약 1분 20초)","p":["구글 딥마인드 공식 채널 영상. 사용자들이 만든 수많은 세계가 동그란 창으로 떠다니는 장면으로 시작함.","이어서 실제 서비스 화면이 나옴. '세계를 스케치하는 것부터 시작하자'는 문구와 함께, 먼저 환경을 글로 설명하고 그다음 캐릭터를 설명함. 캐릭터는 사람, 동물, 물체 무엇이든 될 수 있음.","그런데 '글만으로는 세계가 어떻게 보일지 알기 어렵다'는 나레이션과 함께 미리보기 기능이 소개됨. 미리보기 이미지를 보면서 '멀리 산도 좀 있으면 좋겠다'처럼 말로 고칠 수 있음.","마음에 들면 세계를 생성하고 그 안으로 들어감. 파란 공 모양의 캐릭터가 털로 뒤덮인 듯한 하얀 언덕을 굴러가는 장면이 나오고, '그러니 상상하는 어떤 세계든 플레이할 수 있다'는 말로 마무리."]}],"videoNote":"실제 영상의 자막과 화면을 확인해 정리함. 참고 사이트에 연결된 케이스 영상은 비공개로 바뀌어, 구글 딥마인드의 공식 소개 영상으로 대체함.","sources":[["Contagious (디지털 크래프트 수상)","https://www.contagious.com/article/cannes-lions-2026-digital-craft-winners-3a2392d27e5145b5a3f80e9d86373ce3"],["CB News (심사평)","https://www.cbnews.fr/node/101929"],["Dataconomy (출시)","https://dataconomy.com/2026/01/30/google-launches-project-genie-create-interactive-worlds-with-ai/"]]},

const isDone = e => !!e.bg;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try { const h = new URL(u).hostname.replace("www.",""); return h.includes("youtu") ? "YouTube" : h.includes("vimeo") ? "Vimeo" : h; } catch(e){ return "링크"; } };

/* 일반 웹사이트(깃허브)에서만 실제 썸네일·페이지 내 재생 사용. Claude 아티팩트는 외부 이미지·영상을 막기 때문 */
const LIVE = !/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname) && location.protocol.startsWith("http");
function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/)([\w-]{11})/); return m?m[1]:null; }
function vmId(u){ const m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m?m[1]:null; }
function thumbOf(u){ const y=ytId(u); if(y) return `https://i.ytimg.com/vi/${y}/hqdefault.jpg`; const v=vmId(u); if(v) return `https://vumbnail.com/${v}.jpg`; return null; }
function embedOf(u){ const y=ytId(u); if(y) return `https://www.youtube-nocookie.com/embed/${y}?autoplay=1&rel=0`; const v=vmId(u); if(v) return `https://player.vimeo.com/video/${v}?autoplay=1`; return null; }
function plate(e, big, label, url){
  const cls = TIERS[e.tier].cls;
  const th = LIVE ? thumbOf(url||e.video) : null;
  return `<div class="plate p-${cls} ${th?"has-thumb":""}">${th?`<img class="thumb" src="${esc(th)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-thumb');this.remove()">`:""}<span class="rings"></span>
    <span class="cat">${esc(label||e.cat)}</span>
    <span class="mark">${esc(e.brand)}</span>
    ${e.noVideo ? "" : '<span class="play" aria-hidden="true"></span>'}</div>`;
}

function renderNav(route){
  const nav = document.getElementById("nav");
  const cur = route.startsWith("c-") ? (E.find(x => "c-"+x.id === route)||{}).tier : route;
  nav.innerHTML = Object.entries(TIERS).map(([k,t]) =>
    `<a href="#${k}" ${cur===k?'aria-current="page"':""}><span class="dot" style="background:var(--${t.cls})"></span>${t.short}</a>`).join("");
}

function home(){
  const tiles = Object.entries(TIERS).map(([k,t]) => {
    const list = E.filter(e => e.tier===k), done = list.filter(isDone).length;
    const meta = list.length ? `${done} / ${list.length}편 정리 완료` : "정리 예정";
    const pct = list.length ? Math.round(done/list.length*100) : 0;
    return `<a class="tiertile t-${t.cls} ${list.length?"":"soon"}" href="#${k}">
      <span class="meta">${k==="grand-prix"?"GRAND PRIX · TITANIUM":k.toUpperCase()}</span>
      <h2>${t.name}</h2>
      <div><div class="meta" style="margin-bottom:8px">${meta}</div><div class="bar"><i style="width:${pct}%"></i></div></div></a>`;
  }).join("");
  return `<section class="hero">
    <span class="eyebrow">Cannes Lions International Festival of Creativity · 2026</span>
    <h1>2026 칸 라이언즈 수상작을<br>한국어로 읽는 아카이브</h1>
    <p>수상 등급별로 작품을 모았음. 각 작품은 영상, 브랜드와 캠페인명, 배경 및 문제, 해결, 성과, 분석 순서로 정리.</p>
  </section>
  <div class="tiergrid">${tiles}</div>
  <p class="note">수상작 목록은 Love The Work More의 2026 정리 페이지를 기준으로 함. 배경과 전략은 각 작품 페이지 하단에 표기한 업계 매체·심사 자료를 바탕으로 정리했음. 영상은 보안상 페이지 안에서 바로 재생되지 않아, 썸네일을 누르면 YouTube·Vimeo 원본이 새 탭으로 열림.</p>`;
}

let filter = "all";
function tierPage(k){
  const t = TIERS[k], list = E.filter(e => e.tier===k);
  if(!list.length) return `<div class="listhead"><h1>${t.name}</h1></div><div class="pendingbox">${t.name} 수상작은 그랑프리 정리가 끝난 뒤 순서대로 추가할 예정임.</div>`;
  const shown = filter==="done" ? list.filter(isDone) : list;
  const cards = shown.map(e => `<a class="card ${isDone(e)?"":"pending"}" href="#c-${e.id}">
      ${plate(e,false,null,e.video)}
      <div><div class="ttl">${esc(e.title)}</div><div class="sub">${esc(e.brand)} · ${esc(e.awards.join(", "))}</div></div>
      <div>${isDone(e)?'<span class="chip done">정리 완료</span>':'<span class="chip">정리 예정</span>'}</div></a>`).join("");
  return `<div class="listhead"><div><span class="eyebrow">${k==="grand-prix"?"Grand Prix · Titanium":k}</span><h1>${t.name}</h1></div>
    <span class="count">${list.filter(isDone).length} / ${list.length}편 정리 완료</span></div>
    <div class="filters" role="group" aria-label="보기">
      <button type="button" id="f-all" aria-pressed="${filter==="all"}" data-f="all">전체</button>
      <button type="button" id="f-done" aria-pressed="${filter==="done"}" data-f="done">정리 완료만</button>
    </div>
    <div class="cards">${cards}</div>`;
}

function paras(arr){ return arr.map(p => `<p>${esc(p)}</p>`).join(""); }
function detail(e){
  const t = TIERS[e.tier], list = E.filter(x => x.tier===e.tier), i = list.indexOf(e);
  const prev = list[i-1], next = list[i+1];
  const awards = e.awards.map(a => `<span class="award p-${t.cls}">${esc(a)}</span>`).join("");
  const vids = [{kind: e.videoKind || (e.noVideo ? "케이스 자료" : "케이스 영상"), url:e.video}].concat(e.films||FILMS[e.id]||[]);
  let body;
  if(isDone(e)){
    body = `<article>
      <section><h2>배경 및 문제</h2><div>${paras(e.bg)}</div></section>
      <section><h2>해결</h2><div>${paras(e.solIntro)}<ul style="margin-top:4px">${e.sol.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
      <section><h2>성과</h2><div>${e.stats?`<div class="stats">${e.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}${paras(e.results)}</div></section>
      <section><h2>분석</h2><div>${paras(e.analysis)}</div></section>
    </article>`;
  } else {
    body = `<div class="pendingbox">이 작품의 배경과 전략은 아직 정리 전임. 영상과 수상 정보만 먼저 확인할 수 있음.</div>`;
  }
  const facts = `<aside class="facts"><dl>
      <div><dt>브랜드</dt><dd>${esc(e.brand)}</dd></div>
      <div><dt>캠페인</dt><dd>${esc(e.title)}</dd></div>
      <div><dt>에이전시</dt><dd>${esc(e.agency)}</dd></div>
      ${e.country?`<div><dt>국가</dt><dd>${esc(e.country)}</dd></div>`:""}
      <div><dt>수상</dt><dd>${esc(e.awards.join(" / "))}</dd></div>
    </dl>
    ${e.sources?`<div class="sources"><span class="eyebrow">출처</span><ol>${e.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ol></div>`:""}
  </aside>`;
  return `<a class="back" href="#${e.tier}">← ${t.name} 목록</a>
    <header class="dhead"><div class="awards">${awards}</div><h1>${esc(e.title)}</h1>${e.ko?`<p class="ko">${esc(e.ko)}</p>`:""}</header>
    <section class="media ${e.videoDesc?"with-desc":""}">
      <div class="vids ${vids.length>1?"two":""}">${vids.map(v=>{ const em = LIVE ? embedOf(v.url) : null; const meta=`<span class="vmeta"><b>${esc(v.kind)}</b><span>${v.title?esc(v.title)+" · ":""}<a href="${esc(v.url)}" target="_blank" rel="noopener">${host(v.url)}에서 보기 ↗</a></span></span>`; return em ? `<div class="video"><button type="button" class="vplay" data-embed="${esc(em)}" aria-label="${esc(v.kind)} 재생">${plate(e,true,v.kind,v.url)}</button>${meta}</div>` : `<div class="video"><a class="vlink" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(v.kind)} 열기">${plate(e,true,v.kind,v.url)}</a>${meta}</div>`; }).join("")}</div>
      ${e.videoDesc?`<details class="vdesc" id="vd-${e.id}"><summary>영상 내용</summary><div class="vbody">${e.videoDesc.map(sec=>typeof sec==="string"?`<p>${esc(sec)}</p>`:`<h4>${esc(sec.h)}</h4>${paras(sec.p)}`).join("")}${e.videoNote?`<p class="vnote">${esc(e.videoNote)}</p>`:""}<button type="button" class="vclose">접기 ▲</button></div></details>`:""}
    </section>
    <div class="dgrid"><div style="min-width:0">
      ${body}
      <nav class="pager">${prev?`<a href="#c-${prev.id}">← 이전<b>${esc(prev.title)}</b></a>`:"<span></span>"}${next?`<a href="#c-${next.id}" style="text-align:right">다음 →<b>${esc(next.title)}</b></a>`:""}</nav>
    </div>${facts}</div>`;
}

function route(keepScroll){
  const r = location.hash.replace("#","");
  const app = document.getElementById("app");
  let html;
  if(TIERS[r]) html = tierPage(r);
  else if(r.startsWith("c-") && E.find(e => "c-"+e.id===r)) html = detail(E.find(e => "c-"+e.id===r));
  else html = home();
  app.innerHTML = html;
  renderNav(r);
  if (matchMedia("(min-width: 861px)").matches) app.querySelectorAll(".media.with-desc .vdesc").forEach(d => d.open = true);
  app.querySelectorAll(".vclose").forEach(b => b.addEventListener("click", () => {
    const d = b.closest("details"); d.open = false;
    const r = d.getBoundingClientRect();
    if (r.top < 80) window.scrollBy({top: r.top - 90, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  app.querySelectorAll(".vplay").forEach(b => b.addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = b.dataset.embed; f.className = "vframe"; f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; f.title = b.getAttribute("aria-label");
    b.replaceWith(f);
  }));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; route(true); }));
  if(keepScroll !== true) window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => route());
route();
</script>

</body>
</html>
