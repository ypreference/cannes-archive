반박하면서 논쟁이 더 커졌음. 이번 칸에서 필름 그랑프리를 받았고, 심사위원장 펠레 셰넬은 '모든 프레임에 대담함과 크래프트가 있다. 위험은 컸고, 실행은 흠잡을 데 없었다'고 평가함."],"analysis":["제품의 '없는 기능'을 광고한 사례. 광고가 없다는 건 눈에 보이지 않는 장점이라 설명하기 어려운데, 광고가 있을 때의 불쾌한 순간을 먼저 겪게 해서 그 장점을 체감하게 만들었음.","AI를 사람이 연기하게 한 선택이 핵심. 다정하게 공감하던 상대가 갑자기 영업을 시작하는 순간의 배신감은, 텍스트 화면보다 사람 얼굴로 볼 때 훨씬 크게 와닿음. 특히 키나 외모처럼 민감한 고민을 파고드는 광고라 '내 이야기를 광고에 쓴다'는 불안을 정확히 건드림.","앞부분의 조언이 진짜로 쓸 만하다는 점이 웃음의 장치. 시청자가 'AI 답변이 꽤 괜찮네' 하고 믿기 시작한 순간에 광고가 튀어나오기 때문에 배신감이 더 커짐. 신뢰를 쌓은 뒤 무너뜨리는 구조를 편마다 다른 고민(외모, 가족)으로 반복하면서도 결말 문구는 똑같이 둬서, 여러 편이 하나의 메시지로 묶임.","타이밍과 무대 선택도 정교했음. 광고 업계 최대 무대인 슈퍼볼에서, 경쟁사가 광고 도입을 발표한 직후에 '광고에 반대한다'고 말하는 아이러니 자체가 화제를 만들었음. 경쟁사 CEO의 반박까지 이어지면서, 존재감이 약했던 도전자가 단숨에 'AI 1위와 맞붙는 브랜드'로 보이게 됐음.","다만 오픈AI는 실제 광고가 답변과 분리되어 명확히 표시된다며 광고 속 묘사가 사실과 다르다고 반박했음. 과장된 풍자라는 점은 이 캠페인을 볼 때 함께 알아둘 맥락."],"films":[{"kind":"메인 필름","title":"Can I Get a Six Pack Quickly? (60초)","url":"https://www.youtube.com/watch?v=NuEXYfbV_PA"},{"kind":"메인 필름","title":"How Can I Communicate Better With My Mom? (60초)","url":"https://www.youtube.com/watch?v=8ZnGqg87FEo"},{"kind":"다른 편 · 한글 자막","title":"A Time and a Place (60초)","url":"https://www.youtube.com/watch?v=bMatObaCUNg"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["광고 속 'AI'는 실제 사람이 연기한다. 사용자가 AI 챗봇에게 질문하는 장면을, 사람과 사람이 마주 앉아 대화하는 모습으로 바꿔 보여주는 설정이다. 배경에는 오픈AI가 챗GPT에 광고 도입을 발표한 직후라는 상황이 있다."]},{"h":"케이스 영상 (약 2분)","p":["'오픈AI, 챗GPT에 광고 도입' 같은 뉴스 화면으로 시작했다. 이어서 AI가 광고로 돈을 벌면 우리에게 무엇을 팔지 걱정하는 사람들의 SNS 영상이 나왔다.","'앤트로픽은 AI가 생각의 파트너가 되어야 한다고 믿는다. 당신의 생각을 가장 높은 값을 부르는 사람에게 파는 존재가 아니라'는 문장이 나오고, 앤트로픽이 클로드에 광고를 넣지 않기로 했다는 뉴스 인터뷰가 이어졌다.","'그래서 광고계의 가장 큰 무대를 골라, 광고에 반대하는 입장을 내기로 했다'며 슈퍼볼 경기 화면과 함께 광고 장면들이 소개됐다. 운동장의 트레이너, 식당에서 마주 앉은 여성, 교수 차림의 남성 등이 'AI' 역할로 등장했다.","반응이 쏟아지는 장면이 이어졌다. '767개 기사, 28억 노출' 같은 숫자와 함께 뉴스, 팟캐스트, 유튜버 영상이 화면을 채우고, 슈퍼볼 직후 미국 구글 검색 관심도에서 클로드가 배드 버니를 앞선 그래프가 나왔다. '그들은 클로드로 갈아탔다'는 문구와 함께 앱스토어 상위권에 오른 클로드 화면도 보여줬다.","'눈에 띄지 않던 도전자에서 세계에서 가장 많이 회자되는 브랜드 중 하나로'라는 문장 뒤에 성과 숫자가 이어졌다. 언론 보도 2,127건, 언론 노출 도달 83억, 화제 점유율 15%→28%, 일일 가입자 305% 증가. 마지막은 클로드 로고와 'Keep thinking.'"]},{"h":"메인 필름: Can I Get a Six Pack Quickly? (약 1분)","p":["야외 운동장 철봉 앞. 마른 체형의 젊은 남성이 근육질 트레이너에게 '식스팩 빨리 만들 수 있을까요?'라고 물었다. 트레이너가 AI 역할.","트레이너는 '명확하고 달성 가능한 목표'라며 맞춤 운동 계획을 짜주겠다고 했다. 나이, 키, 몸무게를 묻고, 남성은 '키 170cm(5피트 7인치), 23살, 63kg(140파운드)'이라고 답했다. 트레이너는 몸매를 위한 근력 운동 위주로 계획을 짜겠다고 했다.","그러다 갑자기 '하지만 자신감은 헬스장에서만 만들어지는 게 아니다'라며 말투가 광고 성우처럼 바뀌었다. 키를 1인치 높여주는 깔창 '스텝 부스트 맥스'를 소개하고, 키 작은 남자들도 당당하게 서게 해준다며 할인 코드까지 불러줬다.","남성은 '뭐라고요?' 하며 어리둥절해했다. 화면에 '광고는 AI에 들어온다. 하지만 클로드에는 아니다'라는 문구가 뜨고, 클로드 로고와 'Keep thinking.'으로 끝났다."]},{"h":"메인 필름: How Can I Communicate Better With My Mom? (약 1분)","p":["거실 소파에 앉은 남성이 '엄마와 더 잘 소통하려면 어떻게 해야 할까요?'라고 물었다. 상담사처럼 보이는 여성이 AI 역할로 답했다.","그녀는 먼저 들어주기, 말 뒤에 숨은 마음을 듣기, 공감대에서 대화를 시작하기, 산책 같은 활동을 함께하기를 차분하게 조언했다. 여기까지는 그럴듯한 상담이다.","그러다 '관계를 회복할 수 없다면'이라며 연상 여성과의 만남을 주선하는 데이트 사이트 '골든 인카운터스' 광고로 넘어갔다. 남성이 당황하자 그녀는 웃으며 '프로필을 만들어 드릴까요?'라고 묻고, 같은 마무리 문구로 끝났다."]}],"videoNote":"실제 영상의 대사 자막과 화면 문구를 확인해 정리했다. 케이스 영상은 자막이 없어 화면을 직접 확인했다. 배경 음악 가사는 옮기지 않았다. 케이스와 본편 모두 공식 채널이 아닌 공개 업로드본.","sources":[["Adweek (칸 수상)","https://www.adweek.com/?p=1950749"],["Adweek (슈퍼볼 캠페인 공개)","https://www.adweek.com/brand-marketing/anthropic-makes-super-bowl-debut-promising-ad-free-ai/"],["CB News (심사평)","https://www.cbnews.fr/node/102027"],["Decrypt (광고 배경·이용자 수)","https://decrypt.co/356946/anthropic-trolls-openai-chatgpt-super-bowl-campaign"],["eMarketer (이용자 증가)","https://www.emarketer.com/content/claude-users-grow-11--on-back-of-super-bowl-spot-anthropic-rides-wave-of-anti-ai-ads-sentiment"]]},
 {"id":"nigrum-corpus","tier":"grand-prix","title":"Nigrum Corpus","brand":"IDOMED & Instituto Yduqs","agency":"Artplan, São Paulo","country":"브라질","cat":"Glass: The Lion for Change","awards":["글래스 그랑프리 (2026)","인더스트리 크래프트 그랑프리 (2025)"],"video":"https://www.youtube.com/watch?v=yaFd09v6elM","ko":"브라질 의료계의 인종차별을 '질병'처럼 분류한 가상의 의학 교과서. 실제 흑인 환자들의 증언을 바탕으로 20여 개의 '병'을 만들어 의대에 배포함","bg":["IDOMED는 브라질에서 의대 18곳을 운영하는 의학교육 기관이고, Instituto Yduqs는 교육 그룹 Yduqs의 사회공헌 재단. 두 기관은 의료 현장의 다양성을 다루는 'Med.Diversity(Mediversidade)' 프로젝트를 함께 진행해 왔음.","브라질은 인구의 절반 이상이 흑인 또는 혼혈이지만, 의사 중 흑인은 3%뿐(연방의학협회, 2023). 의료 현장의 차별도 수치로 드러남. 흑인 환자는 진료를 받기까지 평균 10분 더 기다리고, 진료 시간은 백인 환자보다 47% 짧고, 영상 검사를 받을 가능성은 낮고, 진단부터 수술까지 6.7일이 더 걸림.","캠페인이 짚은 문제는 이런 편견이 의학 교육에서부터 시작된다는 것. 케이스 영상에 따르면 의학 교과서 이미지 중 흑인 환자를 보여주는 것은 4.5%뿐. 백인의 몸이 사실상 유일한 임상 기준처럼 다뤄지고, 의대는 흑인의 몸을 어떻게 진료해야 하는지 제대로 가르치지 않고 있었음. 미래의 의사를 길러내는 교육 기관으로서, 이 문제를 교육 안에서 다뤄야 했음."],"solIntro":["의사들이 가장 익숙한 형식, 의학 교과서를 그대로 빌렸음. 인종차별을 의료계에 퍼진 '질병'으로 보고, 실제 흑인 환자들의 증언을 바탕으로 20여 개의 가상 질환을 만들어 진단서처럼 정리한 책 『Nigrum Corpus – 브라질 의학의 인종차별에 관한 연구』를 만들었음. 라틴어 제목은 '흑인의 몸'이라는 뜻."],"sol":["질환마다 라틴어 의학 용어 같은 이름을 붙임. 예를 들어 '비시오 알바 셀렉티바(Visio Alba-Selectiva)'는 흰 피부만 보이는 임상적 색맹, '모르부스 알부스 디아그노스티카(Morbus Albus Diagnostica)'는 백인의 몸만을 진단 기준으로 삼는 병, '니그룸 코르푸스 레옉툼(Nigrum Corpus Rejectum)'은 장기 이식에서 흑인이 뒤로 밀려나는 현상","아트 디렉션은 고전 해부학 도감을 참고함. 일러스트, 편집 디자인, 3D 모델링을 결합했고 AI는 이미지 보정에만 보조적으로 사용. 해부학 그림에 꽃무늬를 섞어 흑인의 몸을 존엄하고 아름답게 표현함","흑인과 백인 아이를 비교하는 페이지 등 독자가 직접 경험하게 만드는 특수 페이지도 넣음","비판에서 그치지 않고 흑인 교수 채용 확대, 인종 다양성을 반영한 임상 시뮬레이터 도입 같은 개선책도 제안함","단편영화 〈Corpo Preto(검은 몸)〉도 함께 제작. 의료진의 무관심과 방치를 겪는 흑인 남성의 이야기로, 환자를 화면에서 흐릿하게 처리해 '보이지 않는 존재'가 된 현실을 표현함. 2025년 4월 1일 리우데자네이루 극장에서 개봉하고 전문가 토론회를 염","책은 브라질 전역의 의대에 배포하고, 원하는 모든 브라질 대학에 무료로 제공함"],"stats":[["9,000명+","책을 받은 의대생"],["10개 주+","배포된 브라질 주"],["20여 개","책에 담긴 가상 질환"]],"results":["책은 브라질 10개 주 이상에서 9,000명이 넘는 의대생에게 전달됐고, 케이스 영상에 따르면 브라질 보건부 장관에게도 전달됨. 2025년 칸에서 인더스트리 크래프트 그랑프리 등 라이언 4개를 받았고, 2026년에는 글래스 그랑프리를 받음. 글래스 심사위원장 모니크 넬슨은 이 작품을 '혁명적'이라고 평가함. D&AD에서도 펜슬 2개를 받음."],"analysis":["형식 선택이 메시지를 완성함. 인종차별을 '사회 문제'로 말하면 의사들은 자기 일이 아니라고 느낄 수 있지만, 의학 교과서 속 '질병'으로 분류하면 의사가 진단하고 치료해야 할 대상이 됨. 의사의 언어로 의사에게 말한 것.","가상의 질환이지만 하나하나가 실제 증언과 통계에 뿌리를 두고 있어 허구처럼 느껴지지 않음. 라틴어 병명은 웃음을 주면서도, 너무 익숙해서 질병인 줄도 몰랐던 관행을 이름 붙여 드러내는 역할을 함.","광고 캠페인이 아니라 실제로 쓰이는 교육 도구라는 점이 글래스 부문(사회 변화를 이끄는 작품)에서 높이 평가받은 이유. 의대에 배포되어 미래의 의사들에게 직접 닿는 구조라서, 일회성 인식 개선을 넘어 의료 현장을 장기적으로 바꿀 수 있음.","2025년 크래프트 그랑프리에 이어 2026년 글래스 그랑프리까지 받은 드문 사례. 아름다운 만듦새가 무거운 주제를 끝까지 읽게 만드는 힘이 됐음."],"films":[{"kind":"메인 필름","title":"Black Body (Corpo Preto) 영어판 단편영화 (5분 33초)","url":"https://www.youtube.com/watch?v=1bKI5ji5DSE"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["브라질은 인구의 절반 이상이 흑인 또는 혼혈인 나라다. 영상 초반의 포르투갈어 증언은 실제 흑인 환자 가족의 이야기이고, 이후 영어 나레이션으로 책을 소개한다. 책에 나오는 라틴어 병명은 모두 인종차별을 빗댄 가상의 질환이다."]},{"h":"케이스 영상 (약 2분 15초)","p":["흑백 화면 속 젊은 여성이 '의사들이 할머니를 제대로 진단하지 않았다'고 증언하며 시작했다. 실제 흑인 환자 가족의 이야기다.","흑인 환자가 받는 차별을 보여주는 통계 카드들이 화면을 가득 채웠다. 진료 시간이 47% 짧다는 것 등. 나레이션은 이 숫자가 브라질의 것이지만 다른 나라도 크게 다르지 않을 것이라고 말했다.","'이 현실을 바꾸려면 모든 것이 시작되는 곳을 바꿔야 한다'는 문장과 함께, 의대가 여전히 가르치지 않는 것, 즉 흑인의 몸을 어떻게 진료할지에 관한 연구를 만들었다고 소개했다. 의료 데이터와 실제 증언을 임상 형식으로 바꿨다는 설명이다.","책 속 질환들이 하나씩 펼쳐졌다. 흰 피부만 보는 임상적 색맹 '비시오 알바 셀렉티바', 백인의 몸이 유일한 진단 기준이 되는 '모르부스 알부스 디아그노스티카'(의학 교과서 이미지 중 흑인 환자는 4.5%뿐이라는 수치와 함께), 장기 이식에서 흑인이 밀려나는 '니그룸 코르푸스 레옉툼' 등 모두 20개가 넘었다.","피부색에 따라 진단 징후가 어떻게 다르게 보이는지 비교하는 페이지, 해부학 그림과 꽃무늬를 섞은 일러스트가 이어졌다.","책이 브라질 전역의 대학에 제공되어 미래 의사들의 인종 문해력 도구가 됐다는 설명과 함께 의대생들이 책을 읽는 장면이 나오고, 보건부 장관이 책을 들고 '의료 현장에 남아 있는 제도적 인종차별과 싸워야 한다'고 말하는 장면으로 이어졌다."]},{"h":"메인 필름: Black Body (약 5분 30초)","p":["대사가 거의 없는 단편영화다. 집에서 트럼펫을 연주하는 흑인 남성의 모습으로 시작했다.","그는 몸이 좋지 않아 병원을 찾지만 텅 빈 대기실에서 기다리고, 진료실에서도 의료진의 관심을 받지 못했다. 카메라는 그를 계속 흐릿하게 비췄다. 의료진의 눈에 그가 보이지 않는다는 뜻이다.","집으로 돌아온 그는 쓰러지고, 다시 병원에 실려 가 어두운 병실 침대에 눕게 됐다. 증상이 제대로 다뤄지지 않은 채 상태가 악화되는 과정이 이어졌다.","끝에는 '흑인에게 의료 과실이 더 자주 일어난다', '흑인이 순환기 질환을 더 많이 앓지만 장기 이식은 백인이 더 많이 받는다' 같은 문구가 뜨고, 'Med.Diversity – 포용적인 의학을 위해'로 마무리했다."]}],"videoNote":"케이스 영상은 화면에 박힌 영어 자막과 문구를 확인해 정리했다. 단편영화는 대사 자막이 없어 화면을 직접 확인했다. Vimeo 케이스는 2025년 출품 당시 버전으로 보이며 내용이 거의 같다.","sources":[["Propmark (글래스 GP)","https://propmark.com.br/cannes/2026/glass/nigrum-corpus-da-artplan-para-idomed-e-instituto-yduqs-recebe-grand-prix-de-glass/"],["The Stable (캠페인 공개·통계)","https://www.thestable.com.au/artplan-a-short-film-a-book-intend-to-train-out-racial-bias-in-medical-practice/"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/nigrum-corpus"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/categoria-glass-cannes-lions-2026-campanas-ganadoras"],["Artplan 크리에이티브 디렉터 포트폴리오 (배포 수치)","https://pedrorosas.cargo.site/Black-Body"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"tiny-coffee-shops","tier":"grand-prix","title":"Tiny Coffee Shops","brand":"De'Longhi","agency":"LOLA, Madrid","country":"스페인 / 이탈리아","cat":"Industry Craft","awards":["인더스트리 크래프트 그랑프리","아웃도어 골드"],"video":"https://www.youtube.com/watch?v=4C0kHoyBIpE","ko":"드롱기 전자동 커피머신 다섯 대를 밀라노·도쿄·파리·코펜하겐·베를린의 카페를 본뜬 미니어처 건물로 감싼 캠페인. '최고의 커피는 카페에 있다'는 생각을 깨려 함","bg":["드롱기는 이탈리아의 가전 브랜드로, 원두를 넣으면 알아서 갈아 추출해 주는 전자동 커피머신이 주력 제품.","커피의 80% 이상은 집에서 소비됨. 그런데도 응답자의 72%는 '가장 맛있는 커피'는 카페에서만 마실 수 있다고 믿고 있었음. 유명 카페 앞에 긴 줄이 늘어서는 이유.","드롱기에게는 이 인식이 곧 판매의 장벽. 집에서도 카페 수준의 커피를 만들 수 있다고 아무리 기능을 설명해도, 사람들의 마음속에서 '진짜 커피'는 여전히 카페의 것이었음. 품질을 말로 전하는 것만으로는 부족하다는 결론."],"solIntro":["카페를 집 안으로 옮겨왔음. 드롱기 전자동 커피머신 다섯 대를 각 도시의 커피 문화를 담은 미니어처 카페 건물로 감싸서, '세상에서 가장 작은 카페'로 만들었음. 주방 조리대 위에 카페가 들어선다는 은유를 실제 물건으로 보여준 것."],"sol":["도시와 기계 조합. 파리(리벨리아), 도쿄(마니피카 에보 넥스트), 베를린(엘레타 울트라), 밀라노(엘레타 익스플로어), 코펜하겐(프리마돈나 아로마틱)","제작은 웨스 앤더슨 감독의 〈그랜드 부다페스트 호텔〉, 〈애스터로이드 시티〉 등에서 미니어처와 소품을 만든 베를린의 모형 장인 시몬 바이세가 맡음","모두 합쳐 400개가 넘는 부품을 손으로 만들었음. 장식용 껍데기가 아니라 커피머신이 그대로 작동하는 구조. 작은 창문으로 기계 화면이 보이고, 지붕을 열어 물을 채울 수 있음. 가게 안에는 미니어처 커피머신까지 놓여 있음","베를린에서 운 좋은 인플루언서들에게 미니어처 카페를 보내는 것으로 시작해, 디지털·매장·체험 행사로 확장하고, 2026년 밀라노 디자인 위크 전시로 마무리","도쿄에서는 3일간 갤러리 같은 팝업 '가장 작은 카페'를 열어 방문객이 열쇠 모양 토큰으로 음료를 받아 가게 함"],"stats":[["680만","노출(케이스 영상)"],["6년 만의 최고치","검색량(케이스 영상)"],["약 3,500명","도쿄 팝업 방문객"]],"results":["케이스 영상에 따르면 680만 노출을 기록했고, 브랜드 검색량은 6년 만에 최고치를 찍음. 도쿄 팝업에는 사흘간 약 3,500명이 다녀감. 이번 칸에서 인더스트리 크래프트 그랑프리와 아웃도어 골드를 받음. 드롱기 CMO는 '완벽한 커피는 더 이상 카페만의 것이 아니라 집 주방 조리대 위에도 있다'고 말함."],"analysis":["제품을 설명하지 않고 제품을 '변신'시켰음. 커피 맛은 광고로 전달하기 어렵지만, 커피머신이 카페 건물이 되는 모습은 한눈에 '이 기계가 곧 카페'라는 메시지를 전함. 은유를 말이 아니라 물건으로 만든 것.","인더스트리 크래프트는 만듦새 자체를 평가하는 부문. 영화 미니어처 장인이 만든 정교한 건물이 실제로 커피를 내린다는 점이 놀라움을 주고, 그 놀라움이 SNS에서 공유될 이유가 됐음. 정성 들인 결과물 자체가 브랜드의 품질을 증명하는 장치.","도시마다 다른 커피 문화를 건물로 표현해, 사람들이 카페에 가는 이유(분위기, 문화, 경험)까지 집으로 가져올 수 있다고 말함. 커피 맛뿐 아니라 '카페 경험'과 경쟁한 것."],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["칸 출품용 케이스 영상이다. 나레이션과 시몬 바이세의 인터뷰가 스페인어 자막으로 나온다. 등장하는 건물들은 실제 크기의 거리가 아니라 커피머신을 감싼 미니어처다."]},{"h":"케이스 영상 (약 1분 55초)","p":["유명 카페 앞에 사람들이 줄을 선 도시 거리로 시작했다. 그런데 카메라가 빠지면 이 거리 전체가 정교한 미니어처라는 게 드러났다. 나레이션은 맛있는 커피에는 끝없는 줄이 따라온다고 말하고, '똑같이 좋은 커피를 집에서 마실 수 있다면?'이라고 물었다.","그래서 가장 상징적인 기계 다섯 대를 여러 도시에서 영감을 받은 미니어처 카페로 바꾸기로 했다고 소개했다. 커피머신을 감싼 건물들이 하나씩 나왔다.","웨스 앤더슨 영화의 미니어처를 만든 시몬 바이세가 작업실에서 인터뷰했다. 실제로 작동하는 커피머신을 안에 품은 미니어처를 만들어야 했다고 설명하고, 모두 400개가 넘는 부품이 들어간 제작 과정이 단계별로 이어졌다.","완성된 카페 머신들이 거리 행사와 인플루언서들에게 보내지는 장면이 나왔다. 상자를 열어본 사람들이 '이 카페 정말 작다'며 놀라워했다. 바이세는 가게 안 미니어처 커피머신이 자신이 가장 좋아하는 숨은 디테일이라고 말했다.","성과로 680만 노출과 6년 만의 최고 검색량이 나오고, '이렇게 드롱기의 베스트셀러 기계 다섯 대가 세계 최고 커피의 예술적 상징이 됐다'는 말로 마무리했다."]}],"videoNote":"영상 화면과 스페인어 자막을 확인해 정리했다. 자동 자막이 없어 장면별로 직접 확인했다.","sources":[["Contagious (인더스트리 크래프트 수상)","https://www.contagious.com/article/cannes-lions-2026-industry-craft-winners-7b983b0a90b241e6a7886be856201f94"],["드롱기 재팬 보도자료 (수상·도쿄 팝업)","https://eu-assets.contentstack.com/v3/assets/blt2252ade9ce4d4191/bltf7efb79fe021eca1/6a4dc9bd541f2adf3b9418ef/%E5%85%AC%E5%BC%8FHP%E7%94%A8%E3%80%90De_Longhi%EF%BD%9CPRESS_RELEASE%E3%80%91%E3%82%AB%E3%83%B3%E3%83%8C%E3%83%A9%E3%82%A4%E3%82%AA%E3%83%B3%E3%82%BA2026%E3%81%A7W%E5%8F%97%E8%B3%9E%E3%80%8CTiny_Coffee_Shops%E3%80%8D.pdf"],["llllitl (배경 수치·제작)","https://www.llllitl.fr/2026/07/delonghi-tiny-coffee-shops/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"supernova-adaptive","tier":"grand-prix","title":"Supernova Adaptive","brand":"adidas","agency":"TBWA\\Canada, Toronto","country":"캐나다 / 독일","cat":"Innovation","awards":["이노베이션 그랑프리"],"video":"https://www.youtube.com/watch?v=JFJtYyt8DO0","ko":"다운증후군 선수들과 함께 3년간 개발한 아디다스의 첫 퍼포먼스 러닝화. 발볼은 넓고 뒤꿈치는 좁은 발에 맞춰 신발 자체를 새로 설계함","bg":["스포츠 브랜드들은 운동화 성능을 높이는 데 수십억 달러를 써 왔음. 하지만 그 신발들은 대부분 표준적인 발 모양을 기준으로 만들어졌음.","다운증후군이 있는 사람들은 유전적인 특성 때문에 발 모양이 다른 경우가 많음. 앞쪽은 넓고 뒤꿈치는 좁고, 과회내(발이 안쪽으로 무너지는 현상)와 안정성 문제를 겪기도 함. 연구에 따르면 다운증후군이 있는 사람의 66%가 발에 맞는 신발을 찾는 데 어려움을 겪었음. 전 세계 약 600만 명에게 맞는 러닝화가 사실상 없었던 셈.","출발점은 아디다스가 후원하는 선수 크리스 니키치. 다운증후군이 있는 사람 최초로 철인 3종(아이언맨)을 완주한 선수이자, 글로벌 스포츠 브랜드가 후원한 첫 다운증후군 선수. 그는 맞지 않는 신발 때문에 물집과 통증에 시달렸고, 경기를 끝까지 뛰기 어려울 정도였음."],"solIntro":["광고가 아니라 제품으로 답했음. 다운증후군 선수들과 함께 그들의 발에 맞는 퍼포먼스 러닝화를 처음부터 공동 개발함. 아디다스의 인기 러닝화 '슈퍼노바 라이즈 3'를 바탕으로 만든 '슈퍼노바 어댑티브'."],"sol":["3년에 걸쳐 개발. 선수, 보호자, 다양한 장애를 가진 사람들과 함께 만들었고, 수백 마일의 착용 테스트를 거침","넓은 앞코와 좁은 뒤꿈치에 맞춘 핏. 뒤꿈치가 빠지지 않게 하고 발가락 공간은 넉넉하게 설계","단단한 뒤꿈치로 발을 넣기 쉽게 하고, 압박이 적은 끈 구조, 자석으로 여닫는 뒤꿈치·발등 고리를 적용. 손 움직임이 불편한 사람도 혼자 신을 수 있게 함","발등 쪽 혀를 신발 몸체에 붙인 구조(거싯 텅)로 발 중간 부분을 지지해 안정성을 높임. 시각·감각에 어려움이 있는 사람을 위한 촉각 요소도 넣음","2026년 3월 21일 세계 다운증후군의 날에 맞춰 29개국에 출시"],"stats":[["66%","맞는 신발을 찾기 어렵다는 다운증후군 당사자 비율"],["3년","공동 개발 기간"],["29개국","출시 국가"]],"results":["세계 다운증후군의 날에 29개국에서 정식 출시됨. 장애 관련 매체들은 '실제 필요를 다룬 신발'이라고 평가함. 케이스 영상은 이 신발이 더 넓게는 전 세계 장애인 13억 명을 위한 해법이 될 수 있다고 밝힘. 이번 칸에서 이노베이션 그랑프리를 받음."],"analysis":["이노베이션 부문은 아이디어가 실제로 작동하는 기술이나 제품이 됐는지를 봄. 이 캠페인은 메시지를 알리는 데서 멈추지 않고, 실제로 팔리는 신발을 만들어 냈다는 점이 결정적.","포용(inclusion)을 말로 하지 않고 제품 설계로 증명함. '모두를 위한 스포츠'라는 아디다스의 오랜 철학을, 그동안 시장에서 소외됐던 사람들의 발 모양에서부터 다시 시작한 셈.","한 명의 실제 선수에게서 출발했다는 점이 진정성을 만듦. 크리스 니키치라는 구체적인 사람의 고통이 문제를 분명하게 보여주고, 당사자들과 함께 만들었다는 과정이 제품의 신뢰를 뒷받침함.","작은 집단을 위해 만든 해법이 더 넓게 쓰일 수 있다는 것도 포인트. 자석 고리나 쉽게 신는 구조는 다운증후군뿐 아니라 다양한 장애를 가진 사람과 노인에게도 도움이 될 수 있음."],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["영상 속 크리스 니키치는 다운증후군이 있는 사람 최초로 철인 3종을 완주한 미국 선수다. 인터뷰에 나오는 '발볼이 넓고 뒤꿈치가 좁다'는 말이 이 신발의 출발점이다."]},{"h":"케이스 영상 (약 2분 15초)","p":["'신발 브랜드들은 운동화를 완벽하게 만드는 데 수십억 달러를 쏟아부었다. 하지만 그 어떤 신발도 당신 발에 맞지 않는다면?'이라는 문구로 시작했다.","'세상에 잘 알려지지 않았지만, 다운증후군이 있는 사람들은 유전적인 발 이상을 겪는다'는 설명과 함께 한 사람이 '앞쪽은 넓고 뒤꿈치는 아주 좁다'고 말했다. 크리스 니키치 곁의 한 사람은 그가 처음 운동을 시작했을 때 물집투성이였고 발가락이 엉망이었다고 회상했다. 크리스는 마라톤에서 통증이 있다고 말했다.","한 부모는 '세상 누구도 우리 아이들을 위한 신발을 만들지 않는다'고 말하고, 아디다스는 '세계 최대 스포츠 기업 중 하나인 우리가 하지 않으면 누가 하겠느냐'고 답했다. 다운증후군 선수와 함께 만든 첫 퍼포먼스 러닝화 소식을 전하는 뉴스 화면이 이어졌다.","아디다스 본사 제품팀이 선수들에게 무엇이 필요한지 묻는 장면이다. 선수들은 '뒤꿈치가 자꾸 빠진다', '앞쪽에 공간이 더 필요하다'고 말하고, 발 본을 뜨는 과정과 수백 마일의 착용 테스트가 나왔다.","'삶을 바꾸는 5가지 기능'이 소개되고, 신발을 처음 신어본 선수들이 '완벽해요', '맞아요', '정말 멋지다'며 기뻐했다.","'더 넓은 장애를 가진 13억 명을 위한 해법', '29개국 판매' 같은 문구가 이어지고, 비에른 굴덴 아디다스 CEO가 '스포츠는 최고의 것이고, 모든 사람이 누릴 수 있어야 한다'고 말하며 마무리했다."]}],"videoNote":"실제 영상의 인터뷰 자막과 화면 문구를 확인해 정리했다.","sources":[["Contagious (이노베이션 수상)","https://www.contagious.com/article/cannes-lions-2026-innovation-winners-5153116714b04761bf530778b823e7f2"],["Propmark (제품 기능)","https://propmark.com.br/cannes/2026/innovation/tbwa-canadense-conquista-gp-de-innovation-com-adidas/"],["LBB Online (그랑프리 목록)","https://lbbonline.com/news/Cannes-Lions-2026-Grand-Prix-Winners-in-Brand-Experience-and-Activation-Business-Transformation-Commerce-Effectiveness-Strategy-Innovation-and-Luxury"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"warmer-together","tier":"grand-prix","title":"Warmer Together","brand":"Moncler","agency":"WeSayHi, Sliema (몰타)","country":"이탈리아 / 몰타","cat":"Luxury","awards":["럭셔리 그랑프리"],"video":"https://www.youtube.com/watch?v=q1X50LAmL7Y","ko":"평생의 친구 알 파치노와 로버트 드 니로를 마주 앉혀, '따뜻함은 옷이 아니라 함께하는 사람에게서 온다'고 말한 몽클레르의 브랜드 캠페인","bg":["몽클레르는 70년 넘게 '따뜻함'과 함께해 온 이탈리아의 럭셔리 패딩 브랜드. 추운 날씨를 막아주는 고급 다운재킷의 대명사.","2025년 럭셔리 시장은 전반적으로 둔화됐음. 몽클레르도 2025년 3분기 브랜드 매출이 1% 줄었고, 1~9월 누적 그룹 매출도 전년보다 소폭 감소함. 유럽과 일본에서는 관광객 감소와 신중해진 소비자 때문에 매출이 떨어졌음.","이런 시기에 '추위를 막는 기능'만으로는 비싼 패딩을 살 이유를 만들기 어려웠음. 몽클레르는 따뜻함의 의미를 날씨에서 사람 사이의 관계로 넓히는 새 글로벌 브랜드 플랫폼이 필요했음."],"solIntro":["따뜻함을 '사람과 사람 사이의 연결'로 다시 정의했음. 그리고 그 메시지를 가장 설득력 있게 보여줄 두 사람을 골랐음. 수십 년 우정을 이어온 알 파치노와 로버트 드 니로. 두 사람이 함께한 첫 패션 캠페인."],"sol":["2025년 10월 가을·겨울 컬렉션에 맞춰 공개. 인물 사진가 플라톤이 뉴욕에서 흑백으로 촬영","제품보다 두 사람의 우정에 집중함. 대본 없는 듯한 대화와 영화 같은 인물 사진으로 구성. 우정, 존중, 연결, 신뢰, 따뜻함 다섯 가지 주제로 풀어냄","두 개의 의자를 핵심 시각 장치로 사용. 두 사람이 처음 함께 출연한 영화 〈히트〉(1995)의 식당 장면과, 두 사람이 처음 만난 뉴욕의 연기 학교를 떠올리게 하는 연출","옥외 광고, 인쇄, 디지털, 소셜, 넷플릭스까지 전 세계에 집행. 마야 70, 브르타뉴 재킷을 함께 보여줌","빌 위더스의 'Lean on Me'를 토비 은위그웨가 다시 부른 곡을 캠페인 음악으로 쓰고, 뉴욕 록펠러 센터에서 라이브 공연으로 캠페인을 마무리함"],"stats":[["31억","잠재 도달(케이스 영상)"],["8,540만","순매출(케이스 영상)"],["+48%","전년 대비(케이스 영상)"]],"results":["케이스 영상에 따르면 잠재 도달 31억 회, 순매출 8,540만, 전년 대비 48% 증가를 기록함. 이번 칸 럭셔리 부문(130편 출품) 그랑프리. 심사위원장 품 르페뷰르는 '럭셔리 스토리텔링을 아주 단순한 진실, 사람 사이의 연결로 되돌려 놓았다'고 평가하고, 크리에이티브와 성과가 잘 맞아떨어진 점을 높이 삼."],"analysis":["브랜드의 핵심 자산을 버리지 않고 의미를 넓혔음. 몽클레르는 원래 '따뜻함'의 브랜드였고, 이 캠페인은 그 단어를 그대로 쓰되 날씨에서 관계로 확장함. 브랜드의 뿌리는 지키면서 새로운 감정적 이유를 만든 것.","모델 선택이 메시지 그 자체. 알 파치노와 로버트 드 니로의 오랜 우정은 이미 대중이 아는 이야기라서, 따로 설명하지 않아도 '함께하는 따뜻함'이 바로 전달됨. 영화 〈히트〉를 기억하는 사람에게는 두 사람이 마주 앉는 장면 자체가 큰 울림.","럭셔리 광고의 공식을 비켜감. 화려한 제품 클로즈업 대신 흑백 화면, 느린 대화, 두 개의 의자만으로 구성해 오히려 고급스러움을 만들었음. 심사위원장의 말처럼 '잘 만든 럭셔리는 의미 있는 것을 고르는 일'이라는 걸 보여준 사례."],"films":[{"kind":"메인 필름","title":"Warmer Together with Al Pacino and Robert De Niro (1분 30초)","url":"https://www.youtube.com/watch?v=b00A4DVQYrQ"},{"kind":"메인 필름","title":"Warmer Together | Director's Cut (7분 20초)","url":"https://www.youtube.com/watch?v=TtZ8MLSZLrk"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["알 파치노와 로버트 드 니로는 젊은 시절부터 우정을 이어온 할리우드 배우다. 두 사람이 한 화면에서 처음 마주 앉은 영화가 〈히트〉(1995)로, 식당 테이블에 마주 앉아 대화하는 장면이 유명하다. 이 캠페인의 '두 개의 의자'는 그 장면을 떠올리게 한다. 배경 음악의 가사는 옮기지 않는다."]},{"h":"케이스 영상 (약 2분 10초)","p":["어두운 무대 위 한 사람의 실루엣. 알 파치노가 '무슨 일이 일어날지 말해주겠다. 나는 알 파치노이고, 내 아주 좋은 친구 로버트 드 니로를 만날 것'이라고 말하며 시작했다.","의자들이 놓인 텅 빈 무대에서 두 사람이 만나 반갑게 인사했다. '밖은 춥네', '여긴 따뜻하다' 같은 짧은 대화가 오갔다.","뉴욕 스카이라인을 배경으로 옥상에 놓인 두 개의 의자. 나레이션이 이어졌다. '따뜻함은 결코 바깥의 것이 아니었다. 언제나 안에서 일어나는 일이었다.' 따뜻함은 함께 걷고 이야기하는 것, 의자를 끌어와 앉아 대화하는 것, 서로를 아끼는 대화에서 온다는 내용이다.","밤의 도시에 걸린 대형 옥외 광고, 웹사이트와 인쇄 광고 등 캠페인 집행 장면이 나오고, '날씨보다도, 따뜻함은 언제나 함께하는 것'이라는 말로 메시지를 정리했다.","록펠러 센터 라이브 공연 장면과 언론 평가가 이어지고, 잠재 도달 31억, 순매출 8,540만, 전년 대비 48% 증가라는 성과 수치가 나왔다. 마지막은 옥상 의자에 나란히 앉은 두 사람의 뒷모습."]},{"h":"메인 필름 (약 1분 30초)","p":["흑백 화면에 'Moncler Presents' 문구로 시작했다. 어두운 무대, 의자와 작은 테이블.","두 사람이 만나 '뭐 하고 지내?', '좋아 보이네', '너도'라며 인사를 나눴다. '밖은 추워. 여긴 좀 따뜻하네'라는 대화가 이어졌다.","나이 드는 것에 대해 '어쩌겠어', '코트 입어야지. 그게 인생이지. 점점 좋아지다가… 나빠지다가…' 하며 웃었다. 테이블 위에서 서로의 손을 잡는 클로즈업이 나오고, 몽클레르 로고로 끝났다."]}],"videoNote":"실제 영상의 대사 자막과 화면 문구를 확인해 정리했다. 노래 가사는 저작권 때문에 옮기지 않았다. 케이스 영상은 공식 채널이 아닌 공개 업로드본.","sources":[["CB News (심사평·출품 수)","https://www.cbnews.fr/node/101986"],["Contagious (럭셔리 수상)","https://www.contagious.com/article/cannes-lions-2026-luxury-winners-89446dd0699d414491e99676b1b12d75"],["Luxury Tribune (2025 실적·캠페인 공개)","https://www.luxurytribune.com/en/moncler-remains-steady-in-the-third-quarter-of-2025"],["llllitl (제작 정보)","https://www.llllitl.fr/2026/07/moncler-warmer-together/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"build-your-own-super-bowl","tier":"grand-prix","title":"Build Your Own Super Bowl Commercial","brand":"Uber Eats","agency":"Special (미국 & 호주)","country":"미국 / 호주","cat":"Media","awards":["미디어 그랑프리","다이렉트 골드"],"video":"https://www.youtube.com/watch?v=ftlLzZKzU1U","ko":"음식을 주문하듯 앱에서 장면을 골라 '나만의 슈퍼볼 광고'를 만들게 한 우버이츠 캠페인. 1,000편이 넘는 광고 조합을 만들고, 완성할 때마다 할인 혜택을 줘 주문으로 연결함","bg":["슈퍼볼은 미국에서 1년 중 가장 큰 스포츠 이벤트이자, 음식 배달 업계에는 가장 치열한 대목. 경기 날에는 피자, 치킨 같은 배달 주문이 몰리고, 배달 앱들은 이 날의 주문을 잡기 위해 경쟁함.","우버이츠는 2년째 '미식축구는 사실 음식을 팔기 위해 만들어졌다'는 음모론 콘셉트로 슈퍼볼 광고를 이어오고 있었음. 배우 매튜 매커너히가 이 음모론을 파헤치는 인물로 등장하는 시리즈.","문제는 슈퍼볼 광고의 한계. 한 편에 수백만 달러가 드는 광고를 사람들이 재밌게 봐도, 광고를 본 순간과 실제로 앱을 열어 주문하는 순간 사이에는 거리가 있음. 다른 브랜드들도 모두 같은 날 광고를 쏟아내기 때문에, 재미만으로는 주문까지 이어지기 어려웠음."],"solIntro":["광고를 앱 안으로 옮겼음. 음모론의 '증거'들을 우버이츠 앱에 모두 넣고, 사람들이 포케볼이나 부리토볼 메뉴를 고르듯 재료(장면)를 골라 자기만의 슈퍼볼 광고를 '주문'하게 했음. 광고를 보는 곳이 곧 주문하는 곳이 되도록 만든 것."],"sol":["TV 광고는 슈퍼볼 LX 2쿼터에 방송. 매튜 매커너히가 '미식축구는 음식을 팔려는 음모'라고 주장하고, 브래들리 쿠퍼가 미식축구를 변호하고, 파커 포지가 끼어드는 구성","앱에서는 선택할 때마다 새로운 증거 장면, 새 캐릭터, 카메오가 열림. 40개가 넘는 증거와 1,000개가 넘는 광고 조합. 애디슨 레이, 트라멜 틸먼, 제리 라이스 같은 유명인 카메오도 들어감","모든 조합이 자연스럽게 이어지도록 1,000편 넘는 맞춤형 광고를 사람이 직접 쓰고 제작함","광고를 하나 완성할 때마다 다음 주문에 쓸 수 있는 할인 혜택을 줌. 재미가 곧바로 주문으로 이어지는 구조","샌프란시스코 슈퍼볼 체험 행사장에도 '증거실'을 만들어 오프라인으로 확장"],"stats":[["3,600만 달러+","역대 슈퍼볼 매출 기록 경신 폭"],["370만","신규 앱 방문(케이스 영상)"],["1,000편+","제작한 광고 조합"]],"results":["우버이츠는 역대 최고의 슈퍼볼 매출을 기록했고, 이전 기록을 3,600만 달러 넘게 경신함. 케이스 영상에 따르면 1년 중 경쟁이 가장 치열한 주간에 370만 건의 신규 앱 방문을 끌어냈고, 전환율도 사상 최고를 기록함. 이번 칸에서 미디어 그랑프리(1,432편 출품)와 다이렉트 골드를 받음. 호주가 이번 칸에서 받은 첫 그랑프리이기도 함."],"analysis":["심사위원장 신두자 라이는 이 작품이 '퍼널을 무너뜨렸다'고 평가함. 보통 광고는 '보고 → 관심 갖고 → 앱을 열고 → 주문하는' 여러 단계를 거치는데, 이 캠페인은 광고를 보는 행위 자체가 앱 안에서 일어나게 만들어 그 단계를 한 번에 압축했음.","다른 브랜드들이 사람들이 광고를 오래 보게 하는 데 집중할 때, 우버이츠는 사람들이 앱에 오래 머물게 했음. 미디어를 아이디어를 실어 나르는 수단이 아니라 아이디어 그 자체로 쓴 사례.","'광고를 주문한다'는 설정이 브랜드의 본업과 정확히 겹침. 메뉴를 고르듯 장면을 고르는 경험이 자연스럽게 우버이츠 앱 사용법을 익히게 하고, 마지막의 할인 혜택이 실제 주문으로 마무리함.","2년간 쌓아온 '음식 음모론' 세계관이 있었기에 가능했음. 이미 사람들이 아는 농담을 확장한 덕분에, 1,000개의 조합도 하나의 이야기처럼 느껴짐."],"films":[{"kind":"메인 필름","title":"슈퍼볼 LX TV 광고 (60초)","url":"https://www.youtube.com/watch?v=vEFUlSYbzM8"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["이 광고의 웃음은 대부분 말장난이다. 미식축구 용어와 선수 이름에 음식 단어가 숨어 있다는 '증거'를 내미는 식이다. 예를 들어 쿼터백이 뛰는 걸 '스크램블'이라 부르는데, 스크램블은 스크램블드에그이기도 하다. '팬케이크 블록'은 상대를 바닥에 납작하게 눕히는 블로킹 기술이다."]},{"h":"케이스 영상 (약 2분 10초)","p":["'미국 최대의 스포츠 엔터테인먼트 날이 어떻게 우버이츠의 기록적인 매출의 날이 됐는지'라는 나레이션으로 시작했다.","2년 동안 '미식축구는 음식을 팔기 위해 만들어졌다'는 음모론을 파헤쳐 왔고, 증거는 계속 늘어났다고 설명했다. 선수 이름이 '양고기, 농어, 레드와인'이면 그건 선수 명단이 아니라 프랑스 코스 요리라는 식의 농담이 이어졌다.","이번 슈퍼볼에는 모든 증거를 앱에 넣고, 팬들이 포케볼이나 부리토볼처럼 자기만의 '진실'을 주문하게 했다고 소개했다. 재료를 고를 때마다 새로운 증거가 열리고, '명예의 전당 건물이 사실 착즙기 모양'이라는 장면 같은 새 장면과 농담, 새 등장인물이 나타났다.","앱이 처음으로 엔터테인먼트 공간이 되어 370만 건의 신규 방문을 만들었다고 했다. 이를 위해 1,000편이 넘는 맞춤형 슈퍼볼 광고를 만들었고, 모든 장면을 사람이 직접 만들어 어떤 조합이든 자연스럽게 이어지게 했다고 설명했다.","광고를 완성할 때마다 할인 혜택이 열려 엔터테인먼트가 주문으로 바뀌었고, 이전 기록을 3,600만 달러 넘게 경신한 역대 최고 슈퍼볼 매출을 냈다고 했다. '다른 브랜드가 광고에 시간을 쓰게 할 때, 우리는 앱에 시간을 쓰게 했다'는 말과 함께 '슈퍼볼 온 우버이츠'로 마무리했다."]},{"h":"메인 필름: 슈퍼볼 TV 광고 (약 1분)","p":["아침 식탁. 매커너히가 브래들리 쿠퍼에게 '쿼터백이 뛰면 스크램블이라고 하지. 아침으로 스크램블 어때?'라며 음모론을 꺼냈다. 쿠퍼는 '다른 데 갈 데 없냐'며 귀찮아했다.","매커너히는 골대가 포크 모양이라거나, 선수 이름에 햄(Ham), 체리(Cherry)가 들어간다는 '증거'를 줄줄이 내밀었다. 쿠퍼가 '골라서 말하는 거잖아(cherry picking)'라고 하자 그것마저 체리라며 받아쳤다.","파커 포지가 등장해 '팬케이크 블록 얘기는 했어?'라고 거들고, 프로 미식축구 명예의 전당 건물을 보여주며 '저건 착즙기야'라고 주장했다.","결국 쿠퍼가 '그만 싸우자(squash this beef)'고 하자, 매커너히는 '비프(beef)도 음식이네'라며 또 받아쳤다. '미식축구가 배고프게 만들면, 우버이츠로 주문하세요'라는 말로 끝났다."]}],"videoNote":"실제 영상의 나레이션과 대사 자막을 확인해 정리했다. 영어 말장난은 의미가 통하도록 풀어서 설명했다. TV 광고는 공식 채널이 아닌 공개 업로드본.","sources":[["LBB Online (수상·심사평·성과)","https://lbbonline.com/news/uber-eats-special-cannes-grand-prix-2026"],["B&T (호주 첫 그랑프리)","https://www.bandt.com.au/special-australia-delivers-australias-first-2026-cannes-grand-prix/"],["Uber 뉴스룸 (캠페인 구성)","https://uber.com/newsroom/super-bowl-lx-from-app-to-endzone/"],["Chowhound (1,000개 버전)","https://www.chowhound.com/2094892/uber-eats-superbowl-2026-commercial-thousand-versions"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"field-barcode","tier":"grand-prix","title":"Field Barcode","brand":"Mercado Livre","agency":"GUT, São Paulo","country":"브라질","cat":"Outdoor","awards":["아웃도어 그랑프리","아웃도어 브론즈"],"video":"https://www.youtube.com/watch?v=KATqp4QLnS8","ko":"축구장 잔디를 길이 104m짜리 바코드 모양으로 깎아, TV 중계 화면을 스캔하면 할인 쿠폰이 나오게 만든 메르카도 리브레의 경기장 캠페인","bg":["메르카도 리브레(브라질명 메르카도 리브르)는 중남미 최대의 이커머스 기업. 상파울루의 유서 깊은 파카엥부 경기장이 새 단장을 마치고 다시 문을 열 때 이름 사용권을 사서, 경기장 이름이 '메르카도 리브르 아레나 파카엥부'가 됐음.","경기장 이름을 사는 스폰서십은 보통 간판과 중계 화면에 로고가 노출되는 데서 끝남. 사람들은 이름을 보지만, 그게 쇼핑으로 이어지지는 않음.","축구는 브라질 사람들이 가장 많이 보는 콘텐츠. 메르카도 리브레에게 과제는 비싼 경기장 스폰서십을 단순한 로고 노출이 아니라 실제 구매로 연결하는 것이었음."],"solIntro":["경기장 자체를 '결제 페이지'로 만들었음. 축구장 잔디를 깎는 방향에 따라 생기는 밝고 어두운 줄무늬에 착안해, 잔디 전체를 하나의 거대한 바코드로 깎았음. TV로 경기를 보는 사람이 휴대폰으로 화면 속 잔디를 스캔하면 바로 할인 쿠폰을 받는 구조."],"sol":["잔디를 밝은 줄과 어두운 줄로 번갈아 깎아 길이 104m의 바코드를 만듦. 대부분의 TV 카메라 각도에서도 인식되도록 설계","데뷔 무대는 코린치안스 대 보카 주니어스 경기. 2012년 코파 리베르타도레스 결승을 재현한 매치로 큰 관심을 모은 경기","TV, 디즈니+, 유튜브로 경기를 보던 팬들이 전용 웹앱으로 화면 속 잔디를 스캔하면, 메르카도 리브레에서 쓸 수 있는 25% 할인 쿠폰이 열림. 중계를 끄지 않고도 바로 쇼핑할 수 있게 함","축구 유니폼, 골키퍼 장갑처럼 경기를 보며 사고 싶어지는 상품과 연결"],"stats":[["53,000장+","사용된 쿠폰"],["150만 유로+","발생한 매출"],["813개 도시","쿠폰을 쓴 지역(25개 주, 케이스 영상)"]],"results":["브랜드 발표에 따르면 5만 3,000장이 넘는 쿠폰이 사용됐고 150만 유로가 넘는 매출이 발생함. 케이스 영상에 따르면 브라질 25개 주 813개 도시에서 접속했고, 언론은 '파카엥부가 바코드가 됐다', '아름다운가 흉한가, 바코드 잔디가 관심을 끈다' 같은 기사로 화제를 다룸. 이번 칸 아웃도어 부문(135편 출품)에서 그랑프리를 받음. 심사위원장 에런 스타크먼은 이 아이디어를 '필연적(inevitable)'이라고 표현하며, 이런 고전적인 옥외 광고는 AI가 대체할 수 없다고 말함."],"analysis":["옥외 광고의 정의를 넓혔음. 경기장 간판이 아니라 경기장 바닥 전체가 광고판이 됐고, 그 광고판이 TV를 통해 전국 거실로 들어감. 현장에 있는 관중보다 중계를 보는 수백만 명을 위한 옥외 광고.","'잔디 깎는 줄무늬'라는 이미 존재하던 요소를 활용한 점이 영리함. 경기 규칙이나 시야를 해치지 않으면서, 누구나 본 적 있는 줄무늬를 바코드로 바꾸기만 했음. 심사위원장이 '필연적'이라고 말한 것도 '왜 이제야 나왔나' 싶을 만큼 자연스러운 아이디어라는 뜻.","스폰서십을 커머스로 바꿨음. 경기장 이름 사용권이라는 전통적인 미디어 자산을, 이커머스 기업의 본업인 '구매'로 곧바로 연결한 사례. 노출이 아니라 매출로 성과를 증명할 수 있었음."],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["축구장 잔디는 깎는 방향에 따라 빛 반사가 달라져 밝은 줄과 어두운 줄이 생긴다. 경기장마다 체크무늬나 줄무늬를 넣는 이유다. 이 캠페인은 그 줄무늬를 바코드처럼 배열한 것이다. 영상은 대부분 나레이션 없이 화면과 문구로 진행된다."]},{"h":"케이스 영상 (약 2분)","p":["여러 축구장의 잔디 무늬를 보여주며 시작했다. 경기장마다 잔디를 깎는 방식으로 체크무늬나 줄무늬를 만든다는 설명이다.","메르카도 리브레의 물류 상자와 함께, 새로 문을 연 파카엥부 경기장의 이름 사용권을 메르카도 리브레가 사서 '메르카도 리브르 아레나 파카엥부'가 된다는 기사 화면이 나왔다.","드론 화면으로 잔디가 굵고 가는 줄무늬로 깎여 거대한 바코드가 되는 과정이 보이고, '104m'라는 길이가 표시됐다.","코린치안스 대 보카 주니어스 경기의 중계 화면. 해설진이 '잔디가 바코드처럼 보이지 않느냐'고 말하고, 관중과 시청자가 휴대폰으로 화면 속 잔디를 스캔하자 골키퍼 장갑, 유니폼 등에 쓸 수 있는 25% 할인 쿠폰이 떴다.","집집마다 TV 화면을 스캔하는 SNS 영상들이 이어지고, '25개 주 813개 도시에서 접속' 같은 성과와 함께 '파카엥부가 바코드가 됐다' 등 언론 보도가 소개됐다.","실제 중계 장면과 유명 축구인의 반응 영상으로 마무리했다."]}],"videoNote":"영상 화면과 문구, 중계 화면 자막을 확인해 정리했다. 자동 자막이 없어 장면별로 직접 확인했다.","sources":[["Propmark (그랑프리·심사)","https://propmark.com.br/cannes/2026/outdoor/gut-conquista-grand-prix-em-outdoor-lions/"],["WeRSM (실행·성과)","https://wersm.com/mercado-libre-turned-a-soccer-field-into-a-giant-barcode/"],["LBB Online (브라질 수상작)","https://lbbonline.com/news/brazil-cannes-lions-winners-2026-grand-prix"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"relax-your-tight-end","tier":"grand-prix","title":"Relax Your Tight End","brand":"Novartis","agency":"Fallon, Minneapolis","country":"미국","cat":"Pharma","awards":["파마 그랑프리","파마 실버"],"video":"https://www.youtube.com/watch?v=6qntVs_kftA","ko":"전립선암 검사는 '불편한 직장 검사'가 아니라 간단한 피검사로 시작할 수 있다는 걸, NFL 타이트엔드 선수들이 편하게 '힘을 빼는' 모습으로 알린 노바티스의 슈퍼볼 광고","bg":["미국 남성 8명 중 1명은 평생 한 번은 전립선암 진단을 받음. 일찍 발견하면 치료 가능성이 높지만, 케이스 영상에 따르면 검사를 받지 않는 남성이 4,000만 명에 이름.","가장 큰 걸림돌은 오해. 많은 남성이 전립선암 검사라고 하면 의사가 손가락으로 직장을 검사하는 장면부터 떠올리고, 그게 싫어서 검사를 미룸. 실제로는 간단한 PSA 혈액검사로 시작할 수 있다는 사실이 잘 알려져 있지 않았음.","노바티스는 전립선암 치료제를 만드는 제약회사. 특정 제품 광고가 아니라 질병 인식과 검사를 늘리는 비브랜드(언브랜디드) 캠페인으로 접근함."],"solIntro":["'긴장 풀어, 피검사야(Relax, it's a blood test)'. 남자들이 검사를 피하는 진짜 이유인 '엉덩이에 힘이 들어가는' 두려움을 정면으로, 그러나 웃기게 다뤘음. 미식축구 포지션 '타이트엔드(tight end)'가 영어로 '꽉 조인 엉덩이'로도 들린다는 점을 이용한 말장난이 출발점."],"sol":["2026년 2월 8일 슈퍼볼 LX에서 60초 광고를 공개. 전·현직 NFL 타이트엔드들이 마사지를 받거나 수영장에 둥둥 떠 있는 등 한껏 이완한 모습으로 등장하고, 배경에는 엔야의 'Only Time'이 흐름. '손가락이 필요 없는 간단한 혈액검사'라는 메시지를 직접적으로 전함","전립선암을 이겨낸 브루스 에어리언스 감독이 출연하고, 롭 그롱코프스키가 마지막 문구를 말함. 전립선암과 개인적인 사연이 있는 NFL 인물 8명이 참여","NFL 경기장 현장 검사, 슈퍼볼 체험 행사장의 교육 부스, 검사에 관한 오해를 풀어주는 온라인 허브와 위험도 자가 진단 도구로 확장","선수들의 가족과 친구들이 소셜 영상에 참여해 더 많은 남성에게 검사를 권하도록 함. 환자 단체들과도 협력"],"stats":[["9.8배","온라인 장바구니에 담긴 PSA 검사 증가(케이스 영상)"],["#2","디 애슬레틱 선정 슈퍼볼 최고 광고"],["236편","파마 부문 출품작 중 유일한 그랑프리"]],"results":["케이스 영상에 따르면 온라인 장바구니에 담긴 PSA 검사가 9.8배 늘었음. 디 애슬레틱 '슈퍼볼 최고 광고' 2위, USA 투데이 애드미터 7위에 올랐고, 롤링스톤의 베스트 리스트에도 포함됨. 롭 그롱코프스키와 에어리언스 감독은 NBC 투데이 쇼 등 여러 방송에 출연해 검사를 알림. 이번 칸 파마 부문(236편 출품)에서 그랑프리를 받음. 심사위원장 트레이시 브레이더는 '공감 가는 인간적 진실, 진정성 있는 유명인 활용, 채널 전반의 통합'을 높이 평가하며 '좋은 부분들의 합보다 전체가 더 큰 작품'이라고 말함."],"analysis":["문제를 정확히 짚었음. 남자들이 전립선암 검사를 피하는 건 정보가 없어서가 아니라 '그 검사'가 싫어서였음. 캠페인은 그 두려움을 숨기지 않고 웃음의 소재로 꺼내, '힘 빼도 된다, 피검사다'라는 해결책을 한 번에 전함.","말장난 하나가 메시지와 모델 선택을 동시에 해결함. 타이트엔드 선수들이 '타이트하지 않은 엔드'를 보여주는 설정 덕분에, 미식축구 팬이라면 바로 웃고 기억할 수 있음. 슈퍼볼이라는 무대와 남성 시청자라는 타깃이 정확히 맞아떨어짐.","광고에서 끝나지 않고 검사까지 이어지는 길을 만들었음. 현장 검사, 온라인 허브, 자가 진단 도구로 '알게 되는 것'과 '실제로 검사받는 것' 사이의 거리를 줄인 점이 심사위원단이 말한 '채널 전반의 통합'.","제약 광고는 규제 때문에 진지하고 딱딱해지기 쉬운데, 이 캠페인은 유머로 민감한 주제의 문턱을 낮췄음. 제품명을 내세우지 않은 비브랜드 캠페인이라 유머를 쓰기도 더 자유로웠음."],"films":[{"kind":"메인 필름","title":"Relax your tight end. 슈퍼볼 광고 (60초)","url":"https://www.youtube.com/watch?v=lMTcZb48aVU"},{"kind":"메인 필름","title":"Relax, it's a blood test (30초)","url":"https://www.youtube.com/watch?v=z5FGLIGjnKA"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["타이트엔드(tight end)는 미식축구의 공격 포지션 이름이다. 그런데 영어로는 '꽉 조인 엉덩이'로도 들린다. 전립선암 검사에 대한 두려움(직장 검사)과 엮인 말장난이 캠페인의 핵심이다. PSA 검사는 피를 뽑아 전립선 특이 항원 수치를 보는 간단한 혈액검사다."]},{"h":"케이스 영상 (약 2분)","p":["'남성 8명 중 1명', '검사받지 않는 남성 4,000만 명' 같은 숫자로 시작했다. 이어서 실제 남성들이 '그 검사(손가락 검사)가 싫어서 안 받는다'고 털어놓는 영상이 나왔다.","하지만 시작은 '간단한 PSA 혈액검사'라는 설명이 나왔다. 그래서 남자들에게 긴장을 풀라고 말하기로 했다며, 경기 장면 속 타이트엔드와 꽉 조인 엉덩이 그림을 나란히 보여주는 말장난이 소개됐다.","슈퍼볼 광고 장면. 선수들이 얼굴 마사지를 받고, 물 위에 둥둥 떠 있고, 화이트보드에 '남성 8명 중 1명은 평생 전립선암 진단을 받는다'고 적어 보여줬다.","슈퍼볼 현장 이벤트, 검사 정보를 담은 웹사이트, 선수 가족과 친구들이 참여한 소셜 영상, 경기장 검사 부스와 이동 검진 차량 등 확장 활동이 이어졌다.","언론의 '최고의 슈퍼볼 광고' 순위와 함께, 온라인 장바구니에 담긴 PSA 검사가 9.8배 늘었다는 성과가 나왔다. 비뇨기과 학회 가이드라인이 PSA를 첫 번째 검사로 권고한다는 화면과 투데이 쇼에 출연한 그롱코프스키의 모습으로 마무리했다."]},{"h":"메인 필름: 슈퍼볼 광고 (약 1분)","p":["엔야의 'Only Time'이 흐르는 가운데 나레이터가 '살면서 이렇게 느긋한 타이트엔드를 본 적 있는가?'라고 물었다. NFL 타이트엔드들이 얼굴 마사지를 받거나, 수영장에 둥둥 떠 있거나, 말을 타고 들판을 걷는 등 한없이 편안한 모습으로 등장했다.","'걱정 없고, 차분하고, 평온한' 선수들. 나레이터는 이들이 이렇게 느긋한 이유가 전립선암 검사 때문이라고 밝혔다. '손가락이 필요 없는' 간단한 혈액검사가 있다는 걸 알게 됐기 때문.","브루스 에어리언스 감독이 '남성 약 8명 중 1명이 전립선암 진단을 받는데, 나도 그중 한 명이었다. 일찍 발견해서 지금 여기 있다'고 말하고, '그롱크, 내가 뭘 가르쳐줬지?'라고 물었다.","롭 그롱코프스키가 '타이트엔드에 힘 빼'라고 답하고, 전립선암 검사는 간단한 혈액검사로 시작한다는 안내와 함께 검사 정보 사이트 주소로 마무리했다."]}],"videoNote":"실제 영상의 대사 자막과 화면 문구를 확인해 정리했다. 케이스 영상은 자막이 없어 화면을 직접 확인했다. 참고 사이트에 연결된 영상은 비공개로 바뀌어 같은 케이스의 다른 공개본으로 대체했다. 노래 가사는 옮기지 않았다.","sources":[["Fierce Pharma (수상·광고 구성)","https://www.fiercepharma.com/marketing/novartis-relax-your-tight-end-cancer-campaign-wins-cannes-lions-pharma-grand-prix"],["Contagious (파마 수상)","https://www.contagious.com/article/cannes-lions-2026-pharma-winners-6c090db2d3134c75ba55a61f0fc5426c"],["Campaign (미국 수상작)","https://campaignlive.com/article/whos-leading-cannes-lions-2026-every-us-winner-ranked/1962450"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"periodic-fable","tier":"grand-prix","title":"The Periodic Fable","brand":"The Ordinary","agency":"Uncommon Creative Studio, London","country":"영국 / 캐나다","cat":"Health & Wellness","awards":["헬스 & 웰니스 그랑프리"],"video":"https://www.youtube.com/watch?v=KzzcVMa7gY4","videoKind":"메인 필름 · 한글 자막","ko":"원소 주기율표의 원소들을 '모공 제로', '주름 삭제' 같은 뷰티 광고 문구 49개로 바꾼 '가짜 주기율표'로, 과학처럼 포장된 화장품 마케팅을 비꼰 디 오디너리 캠페인","bg":["디 오디너리는 성분 이름을 그대로 제품명으로 쓰는 스킨케어 브랜드(캐나다 데시엠 소속). 과장 없이 성분과 과학을 투명하게 공개하는 것을 정체성으로 삼아 왔음.","뷰티 업계에는 과학처럼 보이지만 근거가 없는 표현이 넘쳐남. '안티에이징', '마법 같은', '주름 삭제', '완벽한' 같은 말들. 디 오디너리 조사에 따르면 영국 소비자의 51%는 '럭셔리'라고 표현된 제품을 더 신뢰했고, 안티에이징 시장은 2030년 800억 달러가 넘을 것으로 전망됨.","브랜드의 최고 브랜드 책임자는 '안타깝게도 많은 잘못된 정보가 공포를 구매의 방아쇠로 쓰기 위해 퍼지고 있다'고 말함. 디 오디너리에게 과제는 업계의 과장 광고와 자신들의 차이를 분명히 드러내는 것. 2025년 초 시작한 브랜드 플랫폼 '진실은 평범해야 한다(The Truth Should Be Ordinary)'의 연장선."],"solIntro":["과학의 상징인 원소 주기율표를 패러디했음. 원소 자리에 뷰티 업계가 즐겨 쓰는 근거 없는 유행어 49개를 넣은 '주기율 우화(The Periodic Fable™)'를 만들어, 과학처럼 보이는 말들이 사실은 '우화(지어낸 이야기)'라는 걸 보여줌. 제목 자체가 주기율표(Periodic Table)와 우화(Fable)를 합친 말장난."],"sol":["2025년 10월 공개. 감독 올리비아 드 캠프스(제작사 스머글러)가 차갑고 미래적인 교실을 배경으로 캠페인 필름을 연출","흰 옷을 입은 '학생들'이 뷰티 업계의 주문에 걸린 듯 얼굴을 문지르고, 굴리고, 당기는 이상한 관리법을 반복함. 필름에 나오는 관리법은 모두 실제로 시중에 판매되는 것들","에이전시는 과학자들과 협업해 내용의 과학적 정확성을 확인함","옥외 광고, 소셜, 인플루언서 활동으로 확장. 브랜드 웹사이트에서 '주기율 우화'를 직접 볼 수 있게 함"],"stats":[["49개","주기율표에 넣은 뷰티 유행어"],["51%","'럭셔리' 표현 제품을 더 신뢰하는 영국 소비자"],["블랙 펜슬","D&AD 2026"]],"results":["이번 칸 첫날 발표된 헬스 & 웰니스 그랑프리로, 2026년 영국의 첫 그랑프리이자 에이전시 언커먼의 첫 칸 그랑프리. 심사위원장 카이나즈 카르마카르는 '이견 없는 수상작'이라며 '피부 트렌드에 대한 집착이 날마다 통제 불능이 되어가는 현실에 대한 뛰어난 논평'이라고 평가함. D&AD에서도 최고상인 블랙 펜슬을 받음. 공개된 자료에 매출 같은 정량 성과는 나와 있지 않음."],"analysis":["적의 언어를 무기로 썼음. 과장 광고가 '과학처럼 보이려고' 쓰는 형식(실험실, 원소, 주기율표)을 그대로 가져와, 그 안을 근거 없는 유행어로 채우니 과장 광고의 허술함이 저절로 드러남.","브랜드 정체성과 메시지가 완전히 일치함. 성분을 투명하게 공개하는 디 오디너리가 '과학을 흉내 내는 마케팅'을 비판하는 건 설득력이 있고, 비판 자체가 곧 '우리는 다르다'는 브랜드 광고가 됨.","필름의 기괴한 분위기가 메시지를 강화함. 똑같은 흰 옷을 입고 무표정하게 얼굴을 문지르는 학생들은, 끝없는 스킨케어 루틴에 갇힌 소비자의 모습을 과장해서 보여줌. 감독의 말처럼 '기계적이고 끝이 없지만 조금은 부조리한' 일상을 시각화한 것."],"films":[{"kind":"메인 필름","title":"The Periodic Fable™ 15초 버전","url":"https://www.youtube.com/watch?v=k3yOJw3wnXI"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["필름 속 대사는 '시작', '모공 제로(Poreless)', '주름 삭제(Wrinkle erasing)', '비밀', '소중한' 같은 뷰티 광고 문구들뿐이다. 이 단어들이 바로 '가짜 주기율표'의 원소들이다. 별도 케이스 영상은 공개본을 찾지 못해 메인 필름으로 대신한다."]},{"h":"메인 필름 (약 1분)","p":["하늘색 조명이 비치는 텅 빈 교실. 흰 실험복 같은 옷을 입은 사람들이 책상에 줄지어 앉아 있었다. '시작'이라는 목소리가 울렸다.","한 사람씩 얼굴에 손을 대고 문지르기 시작했다. '모공 제로', '주름 삭제', '비밀' 같은 단어가 들릴 때마다 학생들은 얼굴을 당기고, 두드리고, 굴리는 동작을 기계적으로 반복했다.","동작은 점점 기괴해졌다. 머리에 이상한 기구를 쓰거나, 얼굴을 비틀어 당긴 채 멍하니 앞을 보는 학생들이 클로즈업됐다.","교실이 어두워지고, 학생들이 일어나 앞쪽 스크린을 바라봤다. 스크린에는 원소 대신 뷰티 유행어로 채워진 '주기율 우화'가 떠 있었다.","마지막은 디 오디너리 로고와 '디 오디너리 웹사이트에서 주기율 우화를 확인하라'는 문구."]}],"videoNote":"실제 영상의 화면과 대사 자막을 확인해 정리했다. 참고 사이트는 이 작품을 파마 부문으로 분류했지만, 기사들에 따르면 헬스 & 웰니스 그랑프리 수상작이라 바로잡았다.","sources":[["Adweek (헬스 & 웰니스 GP)","https://www.adweek.com/creativity/the-ordinary-wins-big-among-8-grand-prix-winners-from-cannes-lions-2026-day-1/"],["More About Advertising (심사평)","https://www.moreaboutadvertising.com/news/uncommon-wins-its-first-grand-prix-cannes-day-one-winners/"],["Creative Review (캠페인 공개)","https://www.creativereview.co.uk/the-ordinary-periodic-fable-campaign/"],["D&AD (제작 배경)","https://www.dandad.org/work/annual-2026/behind-the-work/how-the-ordinary-created-a-twisted-science-lesson-to-expose-beauty-industry-myths"]]},
 {id:"kitkat-heist", tier:"grand-prix", title:"The KitKat Heist", brand:"KitKat", agency:"VML London", cat:"PR", awards:["PR 그랑프리"], video:"https://vimeo.com/1204147459"},

const isDone = e => !!e.bg;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try { const h = new URL(u).hostname.replace("www.",""); return h.includes("youtu") ? "YouTube" : h.includes("vimeo") ? "Vimeo" : h; } catch(e){ return "링크"; } };

/* 일반 웹사이트(깃허브)에서만 실제 썸네일·페이지 내 재생 사용. Claude 아티팩트는 외부 이미지·영상을 막기 때문 */
const LIVE = !/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname) && location.protocol.startsWith("http");
function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/)([\w-]{11})/); return m?m[1]:null; }
function vmId(u){ const m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m?m[1]:null; }
function thumbOf(u){ const y=ytId(u); if(y) return `https://i.ytimg.com/vi/${y}/hqdefault.jpg`; const v=vmId(u); if(v) return `https://vumbnail.com/${v}.jpg`; return null; }
function embedOf(u){ const y=ytId(u); if(y) return `https://www.youtube-nocookie.com/embed/${y}?autoplay=1&rel=0`; const v=vmId(u); if(v) return `https://player.vimeo.com/video/${v}?autoplay=1`; return null; }
function plate(e, big, label, url){
  const cls = TIERS[e.tier].cls;
  const th = LIVE ? thumbOf(url||e.video) : null;
  return `<div class="plate p-${cls} ${th?"has-thumb":""}">${th?`<img class="thumb" src="${esc(th)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-thumb');this.remove()">`:""}<span class="rings"></span>
    <span class="cat">${esc(label||e.cat)}</span>
    <span class="mark">${esc(e.brand)}</span>
    ${e.noVideo ? "" : '<span class="play" aria-hidden="true"></span>'}</div>`;
}

function renderNav(route){
  const nav = document.getElementById("nav");
  const cur = route.startsWith("c-") ? (E.find(x => "c-"+x.id === route)||{}).tier : route;
  nav.innerHTML = Object.entries(TIERS).map(([k,t]) =>
    `<a href="#${k}" ${cur===k?'aria-current="page"':""}><span class="dot" style="background:var(--${t.cls})"></span>${t.short}</a>`).join("");
}

function home(){
  const tiles = Object.entries(TIERS).map(([k,t]) => {
    const list = E.filter(e => e.tier===k), done = list.filter(isDone).length;
    const meta = list.length ? `${done} / ${list.length}편 정리 완료` : "정리 예정";
    const pct = list.length ? Math.round(done/list.length*100) : 0;
    return `<a class="tiertile t-${t.cls} ${list.length?"":"soon"}" href="#${k}">
      <span class="meta">${k==="grand-prix"?"GRAND PRIX · TITANIUM":k.toUpperCase()}</span>
      <h2>${t.name}</h2>
      <div><div class="meta" style="margin-bottom:8px">${meta}</div><div class="bar"><i style="width:${pct}%"></i></div></div></a>`;
  }).join("");
  return `<section class="hero">
    <span class="eyebrow">Cannes Lions International Festival of Creativity · 2026</span>
    <h1>2026 칸 라이언즈 수상작을<br>한국어로 읽는 아카이브</h1>
    <p>수상 등급별로 작품을 모았음. 각 작품은 배경 및 문제, 해결, 영상, 성과, 분석 순서로 정리.</p>
  </section>
  <div class="tiergrid">${tiles}</div>
  <p class="note">수상작 목록은 Love The Work More의 2026 정리 페이지를 기준으로 함. 배경과 전략은 각 작품 페이지 하단에 표기한 업계 매체·심사 자료를 바탕으로 정리했음. 영상은 보안상 페이지 안에서 바로 재생되지 않아, 썸네일을 누르면 YouTube·Vimeo 원본이 새 탭으로 열림.</p>`;
}

let filter = "all";
function tierPage(k){
  const t = TIERS[k], list = E.filter(e => e.tier===k);
  if(!list.length) return `<div class="listhead"><h1>${t.name}</h1></div><div class="pendingbox">${t.name} 수상작은 그랑프리 정리가 끝난 뒤 순서대로 추가할 예정임.</div>`;
  const shown = filter==="done" ? list.filter(isDone) : list;
  const cards = shown.map(e => `<a class="card ${isDone(e)?"":"pending"}" href="#c-${e.id}">
      ${plate(e,false,null,e.video)}
      <div><div class="ttl">${esc(e.title)}</div><div class="sub">${esc(e.brand)} · ${esc(e.awards.join(", "))}</div></div>
      <div>${isDone(e)?'<span class="chip done">정리 완료</span>':'<span class="chip">정리 예정</span>'}</div></a>`).join("");
  return `<div class="listhead"><div><span class="eyebrow">${k==="grand-prix"?"Grand Prix · Titanium":k}</span><h1>${t.name}</h1></div>
    <span class="count">${list.filter(isDone).length} / ${list.length}편 정리 완료</span></div>
    <div class="filters" role="group" aria-label="보기">
      <button type="button" id="f-all" aria-pressed="${filter==="all"}" data-f="all">전체</button>
      <button type="button" id="f-done" aria-pressed="${filter==="done"}" data-f="done">정리 완료만</button>
    </div>
    <div class="cards">${cards}</div>`;
}

function paras(arr){ return arr.map(p => `<p>${esc(p)}</p>`).join(""); }
function detail(e){
  const t = TIERS[e.tier], list = E.filter(x => x.tier===e.tier), i = list.indexOf(e);
  const prev = list[i-1], next = list[i+1];
  const awards = e.awards.map(a => `<span class="award p-${t.cls}">${esc(a)}</span>`).join("");
  const vids = [{kind: e.videoKind || (e.noVideo ? "케이스 자료" : "케이스 영상"), url:e.video}].concat(e.films||FILMS[e.id]||[]);
  let body, body2 = "";
  if(isDone(e)){
    body = `<article>
      <section><h2>배경 및 문제</h2><div>${paras(e.bg)}</div></section>
      <section><h2>해결</h2><div>${paras(e.solIntro)}<ul style="margin-top:4px">${e.sol.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
    </article>`;
    body2 = `<article>
      <section><h2>성과</h2><div>${e.stats?`<div class="stats">${e.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}${paras(e.results)}</div></section>
      <section><h2>분석</h2><div>${paras(e.analysis)}</div></section>
    </article>`;
  } else {
    body = `<div class="pendingbox">이 작품의 배경과 전략은 아직 정리 전임. 영상과 수상 정보만 먼저 확인할 수 있음.</div>`;
  }
  const facts = `<aside class="facts"><dl>
      <div><dt>브랜드</dt><dd>${esc(e.brand)}</dd></div>
      <div><dt>캠페인</dt><dd>${esc(e.title)}</dd></div>
      <div><dt>에이전시</dt><dd>${esc(e.agency)}</dd></div>
      ${e.country?`<div><dt>국가</dt><dd>${esc(e.country)}</dd></div>`:""}
      <div><dt>수상</dt><dd>${esc(e.awards.join(" / "))}</dd></div>
    </dl>
    ${e.sources?`<div class="sources"><span class="eyebrow">출처</span><ol>${e.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ol></div>`:""}
  </aside>`;
  const head = `<a class="back" href="#${e.tier}">← ${t.name} 목록</a>
    <header class="dhead"><div class="awards">${awards}</div><h1>${esc(e.title)}</h1>${e.ko?`<p class="ko">${esc(e.ko)}</p>`:""}</header>`;
  const media = `<section class="media ${e.videoDesc?"with-desc":""}">
      <div class="vids ${vids.length>1?"two":""}">${vids.map(v=>{ const em = LIVE ? embedOf(v.url) : null; const meta=`<span class="vmeta"><b>${esc(v.kind)}</b><span>${v.title?esc(v.title)+" · ":""}<a href="${esc(v.url)}" target="_blank" rel="noopener">${host(v.url)}에서 보기 ↗</a></span></span>`; return em ? `<div class="video"><button type="button" class="vplay" data-embed="${esc(em)}" aria-label="${esc(v.kind)} 재생">${plate(e,true,v.kind,v.url)}</button>${meta}</div>` : `<div class="video"><a class="vlink" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(v.kind)} 열기">${plate(e,true,v.kind,v.url)}</a>${meta}</div>`; }).join("")}</div>
      ${e.videoDesc?`<details class="vdesc" id="vd-${e.id}"><summary>영상 내용</summary><div class="vbody">${e.videoDesc.map(sec=>typeof sec==="string"?`<p>${esc(sec)}</p>`:`<h4>${esc(sec.h)}</h4>${paras(sec.p)}`).join("")}${e.videoNote?`<p class="vnote">${esc(e.videoNote)}</p>`:""}<button type="button" class="vclose">접기 ▲</button></div></details>`:""}
    </section>`;
  const pager = `<nav class="pager">${prev?`<a href="#c-${prev.id}">← 이전<b>${esc(prev.title)}</b></a>`:"<span></span>"}${next?`<a href="#c-${next.id}" style="text-align:right">다음 →<b>${esc(next.title)}</b></a>`:""}</nav>`;
  // 정리 완료 작품: 배경·해결 → 영상 → 성과·분석
  if(isDone(e)){
    return `${head}
    <div class="dgrid"><div style="min-width:0">${body}</div>${facts}</div>
    ${media}
    <div class="dgrid"><div style="min-width:0">${body2}${pager}</div><div></div></div>`;
  }
  return `${head}
    ${media}
    <div class="dgrid"><div style="min-width:0">
      ${body}${body2}
      ${pager}
    </div>${facts}</div>`;
}

function route(keepScroll){
  const r = location.hash.replace("#","");
  const app = document.getElementById("app");
  let html;
  if(TIERS[r]) html = tierPage(r);
  else if(r.startsWith("c-") && E.find(e => "c-"+e.id===r)) html = detail(E.find(e => "c-"+e.id===r));
  else html = home();
  app.innerHTML = html;
  renderNav(r);
  if (matchMedia("(min-width: 861px)").matches) app.querySelectorAll(".media.with-desc .vdesc").forEach(d => d.open = true);
  app.querySelectorAll(".vclose").forEach(b => b.addEventListener("click", () => {
    const d = b.closest("details"); d.open = false;
    const r = d.getBoundingClientRect();
    if (r.top < 80) window.scrollBy({top: r.top - 90, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  app.querySelectorAll(".vplay").forEach(b => b.addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = b.dataset.embed; f.className = "vframe"; f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; f.title = b.getAttribute("aria-label");
    b.replaceWith(f);
  }));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; route(true); }));
  if(keepScroll !== true) window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => route());
route();
</script>

</body>
</html>
