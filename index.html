<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>칸 라이언즈 2026 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 고정 등급 탭 + 단일 컬럼 아카이브. 썸네일은 등급 색의 '트로피 플레이트'로 표현 */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15171C; --muted:#5A5F6A; --line:#D9DCE2;
  --accent:#A3262A;
  --gp:#1E2740; --gp-ink:#E3C77A;
  --gold:#A87C24; --silver:#737B86; --bronze:#94532F; --plate-ink:#FFFFFF;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:18px;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
nav.tiers{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tiers a{text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tiers a .dot{width:8px;height:8px;border-radius:50%}
nav.tiers a:hover{color:var(--ink);background:var(--bg)}
nav.tiers a[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:40px 80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* home */
.hero{display:grid;gap:14px;max-width:720px;margin-bottom:40px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tiertile{text-decoration:none;display:grid;gap:18px;padding:22px;border-radius:6px;color:var(--plate-ink);min-height:180px;align-content:space-between;position:relative;overflow:hidden}
.tiertile h2{font-size:26px;font-weight:900;color:inherit}
.tiertile .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.85}
.tiertile .bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.tiertile .bar i{display:block;height:100%;background:currentColor}
.tiertile:hover{filter:brightness(1.08)}
.tiertile.soon{opacity:.55}
.t-gp{background:var(--gp);color:var(--gp-ink)} .t-gold{background:var(--gold)} .t-silver{background:var(--silver)} .t-bronze{background:var(--bronze)}
.note{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:72ch}

/* tier list */
.listhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:18px}
.listhead h1{font-size:clamp(28px,4vw,38px);font-weight:900}
.listhead .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px}
.card{text-decoration:none;display:grid;gap:10px;min-width:0}
.card .ttl{font-weight:600;font-size:16px;line-height:1.4}
.card .sub{font-size:13px;color:var(--muted);line-height:1.5}
.card:hover .plate{transform:translateY(-2px)}
.card.pending .ttl{color:var(--muted)}

/* plate (thumbnail) */
.plate{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--plate-ink);transition:transform .2s}
.plate .cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.plate .mark{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,28px);line-height:1.15;letter-spacing:-.02em;position:relative;z-index:1;max-width:85%}
.plate .play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.9;z-index:1}
.plate .play::after{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.plate .rings{position:absolute;right:-30%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid currentColor;opacity:.16;box-shadow:0 0 0 18px transparent,0 0 0 19px currentColor}
.plate .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.plate.has-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45));z-index:0}
.plate.has-thumb{color:#fff}
.plate.has-thumb .mark,.plate.has-thumb .rings{display:none}
.plate.has-thumb .cat,.plate.has-thumb .play{z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.plate.has-thumb .play{background:rgba(0,0,0,.35)}
.yt{background:#000;border-radius:5px;overflow:hidden;outline:none;display:flex;flex-direction:column}
.yt:fullscreen{border-radius:0;justify-content:center}
.yt-stage{position:relative;aspect-ratio:16/9;width:100%}
.yt:fullscreen .yt-stage{aspect-ratio:auto;flex:1}
.yt-frame,.yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-poster{position:absolute;inset:0;background:#000 center/cover no-repeat;display:grid;place-items:center;transition:opacity .2s}
.yt.started .yt-poster{opacity:0;pointer-events:none}
.yt-big{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.yt-big::before{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.yt-hit{position:absolute;inset:0;cursor:pointer}
.yt-bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#111}
.yt-bar button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;color:#fff;flex:none}
.yt-bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.yt-pp::before{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.yt.playing .yt-pp::before{border:0;width:4px;height:14px;margin:0;box-shadow:-4px 0 0 #fff,4px 0 0 #fff;background:transparent}
.yt-mute::before{content:"🔊";font-size:14px}.yt.muted .yt-mute::before{content:"🔇"}
.yt-fs::before{content:"";width:12px;height:12px;border:2px solid #fff;border-radius:2px}
.yt-seek{flex:1;min-width:0;accent-color:#fff;height:4px;cursor:pointer}
.yt-time{color:#ddd;font:12px/1 ui-monospace,monospace;white-space:nowrap}
.vplay{all:unset;display:block;cursor:pointer;border-radius:5px}
.vplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vlink{display:block;text-decoration:none}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:5px;background:#000;display:block}
.vmeta a{color:inherit}
.p-gp{background:var(--gp);color:var(--gp-ink)} .p-gold{background:var(--gold)} .p-silver{background:var(--silver)} .p-bronze{background:var(--bronze)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.done{border-color:var(--accent);color:var(--accent)}

/* detail */
.back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:20px}
.back:hover{color:var(--ink)}
.dhead{display:grid;gap:12px;margin-bottom:28px;max-width:800px}
.dhead h1{font-size:clamp(28px,4.5vw,42px);font-weight:900;line-height:1.25}
.dhead .ko{font-size:17px;color:var(--muted);margin:0}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:13px;font-weight:600;padding:4px 10px;border-radius:3px;color:var(--plate-ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.vids{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:24px}
.media{max-width:720px;margin-bottom:8px}
.media.with-desc{max-width:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.media.with-desc .vdesc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);margin-bottom:24px}
.media.with-desc .vdesc[open] .vbody{max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:860px){.media.with-desc{display:block}.media.with-desc .vdesc{position:static}.media.with-desc .vdesc[open] .vbody{max-height:none}}
.video{display:grid;gap:8px;text-decoration:none;min-width:0}
.vmeta{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.5}
.vmeta b{color:var(--ink);font-size:14px}
.video:hover .vmeta span{color:var(--accent)}

.video .plate{aspect-ratio:16/9}
.video .plate .mark{font-size:clamp(28px,5vw,48px)}
.video .plate .play{width:56px;height:56px;right:22px;bottom:22px}
.video .plate .play::after{border-left-width:14px;border-top-width:9px;border-bottom-width:9px}
.vcap{font-size:13px;color:var(--muted);margin:0 0 20px}
.vdesc{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:36px}
.vdesc summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.vdesc summary::-webkit-details-marker{display:none}
.vdesc summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.vdesc[open] summary::after{content:"−"}
.vdesc .vbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.vdesc .vbody p{margin:14px 0 0;max-width:62ch}
.vdesc .vnote{font-size:13px;color:var(--muted)}
.vdesc h4{margin:22px 0 0;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent)}
.vdesc .flink{color:var(--accent);font-weight:600}
.vclose{margin-top:20px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.vclose:hover{color:var(--ink)}
.vcap a{color:var(--accent)}
article section{padding-block:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px}
@media (max-width:600px){article section{grid-template-columns:minmax(0,1fr);gap:8px}}
article section h2{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.02em;padding-top:2px}
article section p{margin:0 0 .8em;max-width:62ch}
article section p:last-child{margin-bottom:0}
article ul{margin:0;padding-left:1.1em;max-width:62ch;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{border-left:2px solid var(--accent);padding-left:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
aside.facts{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px}
@media (max-width:860px){aside.facts{position:static}}
aside.facts dl{margin:0;display:grid;gap:12px}
aside.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
aside.facts dd{margin:2px 0 0;font-size:15px;font-weight:500;line-height:1.5}
.sources{font-size:13px;color:var(--muted)}
.sources ol{padding-left:1.2em;margin:6px 0 0;display:grid;gap:4px}
.sources a{color:var(--muted)}
.pendingbox{border:1px dashed var(--line);border-radius:6px;padding:22px;color:var(--muted);max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;color:var(--muted);max-width:48%}
.pager a b{display:block;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#">칸 라이언즈 아카이브 <small>2026</small></a>
  <nav class="tiers" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const TIERS = {
  "grand-prix": {name:"그랑프리 · 티타늄", short:"그랑프리", cls:"gp", desc:"부문별 최고상인 그랑프리와, 업계의 방향을 바꾼 작품에 주는 티타늄 수상작."},
  "gold": {name:"골드", short:"골드", cls:"gold", desc:"골드 라이언 수상작."},
  "silver": {name:"실버", short:"실버", cls:"silver", desc:"실버 라이언 수상작."},
  "bronze": {name:"브론즈", short:"브론즈", cls:"bronze", desc:"브론즈 라이언 수상작."}
};

const E = [
 {"id":"haven","tier":"grand-prix","title":"Haven","brand":"Suncorp Insurance","agency":"Leo Australia, Sydney","country":"호주","cat":"Titanium","awards":["티타늄 그랑프리"],"video":"https://www.youtube.com/watch?v=Pwf50R9flkU","ko":"주소를 입력하면 '우리 집'이 직접 기상 위험을 알려주는 보험사의 디지털 툴","bg":["극한 기상이 잦아지면서 호주의 주택보험료는 5년 새 51% 올랐고, 이대로면 2035년에는 호주 주택의 10%가 보험에 들 수 없게 될 수 있었음. 보험사 선코프에게는 보험을 팔 수 있는 집 자체가 줄어든다는 뜻.","피해를 줄이는 길은 미리 대비하는 것. 보험 청구 10건 중 9건은 대비했다면 막을 수 있었던 피해였지만, 호주인의 35%는 기후 재난이 자신에게는 오지 않을 거라고 믿었음."],"solIntro":["위험을 '남의 이야기'가 아니라 '우리 집 이야기'로 바꿨음. 주소를 입력하면 그 집이 직접 말을 걸어, 어떤 위험에 취약하고 무엇을 고치면 되는지 알려주는 무료 디지털 툴 'Haven'을 만들었음."],"sol":["썬코프의 재해 데이터에 건물 정보, 실시간 날씨, 구글 3D 지도 등을 합쳐 호주 1,100만 채가 넘는 집의 위험을 집마다 분석","집마다 다른 맞춤 영상과, 폭풍·홍수·산불별 위험도와 보강 방법을 정리한 리포트를 제공","2025년 5월 출시. TV 리노베이션 프로그램, 옥외, 소셜, 유튜브 등으로 알림"],"stats":[["28만+","출시 첫해 방문자"],["74%","이용 후 집 보강 의향"],["1위","썬코프 홈보험 순위"]],"results":["출시 첫해 28만 명 이상이 방문했고, 이용자의 74%가 집을 보강하겠다고 답함. 이번 칸에서 티타늄 그랑프리를 포함해 라이언 4개를 받음."],"analysis":["'우리 동네는 괜찮다'고 믿는 사람에게 일반적인 경고는 통하지 않음. 그래서 자기 집 주소로, 자기 집이 직접 말하게 했음. 남의 이야기가 내 집 진단이 되는 순간 대비할 이유가 생김.","'사고 나면 보상해 준다'는 광고 대신, 사고가 나기 전에 실제로 쓸 수 있는 서비스를 내놨다는 점이 핵심. 피해가 줄면 고객도 보험사도 이익인 구조."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["2035년이면 기후변화 때문에 호주 주택의 10%가 보험에 들 수 없게 될 수 있다. 그래서 보험사 선코프는 몇 년 전부터, 업계의 초점을 '복구'에서 '대비'로 옮기는 변화를 이끌어 왔다.","\"이제는 재해가 일어나기 전에, 우리 집을 기상 재해에 더 강하게 만드는 데 집중해야 합니다.\"","시작은 집 한 채였다. \"화재, 홍수, 사이클론을 모두 견딜 만큼 튼튼한 집.\" 그다음은 거리 하나로 넓혔다. \"여기는 '리질리언스 로드'입니다.\"","다음 단계는 나라 전체를 대비시키는 것. 그러려면 1,100만 채가 넘는 집의 위험 요소를 하나하나 파악해야 했다. 그래서 정확히 그렇게 했다. 호주의 모든 집을 안전한 피난처, '헤이븐'으로 만들었다.","선코프 헤이븐은 세계 최초의 데이터 기반 디지털 플랫폼이다. 누구든 주소만 입력하면, 자기 집이 직접 말을 건다. \"안녕, 나야, 너희 집. 드디어 이야기하게 됐네.\" 산불, 폭풍, 홍수 등 우리 집이 맞닥뜨린 위험에 맞춰, 더 튼튼해지려면 정확히 무엇이 필요한지 알려준다. \"방충망을 설치하는 걸 고려해 봐.\"","헤이븐은 선코프가 가진 자연재해 데이터와 인사이트를 포함해 12개의 방대한 데이터를 활용한다. 이 데이터로 집마다 다른 특성을 파악해, 사용자마다 맞춤형 영화 같은 경험을 만들어 낸다.","\"오늘 호주 최초의 서비스가 출시됐습니다. 선코프의 '헤이븐'으로, 집주인이 무료로 자기 집의 취약점을 점검하고 대비를 강화할 수 있게 돕는 온라인 도구입니다.\"","\"자사 데이터를 공개한 건 저희가 " \"지구가 평평하다는 걸 증명하는 사람에게 회사 소유권 전체를 주겠답니다.\" \"전부 다요.\" \"네, 진짜예요. 황당하죠.\"","시작은 생방송 TV였다. \"지구 끝 사진만 찍어 오시면 회사를 드립니다.\" \"평평한 지구 음모론자들을 향한 장난 섞인 도전입니다. 그들이 말하는 건, 바다가 우주로 쏟아져 내리는 그 끝이죠.\" \"반응이 엄청납니다.\"","뉴욕타임스에는 공개 편지를 실었다. \"자, 이제 말로만 하지 말고 지도로 증명하실 때입니다. 저는 열쇠를 들고 여기서 기다리겠습니다. 평평한 마음을 담아, 팀 보일.\"","받을 수 있는 물건의 전체 목록도 공개했다. \"이거 전부 드립니다. 이건… 사실 렌털이에요.\" \"아, 이건 빼고.\"","그다음은 월스트리트. 회사를 손에 넣고 싶어 안달 난 사람들을 유혹했다. 평평한 지구론자들이 나타나는 곳이면 어디든 컬럼비아도 나타났다. \"여러분, 그만 싸우고 탐험을 시작하세요.\" \"중력도 엄밀히 말하면 아직 이론이에요.\" \"이런 논쟁도 재밌지만, 저희는 증거에 더 관심이 있습니다.\" \"당연히 평평하지. 돌아가는 공 위에 물을 붙잡아 둬 보든가.\"","사람들이 실제로 도전에 나섰다. \"쉽네, 도전 받아들인다.\" \"이렇게 생긴 거대한 벽이 있어.\"","놀랍게도 아무도 지구의 끝을 찾지 못했다. 하지만 도전은 의도한 그대로 통했다. \"그 셀카 정말 기대된다.\" \"이거 마케팅 아이디어 좋네. 나도 가서 증명하고 싶어진다.\"","획득 오디언스 8,000만, 자연 조회수 1,000만, 언론 보도 250건 이상. 그리고 짜증 난 평평한 지구론자 수천 명. \"완전 조롱이네.\"","지구 끝까지 갈 거라면, 컬럼비아를 입어라. 필요할 테니까."]},{"h":"메인 필름 (약 1분 20초)","p":["\"안녕하세요, 컬럼비아 스포츠웨어 CEO 팀 보일입니다. 이 메시지는 평평한 지구론자 여러분께 드립니다. 지구에 끝이 있다고 주장하시죠? 그럼 가서 사진 찍어서 저희한테 보내 주세요. 그러면 회사 자산을 드립니다. 전부 다요. 서류도, 변호사도, 함정도 없습니다.\"","\"팀, 서류는 좀 있어요.\"","\"자, 이거 전부 드립니다. 이거, 이거. 여기 좋은 게 많아요.\" \"여기 메모가 붙어 있네.\" \"이거, 이거, 이거.\"","\"이 회의 얼마나 걸려요?\" \"이거 전부.\" \"이거, 이거.\" \"저건 어떻게 한 거지?\"","\"이거…\" \"그건 사실 렌털이에요.\" \"아, 이건 빼고.\"","\"이거 전부, 이것도, 저것도 전부.\"","\"평평한 지구론자 여러분, 부탁 하나만 할게요. 지구 끝까지 가실 거라면, 컬럼비아를 입으세요. 필요할 테니까. 행운을 빕니다.\""]}],"sources":[["The Drum","https://www.thedrum.com/news/columbia-sportswear-offered-to-give-away-the-company-and-cannes-gave-it-ten-lions"],["Creative Salon","https://creative.salon/articles/features/columbia-sportswear-adam-eve-tbwa-cannes-lions-titanium-expedition-impossible"],["Marketing Dive","https://www.marketingdive.com/news/columbia-challenges-flat-earthers-as-part-of-bolder-marketing-revamp/806761/"],["SGI Europe","https://www.sgieurope.com/brands/the-impossible-expedition-that-won-cannes/121914.article"]],"videoKind":"케이스 영상 · 한글 자막","films":[{"kind":"메인 필름","title":"Expedition Impossible","url":"https://www.youtube.com/watch?v=JxJOAsTMC6w"}]},
 {"id":"vehicle-of-hope","tier":"grand-prix","title":"Vehicle of Hope","brand":"Caritas","agency":"Differ, Stockholm","country":"스웨덴","cat":"Lions Health · Grand Prix for Good","awards":["라이언즈 헬스 그랑프리 포 굿"],"video":"https://www.youtube.com/watch?v=YfQbzgQfOKI","ko":"프란치스코 교황의 포프모빌을 가자지구 아이들을 위한 이동 진료소로 개조한 프로젝트","bg":["2년간의 전쟁으로 가자지구의 의료 체계는 무너졌고, 인도적 지원은 이스라엘에 의해 막혀 있었음.","가톨릭 구호단체 카리타스 스웨덴의 목표는 두 가지. 이 봉쇄를 세상에 알리는 것, 그리고 실제로 가자의 아이들에게 의료를 전달하는 것."],"solIntro":["프란치스코 교황이 타던 차 '포프모빌'을 가자 아이들을 위한 이동 진료소로 바꿨음. 전 세계가 아는 교황의 차가 봉쇄된 가자로 향한다는 이야기 자체가 봉쇄에 관심을 모으는 장치."],"sol":["2014년 교황이 베들레헴을 방문할 때 탔던 차량을 활용","카리타스가 교황에게 제안서를 보냈고, 몇 주 만에 승인과 축복을 받음","전쟁으로 일자리를 잃은 팔레스타인 정비공들이 베들레헴에서 개조. 하루 200명의 아이를 진료할 수 있는 진료소가 됨","2025년 4월 교황이 선종한 뒤 '교황의 마지막 소원'으로 알려지며 전 세계 언론이 보도"],"stats":[["200명","하루 진료 가능 인원"],["7대","영향받아 추가된 이동 진료소"],["5,200건+","언론 기사"],["2,800건+","TV·라디오 보도"]],"results":["TV·라디오 보도 2,800건 이상, 기사 5,200건 이상이 나왔고, 이 프로젝트에 영향을 받아 이동 진료소 7대가 추가됐음. 하지만 이스라엘 당국이 진입을 허가하지 않아 진료소는 아직 가자에 들어가지 못했음. 이번 칸에서 라이언즈 헬스 그랑프리 포 굿을 받음."],"analysis":["봉쇄를 정치적으로 비판하는 대신, 누구도 반대하기 어려운 '교황의 차로 만든 아이들 진료소'를 내세웠음. 주장 대신 행동이 메시지가 됨.","차가 가자에 들어가지 못한다는 사실 자체가 봉쇄를 증명함. 들어가면 아이들을 치료하고, 막히면 봉쇄를 고발하는 구조."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["\"교황 프란치스코의 마지막 소원 중 하나였습니다. 교황은 지난 4월 선종했습니다.\"","가자지구. 인도적 지원과 의료가 막혀 있다. 가장 큰 피해자는 아이들이다. 전쟁뿐 아니라 충분히 예방할 수 있는 병에도 시달린다. 카리타스는 이 봉쇄에 세상의 관심을 모으기로 했다.","2024년 11월 5일, 카리타스는 교황에게 포프모빌을 아이들을 위한 이동 진료소로 바꾸자고 제안했다. 2024년 12월 18일, 답이 왔다. '교황께서 이 프로젝트를 승인하셨으며, 함께하는 모든 이를 위해 기도하십니다.'","베들레헴에서 포프모빌을 진료소로 개조했다. 교황이 앉던 자리에서, 이제 하루 200명의 아이들이 치료받는다.","\"교황 프란치스코가 타던 포프모빌 한 대가 가자지구 아이들을 위한 이동 진료소로 새 삶을 얻습니다. 스웨덴 카리타스의 지원으로요.\" \"교황의 포프모빌이 가자지구로 향합니다.\" \"포프모빌이 가자지구로 들어가는 구호 물품 봉쇄를 뚫을 수 있을지는 아직 알 수 없습니다.\"","\"이 차를 가자지구 아이들의 생명을 살리는 진료에 쓰는 것, 그것이 교황 프란치스코의 마지막 소원 중 하나였습니다.\"","TV·라디오 보도 2,800건 이상, 기사 5,200건 이상, X 언급 9만 4,000건, 전체 언급 10만 3,000건.","이스라엘은 여전히 인도적 지원과 의료를 강하게 제한하고 있다. 희망의 차(The Vehicle of Hope)."]}],"sources":[["Contagious","https://www.contagious.com/article/cannes-lions-2026-lions-health-and-united-nations-grand-prix-for-good-winner-f89924525b5242fd825ed3a817fc8509"],["Al-Monitor (AFP)","https://www.al-monitor.com/originals/2025/11/popemobile-transformed-gaza-mobile-childrens-clinic"],["The Drum (에이전시 기고)","https://www.thedrum.com/opinion/johan-gustafsson-we-pitched-two-popes-to-provide-a-pop-up-popemobile-for-gaza"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/vehicle-of-hope"]]},
 {"id":"600k-network","tier":"grand-prix","title":"600K Network","brand":"Comando con Venezuela","agency":"Rainbow Lobster, Mexico City","country":"베네수엘라 / 멕시코","cat":"Titanium · Grand Prix for Good","awards":["티타늄","그랑프리 포 굿"],"video":"https://www.youtube.com/watch?v=XfNU8RAbE1I","ko":"시민들이 개표 결과지의 QR코드를 스캔해 선거 결과의 증거를 확보한 작전","bg":["2024년 베네수엘라 대선. 야권은 수년간 정권이 개표를 조작한다고 주장해 왔지만, 이를 증명할 방법이 없었음.","과제는 선관위가 어떤 결과를 발표하든, 실제 개표 결과를 누구도 반박할 수 없는 증거로 먼저 확보하는 것."],"solIntro":["정권이 모르고 열어둔 빈틈을 찾았음. 투표가 끝나면 투표기마다 개표 결과지가 출력되는데, 여기에 결과가 QR코드로 담겨 있고 참관인은 사본을 받을 수 있음. 이 결과지를 선관위 발표보다 먼저, 전국에서 최대한 많이 모으기로 함."],"sol":["60만 명의 참관인과 자원봉사자를 몇 달간 비밀리에 교육","선거 당일 참관인들이 휴대폰으로 결과지의 QR코드를 찍어 바로 집계. 통신이 안 되는 곳은 오토바이, 배 등으로 결과지를 실어 나름","모은 결과지를 웹사이트에 공개해, 누구나 신분증 번호로 자기 투표소의 결과지를 직접 확인할 수 있게 함"],"stats":[["60만","참여한 시민 검증자"],["85%","이틀 뒤 공개한 개표 결과지"],["620만 : 270만","야권 집계 (곤살레스 : 마두로)"],["640만 : 530만","선관위 발표 (마두로 : 곤살레스)"]],"results":["이틀 만에 전체 결과지의 85%를 공개했고, 결과는 야권 후보 곤살레스 620만 표 대 마두로 270만 표였음. 그러나 선관위는 마두로의 승리를 발표했음. 미국은 곤살레스의 승리를 인정했고, 정권은 2,000명이 넘는 시민을 투옥했음. 야권 지도자 마차도는 2025년 노벨평화상을 받았음. 이번 칸에서 티타늄과 그랑프리 포 굿을 받음."],"analysis":["'선거가 조작됐다'는 말은 반박당할 수 있지만, 투표소마다 찍힌 결과지 원본은 반박하기 어려움. 주장을 증거로 바꾼 것이 핵심.","광고가 아니라 증거를 모으는 시스템 자체가 크리에이티비티로 인정받은 사례. 이미 있는 QR코드와 누구나 가진 휴대폰으로 국가 권력에 맞설 규모를 만들었음."],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["탄압 속에 치러진 대통령 선거. 선거관리기관은 정권의 편이었다.","평화적으로 표를 지키려면, 조작되기 전에 진짜 개표 결과를 먼저 확보해야 했다. 수년간의 준비 끝에, 정권이 모르고 열어 둔 빈틈 하나를 찾아냈다. QR코드. 공식 개표 결과지마다 투표소별 결과가 담긴 QR코드가 찍혀 나온다.","그렇게 '60만 네트워크'가 탄생했다.","코만도 콘 베네수엘라는 앱을 만들어, 휴대폰 하나만 가진 베네수엘라 국민 60만 명을 검증인으로 만들었다. 자원봉사 선거 참관인들은 몇 달 동안 큰 위험을 무릅쓰고 훈련받았다. 투표소마다 몰래 QR코드를 찍어 결과를 전송하는 법을. 1만 5,000개 투표 센터, 3만 개가 넘는 투표함에서 검증 가능한 데이터를 만들기 위해서였다.","선거관리기관이 10년 넘게 권력을 쥐고 있던 그 남자를 당선자로 발표하자, 야권 지도자는 바로 그날 밤 카메라 앞에 섰다.","이틀 뒤, 전체 개표 결과지의 85%가 resultadosconvenezuela.com에 공개됐다. 검증된 데이터는 국제 검증 기관들에 전달됐고, 진실은 외교 채널을 타고 퍼져 나갔다.","정권은 폭력으로 답했다. 2,000명이 넘는 시민이 투옥됐다.","2025년, 노벨평화상은 수년간 진실을 지켜 온 베네수엘라 국민을 기렸다. 이번에는 손에 휴대폰을 들고 지켰다. 투명성이 보장되지 않을 때, 시민들이 직접 그것을 만들어 냈다."]}],"sources":[["AP (NBC 게재)","https://www.nbcwashington.com/news/politics/venezuelas-opposition-secured-over-80-of-crucial-vote-tally-sheets-heres-how-they-did-it"],["Adweek","https://www.adweek.com/creativity/venezuelan-election-operation-among-good-grand-prix-winners-on-cannes-lions-2026-day-5/"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/venezuela-hace-historia-cannes-lions-titanium-grand-prix-for-good-defensa-democracia"],["The Stable","https://www.thestable.com.au/rainbow-lobsters-600k-network-beyond-the-cannes-grand-prix-for-good-dan-wieden-titanium-lion-win/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"oreo-cows","tier":"grand-prix","title":"Oreo Cows","brand":"Oreo (Mondelēz)","agency":"VML Mexico City & New York","country":"멕시코","cat":"Titanium","awards":["티타늄"],"video":"https://www.youtube.com/watch?v=F2EjJgR0adE","ko":"오레오처럼 검정-흰색-검정 줄무늬를 가진 실제 소를 내세워 '오레오엔 우유'를 다시 각인시킨 멕시코 캠페인","bg":["멕시코에는 빵이나 쿠키를 우유에 찍어 먹는 '초페오'라는 습관이 있음. 그런데 오레오를 우유에 찍어 먹는 멕시코인은 약 25%뿐이었음.","오레오는 우유에 찍어 먹는 사람이 늘면 오레오를 먹는 순간도 늘어난다고 봤음. 과제는 '오레오와 우유는 한 쌍'이라는 생각을 되살리는 것."],"solIntro":["'오레오와 우유는 원래 한 쌍'이라는 증거를 찾아냈음. 몸통 가운데 흰 띠가 둘린 소 '벨티드 갤로웨이'. 우유를 만드는 소부터 오레오처럼 생겼다는 이야기로, 오레오를 우유에 찍어 먹는 습관을 다시 떠올리게 했음."],"sol":["오레오 소를 키우는 멕시코 농부의 이야기를 담은 약 5분짜리 코미디 단편 필름 공개","멕시코 우유 브랜드 산타 클라라와 '오레오 소' 우유를 함께 출시해 전국에서 판매","필름 속 우유병을 본뜬 한정판 병을 인플루언서들에게 보내고, 오레오를 우유에 찍어 먹는 오프라인 행사도 진행"],"stats":[["+12%","전년 대비 판매"],["9.6억","노출"],["910만","인터랙션 (목표의 2배 이상)"],["1,710만 달러","언론 노출 가치"]],"results":["오레오 판매는 전년보다 12% 늘었고, 노출 9.6억 회, 영상 조회수 3,120만 회를 기록함. 이번 칸에서 티타늄을 받음."],"analysis":["'오레오는 우유에 찍어 먹어야 맛있다'고 말하는 대신, 오레오를 닮은 소라는 '자연이 만든 증거'를 보여줬음. 억지 주장 없이 오레오와 우유가 한 쌍이라는 생각이 따라옴.","보는 데서 끝나지 않고 실제 우유 제품으로 이어졌음. 오레오 소 우유를 사서 오레오를 찍어 먹는 순간, 캠페인이 목표한 습관이 그대로 실현됨."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["우유가 있는 곳엔 오레오가 있어야 한다. 그런데 멕시코 전체에 이걸 어떻게 증명할까?","벨티드 갤로웨이 소. 우리는 이 소를 '오레오 소'라고 부른다. 일상 속에 숨어 있던 우리의 쿠키.","\"자기 소에 페인트칠하는 사람이 있다니까요.\" \"이웃들은 뭐라고 하든 말든, 보세요. 이걸로 입을 다물게 하죠. 칠했으면 이렇게 똑같아 보이겠어요?\" \"아뇨.\" \"그 사람, 있다고 꿈만 꾸는 거예요. 미쳤어요.\"","\"짜잔!\" 전설의 우유(LEGEN-DAIRY).","\"루피요네 소들 보러 가자. 진짜 예뻐.\"","\"이제 온 세상이 우리 소들 우유를 마셔요.\"","언론 노출 가치 1,710만 달러.","\"오레오 소 우유에 오레오 쿠키를 찍어 먹는다고? 이거 완전 인셉션인데.\""]}],"sources":[["People (AOL 게재)","https://www.aol.com/articles/yes-those-real-oreo-cows-214244994.html"],["메인 필름 (YouTube)","https://www.youtube.com/watch?v=WnZWqKbAcPM"],["Expansión","https://expansion.mx/empresas/2026/03/31/duda-en-guion-llevo-a-oreo-a-entrar-a-la-categoria-de-leche"],["LBB Online (수상)","https://lbbonline.com/news/oreo-cow-titanium-cannes-lions-vml"],["VML (수상 발표)","https://www.vml.com/news/vml-wins-titanium-lion-for-oreo-cows"],["매드타임스","https://www.madtimes.co.kr/news/articleView.html?idxno=26610"],["캠페인인사이트","https://www.campaigninsight.co.kr/news/articleView.html?idxno=1434"],["Campaign","https://campaignlive.com/article/cannes-lions-2026-oreo-cows-legacy-virginia-giuffre-win-titanium/1963008"],["DesignRush","https://news.designrush.com/oreo-mexico-chopeo-dunking-ritual-vml-campaign"]]},
 {"id":"virginia-giuffre","tier":"grand-prix","title":"The Legacy of Virginia Giuffre","brand":"Virginia Giuffre","agency":"Dini von Mueffling Communications, New York","country":"미국","cat":"Titanium · PR","awards":["티타늄"],"video":"https://www.youtube.com/watch?v=J_45sFUTkhw","ko":"제프리 엡스타인 성착취 피해 생존자 버지니아 주프레가 세상을 떠난 뒤, 그녀의 이야기와 싸움을 이어간 1년간의 PR 활동","bg":["버지니아 주프레는 제프리 엡스타인의 성착취를 공개적으로 고발한 생존자. 하지만 소송과 명예훼손 위협 때문에 자기 이야기를 마음껏 할 수 없었음.","2025년 4월 그녀가 세상을 떠난 뒤, 남은 과제는 그녀의 이야기를 정확히 전하고 책임을 묻는 싸움이 그녀와 함께 사라지지 않게 하는 것."],"solIntro":["광고나 영상 없이, 1년 내내 언론 대응으로 그녀의 목소리를 이어갔음. 그녀가 더 이상 말할 수 없게 되자 회고록과 가족이 대신 말하게 했음. 예산 없이 모두 무상으로 진행."],"sol":["사망 당일 한 기자와 함께 그녀의 삶을 정리한 기사를 내, 죽음을 둘러싼 왜곡과 음모론을 초기에 막음","형제들이 공개적으로 발언할 수 있도록 미디어 트레이닝과 인터뷰를 지원","2025년 10월 회고록 『Nobody's Girl』 출간","다른 생존자, 정치인들과 함께 엡스타인 수사 파일 공개 법안과, 성범죄 공소시효를 없애는 '버지니아 법'을 지지"],"stats":[["140만 부","회고록 영어판 판매"],["300만 건","공개된 엡스타인 파일"],["약 50명","사임한 권력자"],["119개국","보도된 국가"]],"results":["회고록은 영어판만 140만 부가 팔렸음. 엡스타인 파일 투명성법이 통과돼 300만 건의 파일이 공개됐고, 권력자 약 50명이 자리에서 물러났음. 앤드루 왕자는 작위를 박탈당하고 체포됨. 이번 칸에서 티타늄을 받음."],"analysis":["당사자가 세상을 떠나면 이야기도 함께 잊히기 쉬움. 이 캠페인은 회고록과 가족이라는 두 목소리를 세워, 그녀의 이야기가 계속 들리게 만들었음.","영상도, 광고도, 예산도 없이 티타늄을 받은 사례. 무엇을 만들었느냐가 아니라 무엇을 바꿨느냐로 평가받았음."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["\"저는 2019년부터 성매매 피해 생존자 버지니아 로버츠 주프리와 함께 일했습니다. 그녀는 제프리 엡스타인, 길레인 맥스웰, 장뤼크 브뤼넬에 맞서 증언했고, 앤드루 왕자를 상대로 소송을 제기했습니다. 버지니아는 생존자들의 말이 믿어지고 정의를 찾을 수 있도록, 자신의 이야기가 세상에 알려지기를 간절히 바랐습니다.\"","\"버지니아가 자기 이야기를 공개적으로 하도록 돕는 일은 극도로 어려웠습니다. 소송 때문에 발언이 제한됐고, 파산할 수도 있는 명예훼손 소송과 그녀와 가족을 향한 폭력의 위협에 끊임없이 시달렸습니다.\"","\"지난 4월, 버지니아는 스스로 목숨을 끊었습니다. 그 직전에 그녀는 저에게, 함께 구상한 회고록이 꼭 출간되게 해 달라고 부탁했습니다. 형제들에게는 자신의 뜻을 이어 달라고 했습니다.\"","\"그녀가 세상을 떠난 뒤 1년 동안, 저는 전 세계 언론 보도를 조율하고 중요한 일이 있을 때마다 성명을 냈습니다. 버지니아의 삶과 죽음에 대한 결정판 기사를 만드는 일부터, 가족이 공적인 목소리를 내도록 돕는 일, 의회에서 생존자·정치인들과 함께 발언하는 일까지. 그리고 앤드루 왕자는 왕실 칭호를 박탈당하고 체포됐습니다.\"","\"10월, 버지니아의 회고록 『Nobody's Girl』이 출간됐습니다. 영어판만 이미 140만 부가 팔렸습니다. 엡스타인 투명성법은 이제 법이 됐습니다. 지금까지 300만 건의 파일이 공개됐고, 약 50명이 권력 있는 자리에서 물러났습니다. 성매매 범죄의 연방 공소시효를 없애는 '버지니아법'이 의회에 발의됐습니다. 이것이 그녀의 꿈이었습니다.\"","\"4월 기준, 저희 작업의 총 순방문자 노출은 119개국 1,130억 회에 이릅니다. 소셜 미디어 노출은 너무 많아 셀 수조차 없습니다. 버지니아가 자신과 생존자들을 위해 구했던 정의를 얻을 때까지, 저희는 멈추지 않을 것입니다.\""]}],"sources":[["Campaign (사례 인터뷰)","https://campaignlive.com/article/0-earned-media-campaign-honoring-virginia-giuffre-won-big-cannes/1963256"],["Campaign (티타늄 발표)","https://campaignlive.com/article/cannes-lions-2026-oreo-cows-legacy-virginia-giuffre-win-titanium/1963008"],["AP (회고록 판매)","https://ny1.com/nyc/all-boroughs/ap-top-news/2025/12/16/virginia-roberts-guiffres-memoir-sells-1m-copies-worldwide"],["ABC7 (앤드루 체포)","https://abc7ny.com/post/britains-former-prince-andrew-arrested-suspicion-misconduct-public-office-police-say/18619779/"]]},
 {"id":"faroe-space-program","tier":"grand-prix","title":"The Faroe Islands Space Program","brand":"SKF","agency":"Nord DDB, Stockholm","country":"스웨덴 / 페로 제도","cat":"Creative B2B","awards":["크리에이티브 B2B 그랑프리"],"video":"https://www.youtube.com/watch?v=EM1BgVJEhk4","ko":"하늘이 아니라 바다 아래로 내려가는 '우주 프로그램'. 달의 인력이 만드는 조류로 전기를 만드는 기술을 우주 경쟁에 빗대 알린 B2B 캠페인","bg":["SKF는 마찰을 줄이는 베어링을 만드는 스웨덴 기업. 회사는 에너지를 아끼게 해주는 클린테크 기업으로 보이고 싶었지만, 사람들은 그저 '베어링 회사'로만 알았음.","게다가 세상의 관심은 재생에너지가 아니라, 자원을 찾아 달로 향하는 '새로운 우주 경쟁'에 쏠려 있었음."],"solIntro":["세상의 관심이 쏠린 '우주 경쟁'에 올라탔음. 페로 제도에서 '우주 프로그램'을 출범시킨 것. 단, 이 우주 프로그램은 지구를 떠나지 않음.","바닷물이 밀려왔다 빠지는 조류는 달의 인력 때문에 생김. 그러니 조류로 전기를 만드는 건 곧 지구에서 '달의 힘'을 쓰는 셈. 조력발전을 '달 에너지'로, 바닷속 발전기를 '우주선'으로 바꿔 이야기했음."],"sol":["SKF, 조력발전 기업 미네스토, 페로 제도 전력회사 SEV가 함께 참여. 미네스토의 수중 조력발전기에 SKF 기술을 결합","카운트다운, 발사, 우주선 도장까지 진짜 우주 프로그램처럼 연출","광고가 아니라 실제 프로그램으로 보이게 뉴스와 PR 중심으로 알리고, 기술을 자세히 설명하는 영상도 따로 제작"],"stats":[["8억+","노출"],["1,400건+","언론 보도"],["16개+","도입을 논의 중인 시장"],["40%","2030년 섬 전력 중 조력 목표 비중"]],"results":["BBC, CNBC, 이코노미스트 등이 보도했고 노출 8억 회 이상, 기술 영상 조회수 2,500만 회를 기록함. SEV는 2030년까지 섬 전력의 40%를 이 기술로 만들 계획이고, 16개 이상의 시장이 도입을 논의 중. 이번 칸에서 크리에이티브 B2B 그랑프리를 받음."],"analysis":["'조력발전 기술'이라고 하면 아무도 보지 않지만, '달의 힘을 쓰는 우주 프로그램'이라고 하면 뉴스가 됨. 이미 사람들이 관심 갖는 이야기에 B2B 기술을 얹은 것이 핵심.","베어링 제품을 광고하는 대신, 에너지를 아끼는 실제 프로젝트에 참여하는 모습을 보여줬음. '베어링 회사'에서 '클린테크 기업'으로 보이고 싶다는 목표에 가장 직접적으로 답한 방식."],"films":[{"kind":"메인 필름","title":"Launching The Faroe Islands Space Program","url":"https://www.youtube.com/watch?v=RpnyotHMOyQ"}],"videoDesc":[{"h":"케이스 영상 (약 2분 10초, 한글 자막)","p":["에너지 수요는 그 어느 때보다 높다. \"드릴, 베이비, 드릴(뚫어라, 계속 뚫어라).\" 재생에너지에 대한 관심은 줄어들고 있다. 우리는 우리 행성에 대한 관심마저 잃고 있다. 강대국들은 자원을 찾아 달을 바라본다. \"우주 경쟁이 벌어지고 있습니다.\" \"달을 향한 우주 경쟁.\"","우리의 과제는 사람들의 관심을 다시 지구로 돌리고, 새로운 기술로 지구의 자원을 더 잘 쓸 수 있다는 걸 보여주는 것이었다.","그래서 외딴 섬들에 세 파트너를 모았다. 그들은 우주 경쟁에 맞서 싸우는 대신, 우주 경쟁에 뛰어들었다. 우주 프로그램을 출범시킨 것이다.","있어야 할 건 다 있다. \"10…\" 단 하나, 예상하지 못한 것만 빼고. \"5, 4…\" 이 우주 프로그램은 지구를 절대 떠나지 않는다. \"1.\"","대신 SKF와 미네스토의 기술로 달의 힘을 이용한다. 달의 인력이 만들어 내는 조력 에너지를 붙잡는 것이다. 이 기술을 우주 프로그램으로 포장하자, 재생에너지가 다시 주목받았다.","\"아이슬란드와 노르웨이 사이의 이 작은 섬들이, 세계에서 가장 멋진 우주 프로그램 중 하나를 갖고 있습니다.\" \"저는 늘 위를 올려다보는데, 여러분은 로켓 같은 걸 아래로 보내는 거네요. 맞나요?\" \"맞습니다.\"","이제 국영 에너지 기업 SEV는 2030년까지 섬 전력의 40%를 이 기술로 만들 계획이다. 그리고 16개가 넘는 새로운 시장이 이 기술 도입을 논의하고 있다.","에너지에 굶주린 세상에서, 페로 제도 우주 프로그램은 일깨워 준다. 이미 가진 자원을 더 잘 쓸 수 있다는 것을. 바로 여기, 지구에서."]},{"h":"메인 필름: Launching The Faroe Islands Space Program (약 1분 30초)","p":["우리는 새로운 항해를 시작했다. 늘어나는 에너지 수요가 새로운 우주 경쟁을 불러왔다. 강대국들이 달의 자원을 차지하려고 경쟁하고 있다.","세계에서 가장 작은 나라 중 하나가 이제 그 경쟁에 뛰어든다. 단 하나가 다르다. 이 우주 프로그램은 절대 지구를 떠나지 않는다.","우리에겐 이미 끝없는 달의 에너지가 있다. 바로 조력 에너지다. 우리 우주선은 위로 올라가지 않는다. 아래로 내려가서 날아간다. 물속에서.","조류가 터빈을 통과하면서, 매일 재생 가능한 '달 에너지'를 만들어 낸다. 바로 여기, 지구에서.","이 우주 프로그램은 2030년까지 재생에너지 100%를 달성하려는 페로 제도의 미션의 일부다. 이미 가진 자원을 최대한 활용하는 일에 함께해 달라."]}],"sources":[["LBB Online (제작 비하인드)","https://lbbonline.com/news/NORD-DDB-SKF-Minesto-Sev-Faroe-Islands-Space-Program"],["Minesto 보도자료 (수상)","https://www.inderes.fi/en/releases/minesto-ab-global-exposure-for-minestos-tidal-dragons-following-cannes-lions-grand-prix-win"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"wedding-rice","tier":"grand-prix","title":"The Wedding Rice","brand":"Wikifarmer","agency":"McCann Athens","country":"그리스","cat":"Creative Business Transformation","awards":["크리에이티브 비즈니스 트랜스포메이션 그랑프리"],"video":"https://www.youtube.com/watch?v=qdQpzF1u0SM","ko":"판매 규격에서 탈락한 쌀을 결혼식 '쌀 던지기' 전용 쌀로 팔아, 버려지던 쌀을 농가의 새 수입원으로 바꾼 그리스 농산물 플랫폼의 사업","bg":["위키파머는 농부가 작물을 직접 파는 온라인 마켓플레이스. 플랫폼이 크려면 농가가 팔 물건과 그걸 살 사람을 새로 이어 줘야 했음.","그리스 쌀 농가는 생산량의 약 30%를 상품 규격에 못 미친다는 이유로 팔지 못하고 있었음. 한편 신혼부부에게 쌀을 뿌리는 결혼 전통 때문에 매년 200톤이 넘는 먹을 수 있는 쌀이 버려졌음."],"solIntro":["버려지는 전통에 버려지는 쌀을 연결했음. 규격 미달로 팔 수 없던 쌀을 결혼식에서 뿌리는 전용 상품 'The Wedding Rice'로 만들어 판매함. 하객은 먹을 쌀을 버리지 않아도 되고, 농가는 팔 수 없던 쌀로 돈을 벌게 됨."],"sol":["농부가 위키파머 마켓플레이스에 웨딩 라이스를 올리고, 결혼식 플래너에게 일반 쌀보다 싼 값에 직접 판매","그리스 정부가 사업을 공식 지지","같은 전통을 가진 다른 나라로 확장할 수 있는 열린 프로그램으로 운영"],"stats":[["3톤","출시 첫 주 판매량"],["+110%","위키파머 마켓플레이스 트래픽"],["15개국","같은 전통을 가진 확장 대상 국가"],["2,000만 건","이 나라들의 연간 결혼식 수"]],"results":["출시 첫 주에 3톤이 팔렸고, 위키파머 마켓플레이스 트래픽은 110% 늘었음. CNN, 포춘 등이 보도함. 같은 전통이 있는 15개국, 연간 2,000만 건의 결혼식으로 확장을 준비 중. 그리스가 칸에서 받은 첫 그랑프리."],"analysis":["두 개의 낭비(버려지는 먹을 쌀, 팔지 못하는 규격 미달 쌀)를 서로 맞물려 한 번에 해결했음. 복잡한 기술 없이 이미 있는 문화를 활용한 단순함이 힘.","광고가 아니라 새 상품과 새 판매 경로를 만든 사업 모델의 변화. 농가에는 없던 수입원이 생겼다는 결과가 아이디어와 바로 연결됨."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초, 한글 자막)","p":["그리스에서 가장 사랑받는 전통 중 하나, 신혼부부에게 쌀 뿌리기.","하지만 매년 200톤이 넘는 먹을 수 있는 쌀이 이렇게 버려진다. 한편 농부들이 키운 쌀의 30%는 상품 규격에 맞지 않아 팔 수 없는 쌀이 된다.","위키파머는 이 '낭비하는 전통'을 바꾸기로 했다. 웨딩 라이스(The Wedding Rice).","농부는 위키파머 마켓플레이스에 웨딩 라이스를 올리고, 결혼식 플래너에게 직접 판다.","\"결혼식에 가장 지속 가능한 방법을 제공하는 것이 우리의 의무입니다.\"","정부가 이 사업을 지지했고, CNN, 포춘, 허핑턴포스트 등이 보도했다.","첫 주에 3톤 판매. 위키파머 마켓플레이스 트래픽 110% 증가.","같은 전통을 가진 나라 15개국, 한 해 결혼식 2,000만 건. 이제 이 나라들의 농부와 결혼식 플래너를 잇는다."]}],"sources":[["CB News (심사평)","https://www.cbnews.fr/node/101984"],["Greek Reporter (그리스 첫 그랑프리)","https://greekreporter.com/2026/06/27/greece-secure-historic-first-grand-prix-cannes-lions-festival/"],["The Stable","https://www.thestable.com.au/mccann-worldgroup-greece-non-edible-rice-makes-a-greek-wedding-tradition-sustainable/"],["designboom","https://www.designboom.com/design/wedding-rice-non-edible-grains-ceremonial-use-against-food-waste-04-20-2025/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"lucky-fan-index","tier":"grand-prix","title":"Lucky Fan Index","brand":"Wisła Kraków","agency":"VML Kraków / Warsaw","country":"폴란드","cat":"Creative Commerce","awards":["크리에이티브 커머스 그랑프리"],"video":"https://www.youtube.com/watch?v=bmQRLuPQDjA","ko":"'내가 경기장에 가면 팀이 이긴다'는 축구팬의 미신을 데이터로 수치화해, 팬마다 '행운 지수'를 매긴 폴란드 축구 클럽","bg":["폴란드의 전통 강호 비스와 크라쿠프가 1부 리그에서 강등되면서 재정에 큰 타격을 입었음.","강등된 클럽에게 티켓 수입은 생존 문제. 과제는 멀어진 팬들을 다시 경기장으로 불러오는 것."],"solIntro":["축구팬이라면 다 아는 미신에서 출발했음. '내가 경기장에 가면 팀이 이긴다.' 이 미신을 진짜 숫자로 만들어, 팬 한 명 한 명이 팀에 가져다준 행운을 재는 'Lucky Fan Index(행운의 팬 지수)'를 만듦.","재료는 이미 클럽 손에 있었음. 폴란드 클럽은 법적으로 입장하는 모든 팬의 신원을 기록해야 함. 쌓아두기만 하던 그 기록을 경기 결과와 맞춰 본 것."],"sol":["22만 명이 넘는 팬의 입장 기록을 골, 실점, 카드, 부상 등 200개가 넘는 경기 지표와 맞춰 분석","팬마다 개인 행운 지수를 매기고, 웹에서 확인하고 공유할 수 있게 함","가장 운 좋은 팬은 VIP석으로 업그레이드, 가장 운 없는 팬에게는 '더 운 좋은 굿즈'를 살 수 있는 팬숍 할인을 제공"],"stats":[["+42%","평균 관중 증가"],["1위","리그 내 관중 순위"],["22만+","분석한 팬 프로필"]],"results":["평균 관중이 42% 늘어 리그 관중 1위에 올랐고, 팬 참여와 클럽 매출도 늘었음. 이 시스템은 다른 유럽 클럽에 판매할 솔루션으로도 제안되고 있음. 이번 칸에서 크리에이티브 커머스 그랑프리를 받음."],"analysis":["팬의 미신을 비웃지 않고 숫자로 받아줬음. '당신이 오면 팀이 이긴다'를 증명해주니 경기장에 가는 일이 개인적인 의미를 갖게 되고, 관중을 늘리려는 클럽의 목적과 팬의 마음이 같은 방향을 향함.","보상도 영리함. 운이 좋으면 좋은 자리, 운이 나쁘면 굿즈 할인. 지수가 어떻든 손해 보는 느낌이 없고, 결국 클럽에서 돈을 쓰게 되는 구조."],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["폴란드 축구의 전설 중 하나인 비스와 크라쿠프가 1부 리그에서 강등되자, 클럽 재정은 큰 타격을 입었다. 갑자기 경기장을 채우는 일은 그냥 중요한 일이 아니라, 생존이 걸린 일이 됐다.","하지만 우리 편에는 강력한 존재가 있었다. 바로 팬들. 행운은 진짜 있고, 자기가 경기장에 있으면 그라운드의 모든 게 달라질 수 있다고 믿는 팬들이다.","그래서 우리는 축구계 어디에나 있는 이 미신을, 어떤 클럽도 만든 적 없는 것으로 바꿨다. '행운의 팬 지수(Lucky Fan Index)'. 팬 한 명 한 명이 비스와 크라쿠프에 얼마나 많은 행운을 가져다주는지 측정하는 첫 번째 통계다.","어떻게? 폴란드의 모든 클럽은 법에 따라 경기장에 들어오는 모든 팬의 신원을 확인해야 한다. 우리는 이 과거 입장 기록을, 경기 중 일어난 운 좋은 일과 운 나쁜 일을 모두 담은 수년치 경기 기록과 대조했다. 골, 놓친 골, 기대 득점, 실점, 카드, 부상 등등. 그리고 그 모든 혼돈 속에서 단순한 개인 숫자 하나가 나온다. 바로 당신만의 행운의 팬 지수.","우리 팀 막내 선수가 130초 만에 두 골을 넣었을 때 거기 있었나? 당신이 행운을 가져왔다. 지수 상승. 막판에 패배했을 때 거기 있었나? 운이 없었다. 지수 대폭락. 처음으로, 팬들은 자기가 경기장에 있는 게 얼마나 중요한지 직접 볼 수 있게 됐다.","행운의 팬 지수는 그냥 재미있는 아이디어가 아니다. 법 때문에 모아야 했던 데이터베이스가, 관중과 팬 참여와 클럽 매출을 끌어올리는 상업 데이터 플랫폼으로 바뀌었다. 가장 운 좋은 팬은 VIP 박스로 업그레이드된다. 최고의 자리는 행운을 가장 많이 가져오는 사람의 몫이어야 하니까. 가장 운 없는 팬은 '더 운 좋은 굿즈'를 살 수 있게 팬숍 할인을 받는다. 팬들은 자기 지수를 확인하고 SNS에 올릴 수 있는 도구도 받았다.","축구 매체들은 열광했다. 하지만 무엇보다, 평균 관중이 42% 늘어 지금은 리그 전체 1위다. \"행운의 팬 지수는 정말 똑똑하고 단순해요. 모든 클럽이 팬들에게 제공해야 해요.\""]}],"sources":[["WPP 케이스","https://www.wpp.com/en/case-studies/the-lucky-fan-index-how-wisla-krakow-used-ai-to-give-every-supporter-a-personal-stake-in-the-teams-success"],["Contagious (커머스 수상)","https://www.contagious.com/article/cannes-lions-2026-creative-commerce-winners-2b827a31c9d1442a996317e2fb246f07"],["VML 케이스","https://www.vml.com/work/lucky-fan-index"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"sos-pos","tier":"grand-prix","title":"SOS POS","brand":"BCP (Banco de Crédito del Perú)","agency":"Circus Grey, Lima","country":"페루","cat":"Creative Data","awards":["크리에이티브 데이터 그랑프리"],"video":"https://www.youtube.com/watch?v=frGZu85YZnc","ko":"휴대폰을 도둑맞으면 은행에 전화할 수도 없다는 모순을, 동네 가게의 카드 결제 단말기로 해결한 페루 최대 은행의 서비스","bg":["페루에서는 하루 4,000대가 넘는 휴대폰이 도난당하고, 범죄자들은 몇 분 만에 은행 앱으로 계좌를 털어감. 페루 최대 은행 BCP에게 이건 고객의 예금과 신용, 그리고 은행에 대한 신뢰가 걸린 문제.","은행마다 계좌를 막는 긴급 전화가 있지만, 휴대폰을 도둑맞은 사람에게는 그 전화를 걸 휴대폰이 없었음."],"solIntro":["휴대폰 대신 동네 가게의 카드 결제 단말기를 '긴급 차단 버튼'으로 바꿨음. 휴대폰을 도둑맞으면 가까운 가게로 가서 단말기에 신분증 번호와 비밀번호만 누르면 계좌가 바로 막힘."],"sol":["결제 단말기와 은행 시스템을 잇는 API를 만들어, 단말기에서 바로 계좌를 차단할 수 있게 함","휴대폰 도난이 잦은 지역에 1만 7,500곳이 넘는 차단 지점을 배치. 어디서든 2분 안에 걸어갈 수 있게 함","식료품점, 철물점, 약국 같은 동네 가게를 차단 지점으로 활용","오픈소스로 공개해 다른 은행도 쓸 수 있게 함"],"stats":[["-48%","월간 금전 도난 신고"],["780만 달러+","4개월간 차단으로 지킨 금액"],["1만 7,500곳+","초기 차단 지점"],["12만 곳+","2026년 목표 차단 지점"]],"results":["월간 금전 도난 신고가 48% 줄었고, 4개월 동안 780만 달러 이상을 지켰음. BCP는 2026년까지 차단 지점을 12만 곳 이상으로 늘릴 계획. 이번 칸에서 크리에이티브 데이터 그랑프리를 받음."],"analysis":["'계좌를 막으려면 전화가 필요한데, 그 전화가 없어졌다'는 모순을 정확히 짚었음. 해결책은 휴대폰이 필요 없는 다른 길을 찾는 것.","새 인프라를 만들지 않고 이미 동네마다 깔린 결제 단말기를 다시 썼음. 도난 데이터로 어디에 둘지 정해, 가장 필요한 곳에서 가장 빨리 쓸 수 있게 만들었음."],"films":[{"kind":"메인 영상","title":"SOS POS - Bloqueo de Emergencia BCP","url":"https://www.youtube.com/watch?v=PGXK48_wIcE"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초, 한글 자막)","p":["페루에서는 매일 4,000대가 넘는 휴대폰이 도난당한다. 범죄자들은 몇 분 만에 잠금을 풀고 은행 앱으로 계좌를 털어 간다.","은행마다 카드를 즉시 막을 수 있는 무료 긴급 전화가 있다. 그런데 휴대폰이 없는데, 어떻게 은행에 전화해서 계좌를 막을까?","BCP의 답은 SOS POS. \"저희가 한 일은 아주 단순합니다. 결제 단말기와 은행 시스템을 연결하는 API를 만들어서, 단말기에서 바로 차단할 수 있게 한 겁니다.\"","휴대폰을 도둑맞으면 가장 가까운 가게로 간다. 단말기에 신분증 번호와 비밀번호를 입력한다. 계좌 차단 끝.","도난이 가장 많은 지역을 찾아 1만 7,500곳이 넘는 차단 지점을 배치했다. 어디서든 단말기까지 2분이 안 걸린다.","\"이제 카드를 막는 데 휴대폰이 필요 없어요. 단말기만 있으면 카드를 막을 수 있어요. 동네 식료품점, 철물점, 약국 등 많은 곳에서요.\"","월간 금전 도난 신고 48% 감소. 4개월 동안 780만 달러 이상을 지켰다. SOS POS는 오픈소스로 공개됐다. \"BCP는 2026년 한 해 동안 12만 곳이 넘는 차단 지점을 열겠다고 약속합니다.\"","전화도, 앱도, 기다림도 없이. 사람들에게 가장 필요한 바로 그 순간의 보안. SOS POS."]},{"h":"메인 영상: SOS POS - Bloqueo de Emergencia BCP (약 2분 45초)","p":["\"강도를 당했는데 어떻게 해야 할지 모르겠다고요? 안녕하세요, 세사르 리테르입니다. 오늘은 긴급 차단으로 바로 대처하는 꿀팁을 알려드릴게요. 시작합니다.\"","\"휴대폰을 도둑맞은 한 청년이, 구글 지도로 BCP 대리점을 찾으려고 했대요. 이봐, 순진하긴. 휴대폰이 없잖아.\"","\"루치토가 묻네요. 긴급 차단이 뭐예요? 바로 알려드릴게요. 여러분의 안전을 위해 만든 해결책이에요. 휴대폰을 도둑맞으면 당연히 카드를 막으려고 전화할 방법이 없잖아요. 이건 전국 어느 BCP 대리점에서든 모든 BCP 카드를 막을 수 있는 방법이에요.\"","\"긴급 차단은 어떻게 신청하냐고요? 그 순간엔 속도가 제일 중요하니까, 절차는 최대한 간단해요. BCP 대리점에 가서 긴급 차단을 요청하고, 신분증 번호와 비밀번호를 누르고, 확인. 끝.\"","\"여기까지 보셨다면 1초만 드릴 테니 좋아요와 구독 눌러 주세요. 이제 편한 옷으로 갈아입을게요.\"","\"SNS에서 다들 묻는 질문. 차단하는 데 돈이 드나요? 긴급 차단은 완전히 무료예요. BCP 대리점은 한 푼도 받지 않아요.\"","\"카드 하나만 막고 싶으면요? 여기 주목. 여러분의 안전을 위해서예요. 휴대폰을 도둑맞으면 무조건 모든 카드를 막아야 해요. 메트로폴리타노(교통카드)까지, 전부 다요. 왜냐고요? 카드가 택시, 배달 등 수많은 앱에 연결돼 있을 수 있거든요. 그리고 갤러리나 메모에 카드 사진이 있다면, 사이버 범죄자들, 흔히 말하는 '초리소'(좀도둑)들이 여러분 정보에 접근할 수 있어요.\"","\"BCP 대리점은 어디서 찾냐고요? 지금 전국에 1만 곳이 넘는 BCP 대리점이 있어요. 감독님, 지도 띄워 주세요. 동네 식료품점, 철물점, 약국 등 정말 많은 곳에 있어요. 이 표시로 알아볼 수 있어요.\"","\"기억하세요. 휴대폰을 도둑맞거나 잃어버리면, 저희 채널 어디서든 카드를 막으세요. 중요한 건 바로 행동하는 거예요. 영상이 좋았다면 좋아요 누르고, 필요한 사람에게 공유해 주세요. 다음 영상에서 만나요.\""]}],"sources":[["CB News (심사평)","https://www.cbnews.fr/node/101940"],["Cannes Lions 공식 발표 (3일차)","https://www.canneslions.com/news/cannes-lions-international-festival-of-creativity-announces-lion-winners-on-day-three"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"three-words","tier":"grand-prix","title":"Three Words","brand":"AXA","agency":"Publicis Conseil, Paris","country":"프랑스","cat":"Creative Effectiveness","awards":["크리에이티브 이펙티브니스 그랑프리"],"video":"https://www.youtube.com/watch?v=6BTheXxBicA","ko":"주택보험 약관의 '긴급 거처 제공' 조항에 '그리고 가정폭력'이라는 세 단어를 더해, 가정폭력 피해자가 집을 떠날 수 있게 만든 보험사","bg":["프랑스에서 주택보험은 의무 가입이라 회사마다 상품이 거의 같았고, AXA는 브랜드 선호도 2위에 머물러 있었음. 고객이 굳이 AXA를 고를 이유가 필요했음.","한편 프랑스에서는 매년 21만 명의 여성이 가정폭력 피해를 입고, 피해자들이 집을 떠나지 못하는 가장 큰 이유는 갈 곳도 돈도 없다는 것. 주택보험은 화재나 홍수 때 임시 거처를 주지만, 가정폭력은 보장 대상이 아니었음."],"solIntro":["새 상품을 만들지 않고, 이미 있는 약관에 세 단어를 더했음. '화재나 홍수로 집에 살 수 없게 되면' 뒤에 '그리고 가정폭력'. 이 세 단어로 가정폭력 피해자도 보험으로 긴급 거처를 받을 수 있게 됨."],"sol":["AXA 주택보험 계약 250만 건 전체에 이 조항을 넣고, 기존 가입자에게도 적용","7일간의 긴급 거처와 함께 법률 지원, 심리 상담, 전용 지원 번호를 제공","프랑스 80개 NGO와 협력해 피해자에게 보장이 닿게 함"],"stats":[["1,576명","첫해 지원받은 피해자"],["+113%","순신규 계약 증가"],["2위→1위","브랜드 선호도"],["250만 건","조항이 추가된 계약"]],"results":["첫해 1,576명의 피해자가 지원을 받았음. 순신규 계약은 113% 늘었고, 브랜드 선호도는 2위에서 1위로 올라섰음. 2025년 칸 티타늄 그랑프리에 이어, 2026년에는 실제 사업 성과를 평가하는 크리에이티브 이펙티브니스 부문 그랑프리를 받음."],"analysis":["피해자에게 필요한 건 위로의 메시지가 아니라 오늘 밤 갈 곳. 보험사가 가장 잘하는 일(긴급 거처 제공)을 가장 필요한 사람에게 연결했음.","누구나 의무로 들어 회사 간 차이가 없던 상품에 '이 회사를 고를 이유'가 생겼음. 사회적 선의가 신규 계약과 브랜드 선호도로 이어져, 효과를 평가하는 부문에서 그랑프리를 받은 이유."],"videoDesc":[{"h":"케이스 영상 (약 2분 10초, 한글 자막)","p":["\"남성, 자택에서 아내 살해 혐의로 기소.\" \"여성, 자택에서 파트너에게 살해된 채 발견.\" \"26세 여성, 집 안에서 남편에게 살해돼.\"","\"다들 늘 묻죠. 그 여자는 왜 떠나지 않느냐고. 때리는 남자 곁에 누가 남아 있겠느냐고.\" \"제가 남아 있었던 건 돈이 없었기 때문이에요. 기댈 수 있는 게 아무것도 없었어요.\" \"결국 문제는 어디로, 무슨 돈으로 가느냐예요.\"","프랑스에서 주택보험은 법적 의무다. 이 보험은 화재나 홍수로 집에 살 수 없게 되면 긴급 거처를 제공한다. 여기에 세 단어를 더했다. '그리고 가정폭력.'","\"보험사의 전문성을 가정폭력 피해 여성들을 위해 쓰겠습니다. 중요한 건 장기적인 해결책을 찾을 시간을 드리는 겁니다.\" (알리스 홀츠만, AXA 프랑스 CEO)","\"AXA 같은 브랜드가 자기가 가장 잘하는 일로 돕는다는 게 놀랍습니다.\" \"긴급 거처는 피해자에게 최우선 과제입니다. 생명을 구합니다.\"","여자로 산다는 것이 위험이 되어서는 안 된다."]}],"sources":[["WARC (이펙티브니스)","https://www.warc.com/article/axa-france-three-words-ebfd758494b64d1393b96011e5602c3f"],["D&AD","https://www.dandad.org/work/annual-2026/behind-the-work/how-axa-used-creative-thinking-to-deliver-life-saving-support"],["Contagious","https://www.contagious.com/article/cannes-lions-2026-creative-effectiveness-winners-84a15deaad234bce86cfc8fe65a66f0e"],["CB News (WARC 랭킹)","https://www.cbnews.fr/node/99377"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"pub-that-refused-to-die","tier":"grand-prix","title":"The Pub That Refused to Die","brand":"Heineken Ireland","agency":"LePub Milan & Publicis Dublin","country":"아일랜드 / 이탈리아","cat":"Creative Strategy","awards":["크리에이티브 전략 그랑프리"],"video":"https://www.youtube.com/watch?v=4UPmILnsGlY","ko":"마을의 마지막 펍이 문을 닫으려 하자 주민 26명이 돈을 모아 펍을 사들인 이야기를 다큐로 만들고, 다른 마을도 따라 할 수 있게 도운 하이네켄","bg":["아일랜드 시골에서는 마을 펍이 사라지고 있음. 작은 마을 킬틸리에 남은 마지막 펍도 운영비를 감당하지 못해 매물로 나왔음.","하이네켄에게 펍은 맥주가 팔리는 곳이자 브랜드가 사람들과 만나는 곳. 펍이 사라지면 사업 기반도 사라짐."],"solIntro":["'혼자 운영하기 힘들다면, 마을이 함께 소유하면 어떨까?' 킬틸리 주민 26명이 실제로 30만 유로를 모아 펍을 사들이고 다시 문을 열었음. 펍 운영 경험은 아무도 없었음.","하이네켄은 이 이야기를 한 번의 미담으로 끝내지 않고, 다른 마을도 따라 할 수 있는 방법으로 만들어 퍼뜨렸음."],"sol":["주민들이 펍 운영을 배울 수 있도록 교육 과정을 마련","이 과정을 다큐멘터리 'The Pub That Refused to Die'로 제작","아일랜드 전국 마을을 돌며 상영회를 열고, 킬틸리 주민들이 직접 경험을 나누며 다른 마을을 지원","펍 공동 인수를 원하는 마을을 위한 실용 가이드를 제공"],"stats":[["26명","펍을 산 주민 수"],["30만 유로","주민들이 모은 금액"],["1곳+","뒤따라 펍을 인수한 마을"]],"results":["투어로 찾아간 마을 중 한 곳이 실제로 자기 마을 펍을 사들였고, 여러 마을이 비슷한 시도를 시작함. 이번 칸에서 크리에이티브 전략 그랑프리를 받음."],"analysis":["하이네켄이 펍을 직접 사들인 게 아니라, 펍을 살린 사람들의 이야기를 '따라 할 수 있는 방법'으로 만들어 퍼뜨렸음. 그래서 한 마을의 사례가 다른 마을의 행동으로 이어졌음.","펍을 살리는 일이 곧 하이네켄의 판매처를 지키는 일. 사회적 명분과 사업적 이익이 정확히 겹쳤음."],"films":[{"kind":"메인 필름","title":"The Pub That Refused to Die (다큐, 약 10분)","url":"https://www.youtube.com/watch?v=U0FNEVBwVi0"},{"kind":"예고편","title":"Official Trailer (30초)","url":"https://www.youtube.com/watch?v=9uwkOfqOijo"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초, 한글 자막)","p":["\"제가 10대였을 땐 마을에 펍이 세 곳 있었어요. 이제 마지막 하나만 남았죠. 가게도 주유소도 없는 곳에선, 펍이 공동체의 마지막 중심이에요.\"","\"돈이 많이 들어요. 그걸 다 꾸려 나가려면요. 그래서 결국 팔기로 했죠.\"","\"주민 26명이 모여 펍을 사들였습니다. 공동체 펍이에요.\" \"30만 유로를 모아 다시 문을 열었습니다.\" \"변호사, 목수, 농부, 간판 제작자, 건축업자… 펍을 운영해 본 사람은 있나요?\" \"아뇨.\"","\"주주들과 앉아 이야기해 보니, 바 경험이 전혀 없더라고요. 그래서 이걸 해내려면 하이네켄이 뭘 할 수 있을지 살펴봤죠.\" \"하이네켄이 사우스 리머릭에 마련한 교육 과정에 몇 명이 들어가서 배웠어요.\"","\"이 모델은 통할 거라고 생각했어요. 사실 이건 전국 어디서든 똑같이 할 수 있거든요.\" \"안녕하세요, 26명 중 한 명인 보스코입니다. 살리고 싶은 펍이 있으시다고요?\"","\"우리가 특별한 게 아니에요. 우리한테 특별한 건 하나도 없어요. 주변 다른 마을이나 교구도 똑같이 할 수 있고, 실제로 하고 있어요.\"","\"이제 저도 펍 주인이에요. 성공을 일궈 낸 사람들이 우리 앞에 당당히 서서 경험을 들려주는 건 정말 값을 매길 수 없어요.\" \"저 사람들이 할 수 있으면, 우리도 할 수 있어요.\" \"하이네켄 같은 큰 브랜드가 자기 노하우를 나눠 준다는 건 정말 귀한 일이에요.\"","\"맞아요. 하이네켄의 도움을 받았죠. 그리고 기쁜 소식이 있어요. 저희가 찾아갔던 마을 중 한 곳이, 어제 그 마을 펍을 사들였답니다. 정말 대단하죠.\""]},{"h":"메인 필름: The Pub That Refused to Die (약 10분)","p":["다큐멘터리. 킬틸리 마을의 마지막 펍이 사라질 위기에 처하자, 펍 운영을 전혀 모르던 주민 26명이 힘을 모아 펍을 되살린다."]}],"sources":[["LBB Online","https://lbbonline.com/news/Heineken-Ireland-Cannes-Lions-Grand-Prix"],["CB News (심사평)","https://www.cbnews.fr/node/102002"],["Adweek","https://www.adweek.com/creativity/heineken-wins-big-again-among-7-grand-prix-winners-at-cannes-lions-2026-day-4/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"apple-tv-rebrand","tier":"grand-prix","title":"Apple TV Rebrand","brand":"Apple TV","agency":"TBWA\\Media Arts Lab, Los Angeles","country":"미국","cat":"Design","awards":["디자인 그랑프리"],"video":"https://www.youtube.com/watch?v=NKSnmy8MwFQ","ko":"'Apple TV+'에서 '+'를 떼고, 진짜 유리로 깎은 로고를 CG 없이 카메라로 찍어 만든 애플 스트리밍 서비스의 새 브랜드 아이덴티티","bg":["Apple TV+는 〈테드 래소〉 같은 히트작을 냈지만, 구독자 중 이 작품을 Apple TV+와 연결하는 사람은 33%뿐이었음.","'Apple TV'라는 이름이 기기, 앱, 스트리밍 서비스에 모두 쓰여 브랜드가 흩어져 있었고, 좋은 작품을 만들어도 그 공이 브랜드에 쌓이지 않았음."],"solIntro":["'+'를 빼고 서비스 이름을 'Apple TV' 하나로 통일한 뒤, 작품이 시작될 때마다 나오는 로고 인트로를 새로 만들었음. 사람들은 작품을 볼 때마다 이 몇 초를 보게 되니, 작품과 서비스를 연결하는 가장 확실한 자리."],"sol":["애플 로고를 투명한 유리로 직접 깎고, 색색의 조명을 비추며 회전시키는 모습을 실제 카메라로 촬영. 3D 렌더링이나 AI 없이 만듦","유리의 반사와 굴절이 촬영할 때마다 달라져, 다양한 장르와 감정을 담을 수 있게 함","피니어스(Finneas)가 새 사운드 아이덴티티를 작곡해 빛의 변화와 음악을 맞물리게 함","예고편용 2초, 시리즈용 5초, 극장용 12초 세 가지 길이로 제작하고, 107개 시장 340개 작품에 적용"],"stats":[["33%","리브랜딩 전 〈테드 래소〉를 Apple TV+와 연결한 구독자"],["340편","새 아이덴티티가 적용된 작품"],["107개","적용된 시장"]],"results":["앱, 애플 기기 메뉴, 홍보물까지 새 아이덴티티로 바뀌었음. 이번 칸에서 디자인 그랑프리를 받음."],"analysis":["문제는 '작품은 유명한데 서비스는 기억되지 않는다'는 것. 그래서 광고가 아니라 작품을 볼 때마다 반드시 지나가는 인트로를 바꿨음. 이름 통일로 흩어진 인지도를 한곳에 모으고, 인트로로 그 이름을 반복해서 각인시킨 것.","AI 영상이 넘쳐나는 시기에 진짜 유리와 진짜 빛으로 찍었다는 점이 곧 메시지. 만드는 방식 자체가 애플이 말하는 품질을 보여줌."],"videoDesc":[{"h":"케이스 영상 (약 30초)","p":["대사나 나레이션 없이 음악과 화면만 나온다.","어두운 스튜디오에서 유리와 조명, 카메라를 설치한다. 보라색 빛 속에 거대한 유리 애플 로고가 서 있다.","모니터에 유리 로고의 곡선이 잡히고, 빛이 유리 표면을 따라 흐르며 굴절된다.","빛을 머금은 유리 애플 로고 옆에 'tv'가 나타난다. 새 Apple TV 로고."]}],"sources":[["Contagious (디자인 수상)","https://www.contagious.com/article/cannes-lions-2026-design-winners-89077875a5ac43a7b3639bb95b9702ed"],["Reason Why (아이덴티티 소개)","https://www.reasonwhy.es/actualidad/apple-tv-estrena-identidad-nueva-intro-proceso-artesanal"],["MacRumors (리브랜딩 발표)","https://www.macrumors.com/2025/10/13/apple-tv-plus-rebrand"],["LBB Online","https://lbbonline.com/news/apple-cannes-lions-grand-prix-win"]]},
 {"id":"project-genie","tier":"grand-prix","title":"Project Genie","brand":"Google (Google DeepMind)","agency":"Google Creative Team, Mountain View","country":"미국","cat":"Digital Craft","awards":["디지털 크래프트 그랑프리"],"video":"https://www.youtube.com/watch?v=UI4qkTWvosM","videoKind":"케이스 영상 · 한글 자막","ko":"글이나 그림 한 장으로 직접 걸어 다닐 수 있는 가상 세계를 만들어주는 구글 딥마인드의 AI '지니 3'를, 누구나 써볼 수 있는 웹 서비스로 만든 작업","bg":["구글 딥마인드의 '지니 3'는 글로 설명하면 그 안을 직접 돌아다닐 수 있는 세계를 실시간으로 만들어내는 AI. 2025년 발표 때 화제가 됐지만, 연구용 시연이라 일반인은 써볼 수 없었고 사람들은 '언제 써볼 수 있냐'고 물었음.","그사이 오픈AI의 소라 같은 경쟁 생성형 영상 서비스는 이미 대중이 쓰고 있었음. 구글에게는 이 기술을 말이 아니라 직접 써보게 해서, AI 경쟁에서 앞선 기술이라는 걸 보여줘야 했음."],"solIntro":["설명 대신 직접 써보게 했음. 지니 3를 누구나 몇 번의 클릭으로 체험할 수 있는 웹 서비스 'Project Genie'로 만들어, 2026년 1월 구글 랩스의 실험적 프로토타입으로 출시함."],"sol":["월드 스케치: 환경과 캐릭터를 글로 설명하거나 이미지를 올리면 세계가 만들어짐. 걷기, 날기, 운전하기 같은 이동 방식과 시점을 고를 수 있음","들어가기 전에 미리보기 이미지를 보여주고 말로 수정할 수 있게 함. 글만으로는 결과를 짐작하기 어렵다는 문제를 푼 장치","월드 탐험: 사용자가 움직이는 대로 앞길이 실시간으로 생성됨. 한 번에 60초까지","월드 리믹스: 다른 사람이 만든 세계를 바꿔 새 버전을 만들 수 있음"],"stats":[["만장일치","심사위원단 그랑프리 결정"],["60초","한 번에 탐험할 수 있는 시간"]],"results":["심사위원단은 만장일치로 디지털 크래프트 그랑프리를 결정했고, 심사위원장은 이 작업이 '크리에이티비티의 미래'를 보여준다고 평가함."],"analysis":["'말로는 와닿지 않는 기술'이라는 문제에 '직접 해보게 하기'로 답했음. 핵심은 연구실 기술을 일반인이 바로 쓸 수 있게 만든 인터페이스. 특히 미리보기 단계가 '글로 써봐야 뭐가 나올지 모른다'는 불안을 없앴음.","완성품인 척하지 않고 '실험적 프로토타입'으로 내놓아, 한계가 있는 기술을 소개하면서도 기대치를 관리했음."],"films":[{"kind":"추가 영상","title":"How world remixing works (45초)","url":"https://www.youtube.com/watch?v=dO0csRgxo_A"}],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["2025년, 구글은 '지니 3'를 발표했다. 상상할 수 있는 어떤 세계든 만들고 탐험할 수 있는 기반 모델이다. 많은 사람에게 이건 AI를 쓰는 완전히 새로운 매체였다. 글로 입력하면 직접 플레이할 수 있는 인터랙티브 세계가 만들어진다.","발표는 인터넷 곳곳에서 화제가 됐다. 하지만 사람들이 정말 알고 싶었던 건 이것이었다. \"언제 써볼 수 있어요?\" 2026년, 구글은 누구나 자기만의 세계를 만들 수 있는 프로토타입을 내놓았다. 프로젝트 지니.","하지만 최첨단 연구를 일반 소비자용 도구로 만드는 데는 특별한 어려움이 있었다. 세상에 처음 나온 경험을, 어떻게 사용자가 직관적으로 쓰게 만들까?","우리는 실험부터 시작했다. 수천 개의 세계를 만들며, 모델이 할 수 있는 것과 없는 것의 경계를 확인했다. 지니는 3인칭 캐릭터 조작, 세계의 기억, 실시간 상호작용에서 다른 모델보다 뛰어났다.","모델이 뭘 잘하는지 아는 것과, 그 경험을 쓸 만하게 만드는 건 다른 문제였다. 지니 3 모델의 인터페이스는 최첨단 연구를 시연하려고 만든 것이지, 일반인이 쓰기 쉽게 만든 게 아니었다.","그래서 프로토타입을 만들기 시작했다. 처음엔 빨리 시험해 보려고 바이브 코딩으로 간단한 앱들을 만들었다. 그런데 그중 상당수가 핵심 사용자 경험을 찾아냈고, 결국 제품에 들어갔다.","지니의 디자인 과제는 생성형 미디어의 새로운 패러다임에서 비롯됐다. 정지된 이미지나 영상이 아니라, 움직이고 상호작용하는 세계였기 때문이다. 화면에 세계를 어떻게 담을지 여러 방법을 시도한 끝에, 단순함과 창작에 초점을 맞춘 UI로 정했다.","완성된 프로젝트 지니에서 사용자는 캐릭터와 환경을 자세히 설명하고, '월드 스케치'로 시작 이미지를 다듬을 수 있다. 직접 찍은 사진으로 세계를 만들 수도 있고, 20개가 넘는 미리 만든 세계 갤러리에서 리믹스할 수도 있다.","2026년 1월 출시. 전체 사용 과정을 보여준 데모 영상은 1,300만 회 넘게 조회되며 구글 딥마인드 역사상 가장 반응이 큰 게시물이 됐다. 프로젝트 지니에는 지금 활발한 디스코드 커뮤니티가 있고, SNS에서 활발한 대화가 이어지며, 지니로 만든 새로운 세계가 끊임없이 올라온다."]},{"h":"공식 소개 영상: How world sketching works (약 1분 20초)","p":["사용자들이 만든 수많은 세계가 동그란 창으로 떠다닌다.","세계를 스케치하는 것부터 시작하자. 먼저 환경을 글로 설명하고, 그다음 캐릭터를 설명한다. 캐릭터는 사람이든 동물이든 물체든 상관없다.","하지만 글만으로는 세계가 어떻게 보일지 알기 어렵다. 그래서 미리보기가 있다. 미리보기 이미지를 보면서 '멀리 산도 좀 있으면 좋겠다'처럼 말로 고칠 수 있다.","마음에 들면 세계를 만들고 그 안으로 들어간다. 파란 공 모양의 캐릭터가 털로 뒤덮인 듯한 하얀 언덕을 굴러간다. 상상하는 어떤 세계든 플레이할 수 있다."]}],"sources":[["Contagious (디지털 크래프트 수상)","https://www.contagious.com/article/cannes-lions-2026-digital-craft-winners-3a2392d27e5145b5a3f80e9d86373ce3"],["CB News (심사평)","https://www.cbnews.fr/node/101929"],["Dataconomy (출시)","https://dataconomy.com/2026/01/30/google-launches-project-genie-create-interactive-worlds-with-ai/"]]},
 {"id":"uva-uva-bombon","tier":"grand-prix","title":"Uva Uva Bombón","brand":"UVA (배달 앱)","agency":"de la Cruz Ogilvy, San Juan","country":"푸에르토리코","cat":"Direct","awards":["다이렉트 그랑프리"],"video":"https://www.youtube.com/watch?v=SnWnb59XTfM","ko":"배드 버니의 슈퍼볼 하프타임 쇼에서 앱 이름과 같은 가사가 나오는 순간, 앱 상품을 1달러에 파는 '우연을 광고로 만든' 푸에르토리코 배달 앱","bg":["UVA는 푸에르토리코의 신생 배달 앱. 이미 자리 잡은 배달 앱들 사이에서 출시와 동시에 이름을 알려야 했지만, 신생 앱이 슈퍼볼 같은 큰 무대에 광고를 살 수는 없었음.","마침 2026년 슈퍼볼 하프타임 쇼의 주인공은 푸에르토리코 출신 배드 버니였고, 그의 히트곡 가사에 'UVA'라는 단어가 들어 있었음."],"solIntro":["배드 버니가 하프타임 쇼에서 'UVA'가 들어간 그 곡을 부르면, 그 순간 UVA 앱에서 상품을 1달러에 팔겠다고 미리 약속했음. 곡이 나오는 순간 수억 명이 보는 무대가 UVA의 광고가 되는 구조."],"sol":["쇼 며칠 전부터 '배드 버니가 이 곡을 부르면 앱에서 특별 할인이 열린다'고 공지","팬들에게 배드 버니 계정을 태그해 그 곡을 불러달라고 요청하게 함","공연이 그 곡으로 시작하자 프로모션이 열림. 피자 세트, 스테이크, 덤벨, 은목걸이 등을 곡이 나오는 동안 또는 재고가 떨어질 때까지 1달러에 판매"],"stats":[["완판","하프타임 쇼 종료 전 전 상품"],["92%","관련 대화 점유율(share of engagement)"]],"results":["하프타임 쇼가 끝나기 전에 전 상품이 완판됐고, 관련 대화 점유율 92%를 기록함. 이번 칸에서 다이렉트 그랑프리를 받음."],"analysis":["신생 앱이 슈퍼볼 광고를 살 수는 없었음. 대신 브랜드 이름과 가사가 같다는 우연을 '곡이 나오면 할인'이라는 조건부 약속으로 바꿔, 남의 무대를 자기 광고로 만들었음.","'노래가 나오는 그 몇 분 동안만'이라는 시간 제한이 즉시 앱을 열고 구매하게 만들었음. 출시 단계 앱에 가장 필요한 설치와 첫 구매로 바로 이어진 것."],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["음악과 화면 자막, 장면 위주로 진행된다. 배드 버니가 'UVA, UVA, BOMBÓN'을 부른다.","슈퍼볼을 앞두고 모두가 같은 질문을 던졌다. 배드 버니는 무슨 곡을 부를까? 틱톡 예측 영상과 뉴스가 쏟아진다.","토크쇼에서 배드 버니가 같은 구절을 부른다. 그런데 이 곡에는 앱 이름이 들어 있다. 우연 = 슈퍼볼 광고.","푸에르토리코 풍경. 나이 지긋한 남성이 서재에서 미식축구공을 들고 예고한다. '빅 게임에서' 이 곡이 나오면 UVA 앱이 열린다. 인스타그램이나 X에서 배드 버니 계정을 태그하고, 그 순간 앱을 눌러 상품을 받아라.","피자 세트, 은목걸이, 덤벨, 미식축구공, 스탠리 컵. 상품 가격이 모두 1달러로 바뀌고, 앱 화면에는 'SOLD OUT'이 줄줄이 뜬다.","실제 하프타임 쇼에서 배드 버니가 이 곡으로 공연을 연다. 대화 점유율 92%. 아티스트가 언급한 유일한 브랜드."]}],"sources":[["LBB Online","https://lbbonline.com/news/de-la-cruz-ogilvy-puerto-rico-uva-super-bowl-bad-bunny"],["Contagious (다이렉트 수상)","https://www.contagious.com/article/cannes-lions-2026-direct-winners-55ef4e7c79bb4c20ae6c120903f94c3e"],["CB News","https://www.cbnews.fr/node/101971"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"original-forever","tier":"grand-prix","title":"Original Forever","brand":"adidas Originals","agency":"Johannes Leonardo, New York (& adidas London)","country":"미국 / 영국","cat":"Entertainment · Music","awards":["엔터테인먼트 그랑프리","엔터테인먼트 포 뮤직 그랑프리"],"video":"https://www.youtube.com/watch?v=au-oBjknsSk","videoKind":"케이스 영상 · 한글 자막","ko":"오아시스 재결합 투어에 맞춰, 30년 넘게 이어진 아디다스와 오아시스 팬덤의 관계를 공식 파트너십과 한 편의 필름으로 묶은 캠페인","bg":["오아시스와 아디다스는 30년 넘게 비공식적으로 엮여 있었음. 멤버들이 무대에서 아디다스 트랙수트를 입었고, 팬들도 따라 입었음.","2025년 오아시스가 재결합 투어로 돌아오면서, 이 오래된 관계를 공식화할 기회가 왔음. 관건은 흔한 후원이나 굿즈처럼 보이지 않는 것."],"solIntro":["후원사가 아니라 '처음부터 함께한 존재'로 등장했음. 오아시스와 정식 파트너십을 맺어 투어 공식 굿즈를 만들고, 밴드와 팬이 함께 지나온 30년을 한 편의 필름에 담았음."],"sol":["아디다스 오리지널스 x 오아시스 컬렉션 26종 출시. 파이어버드 트랙수트, 버킷햇 등 90년대 스타일을 재해석","필름은 'Live Forever'에 맞춰, 관객 위로 떠밀려 가는 팬들이 시대를 거슬러 넵워스 공연 같은 전설적인 순간들을 지나 무대 앞으로 향하는 구성","리암과 노엘 갤러거가 필름 마지막에 함께 등장. 2009년 해체 이후 첫 동반 출연","실제 오아시스 팬 300여 명을 캐스팅하고, 아디다스 아카이브의 빈티지 의류로 각 시대를 재현"],"stats":[["+12%","2025년 아디다스 라이프스타일 매출 성장"],["두 자릿수","2025년 오리지널스 성장률"],["26종","출시된 컬렉션"]],"results":["컬렉션은 매초 하나씩 팔려 영국 내 재고가 모두 동났고, 구매자의 33%가 신규 고객이었음. 아디다스는 오아시스와 가장 강하게 연상되는 브랜드 1위가 됐고, 이 협업을 2025년 라이프스타일 매출 12% 성장 요인 중 하나로 꼽았음. 이번 칸에서 엔터테인먼트 그랑프리와 엔터테인먼트 포 뮤직 그랑프리를 받음."],"analysis":["재결합 투어에 붙는 흔한 후원처럼 보이지 않는 게 관건이었음. 아디다스는 관계를 새로 만들 필요 없이, 30년간 팬들이 실제로 아디다스를 입어왔다는 역사를 꺼내 보여주기만 하면 됐음.","필름의 주인공이 밴드가 아니라 팬이라는 점이 핵심. 시대를 넘어 무대로 향하는 팬들이 입은 옷이 곧 아디다스였다는 사실이 자연스럽게 드러나, 광고가 아니라 팬에게 보내는 헌사처럼 느껴짐."],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["2025년 여름을 지배한 이야기는 단 하나였다. 오아시스의 재결합. 그리고 그 곁에는 언제나 함께였던 브랜드가 있었다. 바로 오아시스와 아디다스.","규칙을 완전히 새로 써야 했다. 그리고 시작부터 크게 갔다. 그렇게 삼선의 브랜드는 '삼선의 밴드'가 됐다.","순식간에 전 세계 헤드라인을 장식했다. 런던 신문 더 스탠더드는 '삼선 열풍! 왜 지금 모든 런던 사람이 아디다스를 입나'라고 썼다.","아디다스는 투어 자체에 녹아들었다. 그리고 두 형제가 16년 만에 처음으로 함께 등장하는 필름을 만들었다. 이 필름은 41번의 공연에서 200만 명의 팬을 만나는 오프닝 무대가 됐다. 세상은 열광했다.","처음부터 오랜 팬들에게 말을 걸었다. 매초 하나씩 팔렸고, 영국 내 재고는 모두 동났다. 영국 아디다스 온라인 스토어는 최근 3년 사이 가장 큰 트래픽 증가를 기록했다.","아디다스는 오아시스와 가장 강하게 연상되는 브랜드 1위가 됐고, 구매자의 33%는 아디다스의 신규 고객이었다.","삼선, 두 형제. 그리고 영원히 기억될 하나의 파트너십."]},{"h":"메인 필름: Original Forever (약 3분)","p":["대사 없이 오아시스의 음악과 공연 실황 사운드로 이어지는 필름이다.","어두운 공연장. 팬들이 관객들 위로 떠밀려 가는 크라우드 서핑을 한다. 이들은 시간을 건너뛰듯 90년대 공연장, 대형 야외 공연, 최근 공연까지 시대가 바뀌는 무대들을 차례로 지난다.","팬들은 각 시대의 헤어스타일과 옷차림을 하고 있고, 그 옷차림에는 아디다스 트랙탑과 저지가 섞여 있다. 오아시스의 실제 공연 장면이 교차된다.","한 목소리가 짧게 회상한다. 완전히 몰입한 날에는 주변이 온통 혼돈이어도 혼자 가만히 서 있게 되는데, 그게 세상에서 가장 좋은 기분이었다고.","크라우드 서퍼들이 마침내 무대 앞에 닿는다. 마지막은 무대 뒤 리암과 노엘 갤러거 형제의 모습."]}],"sources":[["Variety (수상)","https://au.variety.com/2026/biz/news/cannes-lions-entertainment-adidas-oasis-original-forever-38053/"],["CB News (심사평)","https://www.cbnews.fr/node/101927"],["Johannes Leonardo 케이스","https://johannesleonardo.com/case-studies/original-forever/"],["Fashionz (컬렉션 출시)","https://www.fashionz.co.nz/adidas-has-done-it-again-and-theyve-done-it-twice/"]],"films":[{"kind":"메인 필름","title":"Original Forever (약 3분)","url":"https://www.youtube.com/watch?v=mmVwe0Sul68"}]},
 {"id":"copycats-welcome","tier":"grand-prix","title":"Copycats Welcome","brand":"Clash Royale (Supercell)","agency":"DAVID New York","country":"미국 / 핀란드","cat":"Entertainment for Gaming","awards":["엔터테인먼트 포 게이밍 그랑프리"],"video":"https://www.youtube.com/watch?v=Ywz82xGe1To","ko":"클래시 로얄을 베낀 짝퉁 게임 유저들에게, 그동안 쌓은 진행 상황을 진짜 클래시 로얄 재화로 바꿔주겠다고 제안해 유저를 데려온 캠페인","bg":["출시 10년 차를 맞은 클래시 로얄은 전성기의 기세가 꺾였고(공식 e스포츠 결승 최고 시청자 수가 2022년에서 2024년 사이 38% 감소), 그 틈을 클래시 로얄을 베낀 짝퉁 게임들이 파고들어 원조의 플레이어를 빼앗아 갔음.","짝퉁 게임 유저를 데려오기도 어려웠음. 게임을 옮기면 그동안 쌓은 레벨과 재화를 모두 버려야 했기 때문."],"solIntro":["'그들이 우리 게임을 베꼈다면, 우리는 그들의 플레이어를 데려오자.' 짝퉁 게임에서 쌓은 진행 상황을 그대로 인정해, 진짜 클래시 로얄 재화로 바꿔줬음. 처음부터 다시 시작해야 한다는 장벽을 없앤 것."],"sol":["짝퉁 게임 유저들이 모이는 레딧 커뮤니티를 직접 겨냥한 필름 공개","필름 속 클래시 로얄 캐릭터들은 '배시 로얄', '스페이스 로얄' 같은 가짜 게임 세계에 떨어져 자기 짝퉁들과 마주침","전용 사이트에서 짝퉁 게임의 레벨, 플레이 시간, 재화 기록을 공유하면 클래시 로얄 재화로 전환"],"stats":[["230만 명","진행 상황을 옮긴 플레이어"],["165만 명","새로 가입한 플레이어"],["540만 명","복귀한 휴면 유저"]],"results":["230만 명이 진행 상황을 옮겼고, 165만 명이 새로 가입했으며, 휴면 유저 540만 명이 돌아왔음. 게임 유튜버와 커뮤니티가 '게임 업계 최초'라며 앞다퉈 소개함. 이번 칸에서 엔터테인먼트 포 게이밍 그랑프리를 받음."],"analysis":["유저가 넘어오지 않는 진짜 이유는 '쌓아온 게 아까워서'였음. 그 이유를 정확히 찾아 없애줬기 때문에, 광고 메시지가 아니라 장벽 제거가 행동을 바꿨음.","짝퉁 게임의 존재 자체가 '이런 게임을 좋아하는 사람이 이만큼 많다'는 증거였음. 화내며 공격하지 않고 '환영한다'며 여유 있게 받아친 원조의 자신감이 호응을 얻었음."],"films":[{"kind":"메인 필름","title":"So Many Copycats. Only One Clash Royale. (70초)","url":"https://www.youtube.com/watch?v=dmxNEXN0_i4"}],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["클래시 로얄은 지난 10년간 최고의 게임 중 하나다. 그러니 당연히 짝퉁도 많았다. 사커 로얄, 킹 로얄, 러시 로얄. 이름도, 게임 방식도, 캐릭터까지 베꼈다.","게임 유튜버들이 말한다. '요즘 뜨는 짝퉁 붐 아레나.' '축구 버전 클래시 로얄인데 왜 안 고소당하지?'","짝퉁들이 원조를 앞지르기 시작했다. 뭔가 해야 했다. 그들이 우리 게임을 훔쳤다면, 우리는 그들의 플레이어를 훔치면 어떨까? Copycats Welcome.","먼저 짝퉁 게임의 레딧 커뮤니티에 짝퉁을 저격하는 필름을 뿌렸다. 그리고 거부할 수 없는 제안을 했다. 가짜 게임은 떠나되, 쌓은 건 가져가라.","전용 사이트에서 짝퉁 게임의 기록과 재화를 클래시 로얄 재화로 바꾼다. 유튜버들의 반응. '레벨, 플레이 시간, 재화까지 전부 옮겨준다.' '이건 게임 업계 최초다.' '그 짝퉁 지금 바로 지운다.'","게임을 훔칠 생각이라면 기억해라. 그들이 당신의 플레이어를 훔쳐갈 수도 있다."]},{"h":"메인 필름: So Many Copycats. Only One Clash Royale. (약 1분 10초)","p":["바바리안과 아처가 포털에 빨려 들어가 낯선 게임 세계에 떨어진다.","'이게 뭐야, 짝퉁 클래시 로얄이잖아.' 가짜 마녀, 가짜 고블린, 심지어 자기와 똑같이 생긴 '가짜 나'까지 마주친다.","짝퉁 캐릭터들은 어설프게 움직이고, 화면 곳곳에 광고가 덕지덕지 붙은 '스페이스 로얄' 같은 세계도 나온다. '깨진 거울을 보는 것 같네.'","'집에 갈 시간이야.' 진짜 아레나로 돌아오는데, 짝퉁 캐릭터들이 '데려가 줘' 하며 따라온다. '탓할 수 있겠어? 적어도 전리품은 챙겨왔네.' 짝퉁 게임에서 쌓은 걸 들고 넘어오라는 캠페인 메시지 그대로의 결말이다."]}],"sources":[["Contagious (게이밍 수상)","https://www.contagious.com/article/cannes-lions-2026-entertainment-lions-for-gaming-winners-cea58c7caded4e309ecef1e23c25e39d"],["LBB Online","https://lbbonline.com/news/DAVID-New-York-Copycat-Games-Clash-Royale"],["Variety (엔터테인먼트 수상)","https://au.variety.com/2026/biz/news/cannes-lions-entertainment-adidas-oasis-original-forever-38053/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"berghain","tier":"grand-prix","title":"Berghain","brand":"ROSALÍA (feat. Björk & Yves Tumor)","agency":"CANADA, Barcelona","country":"스페인","cat":"Entertainment for Music","awards":["엔터테인먼트 포 뮤직 그랑프리"],"video":"https://www.youtube.com/watch?v=htQBS2Ikz6c","videoKind":"뮤직비디오","ko":"다리미질, 버스 타기 같은 평범한 일상 속에 오케스트라와 합창단이 따라다니는 로살리아의 뮤직비디오. 광고가 아닌 뮤직비디오 자체가 그랑프리를 받음","bg":["로살리아의 네 번째 정규 앨범 〈LUX〉의 첫 싱글. 비요크와 이브 튜머가 참여했고, 스페인어·영어·독일어 세 언어로 부른 곡.","광고가 아닌 뮤직비디오로, 새 앨범이 어떤 세계인지 처음 보여주는 역할을 맡았음."],"solIntro":["실연의 아픔을 겪는 한 여성이 영성을 통해 위로와 치유를 찾아가는 이야기. 집에 돌아오기, 병원 진료, 버스 타기 같은 지극히 평범한 장면들이 교향악단과 합창단이 등장하는 음악적 무대로 바뀌는 구성."],"sol":["연출은 바르셀로나 제작사 CANADA의 공동 창업자 니콜라스 멘데스. 크리에이티브 디렉션은 로살리아와 언니 필라르 비야가 맡음","어디를 가든 교향악단이 열정적으로 연주하고 합창단이 로살리아의 노래를 따라다님","12세기 작곡가 힐데가르트 폰 빙엔과 디즈니 아티스트 아이빈드 얼의 어두운 판타지 화풍에서 영감을 받음","흑백에 가까운 꿈같은 영상과 스트로보 효과. 후반부에는 비요크가 새로, 로살리아가 백설공주 차림으로 등장하는 동화 장면이 나옴","폴란드 바르샤바에서 촬영"],"stats":[["4,600만+","유튜브 조회수(2026년 10월 기준)"],["3개","곡에 쓰인 언어"]],"results":["이 부문 그랑프리 두 개 중 하나. 스페인이 이 부문에서 받은 첫 그랑프리이자, 로살리아와 제작사 CANADA 모두에게 첫 칸 그랑프리. 심사위원장은 '눈과 귀를 위한 진짜 성찬'이라고 평가함."],"analysis":["평범한 일상 장면마다 실제 오케스트라를 등장시키는 설정을 끝까지 밀어붙였음. 심사위원장도 '아이디어에 얼마나 깊이 몰입했느냐'가 승부를 갈랐다고 말함.","다리미질이나 버스 같은 평범한 공간에 오케스트라가 끼어드는 충돌이, 실연의 감정이 일상을 집어삼키는 느낌을 그대로 보여줌."],"videoDesc":[{"h":"뮤직비디오 (약 3분 30초)","p":["대사 없이 노래와 연주로만 이어진다. 어두운 실내, 한 여성의 실루엣이 문을 열고 집으로 들어온다.","그녀가 머무는 평범한 공간마다 교향악단 단원들이 빼곡히 들어차 연주한다. 좁은 방 안에서 바이올린과 플루트가 울리고, 합창단이 그녀를 둘러싼다.","시내버스 안에서도 승객 대신 바이올린, 팀파니, 클라리넷 연주자들이 좌석을 채우고 있다. 일상의 이동마저 하나의 공연이 된다.","후반으로 갈수록 동화 같은 분위기로 넘어간다. 나무 그림이 그려진 어두운 방, 정면을 바라보는 사슴. 비요크가 새로, 로살리아가 백설공주 차림으로 등장한다.","마지막은 커피 잔에 각설탕이 떨어지는 클로즈업 같은 일상의 작은 장면."]}],"sources":[["Reason Why","https://www.reasonwhy.es/actualidad/rosalia-canada-grand-prix-entertainment-for-music-cannes-lions-2026"],["Contagious (뮤직 수상)","https://www.contagious.com/en/article/cannes-lions-2026-entertainment-for-music-winners-de1be0c39be547b1babd3085da5e1d87"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/berghain-rosalia-grand-prix-entretenimiento-musical-cannes-lions"]]},
 {"id":"thousand-sponsors-of-muni","tier":"grand-prix","title":"The Thousand Sponsors of Muni","brand":"Club Deportivo Municipal","agency":"McCann Lima","country":"페루","cat":"Entertainment for Sport","awards":["엔터테인먼트 포 스포츠 그랑프리"],"video":"https://www.youtube.com/watch?v=dYbbeA2rn9c","ko":"메인 스폰서를 잃고 몰락한 페루 축구팀이, 유니폼을 1,000칸으로 나눠 팬이 운영하는 동네 가게 1,000곳을 스폰서로 모은 캠페인","bg":["페루의 전통 클럽 데포르티보 무니시팔은 빚 때문에 1부에서 3부, 끝내 아마추어 리그까지 추락했고, 메인 스폰서도 잃었음.","잃지 않은 건 팬들의 열정. 과제는 이 열정을 실제 재정 지원으로 바꾸는 것."],"solIntro":["큰 스폰서 하나 대신 작은 스폰서 1,000곳을 모으기로 했음. 유니폼 원단 무늬를 1,000개의 작은 칸으로 다시 디자인하고, 칸 하나하나를 팬이 운영하는 동네 가게에 판매함. 팬덤의 상당수가 동네 상인이라는 점에 착안한 것."],"sol":["한 칸 가격은 200솔(약 60달러). 이발소, 빵집, 철물점, 식당 같은 동네 가게와 개인 팬, 기업까지 참여","새 스폰서가 생길 때마다 클럽이 하나씩 소개","스폰서는 단순 노출이 아니라 실제 혜택을 받음. 클럽 공식 굿즈 판매처가 되고, 팬 커뮤니티에서 '인증된 서포터'로 인정받고, 선수들을 가게 홍보에 무료로 활용할 수 있음","기존 기록(우루과이 클럽의 유니폼 스폰서 142곳)을 크게 넘어섬"],"stats":[["1,000곳","유니폼 스폰서"],["6만 달러","약 3개월간 모은 금액(클럽 기록)"],["1,050만","도달(reach)"]],"results":["유니폼 스폰서 1,000곳을 모아 약 3개월 만에 6만 달러를 마련했고, 이 돈은 밀린 선수 급여, 유소년팀, 여자팀 등 가장 급한 곳에 쓰였음. 여러 나라 언론이 '1,000개 로고 유니폼'을 보도함. 이번 칸에서 엔터테인먼트 포 스포츠 그랑프리를 받음."],"analysis":["몰락한 클럽에 큰 스폰서는 다시 오지 않지만, 팬은 남아 있었음. 스폰서십을 팬이 감당할 수 있는 크기로 쪼개, 열정을 실제 돈으로 바꿨음.","스폰서에게 굿즈 판매권, 선수 홍보 같은 실질적 이익을 줘서 기부가 아니라 서로 이득인 거래로 만들었음. 1,000개 로고로 뒤덮인 유니폼은 그 자체로 뉴스가 됐음."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["1935년 창단해 수백만 명의 사랑을 받는 페루 축구 클럽 데포르티보 무니시팔. 영광스러운 역사에도 지금은 3부 리그에서 뛴다.","추락은 클럽의 모든 것을 앗아갔다. 그중 가장 치명적인 건 메인 스폰서를 잃은 것이다. 하지만 무니가 한 번도 잃지 않은 것이 있다. 팬들의 열정.","그 열정을 어떻게 진짜 지속 가능한 재정 지원으로 바꿀까? '무니의 천 개의 스폰서.' 팬이 운영하는 작은 가게 1,000곳이 소액 후원으로 함께 팀을 지원하는 스폰서십 플랫폼이다.","유니폼을 1,000개의 작은 칸으로 다시 디자인했다. 동네 식당, 양조장 사장님들이 SNS에 묻는다. '우리 가게는 어디서 신청하면 돼요?'","스폰서가 받는 혜택. 공식 굿즈 판매처 지정, 팬 커뮤니티의 인증 서포터, 선수들을 가게 홍보에 무료로 쓸 권리.","스폰서 1,000곳, 도달 1,050만. 로고로 빼곡한 유니폼. 열정이 집단 행동이 되면 무엇이든 해낼 수 있다."]}],"sources":[["Ámbito (클럽 상황·성과)","https://www.ambito.com/deportes/la-insolita-estrategia-un-club-peruano-que-descendio-3-veces-seguidas-una-camiseta-1000-sponsors-n6306476"],["Contagious (스포츠 수상)","https://www.contagious.com/article/cannes-lions-2026-entertainment-for-sport-winners-415705a1ba17464e903926d923808e28"],["Vistazo","https://www.vistazo.com/deportes/2026-07-28-deportivo-municipal-lleno-camiseta-1-000-patrocinadores-superar-crisis-economica-GC11133371"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"your-way-out","tier":"grand-prix","title":"Your Way Out","brand":"Coinbase","agency":"Isle of Any, New York","country":"영국 / 미국","cat":"Film Craft","awards":["필름 크래프트 그랑프리"],"video":"https://www.youtube.com/watch?v=spmjIn5NaV0","videoKind":"케이스 영상","ko":"정해진 대로만 움직이던 비디오게임 속 NPC가 규칙을 깨고 게임 밖 현실 세계로 탈출하는 코인베이스 광고. AI나 CG 없이 실제 세트와 분장으로 게임 화면을 재현함","bg":["코인베이스는 미국 최대 암호화폐 거래소. 하지만 암호화폐를 최근 1년 안에 써본 미국 성인은 13%로 제자리였고, 2022년 슈퍼볼에 6곳 넘게 광고하던 암호화폐 기업들도 대부분 광고판에서 사라졌음. 사람들에게 암호화폐는 여전히 투기이거나 남의 이야기였음.","코인베이스는 '이제 시스템을 업데이트할 때'라며, 느리고 낡은 기존 금융 시스템의 대안이 암호화폐라고 말해 왔음. 과제는 이 메시지를 아카데미 시상식이라는 큰 무대에서 사람들이 감정적으로 받아들이게 만드는 것."],"solIntro":["기존 금융 시스템 안에서 정해진 대로 사는 사람을 비디오게임 속 NPC(플레이어가 조종하지 않고 정해진 행동만 반복하는 캐릭터)에 빗댔음. 그 NPC가 스스로 규칙을 깨고 게임 밖으로 탈출하는 이야기로 '코인베이스가 당신의 탈출구'라고 말함."],"sol":["연출은 오스카 허드슨(MJZ). AI도 VFX도 쓰지 않고, 게임 같은 화면을 카메라로 직접 찍어 만들었음","길이 80m짜리 세트 두 개를 짓고, 저해상도 이미지를 세트와 의상에 입히고, 얼굴에는 픽셀처럼 보이는 마스크와 분장을 씌움. 배우들은 게임 캐릭터의 뻣뻣한 움직임을 안무로 연습","이야기가 진행될수록 화면이 게임에서 실제 세계로 서서히 바뀜. 주인공이 삶의 통제권을 되찾는 과정을 화면의 질감으로 보여줌","음악은 'I Gotta Be Me'의 웅장한 편곡 버전"],"stats":[["필름 크래프트 GP","칸 라이언즈 2026"],["블랙 펜슬","D&AD 2026"],["80m × 2","직접 지은 세트"]],"results":["아카데미 시상식 중계로 처음 공개됨. 이번 칸에서 필름 크래프트 그랑프리를 받았고, D&AD 최고상인 블랙 펜슬도 받음."],"analysis":["'기존 금융 시스템에 묶여 있다'는 추상적인 말을, 정해진 길만 걷는 게임 캐릭터라는 한눈에 이해되는 이미지로 바꿨음.","형식이 곧 메시지. 화면이 게임에서 현실로 바뀌는 것 자체가 '시스템에서 벗어나 내 삶의 주인이 된다'는 이야기이고, 이걸 AI 없이 손으로 지은 세트로 찍어 묘하게 살아 있는 느낌을 만든 점이 크래프트 부문에서 평가받았음."],"films":[{"kind":"메인 필름","title":"Your Way Out | Extended Cut (2분 9초)","url":"https://www.youtube.com/watch?v=HQJMzTpckPo"},{"kind":"메인 필름","title":"Your Way Out (60초)","url":"https://www.youtube.com/watch?v=0V4CCxskN_0"}],"videoDesc":[{"h":"케이스 영상 (약 1분)","p":["광고 본편 장면과 촬영 현장 모습이 섞여 있다.","정장을 입은 주인공이 게임 화면처럼 보이는 거리를 걷는다. ATM, 간판, 행인 모두 게임 그래픽처럼 보이지만, 실제로 지은 세트와 사람이다.","주인공이 정해진 길을 벗어나 고가도로 위를 달린다. 카메라가 뒤로 빠지면, 사막 언덕을 달리는 배우와 그 모습을 지켜보는 촬영 스태프가 보인다.","'좋아, 컷. 꽤 괜찮았어.' 게임처럼 보였던 장면이 전부 실제 촬영이었다."]},{"h":"메인 필름: Extended Cut (약 2분)","p":["게임 속 도시. 주인공은 다른 캐릭터들처럼 정해진 길을 따라 걷고, 머리 위에는 갈 방향을 알려주는 화살표가 떠 있다. 누군가 핀잔을 준다. '빨리 좀 가, 굼벵이.'","관리자 캐릭터가 게임 대화창으로 묻는다. '환영합니다, 플레이어 3984. 줄을 서시겠습니까?' 주인공은 시스템 속 번호 하나일 뿐이다.","주인공이 정해진 동선을 벗어나 춤추듯 움직이기 시작한다. '잘못된 방향' 경고와 함께 화살표가 그를 쫓아온다. 관리자가 경고한다. '플레이어 3984, 최근 행동은 절대 용납할 수 없습니다.'","주인공은 멈추지 않고 달려 나간다. 장면이 바뀔수록 게임 그래픽 같던 화면이 점점 햇빛 비치는 실제 도시 풍경으로 변한다.","푸른 화면 위로 문구가 뜬다. '그들의 시스템에서 벗어나는 당신의 탈출구(Your way out of their system).'"]}],"sources":[["Adweek","https://www.adweek.com/creativity/coinbases-oscars-ad-turns-a-video-game-npc-into-a-financial-rebel/"],["Creative Review","https://www.creativereview.co.uk/coinbase-oscars-ad-oscar-hudson-isle-of-any/"],["CJC (제작 과정)","https://cjc.org.za/2026/08/03/crafting-a-cannes-winner-the-human-way/"],["Reason Why (필름 크래프트 수상)","https://www.reasonwhy.es/actualidad/anuncios-mejor-hechos-film-craft-cannes-lions-2026"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/your-way-out"]]},
 {"id":"a-time-and-a-place","tier":"grand-prix","title":"A Time and a Place","brand":"Claude (Anthropic)","agency":"Mother London","country":"영국 / 미국","cat":"Film","awards":["필름 그랑프리"],"video":"https://www.youtube.com/watch?v=X4i0k68wOGU","videoKind":"케이스 영상","ko":"AI 챗봇에 광고가 들어오면 어떻게 될까? 진지한 상담 도중 갑자기 광고를 늘어놓는 'AI'를 사람이 연기해 보여준 클로드의 슈퍼볼 캠페인. 'Can I Get a Six Pack Quickly?'와 'How Can I Communicate Better With My Mom?' 두 편이 필름 그랑프리를 받음","bg":["2026년 1월 오픈AI가 챗GPT에 광고를 도입하겠다고 발표했음. 반면 앤트로픽은 클로드에 광고를 넣지 않겠다고 선언함.","클로드는 일반 소비자 사이에서 존재감이 약했음. 챗GPT의 주간 이용자가 9억 명에 가까웠던 반면, 클로드의 월간 이용자는 약 3,000만 명."],"solIntro":["가장 큰 광고 무대인 슈퍼볼에서 '광고에 반대하는' 광고를 냈음. 경쟁사를 직접 공격하지 않고, AI가 대화 중에 광고를 끼워 넣으면 어떤 장면이 펼쳐지는지를 우스꽝스럽게 보여줬음. 캠페인 이름 'A Time and a Place'는 광고에도 때와 장소가 있다는 뜻."],"sol":["AI 챗봇을 사람 배우가 연기하는 설정. 'AI'가 친절하게 상담해 주다가 대화 흐름을 타고 광고를 끼워 넣음","식스팩 편: 트레이너 역의 AI가 운동 계획을 짜준다며 키와 몸무게를 묻고는, 키가 작은 남성에게 키높이 깔창 광고를 읊음","엄마 편: 상담사 역의 AI가 대화법을 조언하다가 연상 여성 데이트 사이트를 권함","모든 편이 같은 문구로 끝남. '광고는 AI에 들어온다. 하지만 클로드에는 아니다.' 식스팩 편은 슈퍼볼 1쿼터, 엄마 편은 킥오프 직전에 방송됨"],"stats":[["+305%","일일 가입자 증가"],["15% → 28%","AI 분야 화제 점유율"],["2,127건","전 세계 언론 보도"],["+11%","슈퍼볼 이후 일간 이용자 증가(BNP 파리바 데이터)"]],"results":["언론 보도 2,127건, AI 분야 화제 점유율이 15%에서 28%로 늘었고, 일일 가입자는 305% 증가함. 클로드 앱은 앱스토어 무료 앱 상위 10위에 들었음. 샘 올트먼 오픈AI CEO가 '재밌지만 부정직하다'고 공개 반박하면서 화제가 더 커졌음. 이번 칸에서 필름 그랑프리를 받음."],"analysis":["'광고가 없다'는 건 눈에 보이지 않는 장점이라 설명하기 어려움. 그래서 광고가 있을 때의 불쾌한 순간을 먼저 겪게 해서 그 장점을 체감하게 만들었음.","AI를 사람이 연기하게 한 게 핵심. 다정하게 공감하던 상대가 갑자기 영업을 시작하는 배신감은 사람 얼굴일 때 훨씬 크게 와닿고, 경쟁사가 광고 도입을 발표한 직후라는 타이밍이 그 메시지에 힘을 실었음."],"films":[{"kind":"메인 필름","title":"Can I Get a Six Pack Quickly? (60초)","url":"https://www.youtube.com/watch?v=NuEXYfbV_PA"},{"kind":"메인 필름","title":"How Can I Communicate Better With My Mom? (60초)","url":"https://www.youtube.com/watch?v=8ZnGqg87FEo"},{"kind":"다른 편 · 한글 자막","title":"A Time and a Place (60초)","url":"https://www.youtube.com/watch?v=bMatObaCUNg"}],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["'오픈AI, 챗GPT에 광고 도입.' 뉴스가 나오고, AI가 광고로 돈을 벌면 우리에게 무엇을 팔지 걱정하는 사람들의 SNS 영상이 이어진다.","앤트로픽은 AI가 생각의 파트너가 되어야 한다고 믿는다. 당신의 생각을 가장 높은 값을 부르는 사람에게 파는 존재가 아니라. 앤트로픽은 클로드에 광고를 넣지 않기로 했다.","그래서 광고계의 가장 큰 무대에서 광고에 반대하는 입장을 내기로 했다. 슈퍼볼. 운동장의 트레이너, 식당에서 마주 앉은 여성, 교수 차림의 남성이 'AI'로 등장한다.","반응이 쏟아졌다. 기사 767개, 노출 28억. 뉴스, 팟캐스트, 유튜버 영상이 화면을 채운다. 슈퍼볼 직후 미국 구글 검색 관심도에서 클로드가 하프타임 공연자 배드 버니를 앞섰다. 사람들은 클로드로 갈아탔고, 클로드는 앱스토어 상위권에 올랐다.","눈에 띄지 않던 도전자에서, 세계에서 가장 많이 회자되는 브랜드 중 하나로. 언론 보도 2,127건, 언론 노출 도달 83억, 화제 점유율 15%→28%, 일일 가입자 305% 증가. Keep thinking."]},{"h":"메인 필름: Can I Get a Six Pack Quickly? (약 1분)","p":["야외 운동장 철봉 앞. 마른 체형의 젊은 남성이 근육질 트레이너에게 묻는다. '식스팩 빨리 만들 수 있을까요?' 트레이너가 AI 역할이다.","'명확하고 달성 가능한 목표네요. 맞춤 운동 계획을 짜드릴까요?' 트레이너가 나이, 키, 몸무게를 묻고, 남성이 답한다. 키 170cm(5피트 7인치), 23살, 63kg(140파운드). '좋아요, 몸매를 위한 근력 운동 위주로 짜볼게요.'","그러다 갑자기 말투가 광고 성우처럼 바뀐다. '하지만 자신감은 헬스장에서만 만들어지는 게 아니죠.' 키를 1인치 높여주는 깔창 '스텝 부스트 맥스'. 키 작은 남자들도 당당하게 서게 해준다며 할인 코드까지 불러준다.","'뭐라고요?' 남성은 어리둥절하다. 광고는 AI에 들어온다. 하지만 클로드에는 아니다. Keep thinking."]},{"h":"메인 필름: How Can I Communicate Better With My Mom? (약 1분)","p":["거실 소파에 앉은 남성이 묻는다. '엄마와 더 잘 소통하려면 어떻게 해야 할까요?' 상담사처럼 보이는 여성이 AI 역할로 답한다.","먼저 들어주세요. 말 뒤에 숨은 마음을 들으세요. 공감대에서 대화를 시작하고, 산책 같은 활동을 함께 해보세요. 여기까지는 그럴듯한 상담이다.","'관계를 회복할 수 없다면' 연상 여성과의 만남을 주선하는 데이트 사이트 '골든 인카운터스'를 써보라고 권한다. 남성이 당황하자 그녀가 웃으며 묻는다. '프로필을 만들어 드릴까요?' 광고는 AI에 들어온다. 하지만 클로드에는 아니다."]}],"sources":[["Adweek (칸 수상)","https://www.adweek.com/?p=1950749"],["Adweek (슈퍼볼 캠페인 공개)","https://www.adweek.com/brand-marketing/anthropic-makes-super-bowl-debut-promising-ad-free-ai/"],["CB News (심사평)","https://www.cbnews.fr/node/102027"],["Decrypt (광고 배경·이용자 수)","https://decrypt.co/356946/anthropic-trolls-openai-chatgpt-super-bowl-campaign"],["eMarketer (이용자 증가)","https://www.emarketer.com/content/claude-users-grow-11--on-back-of-super-bowl-spot-anthropic-rides-wave-of-anti-ai-ads-sentiment"]]},
 {"id":"nigrum-corpus","tier":"grand-prix","title":"Nigrum Corpus","brand":"IDOMED & Instituto Yduqs","agency":"Artplan, São Paulo","country":"브라질","cat":"Glass: The Lion for Change","awards":["글래스 그랑프리 (2026)","인더스트리 크래프트 그랑프리 (2025)"],"video":"https://www.youtube.com/watch?v=yaFd09v6elM","ko":"브라질 의료계의 인종차별을 '질병'처럼 분류한 가상의 의학 교과서. 실제 흑인 환자들의 증언을 바탕으로 20여 개의 '병'을 만들어 의대에 배포함","bg":["브라질은 인구의 절반 이상이 흑인 또는 혼혈이지만 의사 중 흑인은 3%뿐. 흑인 환자는 진료 시간이 47% 짧고, 진단부터 수술까지 6.7일이 더 걸림.","이런 편견은 의학 교육에서부터 시작됨. 의학 교과서 이미지 중 흑인 환자는 4.5%뿐이었음. 브라질 전역에서 의대를 운영하는 교육 그룹 IDOMED에게는 자기 교육 현장의 문제이기도 했음."],"solIntro":["의사들에게 가장 익숙한 형식, 의학 교과서를 빌렸음. 인종차별을 의료계에 퍼진 '질병'으로 보고, 실제 흑인 환자들의 증언을 바탕으로 20여 개의 가상 질환을 만들어 진단서처럼 정리한 책 『Nigrum Corpus』를 만들었음. 라틴어로 '흑인의 몸'이라는 뜻."],"sol":["질환마다 라틴어 의학 용어 같은 이름을 붙임. '비시오 알바 셀렉티바'는 흰 피부만 보이는 임상적 색맹, '니그룸 코르푸스 레옉툼'은 장기 이식에서 흑인이 뒤로 밀려나는 현상","고전 해부학 도감을 참고한 일러스트에 꽃무늬를 섞어 흑인의 몸을 존엄하게 표현","흑인 교수 채용 확대, 인종 다양성을 반영한 임상 시뮬레이터 같은 개선책도 제안","단편영화 〈Corpo Preto(검은 몸)〉도 함께 제작. 환자를 화면에서 흐릿하게 처리해 '보이지 않는 존재'가 된 현실을 표현","책은 브라질 전역의 의대에 무료로 배포"],"stats":[["9,000명+","책을 받은 의대생"],["10개 주+","배포된 브라질 주"],["20여 개","책에 담긴 가상 질환"]],"results":["책은 브라질 10개 주 이상에서 9,000명이 넘는 의대생에게 전달됐고, 보건부 장관에게도 전달됨. 2025년 칸 인더스트리 크래프트 그랑프리에 이어 2026년 글래스 그랑프리를 받음."],"analysis":["편견이 의학 교육에서 시작된다면, 해법도 의학 교육 안에 있어야 함. 인종차별을 '사회 문제'로 말하면 의사들은 자기 일이 아니라고 느끼지만, 교과서 속 '질병'으로 분류하면 진단하고 치료해야 할 대상이 됨.","캠페인으로 끝나지 않고 의대에서 실제로 쓰이는 교재가 되어, 미래의 의사들에게 직접 닿는 구조라는 점이 글래스 부문에서 평가받았음."],"films":[{"kind":"메인 필름","title":"Black Body (Corpo Preto) 영어판 단편영화 (5분 33초)","url":"https://www.youtube.com/watch?v=1bKI5ji5DSE"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["흑백 화면 속 젊은 여성이 증언한다. '의사들이 할머니를 제대로 진단하지 않았어요.' 실제 흑인 환자 가족의 이야기다.","흑인 환자가 받는 차별을 보여주는 통계 카드들이 화면을 채운다. 진료 시간은 47% 짧다. 이 숫자는 브라질의 것이지만, 다른 나라도 크게 다르지 않을 것이다.","이 현실을 바꾸려면 모든 것이 시작되는 곳을 바꿔야 한다. 그래서 의대가 여전히 가르치지 않는 것, 흑인의 몸을 어떻게 진료해야 하는지에 관한 연구서를 만들었다. 의료 데이터와 실제 증언을 임상 형식으로 바꿨다.","책 속의 질환들. 흰 피부만 보이는 임상적 색맹 '비시오 알바 셀렉티바'. 백인의 몸이 유일한 진단 기준이 되는 '모르부스 알부스 디아그노스티카'(의학 교과서 이미지 중 흑인 환자는 4.5%뿐이다). 장기 이식에서 흑인이 뒤로 밀려나는 '니그룸 코르푸스 레옉툼'. 모두 20개가 넘는다.","피부색에 따라 진단 징후가 어떻게 달라 보이는지 비교하는 페이지, 해부학 그림과 꽃무늬를 섞은 일러스트가 이어진다.","책은 브라질 전역의 대학에 제공되어 미래 의사들의 인종 문해력 도구가 됐다. 의대생들이 책을 읽고, 보건부 장관이 책을 들고 말한다. 의료 현장에 남아 있는 제도적 인종차별과 싸워야 한다고."]},{"h":"메인 필름: Black Body (약 5분 30초)","p":["대사가 거의 없는 단편영화다. 집에서 한 흑인 남성이 트럼펫을 연주한다.","몸이 좋지 않아 병원을 찾지만, 그는 텅 빈 대기실에서 하염없이 기다리고 진료실에서도 관심을 받지 못한다. 카메라는 그를 계속 흐릿하게 비춘다. 의료진의 눈에 그는 보이지 않는다.","집으로 돌아온 그는 쓰러지고, 다시 병원에 실려 가 어두운 병실 침대에 눕는다. 증상이 제대로 다뤄지지 않은 채 상태는 나빠진다.","흑인에게 의료 과실이 더 자주 일어난다. 흑인이 순환기 질환을 더 많이 앓지만, 장기 이식은 백인이 더 많이 받는다. Med.Diversity, 포용적인 의학을 위해."]}],"sources":[["Propmark (글래스 GP)","https://propmark.com.br/cannes/2026/glass/nigrum-corpus-da-artplan-para-idomed-e-instituto-yduqs-recebe-grand-prix-de-glass/"],["The Stable (캠페인 공개·통계)","https://www.thestable.com.au/artplan-a-short-film-a-book-intend-to-train-out-racial-bias-in-medical-practice/"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/nigrum-corpus"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/categoria-glass-cannes-lions-2026-campanas-ganadoras"],["Artplan 크리에이티브 디렉터 포트폴리오 (배포 수치)","https://pedrorosas.cargo.site/Black-Body"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"tiny-coffee-shops","tier":"grand-prix","title":"Tiny Coffee Shops","brand":"De'Longhi","agency":"LOLA, Madrid","country":"스페인 / 이탈리아","cat":"Industry Craft","awards":["인더스트리 크래프트 그랑프리","아웃도어 골드"],"video":"https://www.youtube.com/watch?v=4C0kHoyBIpE","ko":"드롱기 전자동 커피머신 다섯 대를 밀라노·도쿄·파리·코펜하겐·베를린의 카페를 본뜬 미니어처 건물로 감싼 캠페인. '최고의 커피는 카페에 있다'는 생각을 깨려 함","bg":["커피의 80% 이상은 집에서 마시지만, 72%의 사람들은 '가장 맛있는 커피'는 카페에서만 마실 수 있다고 믿었음.","전자동 커피머신을 파는 드롱기에게는 이 인식이 판매의 장벽. 기능을 아무리 설명해도 '진짜 커피'는 카페의 것이었음."],"solIntro":["카페를 집 안으로 옮겨왔음. 드롱기 전자동 커피머신 다섯 대를 각 도시의 카페를 본뜬 미니어처 건물로 감싸, 실제로 작동하는 '세상에서 가장 작은 카페'로 만들었음. '이 기계가 곧 카페'라는 말을 물건으로 보여준 것."],"sol":["파리, 도쿄, 베를린, 밀라노, 코펜하겐의 카페를 각각 다른 드롱기 모델에 입힘","웨스 앤더슨 영화의 미니어처를 만든 베를린의 모형 장인 시몬 바이세가 제작","400개가 넘는 부품을 손으로 만들었고, 커피머신이 그대로 작동함. 작은 창문으로 기계 화면이 보이고, 지붕을 열어 물을 채움","인플루언서 배송으로 시작해 디지털, 매장, 도쿄 팝업 '가장 작은 카페', 밀라노 디자인 위크 전시로 확장"],"stats":[["680만","노출"],["6년 만의 최고치","검색량"],["약 3,500명","도쿄 팝업 방문객"]],"results":["680만 노출을 기록했고, 브랜드 검색량은 6년 만에 최고치를 찍음. 도쿄 팝업에는 사흘간 약 3,500명이 다녀감. 이번 칸에서 인더스트리 크래프트 그랑프리를 받음."],"analysis":["커피 맛은 광고로 전달하기 어렵지만, 커피머신이 카페 건물이 되는 모습은 한눈에 '집에서도 카페 커피'라는 메시지를 전함. '진짜 커피는 카페에 있다'는 믿음에 정면으로 답한 것.","영화 미니어처 장인이 만든 건물이 실제로 커피를 내린다는 놀라움이 공유될 이유가 됐고, 그 정교함 자체가 제품의 품질을 증명하는 장치가 됐음."],"videoDesc":[{"h":"케이스 영상 (약 1분 55초)","p":["유명 카페 앞에 사람들이 줄을 서 있다. 그런데 카메라가 빠지면, 이 거리 전체가 정교한 미니어처다. 맛있는 커피에는 끝없는 줄이 따라온다. 그런데 똑같이 좋은 커피를 집에서 마실 수 있다면?","그래서 가장 상징적인 기계 다섯 대를 여러 도시에서 영감을 받은 미니어처 카페로 바꿨다. 커피머신을 감싼 건물들이 하나씩 나온다.","웨스 앤더슨 영화의 미니어처를 만든 시몬 바이세가 작업실에서 말한다. 실제로 작동하는 커피머신을 품은 미니어처를 만들어야 했다고. 모두 400개가 넘는 부품이 들어간 제작 과정이 단계별로 이어진다.","완성된 카페 머신들이 거리 행사와 인플루언서들에게 보내진다. 상자를 연 사람들이 놀란다. '이 카페 정말 작다.' 바이세가 가장 좋아하는 숨은 디테일은 가게 안의 미니어처 커피머신이다.","노출 680만, 6년 만의 최고 검색량. 이렇게 드롱기의 베스트셀러 기계 다섯 대가 세계 최고 커피의 예술적 상징이 됐다."]}],"sources":[["Contagious (인더스트리 크래프트 수상)","https://www.contagious.com/article/cannes-lions-2026-industry-craft-winners-7b983b0a90b241e6a7886be856201f94"],["드롱기 재팬 보도자료 (수상·도쿄 팝업)","https://eu-assets.contentstack.com/v3/assets/blt2252ade9ce4d4191/bltf7efb79fe021eca1/6a4dc9bd541f2adf3b9418ef/%E5%85%AC%E5%BC%8FHP%E7%94%A8%E3%80%90De_Longhi%EF%BD%9CPRESS_RELEASE%E3%80%91%E3%82%AB%E3%83%B3%E3%83%8C%E3%83%A9%E3%82%A4%E3%82%AA%E3%83%B3%E3%82%BA2026%E3%81%A7W%E5%8F%97%E8%B3%9E%E3%80%8CTiny_Coffee_Shops%E3%80%8D.pdf"],["llllitl (배경 수치·제작)","https://www.llllitl.fr/2026/07/delonghi-tiny-coffee-shops/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"supernova-adaptive","tier":"grand-prix","title":"Supernova Adaptive","brand":"adidas","agency":"TBWA\\Canada, Toronto","country":"캐나다 / 독일","cat":"Innovation","awards":["이노베이션 그랑프리"],"video":"https://www.youtube.com/watch?v=JFJtYyt8DO0","ko":"다운증후군 선수들과 함께 3년간 개발한 아디다스의 첫 퍼포먼스 러닝화. 발볼은 넓고 뒤꿈치는 좁은 발에 맞춰 신발 자체를 새로 설계함","bg":["다운증후군이 있는 사람들은 발볼이 넓고 뒤꿈치가 좁은 경우가 많아, 66%가 발에 맞는 신발을 찾지 못했음. 전 세계 약 600만 명에게 맞는 러닝화가 없었던 셈.","출발점은 아디다스 후원 선수 크리스 니키치. 다운증후군이 있는 사람 최초로 철인 3종을 완주했지만, 맞지 않는 신발 때문에 물집과 통증에 시달렸음."],"solIntro":["광고가 아니라 제품으로 답했음. 다운증후군 선수들과 함께 그들의 발에 맞는 러닝화를 처음부터 공동 개발한 '슈퍼노바 어댑티브'."],"sol":["3년에 걸쳐 선수, 보호자, 다양한 장애를 가진 사람들과 함께 개발하고 수백 마일의 착용 테스트를 거침","넓은 앞코와 좁은 뒤꿈치에 맞춘 핏. 뒤꿈치가 빠지지 않고 발가락 공간은 넉넉하게","자석으로 여닫는 고리와 쉽게 발을 넣는 구조로, 손 움직임이 불편한 사람도 혼자 신을 수 있게 함","2026년 3월 21일 세계 다운증후군의 날에 29개국 출시"],"stats":[["66%","맞는 신발을 찾기 어렵다는 다운증후군 당사자 비율"],["3년","공동 개발 기간"],["29개국","출시 국가"]],"results":["세계 다운증후군의 날에 29개국에서 정식 출시됨. 이번 칸에서 이노베이션 그랑프리를 받음."],"analysis":["문제가 '맞는 신발이 없다'였기에, 메시지가 아니라 실제로 맞는 신발로 답했음. 아이디어를 실제로 팔리는 제품으로 만들었다는 점이 이노베이션 부문에서 결정적.","크리스 니키치라는 한 선수의 구체적인 고통에서 출발해 당사자들과 함께 만들었다는 과정이, 포용을 말이 아닌 설계로 증명함."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["신발 브랜드들은 운동화를 완벽하게 만드는 데 수십억 달러를 쏟아부었다. 하지만 그 어떤 신발도 당신 발에 맞지 않는다면?","잘 알려지지 않았지만, 다운증후군이 있는 사람들은 유전적인 발 이상을 겪는다. '앞쪽은 넓고 뒤꿈치는 아주 좁아요.' 크리스 니키치는 처음 운동을 시작했을 때 물집투성이였고 발가락이 엉망이었다. 크리스가 말한다. '마라톤에서 아파요.'","한 부모가 말한다. '세상 누구도 우리 아이들을 위한 신발을 만들지 않아요.' 아디다스가 답한다. '세계 최대 스포츠 기업 중 하나인 우리가 하지 않으면 누가 하겠습니까?' 뉴스들이 전한다. 아디다스가 다운증후군 선수와 함께 만든 첫 퍼포먼스 러닝화를 내놓았다고.","아디다스 본사 제품팀이 선수들에게 무엇이 필요한지 묻는다. '뒤꿈치가 자꾸 빠져요.' '앞쪽에 공간이 더 필요해요.' 발 본을 뜨고, 수백 마일의 착용 테스트를 거친다.","삶을 바꾸는 5가지 기능. 신발을 처음 신어본 선수들이 기뻐한다. '완벽해요.' '맞아요.' '정말 멋져요.'","더 넓게는 장애를 가진 13억 명을 위한 해법. 29개국 판매. 비에른 굴덴 아디다스 CEO가 말한다. '스포츠는 최고의 것이고, 모든 사람이 누릴 수 있어야 합니다.'"]}],"sources":[["Contagious (이노베이션 수상)","https://www.contagious.com/article/cannes-lions-2026-innovation-winners-5153116714b04761bf530778b823e7f2"],["Propmark (제품 기능)","https://propmark.com.br/cannes/2026/innovation/tbwa-canadense-conquista-gp-de-innovation-com-adidas/"],["LBB Online (그랑프리 목록)","https://lbbonline.com/news/Cannes-Lions-2026-Grand-Prix-Winners-in-Brand-Experience-and-Activation-Business-Transformation-Commerce-Effectiveness-Strategy-Innovation-and-Luxury"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"warmer-together","tier":"grand-prix","title":"Warmer Together","brand":"Moncler","agency":"WeSayHi, Sliema (몰타)","country":"이탈리아 / 몰타","cat":"Luxury","awards":["럭셔리 그랑프리"],"video":"https://www.youtube.com/watch?v=q1X50LAmL7Y","ko":"평생의 친구 알 파치노와 로버트 드 니로를 마주 앉혀, '따뜻함은 옷이 아니라 함께하는 사람에게서 온다'고 말한 몽클레르의 브랜드 캠페인","bg":["몽클레르는 고급 패딩의 대명사. 하지만 2025년 럭셔리 시장이 둔화되면서 몽클레르의 매출도 정체됐음.","'추위를 막는 기능'만으로는 비싼 패딩을 살 이유를 만들기 어려웠음."],"solIntro":["따뜻함을 '추위를 막는 기능'에서 '사람 사이의 연결'로 넓혔음. 그 메시지를 가장 설득력 있게 보여줄 두 사람, 수십 년 우정을 이어온 알 파치노와 로버트 드 니로를 마주 앉혔음. 두 사람이 함께한 첫 패션 캠페인."],"sol":["인물 사진가 플라톤이 뉴욕에서 흑백으로 촬영. 제품보다 두 사람의 우정과 대화에 집중","두 개의 의자를 핵심 장치로 사용. 두 사람이 처음 함께 출연한 영화 〈히트〉(1995)의 식당 장면을 떠올리게 하는 연출","옥외, 인쇄, 디지털, 소셜, 넷플릭스까지 전 세계에 집행","'Lean on Me'를 다시 부른 곡을 캠페인 음악으로 쓰고, 록펠러 센터 라이브 공연으로 마무리"],"stats":[["31억","잠재 도달"],["8,540만","순매출"],["+48%","전년 대비"]],"results":["잠재 도달 31억 회를 기록했고, 매출은 전년 대비 48% 늘었음. 이번 칸 럭셔리 그랑프리. 심사위원장은 '럭셔리 스토리텔링을 사람 사이의 연결이라는 단순한 진실로 되돌려 놓았다'고 평가함."],"analysis":["'따뜻함'이라는 브랜드의 핵심 단어는 그대로 두고 의미를 날씨에서 관계로 넓혀, 비싼 패딩을 살 감정적인 이유를 만들었음.","두 배우의 오랜 우정은 이미 모두가 아는 이야기라, 설명 없이도 '함께하는 따뜻함'이 바로 전달됨. 화려한 제품 컷 대신 흑백 화면과 두 개의 의자만으로 고급스러움을 만들었음."],"films":[{"kind":"메인 필름","title":"Warmer Together with Al Pacino and Robert De Niro (1분 30초)","url":"https://www.youtube.com/watch?v=b00A4DVQYrQ"},{"kind":"메인 필름","title":"Warmer Together | Director's Cut (7분 20초)","url":"https://www.youtube.com/watch?v=TtZ8MLSZLrk"}],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["어두운 무대 위 한 사람의 실루엣. '무슨 일이 일어날지 말해줄게요. 나는 알 파치노이고, 내 아주 좋은 친구 로버트 드 니로를 만날 겁니다.'","의자들이 놓인 텅 빈 무대에서 두 사람이 만나 반갑게 인사한다. '밖은 춥네.' '여긴 따뜻하다.'","뉴욕 스카이라인을 배경으로 옥상에 놓인 두 개의 의자. 따뜻함은 결코 바깥의 것이 아니었다. 언제나 안에서 일어나는 일이었다. 함께 걷고 이야기하는 것, 의자를 끌어와 앉아 수다를 떠는 것, 서로를 아끼는 대화에서 온다.","밤의 도시에 대형 옥외 광고가 걸리고, 웹사이트와 인쇄 광고가 이어진다. 날씨보다도, 따뜻함은 언제나 함께하는 것이다.","록펠러 센터의 라이브 공연, 그리고 언론의 평가. 잠재 도달 31억, 순매출 8,540만, 전년 대비 48% 증가. 옥상 의자에 나란히 앉은 두 사람의 뒷모습."]},{"h":"메인 필름 (약 1분 30초)","p":["흑백 화면에 'Moncler Presents'. 어두운 무대, 의자와 작은 테이블.","두 사람이 만나 인사를 나눈다. '뭐 하고 지내?
