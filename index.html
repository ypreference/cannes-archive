<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>칸 라이언즈 2026 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 고정 등급 탭 + 단일 컬럼 아카이브. 썸네일은 등급 색의 '트로피 플레이트'로 표현 */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15171C; --muted:#5A5F6A; --line:#D9DCE2;
  --accent:#A3262A;
  --gp:#1E2740; --gp-ink:#E3C77A;
  --gold:#A87C24; --silver:#737B86; --bronze:#94532F; --plate-ink:#FFFFFF;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --ink:#E8E9EC; --muted:#9BA1AB; --line:#2A2E36;
  --accent:#E06265; --gp:#26324F; --gp-ink:#E8CD86;
  --gold:#B88A2E; --silver:#7E8792; --bronze:#A3603A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:18px;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
nav.tiers{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tiers a{text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted);display:flex;align-items:center;gap:7px}
nav.tiers a .dot{width:8px;height:8px;border-radius:50%}
nav.tiers a:hover{color:var(--ink);background:var(--bg)}
nav.tiers a[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:40px 80px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* home */
.hero{display:grid;gap:14px;max-width:720px;margin-bottom:40px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.25}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tiertile{text-decoration:none;display:grid;gap:18px;padding:22px;border-radius:6px;color:var(--plate-ink);min-height:180px;align-content:space-between;position:relative;overflow:hidden}
.tiertile h2{font-size:26px;font-weight:900;color:inherit}
.tiertile .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;opacity:.85}
.tiertile .bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.tiertile .bar i{display:block;height:100%;background:currentColor}
.tiertile:hover{filter:brightness(1.08)}
.tiertile.soon{opacity:.55}
.t-gp{background:var(--gp);color:var(--gp-ink)} .t-gold{background:var(--gold)} .t-silver{background:var(--silver)} .t-bronze{background:var(--bronze)}
.note{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;max-width:72ch}

/* tier list */
.listhead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:18px}
.listhead h1{font-size:clamp(28px,4vw,38px);font-weight:900}
.listhead .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px}
.card{text-decoration:none;display:grid;gap:10px;min-width:0}
.card .ttl{font-weight:600;font-size:16px;line-height:1.4}
.card .sub{font-size:13px;color:var(--muted);line-height:1.5}
.card:hover .plate{transform:translateY(-2px)}
.card.pending .ttl{color:var(--muted)}

/* plate (thumbnail) */
.plate{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:5px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--plate-ink);transition:transform .2s}
.plate .cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.plate .mark{font-family:var(--f-display);font-weight:900;font-size:clamp(20px,2.6vw,28px);line-height:1.15;letter-spacing:-.02em;position:relative;z-index:1;max-width:85%}
.plate .play{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.9;z-index:1}
.plate .play::after{content:"";border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.plate .rings{position:absolute;right:-30%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid currentColor;opacity:.16;box-shadow:0 0 0 18px transparent,0 0 0 19px currentColor}
.plate .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.plate.has-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45));z-index:0}
.plate.has-thumb{color:#fff}
.plate.has-thumb .mark,.plate.has-thumb .rings{display:none}
.plate.has-thumb .cat,.plate.has-thumb .play{z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.plate.has-thumb .play{background:rgba(0,0,0,.35)}
.vplay{all:unset;display:block;cursor:pointer;border-radius:5px}
.vplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vlink{display:block;text-decoration:none}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:5px;background:#000;display:block}
.vmeta a{color:inherit}
.p-gp{background:var(--gp);color:var(--gp-ink)} .p-gold{background:var(--gold)} .p-silver{background:var(--silver)} .p-bronze{background:var(--bronze)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.chip.done{border-color:var(--accent);color:var(--accent)}

/* detail */
.back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:20px}
.back:hover{color:var(--ink)}
.dhead{display:grid;gap:12px;margin-bottom:28px;max-width:800px}
.dhead h1{font-size:clamp(28px,4.5vw,42px);font-weight:900;line-height:1.25}
.dhead .ko{font-size:17px;color:var(--muted);margin:0}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:13px;font-weight:600;padding:4px 10px;border-radius:3px;color:var(--plate-ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.vids{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:24px}
.media{max-width:720px;margin-bottom:8px}
.media.with-desc{max-width:none;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.media.with-desc .vdesc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);margin-bottom:24px}
.media.with-desc .vdesc[open] .vbody{max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:860px){.media.with-desc{display:block}.media.with-desc .vdesc{position:static}.media.with-desc .vdesc[open] .vbody{max-height:none}}
.video{display:grid;gap:8px;text-decoration:none;min-width:0}
.vmeta{display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.5}
.vmeta b{color:var(--ink);font-size:14px}
.video:hover .vmeta span{color:var(--accent)}

.video .plate{aspect-ratio:16/9}
.video .plate .mark{font-size:clamp(28px,5vw,48px)}
.video .plate .play{width:56px;height:56px;right:22px;bottom:22px}
.video .plate .play::after{border-left-width:14px;border-top-width:9px;border-bottom-width:9px}
.vcap{font-size:13px;color:var(--muted);margin:0 0 20px}
.vdesc{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:36px}
.vdesc summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.vdesc summary::-webkit-details-marker{display:none}
.vdesc summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.vdesc[open] summary::after{content:"−"}
.vdesc .vbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.vdesc .vbody p{margin:14px 0 0;max-width:62ch}
.vdesc .vnote{font-size:13px;color:var(--muted)}
.vdesc h4{margin:22px 0 0;font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent)}
.vdesc .flink{color:var(--accent);font-weight:600}
.vclose{margin-top:20px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.vclose:hover{color:var(--ink)}
.vcap a{color:var(--accent)}
article section{padding-block:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px}
@media (max-width:600px){article section{grid-template-columns:minmax(0,1fr);gap:8px}}
article section h2{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.02em;padding-top:2px}
article section p{margin:0 0 .8em;max-width:62ch}
article section p:last-child{margin-bottom:0}
article ul{margin:0;padding-left:1.1em;max-width:62ch;display:grid;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{border-left:2px solid var(--accent);padding-left:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
aside.facts{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px}
@media (max-width:860px){aside.facts{position:static}}
aside.facts dl{margin:0;display:grid;gap:12px}
aside.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
aside.facts dd{margin:2px 0 0;font-size:15px;font-weight:500;line-height:1.5}
.sources{font-size:13px;color:var(--muted)}
.sources ol{padding-left:1.2em;margin:6px 0 0;display:grid;gap:4px}
.sources a{color:var(--muted)}
.pendingbox{border:1px dashed var(--line);border-radius:6px;padding:22px;color:var(--muted);max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;color:var(--muted);max-width:48%}
.pager a b{display:block;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#">칸 라이언즈 아카이브 <small>2026</small></a>
  <nav class="tiers" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const TIERS = {
  "grand-prix": {name:"그랑프리 · 티타늄", short:"그랑프리", cls:"gp", desc:"부문별 최고상인 그랑프리와, 업계의 방향을 바꾼 작품에 주는 티타늄 수상작."},
  "gold": {name:"골드", short:"골드", cls:"gold", desc:"골드 라이언 수상작."},
  "silver": {name:"실버", short:"실버", cls:"silver", desc:"실버 라이언 수상작."},
  "bronze": {name:"브론즈", short:"브론즈", cls:"bronze", desc:"브론즈 라이언 수상작."}
};

const E = [
 {"id":"haven","tier":"grand-prix","title":"Haven","brand":"Suncorp Insurance","agency":"Leo Australia, Sydney","country":"호주","cat":"Titanium","awards":["티타늄 그랑프리"],"video":"https://www.youtube.com/watch?v=Pwf50R9flkU","ko":"주소를 입력하면 '우리 집'이 직접 기상 위험을 알려주는 보험사의 디지털 툴","bg":["호주에서 극한 기상은 점점 잦아지고 강해지는 중. 썬코프 자체 데이터로는 호주 주소 270만 곳 이상이 최소 한 가지 극한 기상(폭풍·산불·홍수·사이클론)의 고위험 지역에 있음. 그런데 보험 청구 10건 중 9건은 미리 대비했다면 막을 수 있었던 피해였음.","문제는 사람들이 이를 자기 일로 여기지 않는다는 것. 호주인의 35%는 기후 재난이 자신에게는 영향을 주지 않을 거라고 믿었고, 이 믿음이 대비하지 않는 이유가 됨.","썬코프는 2021년부터 보험사의 역할을 '사고 후 보상'에서 '사고 전 대비'로 넓히는 작업을 이어오고 있었음. 재난에 견디는 집을 설계·시험한 'One House'(2021, 2022 칸 이노베이션 그랑프리), 그 교훈을 재난 다발 지역 마을의 집 다섯 채에 적용한 'Resilience Road'(2022), 'If Your Home Could Talk'(2023)에 이은 것이 Haven."],"solIntro":["위험을 '내 집' 단위로 보여주기로 함. 주소를 입력하면 그 집이 직접 화자가 되어, 어떤 기상 위험에 취약하고 무엇을 고쳐야 하는지 설명하는 무료 디지털 툴."],"sol":["썬코프의 자연재해 위험 데이터에 CoreLogic(건물 연식·주택 유형), WillyWeather(실시간 날씨), Google(3D 지도·스트리트뷰·주변 철물점) 데이터를 API로 연결","집마다 다른 맞춤 영상과 내려받을 수 있는 회복력 리포트를 생성. 리포트는 폭풍·사이클론·홍수·산불별 위험도와 보강 방법을 정리","2025년 5월 출시. TV 주택 리노베이션 프로그램에 녹여 넣고 옥외·영화관·소셜·인플루언서·유튜브·스포티파이로 확산","1,100만 채가 넘는 호주 주택의 위험을 각각 분석. 기술 개발에만 2년 소요"],"stats":[["28만+","출시 첫해 방문자"],["74%","이용 후 집 보강 의향"],["1위","썬코프 홈보험 순위"]],"results":["이번 칸에서 티타늄 그랑프리를 포함해 사자상 4개를 받음."],"analysis":["보험 광고의 흔한 공식인 공포 소구를 쓰지 않았음. 같은 위험 정보라도 말하는 주체를 보험사에서 '내 집'으로 바꾸자, 경고가 아니라 내 집에 대한 진단처럼 받아들여짐. '나와는 상관없다'고 믿는 35%에게 가장 직접적으로 반박하는 방식.","단발성 캠페인이 아니라 2021년부터 이어진 '대비' 전략의 네 번째 단계라는 점도 중요함. 보험사가 광고 문구가 아니라 실제로 쓸 수 있는 서비스로 역할 변화를 증명한 사례."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["2035년이면 기후변화 때문에 호주 주택 10채 중 1채는 보험에 들 수 없게 될지도 모른다.","썬코프는 몇 년째 보험업계의 방향을 '피해 복구'에서 '미리 대비'로 바꿔 왔다. 재난이 지나간 뒤 고쳐 주는 것보다, 재난이 오기 전에 집을 튼튼하게 만드는 게 더 중요하기 때문이다.","시작은 산불·홍수·사이클론을 견디는 집 한 채(One House)였다. 다음은 거리 하나(Resilience Road)였고, 이제는 나라 전체다. 그러려면 호주의 1,100만 채가 넘는 집이 각각 어떤 위험을 안고 있는지 알아야 했다.","그렇게 만든 게 Haven이다. 주소를 입력하면 집이 직접 말을 건다. '안녕, 나야, 너희 집. 드디어 얘기하게 됐네.' 그리고 산불·폭풍·홍수 중 어떤 위험이 있는지, 무엇을 고쳐야 하는지 알려준다. 산불 위험이 있는 집이라면 창에 방충망을 달라는 식이다.","Haven은 썬코프의 재해 데이터를 포함한 12개의 대규모 데이터를 엮어 집마다 특성을 파악하고, 집마다 다른 영상을 만든다.","출시 당일 뉴스들은 이렇게 전했다. 자기 데이터를 공개한 첫 보험사다. 이사 갈 집 주변이 어떤 곳인지 미리 알 수 있다. 정기 관리 일정과 동네 시공업체까지 알려준다.","모두가 집을 조금 더 튼튼하게 만들면, 기상 재해가 우리 삶과 지역사회에 남기는 피해도 줄어든다."]},{"h":"메인 영상: About Suncorp Haven (약 1분 30초)","p":["썬코프가 직접 올린 툴 소개 영상이다.","재난 현장에 나가 보면, 많은 집주인이 자기 집이 어떤 위험에 놓여 있는지 모르고 있다.","그래서 집이 직접 말한다. '안녕, 나야, 너희 집.' '나 같은 집은 폭풍 위험이 높아.'","리포트와 영상에는 폭풍·사이클론·산불·홍수별 위험도와 우리 집에 맞는 대비책이 담겨 있다."]}],"videoNote":"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리했다. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮겼다.","sources":[["Suncorp 보도자료","https://www.suncorpgroup.com.au/news/news/haven-launch-2025"],["Mediaweek (출시)","https://www.mediaweek.com.au/suncorp-launches-ai-powered-digital-tool-for-homeowners-via-leo"],["WARC","https://www.warc.com/article/suncorp-insurance%3A-haven-91e3eb444bd3466d97b56cfcc97e84d4"],["Contagious","https://www.contagious.com/article/cannes-lions-2026-titanium-winners-31b6832e78224e209fe8747c57ffc933"],["AdNews","https://www.adnews.com.au/news/cannes-lions-australia-takes-second-grand-prix-with-leo-s-haven-for-suncorp"],["Mediaweek (One House)","https://www.mediaweek.com.au/leo-burnett-sydney-suncorp-campaign-wins-cannes-lions-grand-prix-innovation"]]},
 {"id":"expedition-impossible","tier":"grand-prix","title":"Expedition Impossible","brand":"Columbia Sportswear","agency":"adam&eve\\TBWA, London","country":"영국 / 미국","cat":"Titanium · Brand Experience","awards":["티타늄","브랜드 익스피리언스 & 액티베이션 그랑프리"],"video":"https://www.youtube.com/watch?v=aApa1hO9kJc","ko":"'지구의 끝을 찾아오면 회사를 주겠다' — CEO가 평평한 지구론자들에게 건 공개 내기","bg":["컬럼비아는 1938년 시작된 미국의 가족 경영 아웃도어 브랜드. 공개된 기사에는 매출 감소 같은 구체적인 수치 문제는 나오지 않음.","기사로 확인되는 문제는 브랜드의 존재감. 경쟁 아웃도어 브랜드들은 깨끗하고 목가적인 자연 이미지로 광고하고 있었음. 컬럼비아는 그 반대로 가기로 하고, 2025년 8월 10년 만에 브랜드 플랫폼을 새로 냄. 'Engineered for Whatever(뭐든 견디게 만들었다)'. 아름다운 풍경 대신 야외의 위험을 유머로 보여주며 제품의 내구성을 강조하는 방향.","사장 조 보일은 에이전시에 창업자인 할머니 거트 보일의 책 『One Tough Mother』를 건네며 브랜드의 '무정부적인' 뿌리를 되살려달라고 요청함. 브리프는 '대부분의 광고주라면 승인하기 겁낼 획기적인 작업'. 목표는 사람들이 컬럼비아를 화제로 삼게 만드는 것, 그리고 더 많은 사람이 컬럼비아를 입고 야외로 나가게 하는 것.","제약 조건은 넉넉하지 않은 미디어 예산. 30초 TV 광고 대신 화제를 스스로 만들어내는 아이디어가 필요했음."],"solIntro":["평평한 지구론자들에게 공개 내기를 걸었음. '지구의 끝을 찾아 사진으로 증명하면 회사를 주겠다.' 'Engineered for Whatever'의 '뭐든 견딘다'는 주장을, 존재하지 않는 장소까지 가보라는 도전으로 극단화한 것."],"sol":["CEO 팀 보일 명의의 공개 서한을 뉴욕타임스 지면 광고로 게재하며 시작","상품은 실제로 등록한 법인 'The Company, LLC'. 약 10만 달러 상당의 자산(아웃도어 장비, 사무실 화분, 마네킹 등)을 넣어둠. 즉 '회사(The Company)를 준다'는 말이 문자 그대로 성립하는 말장난","지구의 끝은 진짜 낭떠러지여야 하며, 멋진 절벽 정도로는 인정하지 않는다는 조건을 명시","약 2분짜리 히어로 필름과 소셜 영상, 레딧·유튜브 댓글 참여로 확산","평평한 지구론자를 조롱하지 않고 '증거를 찾는 탐험'으로 프레이밍"],"stats":[["10개","사자상 (이번 칸 최다)"],["8,000만","획득 오디언스"],["1,000만","자연 조회수"],["250건+","언론 보도"]],"results":["수상 내역은 티타늄, 브랜드 익스피리언스 & 액티베이션 그랑프리, 골드 2개(다이렉트·PR), 실버 3개, 브론즈 3개. 상금을 받아간 사람은 없지만, 평평한 지구론자들의 편지와 사진은 지금도 계속 들어오고 있음."],"analysis":["핵심은 상품을 실제 법인으로 만든 것. '회사를 준다'는 과장이 법적으로 실재하는 순간, 농담이 뉴스가 될 만한 사건으로 바뀜. 동시에 법인 이름이 'The Company'라서 약속을 어기지 않으면서도 실제 회사 전체를 걸지 않는 구조.","지구에는 끝이 없으니 아무도 이길 수 없는 내기이기도 함. 판은 크게 벌이되 브랜드가 실제로 잃을 위험은 없음. 적은 미디어 예산으로 화제성을 사는 대신 만들어낸 방식."],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["평평한 지구론자는 지구가 둥근 공이 아니라 평평한 판이라고 믿는 사람들이다. 이 주장이 맞다면 지구에는 '끝', 즉 판의 가장자리가 있어야 한다. 캠페인은 바로 이 지점을 파고든다.","영어로 'edge'는 '가장자리'라는 뜻과 함께 '한계, 극한'이라는 뜻도 있다. 컬럼비아는 '우리 장비는 극한(edge)까지 버틴다'는 말을 '그럼 지구의 끝(edge)까지 가보라'는 도전으로 바꿨다."]},{"h":"케이스 영상 (약 2분 10초)","p":["잔뜩 화가 난 평평한 지구론자들의 반응으로 시작했다. '증거 가져왔으니 돈 내놔', '우리는 평평한 지구에 산다'. 그리고 '어쩌다 이렇게 됐는지 처음부터 보자'로 넘어갔다.","CEO 팀 보일이 '이 메시지는 평평한 지구론자들에게'라며 등장했다. 지구에 끝이 있다고 주장하니 가서 사진만 찍어 오라고 했다.","생방송 TV에서 도전을 처음 알렸고, 뉴욕타임스에 공개 편지를 실었다. 편지의 핵심은 '이제 말이 아니라 지도로 증명할 때'. 뉴스들은 '컬럼비아가 회사를 통째로 걸었다'며 보도했다.","이어서 상으로 걸린 회사 물건 목록을 공개하고(메인 필름 장면), 월스트리트에서는 회사 인수에 관심 많은 사람들을 유혹했다. 평평한 지구론자들이 모이는 온라인 공간마다 컬럼비아가 나타나 '그만 싸우고 탐험하러 가라'는 식으로 댓글을 달았다.","실제로 도전하겠다는 사람들이 등장하지만, 당연히 아무도 지구의 끝을 찾지 못했다. 영상은 그래도 캠페인이 의도대로 작동했다고 정리했다.","성과 수치: 획득 오디언스 8,000만, 자연 조회수 1,000만, 언론 보도 250건 이상, 그리고 짜증 난 평평한 지구론자 수천 명.","'지구 끝까지 갈 거면 컬럼비아를 입어. 필요할 거야'로 마무리했다."]},{"h":"메인 필름 (약 1분 20초)","p":["컬럼비아 공식 채널 영상이다. CEO가 카메라 앞에서 '지구 끝 사진을 보내면 회사 자산을 전부 주겠다. 서류도, 변호사도, 함정도 없다'고 선언했다. 그 순간 옆에서 '팀, 서류는 좀 있어요'라는 말이 끼어들었다.","이후 CEO는 사무실을 돌아다니며 '이것도, 이것도, 이것도' 하고 상으로 줄 물건을 하나씩 가리켰다. 회의 중인 회의실까지 들어가 손가락질을 이어가고, 직원들은 어리둥절해했다.","한 물건 앞에서는 '그건 사실 렌털이에요'라는 정정이 들어오고, CEO가 '아, 이건 빼고'라고 하는 장면이 웃음 포인트.","'지구 끝까지 간다면 컬럼비아를 입어. 필요할 거야. 행운을 빈다'로 마무리했다. 영상 설명란에는 상품이 'The Company, LLC'(자산 10만 달러)라는 조건이 적혀 있었다."]}],"videoNote":"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리했다. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮겼다.","sources":[["The Drum","https://www.thedrum.com/news/columbia-sportswear-offered-to-give-away-the-company-and-cannes-gave-it-ten-lions"],["Creative Salon","https://creative.salon/articles/features/columbia-sportswear-adam-eve-tbwa-cannes-lions-titanium-expedition-impossible"],["Marketing Dive","https://www.marketingdive.com/news/columbia-challenges-flat-earthers-as-part-of-bolder-marketing-revamp/806761/"],["SGI Europe","https://www.sgieurope.com/brands/the-impossible-expedition-that-won-cannes/121914.article"]],"videoKind":"케이스 영상 · 한글 자막","films":[{"kind":"메인 필름","title":"Expedition Impossible","url":"https://www.youtube.com/watch?v=JxJOAsTMC6w"}]},
 {"id":"vehicle-of-hope","tier":"grand-prix","title":"Vehicle of Hope","brand":"Caritas","agency":"Differ, Stockholm","country":"스웨덴","cat":"Lions Health · Grand Prix for Good","awards":["라이언즈 헬스 그랑프리 포 굿"],"video":"https://www.youtube.com/watch?v=YfQbzgQfOKI","ko":"프란치스코 교황의 포프모빌을 가자지구 아이들을 위한 이동 진료소로 개조한 프로젝트","bg":["2년간의 전쟁으로 가자지구의 의료 체계는 무너졌고, 가자로 들어가는 인도적 지원은 이스라엘에 의해 차단되거나 크게 제한되고 있었음.","가톨릭 구호단체 카리타스 스웨덴은 에이전시 Differ에 이 지원 봉쇄 문제를 알려달라고 의뢰함. 동시에 실제로 가자의 아이들에게 의료를 전달하는 것도 목표였음."],"solIntro":["프란치스코 교황이 타던 '포프모빌'을 가자 아이들을 위한 이동 진료소로 개조하는 프로젝트. 이름은 'Vehicle of Hope(희망의 차)'."],"sol":["2014년 5월 교황의 베들레헴 방문 때 쓰인 차량(미쓰비시 개조차)을 활용. 팔레스타인 대통령이 바티칸에 선물했고 이후 프란치스코회 수도사들이 보관하던 차였음","스웨덴의 안데르스 아르보렐리우스 추기경을 통해 스페인어 제안서를 교황에게 전달, 수주 만에 승인과 축복이 담긴 서한을 받음","전쟁 후 일자리를 잃은 팔레스타인 정비공들이 베들레헴의 차고에서 개조. 비용은 약 1만 5천 달러, 부품 부족으로 수개월 지연","2025년 4월 교황 선종. 에이전시는 새 교황이 계획을 취소할 수 있다는 우려에 콘클라베 전 공개를 결정했고, 뉴욕타임스 보도 이후 '교황의 마지막 소원'으로 알려짐. 이후 레오 교황의 축복도 받음","2025년 11월 25일 베들레헴 예수탄생교회 인근에서 공개"],"stats":[["200명","하루 진료 가능 인원"],["7대","영향받아 추가된 이동 진료소"],["5,200건+","언론 기사"],["2,800건+","TV·라디오 보도"]],"results":["다만 이스라엘 당국이 진입을 허가하지 않아, 공개 시점까지 진료소는 가자에 들어갈 날짜를 받지 못했음. 카리타스는 공식 경로로 진입 허가를 계속 요청 중이라고 밝힘. 에이전시는 교황 선종 1주년에 BBC가 이 사실을 보도하도록 다시 이슈화함.","언론 보도 외에 X 언급 94,000건, 전체 언급 103,000건을 기록함."],"analysis":["봉쇄를 정면으로 비판하는 대신, 전 세계가 아는 상징물을 누구도 반대하기 어려운 '아이들 진료소'로 바꿨음. 정치적 주장이 아니라 인도적 행동으로 메시지를 전한 것.","차량이 가자에 들어가지 못한 사실조차 캠페인의 문제의식인 '봉쇄'를 증명하는 장치가 됨. 성공해도 메시지가 되고, 막혀도 메시지가 되는 구조."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["나레이션 없이 음악과 화면 자막, 뉴스 보도 음성으로 진행됐다.","폐허가 된 가자지구 화면 위로 '가자에서는 인도적 지원과 의료가 차단됐다', '가장 큰 피해자는 전쟁 말고도 예방할 수 있는 병에 시달리는 아이들'이라는 자막이 나왔다. 카리타스가 이 봉쇄 문제에 관심을 모으려 나섰다고 소개했다.","날짜 자막으로 과정을 보여줬다. 2024년 11월 5일, 카리타스가 교황에게 포프모빌을 아동 이동 진료소로 바꾸자고 제안했다. 2024년 12월 18일, 교황이 답했다. 화면에는 '교황께서 이 프로젝트를 승인하셨으며, 함께하는 모든 이를 위해 기도하신다'는 내용의 답신이 나왔다.","베들레헴에서 정비공들이 용접하며 차량을 개조하는 장면과, 완성된 진료실 내부가 이어졌다. '교황이 앉던 자리에서 하루 200명의 아이들이' 치료받는다는 자막이 나왔다.","이후 CNN·BBC·뉴욕타임스 등 전 세계 언론 로고와 보도 장면이 몽타주로 이어졌다. 앵커들은 이것이 교황의 마지막 소원 중 하나였다고 전하면서, 이 차가 봉쇄를 뚫고 들어갈 수 있을지는 아직 모른다고 말했다.","성과 수치: TV·라디오 보도 2,800건 이상, 기사 5,200건 이상, X 언급 94,000건, 전체 언급 103,000건.","'이스라엘은 여전히 인도적 지원과 의료를 강하게 제한하고 있다'는 자막 뒤, 'The Vehicle of Hope' 타이틀로 마무리했다."]}],"videoNote":"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리했다. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮겼다.","sources":[["Contagious","https://www.contagious.com/article/cannes-lions-2026-lions-health-and-united-nations-grand-prix-for-good-winner-f89924525b5242fd825ed3a817fc8509"],["Al-Monitor (AFP)","https://www.al-monitor.com/originals/2025/11/popemobile-transformed-gaza-mobile-childrens-clinic"],["The Drum (에이전시 기고)","https://www.thedrum.com/opinion/johan-gustafsson-we-pitched-two-popes-to-provide-a-pop-up-popemobile-for-gaza"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/vehicle-of-hope"]]},
 {"id":"600k-network","tier":"grand-prix","title":"600K Network","brand":"Comando con Venezuela","agency":"Rainbow Lobster, Mexico City","country":"베네수엘라 / 멕시코","cat":"Titanium · Grand Prix for Good","awards":["티타늄","그랑프리 포 굿"],"video":"https://www.youtube.com/watch?v=XfNU8RAbE1I","ko":"시민들이 개표 결과지의 QR코드를 스캔해 선거 결과의 증거를 확보한 작전","bg":["2024년 7월 28일 베네수엘라 대선. 현직 니콜라스 마두로에 맞설 야권의 유력 후보 마리아 코리나 마차도는 출마가 금지됐고, 에드문도 곤살레스가 야권 연합 후보로 나섰음. 코만도 콘 베네수엘라는 마차도를 지지하기 위해 만들어진 야권 조직.","야권은 수년간 개표 조작을 주장했지만 이를 뒷받침할 증거가 없었음. 선관위가 결과를 발표하면 반박할 방법이 없는 구조.","과제는 '조작됐다'는 주장을 누구도 반박할 수 없는 증거로 바꾸는 것."],"solIntro":["베네수엘라의 전자투표기는 투표 마감 후 개표 결과지(acta)를 출력하는데, 여기에는 후보별 득표수와 QR코드가 찍혀 있고 각 정당 참관인은 사본을 받을 권리가 있음. 이 원본 증거를 선관위보다 먼저, 최대한 많이 확보하는 시스템을 설계함."],"sol":["60만 명의 참관인과 자원봉사자를 수개월간 비밀리에 교육. 결과가 전송되기 전에 결과지를 손에 넣는 것이 핵심 임무","참관인들이 휴대폰과 전용 스캐너로 결과지의 QR코드를 스캔해 즉시 집계. 스캐너에 닿지 못하는 곳은 오토바이·자동차·자전거·배로 결과지를 실어 나름","통신이 끊기지 않도록 수박 속에 안테나를 숨기기도 함","스캔한 결과지를 웹사이트에 올려, 유권자가 신분증 번호를 입력하면 자신이 투표한 기계의 결과지를 직접 확인할 수 있게 함"],"stats":[["60만","참여한 시민 검증자"],["85%","이틀 뒤 공개한 개표 결과지"],["620만 : 270만","야권 집계 (곤살레스 : 마두로)"],["640만 : 530만","선관위 발표 (마두로 : 곤살레스)"]],"results":["야권이 확보한 결과지는 곤살레스의 큰 승리를 보여줬지만, 선관위는 마두로의 승리를 발표했고 결과지는 공개하지 않았음. 미국은 곤살레스의 승리를 인정했고, 브라질·콜롬비아 정상도 전체 결과지 공개를 요구함. 정권은 폭력으로 대응해 2,000명이 넘는 시민을 투옥했고, 정치범은 여전히 수감 중.","이번 칸에서 티타늄, 그랑프리 포 굿, 골드 2개를 받음. 마차도는 2025년 노벨평화상을 받았고 칸 심사 프레젠테이션에 화상으로 참여함."],"analysis":["영상이나 카피가 아니라 '증거 수집 시스템' 자체가 크리에이티비티로 인정받은 사례. 디자인한 대상이 메시지가 아니라 프로세스였음. 심사위원장은 외교적 방법이 해내지 못한 일을 크리에이티비티가 해냈다고 평가함.","이미 있는 인프라(결과지의 QR코드, 참관인의 사본 수령 권리)와 누구나 가진 도구(휴대폰)를 조합해 국가 권력에 맞설 만한 규모를 만들어냈다는 점이 핵심."],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["베네수엘라는 전자투표를 하는데, 투표가 끝나면 투표기마다 개표 결과를 영수증처럼 길게 출력한다. 여기에는 후보별 득표수와 QR코드, 관계자 서명이 들어가고, 각 정당 참관인도 한 장씩 받을 수 있다. 선관위가 어떤 숫자를 발표하든, 이 종이가 실제 개표 결과의 원본 증거인 셈이다."]},{"h":"케이스 영상 (약 2분)","p":["'탄압 속에서 치러진 대선, 선거 당국은 정권의 편이었다'는 나레이션으로 시작했다.","표를 평화적으로 지키려면, 결과가 조작되기 전에 진짜 결과를 먼저 확보해야 했다. 수년간 준비한 끝에 정권이 모르고 열어둔 허점을 찾아냈다. 바로 개표 결과지의 QR코드. 투표 테이블마다 출력되는 결과지에 그 테이블의 결과가 QR코드로 담겨 있었다.","코만도 콘 베네수엘라는 휴대폰 하나로 시민 60만 명을 '검증자'로 만드는 앱을 만들었다. 참관인들은 수개월 동안 위험을 무릅쓰고 교육받았고, 선거 당일 전국 1만 5천 개 투표소, 3만 개가 넘는 테이블에서 QR코드를 몰래 찍어 전송했다.","선관위가 10년 넘게 집권해온 인물(마두로)의 승리를 발표하자, 야권 지도자는 그날 밤 바로 카메라 앞에 섰다.","이틀 뒤 전체 결과지의 85%가 웹사이트에 공개됐고, 검증된 데이터는 국제 검증 기관과 외교 채널로 전달됐다.","정권은 폭력으로 대응했고, 2,000명이 넘는 시민이 투옥됐다.","2025년 노벨평화상이 진실을 지켜온 베네수엘라 사람들에게 돌아갔다는 내용과 함께, '투명성이 보장되지 않을 때, 시민들이 직접 그것을 만들었다'는 문장으로 마무리했다."]}],"videoNote":"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리했다. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮겼다.","sources":[["AP (NBC 게재)","https://www.nbcwashington.com/news/politics/venezuelas-opposition-secured-over-80-of-crucial-vote-tally-sheets-heres-how-they-did-it"],["Adweek","https://www.adweek.com/creativity/venezuelan-election-operation-among-good-grand-prix-winners-on-cannes-lions-2026-day-5/"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/venezuela-hace-historia-cannes-lions-titanium-grand-prix-for-good-defensa-democracia"],["The Stable","https://www.thestable.com.au/rainbow-lobsters-600k-network-beyond-the-cannes-grand-prix-for-good-dan-wieden-titanium-lion-win/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"oreo-cows","tier":"grand-prix","title":"Oreo Cows","brand":"Oreo (Mondelēz)","agency":"VML Mexico City & New York","country":"멕시코","cat":"Titanium","awards":["티타늄"],"video":"https://www.youtube.com/watch?v=F2EjJgR0adE","ko":"오레오처럼 검정-흰색-검정 줄무늬를 가진 실제 소를 내세워 '오레오엔 우유'를 다시 각인시킨 멕시코 캠페인","bg":["멕시코에는 빵이나 쿠키를 우유·커피에 찍어 먹는 '초페오(chopeo)'라는 습관이 있음. 많은 사람이 하면서도 이름이 있는 줄은 모를 만큼 일상적인 행동.","문제는 오레오를 우유에 찍어 먹는 멕시코인이 약 25%에 불과했다는 것(오레오 자체 조사). 오레오는 우유에 찍어 먹는 습관이 브랜드 애착과 판매를 함께 끌어올린다고 보고 있었음.","몬델리즈 멕시코의 사업 목표는 오레오가 '간식이 당길 때'뿐 아니라 하루 중 더 많은 순간에 등장하는 것, 즉 소비 횟수를 늘리는 것. 찍어 먹는 습관을 되살리는 일이 곧 이 목표로 가는 길이었음."],"solIntro":["목표는 쿠키를 우유에 찍어 먹는 평범한 행동을 멕시코의 정체성을 담은 상징으로 재정의하는 것. 여러 먹는 방법 중 하나였던 행동을 '멕시코 사람이라면 하는 것'으로 격상시키겠다는 의미.","그 근거로 쓴 것이 실존하는 소. 오레오는 4년째 일상 속에서 오레오 모양을 찾는 'Hidden in Plain Sight' 캠페인을 해왔는데, 그 과정에서 몸통 가운데 흰 띠가 둘린 스코틀랜드 품종 '벨티드 갤로웨이'를 발견함. 우유를 만드는 소부터 오레오처럼 생겼으니, 오레오와 우유는 원래 한 쌍이라는 이야기."],"sol":["멕시코 농부와 그의 '오레오 소'를 다룬 약 5분짜리 단편 필름을 2026년 1월 오레오 멕시코 유튜브에 공개","필름 속 우유병을 그대로 만든 한정판 병을 멕시코 전역의 인플루언서와 일부 매장에 배포","멕시코 우유 브랜드 산타 클라라와 공동 브랜드 우유를 출시해 전국에서 판매. 오레오가 우유 카테고리에 진입한 것","바예 데 브라보에 '찍어 먹기 바'를 여는 등 오프라인 활동도 진행"],"stats":[["+12%","전년 대비 판매"],["9.6억","노출"],["910만","인터랙션 (목표의 2배 이상)"],["1,710만 달러","언론 노출 가치"]],"results":["영상 조회수 3,120만 회. 이번 칸에서 티타늄, 골드 2개(다이렉트, 브랜드 익스피리언스 & 액티베이션), 실버 2개(브랜드 익스피리언스 & 액티베이션, 크리에이티브 커머스)를 받음."],"analysis":["LBB는 오레오를 '역사적으로 우유에서 브랜드 자산을 빌려온 브랜드'라고 설명함. 오레오의 대표적인 먹는 방식이 우유에 찍어 먹기라서, 오레오를 이야기하려면 우유가 따라붙어야 했다는 의미로 읽힘. 그런데 이 캠페인에서는 우유 브랜드인 산타 클라라가 '오레오 소'를 내세운 우유를 팔게 됨. VML 크리에이티브 책임자는 이를 '이제 우유가 오레오의 자산을 빌려 쓴다'고 표현함. 둘 사이의 주도권이 뒤집힌 것.","실존하는 소라는 점이 설득력의 핵심. 억지로 갖다 붙인 연결이 아니라 '자연이 만든 증거'라서, 과장된 주장 없이도 '오레오엔 우유'라는 메시지가 성립함."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["'우유가 있는 곳엔 오레오가 있어야 한다. 그런데 멕시코 전체에 이걸 어떻게 증명할까?'라는 나레이션으로 시작했다.","벨티드 갤로웨이 소를 소개하며 '우리는 이 소를 오레오 소라고 부른다. 일상 속에 숨어 있던 우리의 쿠키'라고 했다.","이어서 메인 필름 장면들이 나왔다. 마을 사람들은 농부가 소에 페인트칠을 한 거라고 수군거리고, 농부는 '칠했으면 이렇게 똑같아 보이겠냐'고 받아쳤다.","'LEGEN-DAIRY'라는 자막이 나오는데, '전설적인(legendary)'과 '유제품(dairy)'을 합친 말장난이다.","틱톡 인플루언서들이 오레오 소 우유병을 소개하는 장면, 마트 카트에 담긴 공동 브랜드 우유가 이어졌다. 농부는 '이제 모두가 내 소들의 우유를 마신다'고 말했다.","성과 수치(언론 노출 가치 1,710만 달러 등)가 나온 뒤, '오레오 소 우유에 오레오를 찍어 먹다니, 완전 인셉션이네'라는 대사로 마무리했다."]},{"h":"메인 필름: The man who believed (약 5분)","p":["다큐멘터리처럼 찍은 코미디다. 마을 사람들이 '그 사람 소에 칠한 거야', '있다고 꿈만 꾸는 거지, 미쳤어'라고 수군거리는 장면으로 시작했다.","주인공의 자기소개. '친구들에겐 루피요, 안 믿는 사람들에겐 과달루페 로페스.' 루피요는 과달루페의 애칭이다. 멕시코에 목장은 많지만 자기 소들 같은 건 없다며, '얘네는 내 오레오예요. 소 모양일 뿐'이라고 했다.","그가 받는 혐의는 소에 페인트칠을 했다는 것이다. 그는 '칠했다면 이렇게 똑같아 보이겠냐, 이 무늬는 마법처럼 생긴 것'이라고 반박했다.","그가 내놓는 이론. 쿠키가 당겨서 외양간에 오레오 한 봉지를 뒀는데, 돌아와 보니 먹보 소 '클레타'가 다 먹어치웠다는 것이다. '아보카도를 뒀으면 초록색 소가 나왔겠죠. 제가 화성 소를 키우는 건 아니잖아요?'","그는 소들을 '바키하스'라고 불렀다. 소(vaca)와 딸(hija)을 합친 말로, 딸처럼 아낀다는 뜻이다. 주변의 한 여성은 부끄럽다면서도, 자기를 아끼듯 소들을 아끼는 마음이라 좋다고 말했다.","아무도 믿어주지 않자 그는 오레오 본사에 이메일을 보냈다. 오레오 사람들이 찾아와 소를 확인하고, 망설임 없이 '오레오 소'라고 인정했다. 오레오 측은 '오레오가 보이는 곳엔 오레오가 있고, 오레오가 있는 곳엔 우유가 있다'고 말했다.","초페오가 무엇인지 설명하는 장면이다. 차갑거나 따뜻한 우유 한 잔에 오레오를 넣어 찍어 먹는 것이다.","오레오 측의 권유로 그가 이 우유로 처음 초페오를 해보고, '왜 진작 안 먹어봤지' 하며 목장 사람 모두에게 맛보게 했다.","그를 비웃던 마을 사람은 '루피요요? 훌륭한 사람이죠'라고 말을 바꾸고, 어머니는 '난 늘 내 아들을 믿었다'고 했다.","마지막 개그. 루피요가 '소들이 유명해졌으니 아무도 이 우유로 찍어 먹는 아이디어를 훔치지 않길' 바라자, 옆에서 '루피요, 그건 원래 있던 거야. 네가 발명한 게 아니야'라고 핀잔을 줬다."]}],"videoNote":"실제 영상의 자막·나레이션과 화면 문구를 확인해 정리했다. 자동 생성 자막은 오류가 있어 맥락에 맞게 바로잡아 옮겼다.","sources":[["People (AOL 게재)","https://www.aol.com/articles/yes-those-real-oreo-cows-214244994.html"],["메인 필름 (YouTube)","https://www.youtube.com/watch?v=WnZWqKbAcPM"],["Expansión","https://expansion.mx/empresas/2026/03/31/duda-en-guion-llevo-a-oreo-a-entrar-a-la-categoria-de-leche"],["LBB Online (수상)","https://lbbonline.com/news/oreo-cow-titanium-cannes-lions-vml"],["VML (수상 발표)","https://www.vml.com/news/vml-wins-titanium-lion-for-oreo-cows"],["매드타임스","https://www.madtimes.co.kr/news/articleView.html?idxno=26610"],["캠페인인사이트","https://www.campaigninsight.co.kr/news/articleView.html?idxno=1434"],["Campaign","https://campaignlive.com/article/cannes-lions-2026-oreo-cows-legacy-virginia-giuffre-win-titanium/1963008"],["DesignRush","https://news.designrush.com/oreo-mexico-chopeo-dunking-ritual-vml-campaign"]]},
 {"id":"virginia-giuffre","tier":"grand-prix","title":"The Legacy of Virginia Giuffre","brand":"Virginia Giuffre","agency":"Dini von Mueffling Communications, New York","country":"미국","cat":"Titanium · PR","awards":["티타늄"],"video":"https://www.youtube.com/watch?v=J_45sFUTkhw","ko":"제프리 엡스타인 성착취 피해 생존자 버지니아 주프레가 세상을 떠난 뒤, 그녀의 이야기와 싸움을 이어간 1년간의 PR 활동","bg":["버지니아 주프레는 제프리 엡스타인과 길레인 맥스웰의 성착취 피해를 공개적으로 고발한 생존자이자 활동가. 엡스타인 일당을 상대로 증언했고, 영국 앤드루 왕자에게 소송을 제기했음. PR 에이전시 DVMC는 2019년부터 그녀의 대변인 역할을 맡아왔음.","문제는 그녀가 자기 이야기를 마음껏 할 수 없었다는 것. 진행 중인 소송 때문에 발언이 제한됐고, 파산에 이를 만한 명예훼손 소송과 가족을 향한 폭력의 위협에 계속 시달렸음.","2025년 4월 그녀는 스스로 생을 마감함. 그 직전 대리인에게 함께 준비한 회고록을 반드시 출간해달라고, 형제들에게는 자신의 뜻을 이어달라고 부탁했음. 남은 과제는 그녀의 죽음을 둘러싼 음모론과 잘못된 정보 속에서 그녀의 이야기를 정확히 전하고, 책임을 묻는 싸움이 그녀와 함께 사라지지 않게 하는 것이었음."],"solIntro":["광고나 영상 대신 1년 내내 이어진 언론 대응으로 풀었음. 예산은 0원, 전부 무상 작업. 에이전시 대표는 매주 새 사건이 터지는 상황이라 정해진 전략보다 그때그때 대응하는 쪽에 가까웠다고 설명함."],"sol":["그녀가 사망한 당일, 한 명의 기자와 함께 그녀의 삶을 정리한 결정판 기사를 내고 다른 언론은 이 기사를 참고하도록 안내. 사망을 둘러싼 왜곡을 초기에 차단","가족이 공개 발언자로 나설 수 있도록 뉴욕 주요 언론사 방문, 미디어 트레이닝, 인터뷰 일정 조율을 지원","2025년 10월 회고록 『Nobody's Girl』 출간을 조율","가을 내내 다른 생존자, 정치인들과 함께 미 의회 집회와 기자회견을 지원","엡스타인 수사 파일 공개를 요구하는 '엡스타인 파일 투명성법' 통과를 위해 목소리를 냄. 법은 2025년 11월 통과","2026년 1월, 성매매·인신매매 범죄에 대한 연방 공소시효를 없애는 '버지니아 법' 발의를 지원"],"stats":[["140만 부","회고록 영어판 판매"],["300만 건","공개된 엡스타인 파일"],["약 50명","사임한 권력자"],["119개국","보도된 국가"]],"results":["앤드루 왕자는 왕실 작위를 박탈당했고 이후 체포됨. 캠페인 측은 누적 순방문자(UVM) 1,130억 회를 기록했다고 밝힘. 이번 칸에서 티타늄과 PR 부문 브론즈를 받음."],"analysis":["영상도, 광고 지면도, 예산도 없이 티타늄을 받은 사례. 에이전시 대표 스스로 '우리는 영화를 만들지 않았다'고 말함. 크리에이티비티가 무엇을 만드느냐가 아니라 무엇을 바꾸느냐로 평가될 수 있다는 걸 보여줌.","PR의 핵심이 메시지를 만드는 일이 아니라 '누가 말하게 할 것인가'를 설계하는 일이라는 점이 드러남. 당사자가 더 이상 말할 수 없게 되자, 회고록과 가족이라는 두 개의 목소리를 세워 그녀의 이야기가 계속 들리게 만듦."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["에이전시 대표 디니 폰 뮈플링의 1인칭 나레이션으로 진행됐다. '2019년부터 성착취 생존자 버지니아와 일했다'는 말로 시작했다.","버지니아는 엡스타인, 맥스웰 등을 상대로 증언하고 앤드루 왕자를 고소했으며, 생존자가 믿음을 얻고 정의를 찾을 수 있도록 자기 이야기가 알려지길 간절히 원했다고 소개했다.","하지만 소송 때문에 발언이 제한됐고, 명예훼손 소송과 폭력의 위협이 끊이지 않았다고 설명했다.","이어 그녀가 2025년 4월 세상을 떠났다는 사실과, 그 직전 회고록 출간과 가족에게 자신의 뜻을 이어달라는 부탁을 남겼다는 이야기가 나왔다.","그 후 1년간 한 일들이 차례로 나왔다. 그녀의 삶을 정리한 결정판 기사, 가족이 공개 발언자로 서도록 돕기, 의회에서 생존자·정치인과 함께한 발언, 앤드루 왕자의 작위 박탈과 체포.","성과 정리: 회고록 『Nobody's Girl』 영어판 140만 부 판매, 엡스타인 파일 투명성법 시행과 300만 건의 파일 공개, 권력자 약 50명 사임, 공소시효를 없애는 '버지니아 법' 발의.","'버지니아가 자신과 생존자들을 위해 찾던 정의를 얻을 때까지 계속하겠다'는 말로 마무리했다."]}],"videoNote":"실제 영상의 자막·나레이션을 확인해 정리했다. 이 캠페인은 별도 광고 필름이 없다.","sources":[["Campaign (사례 인터뷰)","https://campaignlive.com/article/0-earned-media-campaign-honoring-virginia-giuffre-won-big-cannes/1963256"],["Campaign (티타늄 발표)","https://campaignlive.com/article/cannes-lions-2026-oreo-cows-legacy-virginia-giuffre-win-titanium/1963008"],["AP (회고록 판매)","https://ny1.com/nyc/all-boroughs/ap-top-news/2025/12/16/virginia-roberts-guiffres-memoir-sells-1m-copies-worldwide"],["ABC7 (앤드루 체포)","https://abc7ny.com/post/britains-former-prince-andrew-arrested-suspicion-misconduct-public-office-police-say/18619779/"]]},
 {"id":"faroe-space-program","tier":"grand-prix","title":"The Faroe Islands Space Program","brand":"SKF","agency":"Nord DDB, Stockholm","country":"스웨덴 / 페로 제도","cat":"Creative B2B","awards":["크리에이티브 B2B 그랑프리"],"video":"https://www.youtube.com/watch?v=EM1BgVJEhk4","ko":"하늘이 아니라 바다 아래로 내려가는 '우주 프로그램'. 달의 인력이 만드는 조류로 전기를 만드는 기술을 우주 경쟁에 빗대 알린 B2B 캠페인","bg":["SKF는 1907년부터 마찰을 줄이는 제품을 만들어온 스웨덴 기업. 대표 제품은 베어링이고 130개국, 40개 산업에 진출해 있음. SKF에 따르면 전 세계에서 생산되는 에너지의 20%가 마찰을 이기는 데 쓰임. 마찰을 줄이면 그만큼 쓸 수 있는 에너지가 늘어난다는 것이 이 회사의 존재 이유.","문제는 사람들이 SKF를 '베어링 회사'로만 안다는 것. 회사가 보여주고 싶은 모습은 에너지를 아끼게 해주는 클린테크 기업이었음. 게다가 타깃은 기술 애호가부터 베어링이 뭔지도 모르는 사람까지 넓었고, B2B 광고는 보통 제품의 이성적 장점만 늘어놓는 방식이라 주목받기 어려웠음.","시기도 좋지 않았음. 에너지 수요는 커지는데 재생에너지에 대한 관심은 줄고 있었고, 강대국들은 자원을 찾아 달로 눈을 돌리는 '새로운 우주 경쟁'에 열중하던 때."],"solIntro":["우주 경쟁에 맞서는 대신 거기에 올라탔음. 북대서양의 작은 섬나라 페로 제도에서 '우주 프로그램'을 출범시킨 것. 단, 이 우주 프로그램은 절대 지구를 떠나지 않음.","핵심은 조력 에너지를 '달 에너지'로 다시 포장한 것. 바닷물이 밀려왔다 빠지는 조류는 달의 인력 때문에 생기니, 조류로 전기를 만드는 건 곧 지구에서 달의 힘을 쓰는 셈. 로켓 대신 바닷속으로 내려가는 수중 '우주선'이 그 역할을 함."],"sol":["SKF, 조력발전 기업 미네스토(Minesto), 페로 제도 국영 전력회사 SEV가 함께 참여. 미네스토의 수중 연 형태 조력발전기 '드래곤'을 SKF 기술과 결합","우주 프로그램에 있을 법한 요소를 모두 갖춤. 카운트다운, 발사, 우주선 도장까지. 수중 발전기에 칠한 페인트는 4개월간 3.5G의 힘을 견뎌야 했음","200개가 넘는 대본을 쓰고 그만큼의 편집본을 테스트. 날씨 때문에 촬영 일정이 2주 앞당겨져, 대형 제작사 없이 소규모 팀이 직접 섬으로 날아가 촬영","광고 캠페인이 아니라 실제 프로그램으로 보이게 PR을 운영. 기술을 깊이 다룬 영상도 별도로 제작","SKF의 장기 플랫폼 'Fighting Friction(마찰과의 싸움)'의 첫 번째 프로젝트"],"stats":[["8억+","노출"],["1,400건+","언론 보도"],["16개+","도입을 논의 중인 시장"],["40%","2030년 섬 전력 중 조력 목표 비중"]],"results":["BBC, CNBC, 이코노미스트 등이 보도했고, 기술 심층 영상은 2,500만 회 조회됨. SEV는 이 기술로 2030년까지 섬 전력의 40%를 만들 계획이라고 밝힘. 이번 칸에서 크리에이티브 B2B 그랑프리와 크리에이티브 전략 부문 골드를 받음."],"analysis":["B2B 기술을 설명하는 대신, 대중이 이미 관심 갖는 이야기(우주 경쟁)에 얹었음. '조력발전 기술'이라고 하면 아무도 안 보지만 '달의 힘을 쓰는 우주 프로그램'이라고 하면 뉴스가 됨. 뉴스의 흐름을 거꾸로 뒤집은 프레이밍이 핵심.","SKF는 자기 제품을 앞에 내세우지 않았음. 대신 '지금 있는 자원을 최대한 활용한다'는 회사의 철학을 실제 프로젝트로 보여줌. 베어링 회사에서 클린테크 기업으로 인식을 바꾸려는 목표에, 제품 광고보다 더 직접적으로 답한 방식.","B2B 구매자도 결국 사람이라는 에이전시의 관점이 깔려 있음. 이성적 장점 나열 대신 상상력을 건드리는 이야기로 엔지니어들까지 스스로 콘텐츠를 공유하게 만들었음."],"films":[{"kind":"메인 필름","title":"Launching The Faroe Islands Space Program","url":"https://www.youtube.com/watch?v=RpnyotHMOyQ"}],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["'에너지 수요는 그 어느 때보다 높고, 재생에너지에 대한 관심은 줄고 있다'는 뉴스 화면들로 시작했다. 강대국들은 자원을 찾아 달을 바라보고, 화면 속 사람들은 '우주 경쟁'을 외쳤다.","에이전시는 과제를 '사람들의 관심을 다시 지구로 돌리고, 새 기술로 지구의 자원을 더 잘 쓸 수 있다는 걸 보여주는 것'이라고 설명했다.","그래서 세 파트너를 외딴 섬으로 불러 모았고, 우주 경쟁과 싸우는 대신 우주 프로그램을 출범시켜 거기에 합류했다고 했다.","카운트다운 같은 우주 프로그램다운 장면이 이어지다가 반전이 나왔다. 이 우주 프로그램은 지구를 떠나지 않고, SKF와 미네스토의 기술로 달의 인력이 만드는 조력 에너지를 붙잡는다는 것이다.","뉴스 앵커들이 '아이슬란드와 노르웨이 사이 작은 섬들이 세상에서 가장 멋진 우주 프로그램을 가졌다'고 보도하고, 한 인터뷰어는 '나는 늘 위를 보는데, 당신들은 로켓을 아래로 보낸다는 거냐'고 묻기도 했다.","성과: SEV는 2030년까지 섬 전력의 40%를 이 기술로 만들 계획이고, 16개 이상의 시장이 도입을 논의 중이다.","'에너지에 굶주린 세상에서, 이 프로그램은 우리가 이미 가진 지구의 자원을 더 잘 쓸 수 있다는 걸 일깨워준다'는 말로 마무리했다."]},{"h":"메인 필름: Launching The Faroe Islands Space Program (약 1분 30초)","p":["미네스토 공식 채널 영상이다. 진지한 우주 발사 다큐멘터리처럼 연출됐다.","'에너지 수요 증가가 새로운 우주 경쟁을 불러왔다. 강대국들이 달의 자원을 차지하려 경쟁하는 지금, 세계에서 가장 작은 나라 중 하나가 이 경쟁에 뛰어든다. 단 하나 다른 점이 있다'는 나레이션으로 시작했다.","'이 우주 프로그램은 절대 지구를 떠나지 않는다. 우리에겐 이미 끝없는 달의 힘이 있다. 바로 조력 에너지다.'","'우리 우주선은 위로 올라가지 않고 아래로 내려가, 물속을 날 것이다.' 조류가 발전기를 통과하며 매일 지구에서 '달 에너지'를 만들어낸다고 설명했다.","이 프로그램이 2030년까지 재생에너지 100%를 목표로 하는 페로 제도 계획의 일부라고 밝히며, '이미 가진 자원을 최대한 활용하는 일에 함께하자'로 마무리했다."]}],"videoNote":"실제 영상의 자막·나레이션을 확인해 정리했다. 자동 생성 자막의 오류는 맥락에 맞게 바로잡았다.","sources":[["LBB Online (제작 비하인드)","https://lbbonline.com/news/NORD-DDB-SKF-Minesto-Sev-Faroe-Islands-Space-Program"],["Minesto 보도자료 (수상)","https://www.inderes.fi/en/releases/minesto-ab-global-exposure-for-minestos-tidal-dragons-following-cannes-lions-grand-prix-win"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"abinbev-creativity-at-scale","tier":"grand-prix","title":"Creativity at Scale","brand":"AB InBev","agency":"Anheuser-Busch InBev (자사 출품)","country":"벨기에 (글로벌)","cat":"Creative Brand","awards":["크리에이티브 브랜드 그랑프리"],"video":"https://1drv.ms/i/c/4e9ba448a9f90a4d/IQBpy9w4o5vNQbTsYl5UqQRuAQ8lwGGLzZg_iLShKSkxaBg?e=6MDgRz","noVideo":true,"ko":"광고 한 편이 아니라 '크리에이티브를 꾸준히 만들어내는 회사의 시스템'에 준 상. 올해 신설된 크리에이티브 브랜드 부문의 첫 그랑프리","bg":["크리에이티브 브랜드 라이언즈는 2026년에 처음 생긴 부문. 캠페인 한 편이 아니라, 좋은 크리에이티브를 반복해서 만들어내는 회사의 시스템·문화·역량을 평가함. 출품작도 광고 영상이 아니라 조직 운영 방식과 제작 프로세스를 설명하는 전략 문서였음.","AB InBev는 버드와이저, 코로나, 스텔라 아르투아 등 수백 개 브랜드를 가진 세계 최대 맥주 회사. 이 정도 규모에서 크리에이티브의 품질을 브랜드와 나라마다 들쑥날쑥하지 않게 유지하는 것 자체가 과제임.","다만 공개된 자료에는 특정 시기에 회사가 겪은 비즈니스 문제나 수치는 나오지 않음. 출품의 초점은 문제 해결보다 '크리에이티브를 성장 수단으로 체계화한 방식'에 있음."],"solIntro":["크리에이티브를 담당 부서의 일이 아니라 회사 운영 방식 자체로 만들었음. 심사위원단은 크리에이티브가 조직 문화에 박혀 있고, 전 세계 사업에서 체계적인 성장 수단으로 쓰이고 있다는 점을 수상 이유로 들었음."],"sol":["크리에이티브를 최고경영진(C레벨) 차원의 우선순위로 둠","사내에 크리에이티브 효과를 측정하는 시스템을 운영해, 크리에이티브의 품질과 실제 매출 성과의 연결을 확인","이 방식을 수백 개 브랜드, 여러 나라에 걸쳐 확장 가능하고 측정 가능한 형태로 만듦","심사 기준은 크리에이티브 역량의 수준, 강한 아이디어를 만들어내는 능력, 비즈니스 효과, 지속성 네 가지"],"stats":[["3회","칸 올해의 크리에이티브 마케터 (최초)"],["37개","2025년 칸 수상 수"],["71편","이 부문 출품작 수"]],"results":["AB InBev는 2026년 칸 '올해의 크리에이티브 마케터'로도 선정됨. 세 번째 수상이며 처음 있는 일. 회사는 역대 최고 매출을 기록했다고 밝힘. 이 부문에서는 금·은·동상 없이 그랑프리 하나만 수여됨."],"analysis":["칸이 '결과물'뿐 아니라 '결과물을 만드는 구조'에도 상을 주기 시작했다는 점이 이 수상의 의미. 한 번 크게 터진 캠페인보다, 몇 년에 걸쳐 여러 브랜드와 나라에서 꾸준히 좋은 작업이 나오게 하는 능력이 평가 대상이 됨.","AB InBev가 내세우는 핵심은 '크리에이티브는 언제나 성장을 위해 존재한다'는 것. 크리에이티브를 감각의 영역이 아니라 측정하고 관리하는 경영 도구로 다뤘다는 점이 이 부문의 정의와 정확히 맞아떨어짐.","참고로 이 부문 심사위원장 마르셀 마르콘데스는 AB InBev의 글로벌 CMO임. 심사 회피 여부는 보도되지 않았음."],"sources":[["Cannes Lions 공식 발표","https://www.canneslions.com/news/73rd-cannes-lions-international-festival-of-creativity-announces-first-winners"],["The Stable","https://www.thestable.com.au/cannes-lions-ab-inbev-is-the-inaugural-winner-in-creative-brand/"],["CB News","https://www.cbnews.fr/node/101862"],["Campaign (올해의 마케터)","https://www.campaignlive.com/article/ab-inbev-wins-cannes-lions-creative-marketer-year-award-third-time/1957200"]]},
 {"id":"wedding-rice","tier":"grand-prix","title":"The Wedding Rice","brand":"Wikifarmer","agency":"McCann Athens","country":"그리스","cat":"Creative Business Transformation","awards":["크리에이티브 비즈니스 트랜스포메이션 그랑프리"],"video":"https://www.youtube.com/watch?v=qdQpzF1u0SM","ko":"판매 규격에서 탈락한 쌀을 결혼식 '쌀 던지기' 전용 쌀로 팔아, 버려지던 쌀을 농가의 새 수입원으로 바꾼 그리스 농산물 플랫폼의 사업","bg":["그리스에서는 결혼식이 끝나고 나오는 신혼부부에게 쌀을 뿌리는 전통이 있음. 풍요와 다산을 비는 의미로, 그리스에서 가장 아끼는 결혼 풍습 중 하나. 그리스의 결혼식은 한 해 5만 건이 넘음.","문제는 이 전통 때문에 매년 200톤이 넘는 먹을 수 있는 쌀이 버려진다는 것. 국내 쌀 생산자들은 이미 수요를 맞추기도 버거운 상황이었음.","반대편에는 농가의 문제가 있었음. 그리스 쌀 농가는 소득이 낮았고, 생산량의 약 30%는 상품 규격에 못 미친다는 이유로 팔지 못하는 쌀로 분류됐음.","위키파머는 농부가 직접 농산물을 올려 파는 그리스의 농산물 온라인 플랫폼. 이 두 문제를 한 번에 풀 방법을 찾았음."],"solIntro":["버려지는 전통에 버려지는 쌀을 연결했음. 규격 미달로 팔 수 없던 쌀을 모아 결혼식에서 뿌리는 용도 전용 상품 'The Wedding Rice(웨딩 라이스)'로 만들어 판매함. 결혼식 하객은 먹을 쌀을 버리지 않아도 되고, 농가는 팔 수 없던 쌀로 돈을 벌게 됨."],"sol":["위키파머와 칼라스트라 지역 농업협동조합이 함께 참여","위키파머 마켓플레이스에서 농부가 직접 웨딩 라이스를 등록하고 결혼식 플래너에게 바로 판매하는 구조. 일반 쌀보다 싼 값에 판매","그리스 정부가 이 사업을 공식 지지함","같은 전통을 가진 나라의 농부와 결혼식 플래너를 연결하는 열린 프로그램으로 확장"],"stats":[["3톤","출시 첫 주 판매량"],["+110%","위키파머 마켓플레이스 트래픽"],["15개국","같은 전통을 가진 확장 대상 국가"],["2,000만 건","이 나라들의 연간 결혼식 수"]],"results":["CNN, 포춘, 애드에이지, 허핑턴포스트 등 해외 매체가 보도함. 그리스가 칸 라이언즈에서 받은 첫 그랑프리. 이 부문에는 151편이 출품됐음."],"analysis":["심사위원장은 이 작품의 힘을 '단순함'으로 꼽았음. 복잡한 기술이나 운영 없이, 이미 있는 문화(쌀 던지기)를 활용해 큰 경제 문제(농가 소득과 음식 낭비)를 풀었다는 것.","이 부문은 광고가 아니라 사업 모델의 변화를 평가함. 웨딩 라이스는 메시지가 아니라 새 상품이자 새 유통 경로이고, 농가에는 없던 수입원을 만들어냄. 심사위원단이 아이디어와 결과 사이의 연결이 명확하다고 평가한 이유.","심사위원단은 결과를 증명하지 못한 혁신적인 출품작들은 탈락시켰다고 밝힘. 이 부문에서는 아이디어의 새로움보다 실제로 사업이 바뀌었다는 증거가 더 중요하다는 뜻."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["나레이션 없이 음악과 화면 자막으로 진행됐다.","'그리스에서 가장 아끼는 전통 중 하나는 신혼부부에게 쌀을 뿌리는 것'이라는 자막과 함께 결혼식 장면으로 시작했다.","이어서 문제가 나왔다. '매년 200톤이 넘는 먹을 수 있는 쌀이 버려진다.' 동시에 '농부 생산량의 30%는 상품 규격에 맞지 않아 먹을 수 없는 쌀로 취급된다.' 바닥에 흩어진 쌀을 쓸어 담는 장면이 겹쳐졌다.","위키파머가 '낭비하는 전통'을 바꾸기로 했다는 자막 뒤, 'The Wedding Rice' 출시가 소개됐다.","위키파머 사이트 화면이 나오며 작동 방식을 보여줬다. 농부가 마켓플레이스에 웨딩 라이스를 올리고 결혼식 플래너에게 직접 판매했다.","정부가 이 사업을 지지했다는 자막과 함께, CNN·포춘·허핑턴포스트 등 언론 보도가 화면을 채웠다.","성과: 첫 주에 3톤 판매, 위키파머 마켓플레이스 트래픽 110% 증가.","마지막으로 세계 지도 위에 같은 전통을 가진 15개국, 연간 2,000만 건의 결혼식을 표시하며, 이 나라들의 농부와 결혼식 플래너를 연결하겠다고 밝혔다."]}],"videoNote":"실제 영상의 화면 자막을 확인해 정리했다. 이 캠페인은 별도 광고 필름이 확인되지 않았다.","sources":[["CB News (심사평)","https://www.cbnews.fr/node/101984"],["Greek Reporter (그리스 첫 그랑프리)","https://greekreporter.com/2026/06/27/greece-secure-historic-first-grand-prix-cannes-lions-festival/"],["The Stable","https://www.thestable.com.au/mccann-worldgroup-greece-non-edible-rice-makes-a-greek-wedding-tradition-sustainable/"],["designboom","https://www.designboom.com/design/wedding-rice-non-edible-grains-ceremonial-use-against-food-waste-04-20-2025/"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"lucky-fan-index","tier":"grand-prix","title":"Lucky Fan Index","brand":"Wisła Kraków","agency":"VML Kraków / Warsaw","country":"폴란드","cat":"Creative Commerce","awards":["크리에이티브 커머스 그랑프리"],"video":"https://www.youtube.com/watch?v=bmQRLuPQDjA","ko":"'내가 경기장에 가면 팀이 이긴다'는 축구팬의 미신을 데이터로 수치화해, 팬마다 '행운 지수'를 매긴 폴란드 축구 클럽","bg":["비스와 크라쿠프는 폴란드에서 가장 오래된 축구 클럽 중 하나이자 리그의 전통 강호. 그런 클럽이 1부 리그에서 강등되면서 재정에 큰 타격을 입었음.","강등된 클럽에게 경기장을 채우는 일은 분위기 문제가 아니라 생존 문제. 티켓 수입이 곧 클럽의 버팀목이었기 때문. 과제는 강등 후 멀어진 팬들을 다시 경기장으로 불러오는 것이었음."],"solIntro":["축구팬이라면 다 아는 미신에서 출발했음. '내가 경기장에 있으면 팀이 이긴다.' 이 미신을 진짜 숫자로 만들어, 팬 한 명 한 명이 팀에 가져다준 행운을 측정하는 세계 최초의 통계 'Lucky Fan Index(행운의 팬 지수)'를 만듦.","재료는 이미 클럽 손에 있었음. 폴란드에서는 법적으로 모든 클럽이 경기장에 들어오는 팬의 신원을 확인해야 함. 규제 때문에 쌓아두기만 하던 입장 기록을 상업적인 데이터로 바꾼 것."],"sol":["수년치 입장 기록을 골, 놓친 골, 기대 득점, 실점, 카드, 부상 등 200개가 넘는 경기 지표와 교차 분석. 22만 명이 넘는 팬, 홈경기 63경기를 분석함","팬마다 개인 행운 지수를 부여. 막내 선수가 130초 만에 두 골을 넣은 경기에 있었다면 지수가 오르고, 막판 역전패를 당한 경기에 있었다면 크게 떨어짐","웹 앱에서 자기 지수를 확인하고 다른 팬과 비교하거나 소셜에 공유할 수 있게 함","가장 운 좋은 팬은 VIP 박스석으로 업그레이드. 가장 운 없는 팬에게는 '더 운 좋은' 굿즈를 살 수 있게 팬숍 할인을 제공"],"stats":[["+42%","평균 관중 증가"],["1위","리그 내 관중 순위"],["22만+","분석한 팬 프로필"]],"results":["축구 매체들이 앞다퉈 소개했고, 관중 증가와 함께 팬 참여와 클럽 매출도 늘었다고 클럽 측은 밝힘. 이 시스템은 현재 유럽 다른 클럽에 판매할 솔루션으로 제안되고 있어, 클럽에 새로운 수익원이 생김. 이번 칸에서 크리에이티브 커머스 그랑프리를 받았고, 이 부문 유일한 골드도 함께 받음."],"analysis":["규제 때문에 의무로 모으던 데이터를 상업 자산으로 바꿨다는 점이 핵심. 새 데이터를 모으지 않고, 이미 가진 것을 다르게 쓰는 방식으로 문제를 풀었음.","팬의 미신을 비웃지 않고 진지하게 받아줬음. '당신이 오면 팀이 이긴다'는 말을 숫자로 증명해주니, 경기장에 가는 것이 개인적인 의미를 갖게 됨. 결과적으로 관중을 늘리려는 클럽의 목적과 팬의 감정이 같은 방향을 향함.","보상 설계도 영리함. 운 좋은 팬에게는 좋은 자리를, 운 없는 팬에게는 굿즈 할인을 줘서 지수가 낮아도 손해 보는 느낌이 없고, 어느 쪽이든 결국 클럽에서 돈을 쓰게 만드는 구조. 크리에이티브 '커머스' 부문에서 상을 받은 이유."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["'폴란드 축구의 전설 비스와 크라쿠프가 1부 리그에서 강등되자 재정이 큰 타격을 입었고, 경기장을 채우는 일은 갑자기 생존의 문제가 됐다'는 나레이션으로 시작했다.","하지만 클럽에는 강력한 무기가 있었다고 했다. 행운이 진짜 있다고, 자기가 경기장에 있으면 경기가 달라진다고 믿는 팬들이다.","이 미신을 바탕으로 '팬 한 명이 팀에 가져다주는 행운을 측정하는 첫 번째 통계', Lucky Fan Index를 소개했다.","원리 설명. 폴란드 클럽은 법적으로 입장하는 모든 팬의 신원을 확인해야 하는데, 이 입장 기록을 골·놓친 골·기대 득점·카드·부상 같은 수년치 경기 기록과 교차 분석했다. 그 복잡한 데이터에서 나만의 숫자 하나가 나왔다.","예시가 이어졌다. '막내 선수가 130초 만에 두 골을 넣던 날 거기 있었다면? 당신이 행운을 가져왔다. 지수 상승.' '막판에 역전패당한 날 거기 있었다면? 운이 없었다. 지수 폭락.'","이것이 단순한 재미가 아니라, 규제용 데이터베이스를 관중·팬 참여·매출을 끌어올리는 상업 데이터 플랫폼으로 바꾼 것이라고 강조했다. 가장 운 좋은 팬은 VIP 박스로, 가장 운 없는 팬은 '더 운 좋은 굿즈'를 살 수 있게 팬숍 할인으로.","축구 매체들의 반응 뒤 결과가 나왔다. 평균 관중 42% 증가, 리그 전체 관중 1위."]}],"videoNote":"실제 영상의 나레이션을 확인해 정리했다. 자동 자막의 클럽 이름 표기 오류는 바로잡았다. 이 캠페인은 별도 광고 필름이 확인되지 않았다.","sources":[["WPP 케이스","https://www.wpp.com/en/case-studies/the-lucky-fan-index-how-wisla-krakow-used-ai-to-give-every-supporter-a-personal-stake-in-the-teams-success"],["Contagious (커머스 수상)","https://www.contagious.com/article/cannes-lions-2026-creative-commerce-winners-2b827a31c9d1442a996317e2fb246f07"],["VML 케이스","https://www.vml.com/work/lucky-fan-index"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"sos-pos","tier":"grand-prix","title":"SOS POS","brand":"BCP (Banco de Crédito del Perú)","agency":"Circus Grey, Lima","country":"페루","cat":"Creative Data","awards":["크리에이티브 데이터 그랑프리"],"video":"https://www.youtube.com/watch?v=frGZu85YZnc","ko":"휴대폰을 도둑맞으면 은행에 전화할 수도 없다는 모순을, 동네 가게의 카드 결제 단말기로 해결한 페루 최대 은행의 서비스","bg":["페루에서는 하루 4,000대가 넘는 휴대폰이 도난당함. 범죄자들은 몇 분이면 휴대폰 잠금을 풀고, 그 안의 은행 앱으로 계좌를 털어감.","그래서 은행마다 카드와 계좌를 바로 막을 수 있는 무료 긴급 전화가 있음. 문제는 정작 휴대폰을 도둑맞은 사람은 그 전화를 걸 휴대폰이 없다는 것. 계좌를 지켜야 할 가장 급한 순간에, 은행에 연락할 수단이 사라지는 구조였음.","BCP는 페루 최대 은행. 고객 계좌가 털리는 피해를 줄이는 것은 고객 보호이자 은행의 신뢰 문제였음."],"solIntro":["휴대폰 대신 동네 가게에 있는 카드 결제 단말기(POS)를 '긴급 차단 버튼'으로 바꿨음. 휴대폰을 도둑맞으면 가장 가까운 가게로 가서 단말기 키패드에 신분증 번호와 비밀번호만 누르면 계좌가 바로 차단됨. 전화도, 앱도, 기다림도 없이."],"sol":["결제 단말기와 은행 시스템을 연결하는 API를 새로 만들어, 단말기에서 바로 계좌 차단이 가능하게 함","휴대폰 도난이 가장 많은 지역을 데이터로 파악하고, 그곳에 1만 7,500곳이 넘는 차단 지점을 배치. 어디서든 2분 안에 걸어갈 수 있게 설계","동네 식료품점, 철물점, 약국 등 일상적인 가게를 차단 지점으로 활용","SOS POS를 오픈소스 프로젝트로 공개해 다른 은행도 쓸 수 있게 함"],"stats":[["-48%","월간 금전 도난 신고"],["780만 달러+","4개월간 차단으로 지킨 금액"],["1만 7,500곳+","초기 차단 지점"],["12만 곳+","2026년 목표 차단 지점"]],"results":["페루 일간지 엘 코메르시오 등 언론이 보도했고, 현지 인플루언서들도 자발적으로 서비스를 소개함. BCP는 2026년 안에 차단 지점을 12만 곳 이상으로 늘리겠다고 밝힘."],"analysis":["문제 정의가 날카로움. '보안 기능이 있다'에서 멈추지 않고 '그 기능을 쓰려면 정작 없어진 물건(휴대폰)이 필요하다'는 모순을 짚어냈음. 해결책은 이 모순을 피해 가는 다른 경로를 찾는 것.","새 인프라를 만들지 않고 이미 동네마다 깔린 결제 단말기를 재활용했음. 그리고 데이터로 '어디에 둬야 하는가'를 정해 실효성을 높였음. 심사위원장은 데이터를 활용해 데이터(개인 금융정보)를 지키는 방식이 인상적이라고 평가함.","휴대폰과 은행 계좌가 연결된 사람이라면 누구나 공감하는 보편적인 문제라는 점도 심사에서 높이 평가됨. 오픈소스로 공개해 한 은행의 마케팅을 넘어 사회 인프라처럼 만든 것도 같은 맥락."],"films":[{"kind":"메인 영상","title":"SOS POS - Bloqueo de Emergencia BCP","url":"https://www.youtube.com/watch?v=PGXK48_wIcE"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["'페루에서는 매일 4,000대가 넘는 휴대폰이 도난당한다'는 나레이션으로 시작했다. 범죄자들은 몇 분 만에 잠금을 풀고 은행 앱으로 계좌를 털어간다고 설명했다.","그래서 은행마다 카드를 즉시 막을 수 있는 무료 긴급 전화가 있는데, '휴대폰이 없는데 어떻게 은행에 전화해서 계좌를 막느냐'는 질문이 화면 가득 나왔다.","BCP가 SOS POS를 소개했다. 담당자는 결제 단말기와 은행 시스템을 연결하는 API를 만든 것뿐이라며 아주 단순한 방법이었다고 설명했다.","사용법 시연. 휴대폰을 도둑맞으면 가장 가까운 가게로 가서 단말기에 신분증 번호와 비밀번호를 입력하면 된다. 그걸로 계좌 차단 끝.","도난이 가장 많은 지역을 찾아 1만 7,500곳이 넘는 차단 지점을 배치했고, 어디서든 단말기까지 2분이 안 걸리게 했다고 했다.","현지 틱톡 크리에이터와 뉴스가 '이제 휴대폰 없이도 식료품점·철물점·약국에서 카드를 막을 수 있다'고 소개하는 장면이 이어졌다.","성과: 월간 금전 도난 신고 48% 감소, 4개월간 780만 달러 이상을 지켰다. BCP 관계자는 2026년까지 차단 지점을 12만 곳 이상으로 늘리겠다고 밝혔다. SOS POS는 오픈소스 프로젝트로 공개됐다.","'전화도, 앱도, 지체도 없이. 사람들이 가장 필요할 때의 보안'이라는 문장으로 마무리했다."]},{"h":"메인 영상: SOS POS - Bloqueo de Emergencia BCP (약 2분 45초)","p":["BCP 공식 채널의 서비스 소개 영상이다. 페루 배우 세사르 리테르가 파란 배경 앞에서 혼자 이야기하는 형식이다.","그는 휴대폰을 도둑맞으면 당연히 카드를 막으려고 은행에 전화할 방법이 없다는 상황을 짚고, 택시·배달 같은 앱이 다 들어 있는 휴대폰을 잃었을 때의 막막함을 유머러스하게 풀어냈다.","그리고 그럴 땐 바로 긴급 차단을 하라며, 전국 1만 곳이 넘는 BCP 대리점(동네 가게)에서 모든 BCP 카드를 무료로, 즉시 막을 수 있다고 안내했다."]}],"videoNote":"케이스 영상은 나레이션과 화면 자막을, 메인 영상은 화면 자막 일부와 영상 설명란을 확인해 정리했다.","sources":[["CB News (심사평)","https://www.cbnews.fr/node/101940"],["Cannes Lions 공식 발표 (3일차)","https://www.canneslions.com/news/cannes-lions-international-festival-of-creativity-announces-lion-winners-on-day-three"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"three-words","tier":"grand-prix","title":"Three Words","brand":"AXA","agency":"Publicis Conseil, Paris","country":"프랑스","cat":"Creative Effectiveness","awards":["크리에이티브 이펙티브니스 그랑프리"],"video":"https://www.youtube.com/watch?v=6BTheXxBicA","ko":"주택보험 약관의 '긴급 거처 제공' 조항에 '그리고 가정폭력'이라는 세 단어를 더해, 가정폭력 피해자가 집을 떠날 수 있게 만든 보험사","bg":["프랑스 경찰 기록상 매년 21만 명의 여성이 가정폭력 피해를 입음. 사람들은 흔히 '왜 그 집을 떠나지 않느냐'고 묻지만, 피해자들의 대답은 '갈 곳도, 돈도 없었다'는 것. 실제로 가정폭력 상담전화로 걸려오는 요청의 77%가 긴급 거처를 구하는 내용이었음.","한편 프랑스에서는 모든 가구가 주택보험에 의무적으로 가입해야 함. 이 보험에는 화재나 홍수로 집에서 살 수 없게 되면 임시 거처를 제공하는 조항이 이미 들어 있었음. 가정폭력 피해자에게 가장 필요한 것이 바로 그 '긴급 거처'였지만, 보험은 집이 물리적으로 망가진 경우만 보장했음.","AXA 입장에서는 누구나 의무로 드는, 그래서 회사 간 차이가 잘 느껴지지 않는 상품군에서 브랜드를 선택할 이유를 만드는 것도 과제였음. 캠페인 전 AXA의 브랜드 선호도는 2위였음."],"solIntro":["새 상품을 만들지 않고, 이미 있는 약관에 세 단어를 추가했음. '화재나 홍수로 집에서 살 수 없게 되면'이라는 조항 뒤에 '그리고 가정폭력'을 붙인 것. 이 세 단어로 가정폭력 피해자도 보험을 통해 긴급 거처를 받을 수 있게 됨."],"sol":["AXA의 주택보험 계약 250만 건 전체에 이 조항을 넣고, 기존 가입자에게도 소급 적용","7일간의 긴급 거처(연장 가능)와 함께 법률 지원(신고, 접근금지명령 안내), 가정폭력 전문 심리 상담, 전용 지원 번호를 제공","프랑스 내 80개 NGO와 협력해 피해자에게 이 보장이 닿을 수 있게 함","TV, 옥외광고, 소셜 미디어로 알림"],"stats":[["1,576명","첫해 지원받은 피해자"],["+113%","순신규 계약 증가"],["2위→1위","브랜드 선호도"],["250만 건","조항이 추가된 계약"]],"results":["이 작품은 2025년 칸에서 티타늄 그랑프리를 받았고(프랑스 최초), WARC가 집계한 세계 최다 수상 크리에이티브 1위에 올랐음. 2026년에는 실제 비즈니스 성과를 평가하는 크리에이티브 이펙티브니스 부문에서 그랑프리를 받음."],"analysis":["보험사가 가장 잘하는 일(긴급 거처 제공)을 가장 필요한 사람에게 연결했음. 피해자에게 필요한 건 위로의 메시지가 아니라 오늘 밤 갈 곳이라는 점을 정확히 짚었음.","'세 단어'라는 크기의 대비가 이야기의 힘. 약관 한 줄을 고치는 아주 작은 변화가 수천 명의 삶을 바꿨다는 구조라 설명이 쉽고 기억에 남음. 캠페인 이름 자체가 아이디어를 요약함.","사회적 선의가 사업 성과로 이어졌다는 점이 이펙티브니스 수상의 이유. 차별점이 없던 의무 보험에서 '선택할 이유'가 생기면서 신규 계약과 브랜드 선호도가 실제로 올라감."],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["'남자가 자기 집에서 아내를 살해한 혐의로 기소됐다', '여성이 집에서 파트너에게 살해된 채 발견됐다' 같은 뉴스 보도들로 시작했다.","'다들 왜 그 여자가 떠나지 않았느냐고 묻는다'는 질문에 피해자들이 답했다. '갈 곳이 없었다. 돈도 없었다. 기댈 수 있는 게 아무것도 없었다.' 한 전문가는 프랑스어로 '문제는 결국 어디로, 무슨 돈으로 가느냐'라고 정리했다.","이어서 프랑스에서는 주택보험이 법적 의무이고, 화재나 홍수로 집이 살 수 없게 되면 긴급 거처를 제공한다는 설명이 나왔다. 화면 가득 약관 문장이 크게 보이고, 그 끝에 '그리고 가정폭력'이라는 세 단어가 더해졌다.","AXA 프랑스 CEO 알리스 홀츠만이 '보험사의 전문성을 가정폭력 피해 여성들을 위해 쓰겠다. 중요한 건 장기적인 해결책을 찾을 시간을 주는 것'이라고 말했다.","피해자 지원 단체 대표들은 'AXA 같은 브랜드가 자기가 잘하는 일로 돕는다는 게 놀랍다', '긴급 거처는 피해자에게 최우선 과제이고, 생명을 구한다'고 평가했다.","'여자로 산다는 것이 위험이 되어선 안 된다'는 문장으로 마무리했다."]}],"videoNote":"실제 영상의 나레이션(영어·프랑스어)과 화면 문구를 확인해 정리했다. 자동 자막의 브랜드명 오류는 바로잡았다.","sources":[["WARC (이펙티브니스)","https://www.warc.com/article/axa-france-three-words-ebfd758494b64d1393b96011e5602c3f"],["D&AD","https://www.dandad.org/work/annual-2026/behind-the-work/how-axa-used-creative-thinking-to-deliver-life-saving-support"],["Contagious","https://www.contagious.com/article/cannes-lions-2026-creative-effectiveness-winners-84a15deaad234bce86cfc8fe65a66f0e"],["CB News (WARC 랭킹)","https://www.cbnews.fr/node/99377"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"pub-that-refused-to-die","tier":"grand-prix","title":"The Pub That Refused to Die","brand":"Heineken Ireland","agency":"LePub Milan & Publicis Dublin","country":"아일랜드 / 이탈리아","cat":"Creative Strategy","awards":["크리에이티브 전략 그랑프리"],"video":"https://www.youtube.com/watch?v=4UPmILnsGlY","ko":"마을의 마지막 펍이 문을 닫으려 하자 주민 26명이 돈을 모아 펍을 사들인 이야기를 다큐로 만들고, 다른 마을도 따라 할 수 있게 도운 하이네켄","bg":["아일랜드 시골에서는 마을 펍이 사라지고 있음. 가게도 주유소도 없는 작은 마을에서 펍은 사람들이 모이는 마지막 공간인 경우가 많음. 하지만 물가가 오르면서 혼자 펍을 운영하기는 점점 어려워졌고, 리머릭주의 작은 마을 킬틸리(Kilteely)에 남은 마지막 펍 '더 스트리트 바'도 결국 매물로 나왔음.","하이네켄 아일랜드에게 펍은 맥주가 팔리는 곳이자 브랜드가 사람들과 만나는 곳. 펍이 사라지는 건 곧 사업 기반이 사라지는 일이기도 함. 하이네켄은 이미 'For the Love of Pubs(펍을 사랑하는 마음으로)'라는 장기 프로그램으로 아일랜드 펍 문화를 지원해오고 있었고, 'Pub Museums', 'Pub Succession' 같은 이전 캠페인도 칸에서 여러 상을 받았음."],"solIntro":["'혼자 운영하기 힘들다면, 마을이 함께 소유하면 어떨까?' 킬틸리 주민 26명이 실제로 그렇게 했음. 변호사, 목수, 농부, 간판 제작자, 건축업자 등 펍 운영 경험이 전혀 없는 사람들이 30만 유로를 모아 펍을 사들이고 다시 문을 열었음.","하이네켄은 이 이야기를 한 번의 미담으로 끝내지 않고, 다른 마을도 따라 할 수 있는 '모델'로 만들었음. 심사위원장은 '인사이트가 곧 아이디어이자 해결책'이라고 평가함."],"sol":["주민들이 펍 운영을 배울 수 있도록 리머릭에서 교육 과정을 마련","이 과정을 담은 다큐멘터리 'The Pub That Refused to Die(죽기를 거부한 펍)'를 제작","다큐 개봉 후 아일랜드 전국 마을을 돌며 상영회를 열고, 킬틸리 주민들이 직접 경험을 나누며 펍을 지키려는 다른 마을을 지원","펍 공동 인수를 원하는 마을을 위한 실용 가이드를 제공","PR과 언론 보도를 중심으로 이야기를 확산"],"stats":[["26명","펍을 산 주민 수"],["30만 유로","주민들이 모은 금액"],["1곳+","뒤따라 펍을 인수한 마을"]],"results":["투어로 찾아간 마을 중 한 곳이 실제로 자기 마을 펍을 사들였고, 여러 마을이 비슷한 시도를 시작함. 데일리 메일, 아이리시 타임스 등이 보도함. 이번 칸에서 크리에이티브 전략 그랑프리와 브론즈 4개(PR, 다이렉트, B2B, 엔터테인먼트)를 받음. 이 부문 출품작은 738편."],"analysis":["브랜드가 문제를 직접 해결하는 대신, 해결한 사람들의 이야기를 키워서 퍼뜨렸음. 하이네켄이 한 일은 교육, 다큐, 투어라는 '확산 장치'를 만든 것. 그래서 한 마을의 사례가 다른 마을의 행동으로 이어졌음.","'우리는 특별하지 않다, 다른 마을도 할 수 있다'는 주민의 말이 전략의 핵심. 이야기가 감동으로 끝나지 않고 '따라 할 수 있는 방법'으로 끝나도록 설계했음. 심사위원장이 말한 '마음에도 이성에도 말을 거는 작업'이라는 평가가 이 부분.","펍을 살리는 일이 곧 하이네켄의 판매 채널을 지키는 일이라, 사회적 명분과 사업적 이해가 정확히 겹침. 여러 해에 걸친 'For the Love of Pubs' 플랫폼 위에 쌓인 작업이라 진정성도 확보됨."],"films":[{"kind":"메인 필름","title":"The Pub That Refused to Die (다큐, 약 10분)","url":"https://www.youtube.com/watch?v=U0FNEVBwVi0"},{"kind":"예고편","title":"Official Trailer (30초)","url":"https://www.youtube.com/watch?v=9uwkOfqOijo"}],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["한 주민의 회상으로 시작했다. '내가 십대일 땐 마을에 펍이 세 개 있었는데, 이제 하나 남았다. 가게도 주유소도 없으니 펍이 마을의 마지막 중심이다.'","펍 주인은 혼자 운영하기엔 비용이 너무 많이 들어 결국 팔기로 했다고 말했다. '혼자 펍을 운영하는 일은 치솟는 비용 때문에 점점 어려워지고 있다'는 자막에 이어, '그렇다면 마을이 소유한다면?'이라는 질문이 나왔다.","뉴스 보도로 이어졌다. '주민 26명이 모여 펍을 샀다. 이제 공동체 펍이다. 30만 유로를 모아 다시 문을 열었다.' 변호사, 목수, 농부, 간판 제작자, 건축업자. 하지만 '펍을 운영해본 사람은?'이라는 질문에 아무도 없었다.","하이네켄 관계자는 주주들이 바 경험이 전혀 없다는 걸 알고 하이네켄이 할 수 있는 일을 찾았다고 말했다. 주민들은 하이네켄이 마련한 리머릭의 교육 과정에 참여했다.","이 모델은 어디서든 반복할 수 있다고 판단해 전국 투어를 시작했다. 킬틸리 주민이 다른 마을 사람들 앞에서 '지키고 싶은 펍이 있나요?'라고 묻고, '우리는 특별하지 않다, 주변 어느 마을이든 할 수 있다'고 말했다.","다른 마을 주민들은 '그들이 해냈다면 우리도 할 수 있다', '하이네켄 같은 큰 브랜드가 노하우를 나눠주는 건 값을 매길 수 없다'고 반응했다.","'또 한 마을이 마지막 펍을 샀다'는 자막과 함께, 투어로 찾아간 마을 한 곳이 실제로 펍을 인수했다는 발표가 나왔다. 각종 신문 보도로 마무리했다."]},{"h":"메인 필름: The Pub That Refused to Die (약 10분)","p":["하이네켄 공식 채널에 올라온 다큐멘터리다. 킬틸리 마을의 마지막 펍이 사라질 위기에 처하자, 펍 운영을 전혀 모르던 주민 26명이 힘을 모아 불가능해 보이던 일을 해내는 과정을 담았다.","이 영상에는 자막이 없어 세부 대사는 확인하지 못했다. 위 내용은 영상 설명란과 케이스 영상에 나온 장면을 기준으로 했다."]}],"videoNote":"케이스 영상은 나레이션과 화면 자막을 확인해 정리했다.","sources":[["LBB Online","https://lbbonline.com/news/Heineken-Ireland-Cannes-Lions-Grand-Prix"],["CB News (심사평)","https://www.cbnews.fr/node/102002"],["Adweek","https://www.adweek.com/creativity/heineken-wins-big-again-among-7-grand-prix-winners-at-cannes-lions-2026-day-4/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"apple-tv-rebrand","tier":"grand-prix","title":"Apple TV Rebrand","brand":"Apple TV","agency":"TBWA\\Media Arts Lab, Los Angeles","country":"미국","cat":"Design","awards":["디자인 그랑프리"],"video":"https://www.youtube.com/watch?v=NKSnmy8MwFQ","ko":"'Apple TV+'에서 '+'를 떼고, 진짜 유리로 깎은 로고를 CG 없이 카메라로 찍어 만든 애플 스트리밍 서비스의 새 브랜드 아이덴티티","bg":["애플의 스트리밍 서비스 'Apple TV+'는 〈테드 래소〉 같은 히트작을 냈지만, 정작 그 작품이 어느 서비스의 것인지 사람들이 잘 몰랐음. 조사에 따르면 구독자 중 〈테드 래소〉를 Apple TV+와 연결할 수 있는 사람은 33%뿐이었음.","이름도 문제를 키웠음. 'Apple TV'라는 이름이 셋톱박스 기기, 앱, 스트리밍 서비스(Apple TV+)에 모두 쓰이면서 브랜드가 흩어져 있었음. 좋은 작품을 만들어도 그 공이 브랜드에 쌓이지 않는 구조였음."],"solIntro":["2025년 10월, '+'를 빼고 서비스 이름을 'Apple TV' 하나로 통일하고, 브랜드 아이덴티티 전체를 새로 만들었음. 핵심은 작품이 시작될 때마다 나오는 새 로고 인트로. 사람들이 작품을 볼 때마다 이 서비스를 기억하게 만드는 장치."],"sol":["애플 로고를 투명한 유리로 직접 깎아 만들고, 색색의 조명을 비추며 회전시키는 모습을 실제 카메라로 촬영. 디지털 후반 작업, 3D 렌더링, AI를 쓰지 않음","유리에 맺히는 반사와 굴절, 빛 번짐이 촬영할 때마다 다르게 나와, 작품의 다양한 장르와 감정을 상징하도록 함","가수 겸 프로듀서 피니어스(Finneas)가 새 사운드 아이덴티티를 작곡. 로고의 빛 변화와 음악이 맞물리게 함","예고편용 2초, 시리즈용 5초, 극장용 12초 세 가지 길이로 제작","흑백 위주의 대담한 시각 시스템과 전용 서체를 만들어 107개 시장, 340개 작품에 적용. 크리에이티브 스튜디오 Buck이 제작에 참여"],"stats":[["33%","리브랜딩 전 〈테드 래소〉를 Apple TV+와 연결한 구독자"],["340편","새 아이덴티티가 적용된 작품"],["107개","적용된 시장"]],"results":["앱, 애플 기기 메뉴, 홍보물까지 새 아이덴티티로 바뀌었음. 이번 칸에서 디자인 그랑프리를 받음. 수상 이후의 브랜드 인지 변화 수치는 공개되지 않았음."],"analysis":["브랜드 문제를 광고가 아니라 '매번 반복되는 접점'으로 풀었음. 인트로는 사용자가 작품을 볼 때마다 반드시 보게 되는 몇 초. 이 몇 초에 브랜드의 인상을 각인시키는 것이 작품과 서비스를 연결하는 가장 확실한 방법.","AI로 만든 영상이 넘쳐나는 시기에 일부러 손으로 만든 방식을 택했다는 점이 메시지가 됨. 애플은 이를 실사처럼 보이는 가짜 영상과 AI 콘텐츠에 대한 반대 선언으로 설명함. '진짜 빛, 진짜 유리'라는 제작 방식 자체가 브랜드의 품질을 말해줌.","이름을 단순하게 정리한 것도 디자인의 일부. 기기·앱·서비스로 흩어져 있던 브랜드를 'Apple TV' 하나로 모아, 쌓이는 인지도가 한곳으로 모이게 했음."],"videoDesc":[{"h":"케이스 영상 (약 30초)","p":["나레이션 없이 음악과 화면만으로 구성된 짧은 영상이다.","어두운 스튜디오에서 사람들이 유리 조각과 조명, 카메라를 설치하는 제작 현장으로 시작했다. 보라색 빛이 비치는 거대한 유리 애플 로고가 실루엣으로 보였다.","카메라 모니터 화면 속에 유리 로고의 곡선이 잡히고, 빛이 유리 표면을 따라 흐르며 굴절되는 모습이 클로즈업으로 이어졌다.","마지막에 빛을 머금은 유리 애플 로고와 'tv' 글자가 함께 나타나며 새 Apple TV 로고로 마무리됐다. CG가 아니라 실제 유리를 찍었다는 걸 제작 과정으로 보여주는 구성이다."]}],"videoNote":"실제 영상 장면을 확인해 정리했다. 참고 사이트에 연결된 원래 케이스 영상은 비공개로 바뀌어, 같은 캠페인의 공개 케이스 영상으로 대체했다. 애플 공식 채널의 인트로 단독 영상은 찾지 못했다.","sources":[["Contagious (디자인 수상)","https://www.contagious.com/article/cannes-lions-2026-design-winners-89077875a5ac43a7b3639bb95b9702ed"],["Reason Why (아이덴티티 소개)","https://www.reasonwhy.es/actualidad/apple-tv-estrena-identidad-nueva-intro-proceso-artesanal"],["MacRumors (리브랜딩 발표)","https://www.macrumors.com/2025/10/13/apple-tv-plus-rebrand"],["LBB Online","https://lbbonline.com/news/apple-cannes-lions-grand-prix-win"]]},
 {"id":"project-genie","tier":"grand-prix","title":"Project Genie","brand":"Google (Google DeepMind)","agency":"Google Creative Team, Mountain View","country":"미국","cat":"Digital Craft","awards":["디지털 크래프트 그랑프리"],"video":"https://www.youtube.com/watch?v=UI4qkTWvosM","videoKind":"케이스 영상 · 한글 자막","ko":"글이나 그림 한 장으로 직접 걸어 다닐 수 있는 가상 세계를 만들어주는 구글 딥마인드의 AI '지니 3'를, 누구나 써볼 수 있는 웹 서비스로 만든 작업","bg":["구글 딥마인드는 2025년 8월 '지니 3(Genie 3)'라는 '월드 모델'을 일부 테스터에게 먼저 공개했음. 월드 모델은 어떤 환경이 시간에 따라, 그리고 사용자의 행동에 따라 어떻게 변하는지를 시뮬레이션하는 AI. 쉽게 말해 글로 설명하면 그 안을 직접 돌아다닐 수 있는 세계를 실시간으로 만들어내는 기술.","과제는 이 낯선 기술을 대중에게 소개하는 것. '월드 모델'은 연구실 용어라 설명만으로는 와닿지 않고, 직접 해봐야 무엇인지 알 수 있는 기술이었음. 동시에 아직 실험 단계라 세계가 현실과 다르게 보이거나, 프롬프트를 정확히 따르지 않거나, 조작 반응이 느린 한계도 있었음."],"solIntro":["기술을 설명하는 대신 직접 만져볼 수 있는 웹 서비스 'Project Genie'를 만들었음. 2026년 1월 29일 구글 랩스의 실험적 프로토타입으로 출시. 미국의 18세 이상 Google AI Ultra 구독자부터 쓸 수 있게 함."],"sol":["월드 스케치: 환경과 캐릭터를 글로 설명하거나 이미지를 올리면 세계가 만들어짐. 걷기, 타기, 날기, 운전하기 같은 이동 방식과 1인칭·3인칭 시점을 고를 수 있음","글만으로는 결과를 짐작하기 어렵다는 문제를 풀기 위해, 들어가기 전에 미리보기 이미지를 보여주고 말로 수정할 수 있게 함(이미지 생성 모델 Nano Banana Pro 활용)","월드 탐험: 사용자가 움직이는 대로 앞길이 실시간으로 생성됨. 한 번에 60초까지","월드 리믹스: 다른 사람이 만든 세계의 프롬프트를 바꿔 새 버전을 만들거나, 큐레이션된 갤러리와 랜덤 버튼으로 아이디어를 얻을 수 있음","출시 전 기술, 게임, 교육, 크리에이티브 분야 테스터를 먼저 초대하고, 제품 시연 영상과 소셜 콘텐츠로 출시를 알림"],"stats":[["만장일치","심사위원단 그랑프리 결정"],["60초","한 번에 탐험할 수 있는 시간"]],"results":["이용자 수 같은 성과 수치는 공개되지 않았음. 심사위원단은 만장일치로 그랑프리를 결정했고, 심사위원장은 이 작업이 '크리에이티비티의 미래'를 보여준다고 평가함."],"analysis":["디지털 크래프트 부문은 디지털 경험의 '만듦새'를 평가함. 이 작업의 크래프트는 최첨단 연구 기술을 일반인이 몇 번의 클릭으로 써볼 수 있게 만든 인터페이스 설계에 있음. 특히 '글만으로는 결과가 어떨지 모른다'는 사용자의 불안을 미리보기 단계로 풀어준 부분이 핵심.","한계가 분명한 실험 단계 기술을 감추지 않고 '실험적 프로토타입'으로 내놓았음. 완성품처럼 포장하는 대신 써보게 하고 사용 패턴을 다음 개발에 반영하겠다는 방식이라, 기대치 관리와 대중 소개를 동시에 해냄.","AI가 광고 업계의 큰 화두인 해에, AI를 광고 제작 도구가 아니라 '경험 자체'로 만든 작업이 디지털 크래프트 최고상을 받았다는 점도 상징적임."],"films":[{"kind":"추가 영상","title":"How world remixing works (45초)","url":"https://www.youtube.com/watch?v=dO0csRgxo_A"}],"videoDesc":[{"h":"공식 소개 영상: How world sketching works (약 1분 20초)","p":["구글 딥마인드 공식 채널 영상이다. 사용자들이 만든 수많은 세계가 동그란 창으로 떠다니는 장면으로 시작했다.","이어서 실제 서비스 화면이 나왔다. '세계를 스케치하는 것부터 시작하자'는 문구와 함께, 먼저 환경을 글로 설명하고 그다음 캐릭터를 설명했다. 캐릭터는 사람, 동물, 물체 무엇이든 될 수 있었다.","그런데 '글만으로는 세계가 어떻게 보일지 알기 어렵다'는 나레이션과 함께 미리보기 기능이 소개됐다. 미리보기 이미지를 보면서 '멀리 산도 좀 있으면 좋겠다'처럼 말로 고칠 수 있었다.","마음에 들면 세계를 생성하고 그 안으로 들어갔다. 파란 공 모양의 캐릭터가 털로 뒤덮인 듯한 하얀 언덕을 굴러가는 장면이 나오고, '그러니 상상하는 어떤 세계든 플레이할 수 있다'는 말로 마무리했다."]}],"videoNote":"실제 영상의 자막과 화면을 확인해 정리했다. 참고 사이트에 연결된 케이스 영상은 비공개로 바뀌어, 구글 딥마인드의 공식 소개 영상으로 대체했다.","sources":[["Contagious (디지털 크래프트 수상)","https://www.contagious.com/article/cannes-lions-2026-digital-craft-winners-3a2392d27e5145b5a3f80e9d86373ce3"],["CB News (심사평)","https://www.cbnews.fr/node/101929"],["Dataconomy (출시)","https://dataconomy.com/2026/01/30/google-launches-project-genie-create-interactive-worlds-with-ai/"]]},
 {"id":"uva-uva-bombon","tier":"grand-prix","title":"Uva Uva Bombón","brand":"UVA (배달 앱)","agency":"de la Cruz Ogilvy, San Juan","country":"푸에르토리코","cat":"Direct","awards":["다이렉트 그랑프리"],"video":"https://www.youtube.com/watch?v=SnWnb59XTfM","ko":"배드 버니의 슈퍼볼 하프타임 쇼에서 앱 이름과 같은 가사가 나오는 순간, 앱 상품을 1달러에 파는 '우연을 광고로 만든' 푸에르토리코 배달 앱","bg":["UVA는 푸에르토리코의 신생 배달 앱. 출시를 앞두고 사람들의 관심을 끌어 앱을 쓰게 만들어야 했음.","마침 2026년 슈퍼볼(LX) 하프타임 쇼의 주인공은 푸에르토리코 출신 가수 배드 버니. 그의 히트곡 'Tití Me Preguntó'에는 앱 이름 'UVA'와 같은 단어가 가사로 들어 있었음. 쇼를 앞두고 사람들 사이에서는 '배드 버니가 어떤 곡을 부를까'가 최대 관심사였음.","과제는 이 관심을 자연스럽게 가로채서, 그것도 실시간으로 앱 출시와 연결하는 것."],"solIntro":["'우연이 곧 슈퍼볼 광고'라는 발상. 배드 버니가 하프타임 쇼에서 그 곡을 부르면, 그 순간 UVA 앱에서 엄선한 상품을 1달러에 판매하겠다고 미리 약속했음. 가수의 공연 자체를 자기 슈퍼볼 광고처럼 쓰게 만든 것."],"sol":["쇼 며칠 전부터 '배드 버니가 이 곡을 부르면 앱에서 특별 할인이 열린다'고 공지","팬들에게 인스타그램과 X에서 배드 버니 계정을 태그해 그 곡을 세트리스트에 넣어달라고 요청하게 함","공연이 그 곡으로 시작하자 프로모션이 자동으로 열림. 피자 세트, 등심 스테이크, 덤벨, 은목걸이 등 다양한 상품을 곡이 나오는 동안 또는 재고가 떨어질 때까지 1달러에 판매","법무 검토, 기술, 운영, 재고, 인력, 광고주 협의까지 몇 달간 준비해, 사람들은 몇 분 만에 경험하는 이벤트를 실현"],"stats":[["완판","하프타임 쇼 종료 전 전 상품"],["92%","관련 대화 점유율(share of engagement)"]],"results":["캠페인 측은 UVA가 공연 중 아티스트가 언급한 유일한 브랜드가 됐다고 밝힘. 이번 칸에서 다이렉트 그랑프리와 실버 3개, 브론즈 1개를 받음."],"analysis":["브랜드 이름과 가사의 우연한 일치를 발견하고, 그걸 '조건부 약속'으로 설계했다는 점이 핵심. 곡이 나오지 않으면 아무 일도 없지만, 나오면 수천만 명이 보는 무대가 곧 브랜드의 광고판이 됨. 그래서 팬들은 노래를 요청하며 캠페인에 직접 참여하게 됨.","다이렉트 부문은 사람들이 즉시 행동하게 만드는 힘을 평가함. 이 작업은 '노래가 나오는 바로 그 순간에만'이라는 시간 제한으로 즉각적인 앱 접속과 구매를 끌어냈고, 출시 단계 앱에 가장 필요한 행동(설치와 첫 구매)으로 연결함.","에이전시 CCO의 말처럼 '사람들은 순식간에 경험한 이벤트'를 위해 몇 달을 준비함. 실시간 마케팅의 성공은 순발력이 아니라 사전에 설계된 운영 능력에서 나온다는 사례."],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["음악과 화면 자막, 장면 위주로 진행됐다. 배드 버니가 'UVA, UVA, BOMBÓN'을 부르는 장면으로 시작했다.","'모두가 묻는 질문은 하나였다'는 자막과 함께, 슈퍼볼을 앞두고 '배드 버니가 무슨 곡을 부를까'를 예측하는 틱톡 영상과 뉴스가 쏟아지는 장면이 나왔다.","토크쇼에서 배드 버니가 같은 구절을 부르는 장면을 보여주며, 이 곡에 앱 이름이 들어 있다는 점을 짚었다. 이어서 '우연 = 슈퍼볼 광고'라는 자막이 나왔다.","푸에르토리코 풍경과 함께, 나이 지긋한 남성이 서재에서 미식축구공을 들고 '빅 게임에서' 이 곡이 나오면 UVA 앱이 열린다고 예고하는 광고 장면이 나왔다. 팬들에게는 인스타그램이나 X에서 배드 버니 계정을 태그하라고 하고, 그 순간 앱을 눌러 상품을 받으라고 안내했다.","피자 세트, 은목걸이, 덤벨, 미식축구공, 스탠리 컵 같은 상품이 원래 가격에서 1달러로 바뀌어 화면을 가득 채우고, 앱 화면에는 'SOLD OUT'이 줄줄이 떴다.","실제 하프타임 쇼에서 배드 버니가 이 곡으로 공연을 여는 장면이다. 성과로 대화 점유율 92%, '아티스트가 언급한 유일한 브랜드'라는 자막이 나오며 마무리했다."]}],"videoNote":"영상에 나레이션 자막이 없어, 화면 자막과 장면을 확인해 정리했다. 노래 가사는 저작권 때문에 캠페인 제목 외에는 옮기지 않았다.","sources":[["LBB Online","https://lbbonline.com/news/de-la-cruz-ogilvy-puerto-rico-uva-super-bowl-bad-bunny"],["Contagious (다이렉트 수상)","https://www.contagious.com/article/cannes-lions-2026-direct-winners-55ef4e7c79bb4c20ae6c120903f94c3e"],["CB News","https://www.cbnews.fr/node/101971"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"original-forever","tier":"grand-prix","title":"Original Forever","brand":"adidas Originals","agency":"Johannes Leonardo, New York (& adidas London)","country":"미국 / 영국","cat":"Entertainment · Music","awards":["엔터테인먼트 그랑프리","엔터테인먼트 포 뮤직 그랑프리"],"video":"https://www.youtube.com/watch?v=au-oBjknsSk","videoKind":"케이스 영상 · 한글 자막","ko":"오아시스 재결합 투어에 맞춰, 30년 넘게 이어진 아디다스와 오아시스 팬덤의 관계를 공식 파트너십과 한 편의 필름으로 묶은 캠페인","bg":["영국 밴드 오아시스는 아디다스와 30년 넘게 문화적으로 엮여 있었음. 멤버들이 무대에서 아디다스 트랙수트를 입었고, 팬들도 그 스타일을 따라 입었음. 하지만 둘의 관계는 비공식적인 것이었음.","2025년 오아시스가 'Oasis Live '25' 월드 투어로 돌아오면서, 밴드와 팬덤 전체가 다시 큰 문화적 관심을 받는 순간이 왔음. 아디다스에게는 이 오래된 연결을 공식화하고, 오리지널스 브랜드의 문화적 정통성을 되새길 기회였음.","다만 이런 기회에서 흔히 나오는 결과물은 행사 후원이나 로고를 붙인 굿즈. 심사위원장도 '엔터테인먼트로 위장한 광고는 보고 싶지 않았다'고 말했을 만큼, 진짜처럼 보이는 것이 관건이었음."],"solIntro":["후원사가 아니라 '처음부터 함께한 존재'로 등장했음. 아디다스는 오아시스와 정식 파트너십을 맺고 투어 공식 굿즈를 만들었고, 밴드와 팬이 함께 지나온 30년을 한 편의 필름에 담아 팬들에게 보내는 '러브레터'로 풀었음."],"sol":["아디다스 오리지널스 x 오아시스 Live '25 컬렉션 26종 출시. 노엘 갤러거가 즐겨 입던 파이어버드 트랙수트, 버킷햇, 코치 재킷 등 90년대 스타일을 재해석. 아디다스 매장·온라인·투어 현장에서 판매","캠페인 필름은 오아시스의 첫 싱글 'Live Forever'에 맞춰, 시간을 거슬러 이동하는 크라우드 서퍼(관객 위로 떠밀려 가는 팬)들이 넵워스 공연 같은 전설적인 순간들을 지나 무대 앞으로 향하는 구성","리암과 노엘 갤러거 형제가 필름의 마지막에 함께 등장. 투어 발표 외에는 10여 년 만의 첫 동반 출연","영국 전역에서 실제 오아시스 팬 300여 명을 길거리 캐스팅하고, 아디다스 아카이브의 빈티지 의류와 시대별 헤어·메이크업으로 각 시대를 재현","필름과 함께 공연 현장의 팬들을 담은 룩북도 공개"],"stats":[["+12%","2025년 아디다스 라이프스타일 매출 성장"],["두 자릿수","2025년 오리지널스 성장률"],["26종","출시된 컬렉션"]],"results":["아디다스는 오아시스 협업을 2025년 라이프스타일 매출 12% 성장의 요인 중 하나로 꼽았음. 이번 칸에서 엔터테인먼트 그랑프리(656편 출품)와 엔터테인먼트 포 뮤직 그랑프리를 함께 받음."],"analysis":["심사위원 한 명의 말처럼 '맞는 브랜드, 맞는 밴드, 맞는 타이밍'이 모두 맞아떨어진 사례. 아디다스는 이 순간을 새로 만들 필요 없이, 이미 30년간 존재했던 관계를 증거로 꺼내 쓰기만 하면 됐음.","필름의 주인공이 밴드가 아니라 팬이라는 점이 중요함. 시대를 넘어 무대로 향하는 크라우드 서퍼들은 '밴드와 팬은 처음부터 함께였다'는 메시지를 보여주고, 그 팬들이 입은 옷이 곧 아디다스였다는 사실을 자연스럽게 드러냄.","광고를 문화 속에 끼워 넣지 않고, 브랜드가 그 문화의 일부였다는 역사를 보여준 방식. 심사위원단이 '문화를 방해하지 않고 문화에 참여한 브랜드'로 평가한 이유."],"videoDesc":[{"h":"메인 필름: Original Forever (약 3분)","p":["대사 없이 오아시스의 음악과 공연 실황 사운드로 진행되는 필름이다. 칸에는 이 필름 자체가 케이스로 출품됐다.","어두운 공연장, 팬들이 관객들 위로 떠밀려 가는 크라우드 서핑 장면으로 시작했다. 이들은 마치 시간을 건너뛰듯 90년대 공연장, 대형 야외 공연, 최근 공연까지 시대가 바뀌는 무대들을 차례로 지나갔다.","팬들은 각 시대에 맞는 헤어스타일과 옷차림을 하고 있고, 그 옷차림에는 아디다스 트랙탑과 저지가 자연스럽게 섞여 있었다. 오아시스 멤버의 실제 공연 장면도 교차됐다.","중간에 한 목소리가 짧게 회상했다. 완전히 몰입한 날에는 주변이 온통 혼돈이어도 혼자 가만히 서 있게 되는데, 그게 세상에서 가장 좋은 기분이었다는 이야기다.","크라우드 서퍼들이 마침내 무대 앞에 다다르고, 마지막은 무대 뒤에서 리암과 노엘 갤러거 형제의 모습으로 끝났다."]}],"videoNote":"실제 영상의 화면과 자막을 확인해 정리했다. 노래 가사는 저작권 때문에 옮기지 않았다. 필름의 구성 정보는 에이전시 케이스 페이지를 함께 참고했다.","sources":[["Variety (수상)","https://au.variety.com/2026/biz/news/cannes-lions-entertainment-adidas-oasis-original-forever-38053/"],["CB News (심사평)","https://www.cbnews.fr/node/101927"],["Johannes Leonardo 케이스","https://johannesleonardo.com/case-studies/original-forever/"],["Fashionz (컬렉션 출시)","https://www.fashionz.co.nz/adidas-has-done-it-again-and-theyve-done-it-twice/"]],"films":[{"kind":"메인 필름","title":"Original Forever (약 3분)","url":"https://www.youtube.com/watch?v=mmVwe0Sul68"}]},
 {"id":"copycats-welcome","tier":"grand-prix","title":"Copycats Welcome","brand":"Clash Royale (Supercell)","agency":"DAVID New York","country":"미국 / 핀란드","cat":"Entertainment for Gaming","awards":["엔터테인먼트 포 게이밍 그랑프리"],"video":"https://www.youtube.com/watch?v=Ywz82xGe1To","ko":"클래시 로얄을 베낀 짝퉁 게임 유저들에게, 그동안 쌓은 진행 상황을 진짜 클래시 로얄 재화로 바꿔주겠다고 제안해 유저를 데려온 캠페인","bg":["클래시 로얄은 지난 10년간 가장 성공한 모바일 게임 중 하나. 그만큼 이름, 게임 방식, 심지어 캐릭터까지 베낀 짝퉁 게임이 쏟아졌음. 사커 로얄, 킹 로얄, 러시 로얄 같은 이름들.","문제는 일부 짝퉁 게임이 원조보다 더 잘나가기 시작했다는 것. 유튜버들이 '요즘 뜨는 클래시 로얄 짝퉁'을 리뷰할 정도였고, 플레이어들은 어떤 게 진짜인지 헷갈리기 시작했음.","짝퉁 게임 유저를 데려오는 데는 큰 장애물이 있었음. 다른 게임으로 옮기면 그동안 쌓은 레벨과 재화를 모두 버리고 처음부터 다시 시작해야 한다는 것."],"solIntro":["'그들이 우리 게임을 훔쳤다면, 우리는 그들의 플레이어를 훔치자.' 짝퉁 게임을 소송으로 막는 대신 환영했음. 짝퉁 게임에서 쌓은 진행 상황을 그대로 인정해서, 진짜 클래시 로얄 재화로 바꿔준 것. 처음부터 다시 시작해야 한다는 장벽을 없앤 것이 핵심."],"sol":["짝퉁 게임 유저들이 모이는 레딧 커뮤니티를 직접 겨냥해, 처음으로 짝퉁 게임을 대놓고 저격하는 필름을 공개","필름 속 클래시 로얄 캐릭터(바바리안과 아처)는 포털을 타고 '배시 로얄', '스페이스 로얄' 같은 가짜 게임 세계에 떨어져 자기 짝퉁들과 마주침","전용 사이트에서 짝퉁 게임의 레벨, 플레이 시간, 게임 재화 같은 기록을 공유하면 이를 클래시 로얄 재화로 전환","'가짜 게임은 떠나되, 쌓은 건 가져가라'는 제안"],"stats":[["230만 명","진행 상황을 옮긴 플레이어"],["165만 명","새로 가입한 플레이어"],["540만 명","복귀한 휴면 유저"]],"results":["게임 유튜버와 커뮤니티가 '게임 업계 최초'라며 앞다퉈 소개함. 수치는 캠페인 기간 기준으로, 매체에 따라 3일 또는 5일로 보도됨. 이번 칸에서 엔터테인먼트 포 게이밍 그랑프리를 받음."],"analysis":["위협을 기회로 뒤집은 사례. 짝퉁 게임의 존재 자체가 '클래시 로얄 방식의 게임을 좋아하는 사람이 이만큼 많다'는 증거였고, 그 사람들을 데려오기만 하면 됐음.","사람들이 갈아타지 않는 진짜 이유(쌓아온 진행 상황)를 정확히 찾아서 그걸 없애줬다는 점이 핵심. 광고 메시지가 아니라 장벽 제거가 행동을 바꿨음.","원조로서의 자신감도 톤에 묻어남. 짝퉁을 화내며 공격하지 않고 '환영한다'며 여유 있게 받아쳐서, 유저와 게임 유튜버들의 호응을 끌어냈음."],"films":[{"kind":"메인 필름","title":"So Many Copycats. Only One Clash Royale. (70초)","url":"https://www.youtube.com/watch?v=dmxNEXN0_i4"}],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["'클래시 로얄은 지난 10년간 최고의 게임 중 하나. 그러니 당연히 짝퉁도 많았다'는 나레이션으로 시작했다. 사커 로얄, 킹 로얄, 러시 로얄 같은 짝퉁들이 이름과 게임 방식, 캐릭터까지 베꼈다고 소개했다.","게임 유튜버들이 '요즘 뜨는 짝퉁 붐 아레나', '축구 버전 클래시 로얄인데 왜 안 고소당하지?'라고 말하는 장면이 이어졌다.","'그들이 우리를 앞지르기 시작하자 뭔가 해야 했다. 그들이 우리 게임을 훔쳤으니, 우리가 그들의 플레이어를 훔치면 어떨까?' 그리고 'Copycats Welcome'이 소개됐다.","먼저 짝퉁 게임의 레딧 커뮤니티에 짝퉁을 저격하는 필름을 뿌렸다. 그리고 '거부할 수 없는 제안'을 했다. 가짜 게임은 떠나되 쌓은 건 가져가라는 것이다.","전용 사이트에서 짝퉁 게임의 기록과 재화를 클래시 로얄 재화로 바꾸는 과정이 나왔다. 유튜버들은 '레벨, 플레이 시간, 재화까지 전부 옮겨준다', '이건 게임 업계 최초', '그 짝퉁 지금 바로 지운다'며 반응했다.","'게임을 훔칠 생각이라면, 그들이 당신의 플레이어를 훔쳐갈 수도 있다는 걸 기억하라'는 말로 마무리했다."]},{"h":"메인 필름: So Many Copycats. Only One Clash Royale. (약 1분 10초)","p":["클래시 로얄 공식 채널 영상이다. 클래시 로얄의 바바리안과 아처가 포털에 빨려 들어가 낯선 게임 세계에 떨어지면서 시작했다.","주변을 둘러본 캐릭터가 '이게 뭐야, 짝퉁 클래시 로얄이잖아'라며 놀랐다. 가짜 마녀, 가짜 고블린, 심지어 자기와 똑같이 생긴 '가짜 나'까지 마주쳤다.","짝퉁 캐릭터들은 어설프게 움직이고, 화면 곳곳에 광고가 덕지덕지 붙은 '스페이스 로얄' 같은 세계도 나왔다. 캐릭터는 '깨진 거울을 보는 것 같다'고 말했다.","'집에 갈 시간'이라며 진짜 아레나로 돌아오는데, 짝퉁 캐릭터들이 '데려가 줘'라며 따라왔다. '탓할 수 있겠어? 적어도 전리품은 챙겨왔네'라는 말로 마무리했다. 짝퉁 게임에서 쌓은 걸 들고 넘어오라는 캠페인 메시지를 그대로 담은 결말이다."]}],"videoNote":"실제 영상의 나레이션과 대사 자막을 확인해 정리했다. 참고 사이트에 연결된 케이스 영상은 재생할 수 없어, 같은 케이스의 다른 공개본으로 대체했다.","sources":[["Contagious (게이밍 수상)","https://www.contagious.com/article/cannes-lions-2026-entertainment-lions-for-gaming-winners-cea58c7caded4e309ecef1e23c25e39d"],["LBB Online","https://lbbonline.com/news/DAVID-New-York-Copycat-Games-Clash-Royale"],["Variety (엔터테인먼트 수상)","https://au.variety.com/2026/biz/news/cannes-lions-entertainment-adidas-oasis-original-forever-38053/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"berghain","tier":"grand-prix","title":"Berghain","brand":"ROSALÍA (feat. Björk & Yves Tumor)","agency":"CANADA, Barcelona","country":"스페인","cat":"Entertainment for Music","awards":["엔터테인먼트 포 뮤직 그랑프리"],"video":"https://www.youtube.com/watch?v=htQBS2Ikz6c","videoKind":"뮤직비디오","ko":"다리미질, 버스 타기 같은 평범한 일상 속에 오케스트라와 합창단이 따라다니는 로살리아의 뮤직비디오. 광고가 아닌 뮤직비디오 자체가 그랑프리를 받음","bg":["'Berghain'은 스페인 가수 로살리아의 네 번째 정규 앨범 〈LUX〉의 첫 싱글. 2025년 10월 25일 뮤직비디오가 공개됐음. 곡 제목은 베를린의 유명 클럽 이름에서 따왔고, 비요크와 이브 튜머가 참여했으며, 스페인어·영어·독일어 세 언어로 부름.","이 작품은 브랜드 광고가 아니라 아티스트의 뮤직비디오. 공개된 자료에 특정한 '비즈니스 문제'는 나와 있지 않음. 새 앨범의 첫인상을 결정하는 첫 싱글의 영상으로, 앨범이 어떤 세계인지를 처음 보여주는 역할을 맡았음."],"solIntro":["실연의 아픔을 겪는 한 여성이 영성을 통해 위로와 치유를 찾아가는 이야기. 집에 돌아오기, 병원 진료, 버스 타기 같은 지극히 평범한 장면들이 교향악단과 합창단이 등장하는 음악적 무대로 바뀌는 구성."],"sol":["연출은 바르셀로나 제작사 CANADA의 공동 창업자 니콜라스 멘데스. 크리에이티브 디렉션은 로살리아와 언니 필라르 비야가 맡음","어디를 가든 교향악단이 열정적으로 연주하고 합창단이 로살리아의 노래를 따라다님","12세기 작곡가 힐데가르트 폰 빙엔과 디즈니 아티스트 아이빈드 얼의 어두운 판타지 화풍에서 영감을 받음","흑백에 가까운 꿈같은 영상과 스트로보 효과. 후반부에는 비요크가 새로, 로살리아가 백설공주 차림으로 등장하는 동화 장면이 나옴","폴란드 바르샤바에서 촬영"],"stats":[["4,600만+","유튜브 조회수(2026년 10월 기준)"],["3개","곡에 쓰인 언어"]],"results":["이 부문 그랑프리 두 개 중 하나. 스페인이 이 부문에서 받은 첫 그랑프리이자, 로살리아와 제작사 CANADA 모두에게 첫 칸 그랑프리. 앞서 D&AD 등에서도 상을 받음. 심사위원장은 '눈과 귀를 위한 진짜 성찬'이라고 평가함."],"analysis":["심사위원장은 결국 '아이디어에 얼마나 깊이 몰입했느냐'가 승부를 갈랐다고 말함. 평범한 일상 장면마다 실제 오케스트라를 등장시키는 설정을 끝까지 밀어붙인 집요함이 이 작품의 힘.","일상과 비일상의 충돌이 핵심 장치. 다리미질이나 버스 같은 너무나 평범한 공간에 클래식 오케스트라가 끼어들면서, 실연의 감정이 일상을 집어삼키는 느낌을 시각적으로 보여줌.","칸의 엔터테인먼트 포 뮤직 부문은 음악과 문화, 커뮤니케이션의 연결을 평가함. 브랜드 협업 없이 뮤직비디오 자체가 그랑프리를 받았다는 점은, 크래프트가 충분히 강하면 순수한 콘텐츠도 광고제의 최고상을 받을 수 있다는 걸 보여줌."],"videoDesc":[{"h":"뮤직비디오 (약 3분 30초)","p":["대사 없이 노래와 연주로만 진행됐다. 어두운 실내에서 한 여성의 실루엣이 문을 열고 집으로 들어오는 장면으로 시작했다.","그녀가 머무는 평범한 공간마다 교향악단 단원들이 빼곡히 들어차 연주했다. 좁은 방 안에서 바이올린과 플루트가 울리고, 합창단이 그녀를 둘러쌌다.","시내버스 안 장면에서도 승객 대신 바이올린, 팀파니, 클라리넷 연주자들이 좌석을 채우고 있었다. 일상의 이동마저 하나의 공연처럼 바뀌었다.","후반으로 갈수록 영상은 동화 같은 분위기로 넘어갔다. 나무 그림이 그려진 어두운 방, 정면을 바라보는 사슴, 그리고 기사에 따르면 비요크가 새로, 로살리아가 백설공주 차림으로 등장하는 장면이 이어졌다.","커피 잔에 각설탕이 떨어지는 클로즈업 같은 일상의 작은 장면으로 마무리했다."]}],"videoNote":"뮤직비디오 화면을 확인하고 기사 설명을 함께 참고해 정리했다. 가사는 저작권 때문에 옮기지 않았다.","sources":[["Reason Why","https://www.reasonwhy.es/actualidad/rosalia-canada-grand-prix-entertainment-for-music-cannes-lions-2026"],["Contagious (뮤직 수상)","https://www.contagious.com/en/article/cannes-lions-2026-entertainment-for-music-winners-de1be0c39be547b1babd3085da5e1d87"],["Marketing Directo","https://www.marketingdirecto.com/especiales/cannes-lions/berghain-rosalia-grand-prix-entretenimiento-musical-cannes-lions"]]},
 {"id":"thousand-sponsors-of-muni","tier":"grand-prix","title":"The Thousand Sponsors of Muni","brand":"Club Deportivo Municipal","agency":"McCann Lima","country":"페루","cat":"Entertainment for Sport","awards":["엔터테인먼트 포 스포츠 그랑프리"],"video":"https://www.youtube.com/watch?v=dYbbeA2rn9c","ko":"메인 스폰서를 잃고 몰락한 페루 축구팀이, 유니폼을 1,000칸으로 나눠 팬이 운영하는 동네 가게 1,000곳을 스폰서로 모은 캠페인","bg":["데포르티보 무니시팔('무니')은 1935년 창단한 페루 리마의 축구 클럽. 수많은 팬의 사랑을 받는 전통 있는 팀이지만 최근 몇 년 사이 끝없이 추락했음.","2023년 선수 급여가 밀리면서 1부에서 2부로 강등됐고, 빚을 갚지 못해 2024년 말 리그 참가 자격을 잃고 3부로 떨어졌음. 2026년 3월에는 끝내 부채를 해결하지 못해 아마추어 지역 리그까지 내려갔음.","추락 과정에서 메인 스폰서와 TV 중계권까지 잃었음. 하지만 무니가 끝까지 잃지 않은 것이 하나 있었음. 팬들의 열정. 과제는 이 열정을 지속 가능한 재정 지원으로 바꾸는 것."],"solIntro":["큰 스폰서 하나 대신 작은 스폰서 1,000곳을 모으기로 했음. 유니폼 원단 무늬를 1,000개의 작은 칸으로 다시 디자인하고, 칸 하나하나를 팬이 운영하는 동네 가게에 판매함. 팬덤의 상당수가 동네 상인이라는 점에 착안한 것."],"sol":["한 칸 가격은 200솔(약 60달러). 이발소, 빵집, 철물점, 식당 같은 동네 가게와 개인 팬, 기업까지 참여","새 스폰서가 생길 때마다 클럽이 하나씩 소개","스폰서는 단순 노출이 아니라 실제 혜택을 받음. 클럽 공식 굿즈 판매처가 되고, 팬 커뮤니티에서 '인증된 서포터'로 인정받고, 선수들을 가게 홍보에 무료로 활용할 수 있음","기존 기록(우루과이 클럽의 유니폼 스폰서 142곳)을 크게 넘어섬"],"stats":[["1,000곳","유니폼 스폰서"],["6만 달러","약 3개월간 모은 금액(클럽 기록)"],["1,050만","도달(reach)"]],"results":["모인 돈은 밀린 선수 급여, 유소년팀, 여자팀 등 가장 급한 곳에 쓰였음. 여러 나라 언론이 '1,000개 로고 유니폼'을 보도함. 이번 칸에서 엔터테인먼트 포 스포츠 그랑프리를 받음."],"analysis":["스폰서십의 구조 자체를 뒤집었음. 큰 기업 하나에 기대는 대신, 팬 한 명 한 명이 감당할 수 있는 크기로 쪼개서 '집단의 힘'으로 바꿨음. 몰락한 클럽에게 큰 스폰서는 다시 오지 않지만, 팬은 남아 있다는 현실을 정확히 본 해법.","스폰서에게 노출 이상의 실질적 이익(굿즈 판매권, 선수 홍보)을 준 덕분에, 기부가 아니라 서로 이득이 되는 거래가 됨. 그래서 일회성 응원으로 끝나지 않고 지속 가능한 구조가 됨.","1,000개 로고로 뒤덮인 유니폼 자체가 강렬한 시각적 상징이 되어, 별도의 광고 없이도 뉴스가 됐음. 결과물(유니폼)이 곧 미디어인 셈."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["'1935년 창단해 수백만 명의 사랑을 받는 페루 축구 클럽 데포르티보 무니시팔. 영광스러운 역사에도 지금은 3부 리그에서 뛴다'는 나레이션으로 시작했다.","추락이 클럽의 모든 것을 앗아갔지만, 그중 가장 치명적인 건 메인 스폰서를 잃은 것이었다고 설명했다. 하지만 무니가 한 번도 잃지 않은 건 팬들의 열정이었다고 했다.","'그 열정을 어떻게 진짜 지속 가능한 재정 지원으로 바꿀까?'라는 질문과 함께 '무니의 천 개의 스폰서'가 소개됐다. 팬이 운영하는 작은 가게 1,000곳이 소액 후원으로 함께 팀을 지원하는 스폰서십 플랫폼이다.","유니폼을 1,000개의 작은 칸으로 다시 디자인한 과정이 나오고, 동네 식당, 양조장 같은 가게 사장님들이 '우리 가게는 어디서 신청하면 되느냐'며 참여하는 SNS 영상들이 이어졌다.","스폰서가 얻는 혜택이 소개됐다. 공식 굿즈 판매처 지정, 팬 커뮤니티의 인증 서포터, 선수들을 가게 홍보에 무료로 쓸 권리다.","1,000이라는 숫자와 1,050만 도달 수치가 나오고, 로고로 빼곡한 유니폼 클로즈업과 함께 '열정이 집단 행동이 되면 무엇이든 해낼 수 있다'는 말로 마무리했다."]}],"videoNote":"실제 영상의 나레이션과 화면 자막을 확인해 정리했다. 자동 자막의 클럽명 오류는 바로잡았다. 참고 사이트에 연결된 케이스 영상은 재생할 수 없어 같은 케이스의 다른 공개본으로 대체했다.","sources":[["Ámbito (클럽 상황·성과)","https://www.ambito.com/deportes/la-insolita-estrategia-un-club-peruano-que-descendio-3-veces-seguidas-una-camiseta-1000-sponsors-n6306476"],["Contagious (스포츠 수상)","https://www.contagious.com/article/cannes-lions-2026-entertainment-for-sport-winners-415705a1ba17464e903926d923808e28"],["Vistazo","https://www.vistazo.com/deportes/2026-07-28-deportivo-municipal-lleno-camiseta-1-000-patrocinadores-superar-crisis-economica-GC11133371"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"your-way-out","tier":"grand-prix","title":"Your Way Out","brand":"Coinbase","agency":"Isle of Any, London (& Coinbase Creative Studio)","country":"영국 / 미국","cat":"Film Craft","awards":["필름 크래프트 그랑프리"],"video":"https://www.youtube.com/watch?v=spmjIn5NaV0","videoKind":"케이스 영상","ko":"정해진 대로만 움직이던 비디오게임 속 NPC가 규칙을 깨고 게임 밖 현실 세계로 탈출하는 코인베이스 광고. AI나 CG 없이 실제 세트와 분장으로 게임 화면을 재현함","bg":["코인베이스는 미국의 암호화폐 거래소. 오래전부터 '이제 시스템을 업데이트할 때(It's time to update the system)'라는 메시지로 느린 송금, 불필요한 절차 같은 기존 금융 시스템의 낡은 방식을 비판해 왔음.","2026년 2월 슈퍼볼에서는 노래방 콘셉트의 'Everybody Coinbase' 광고를 냈고, 이어서 3월 15일 제98회 아카데미 시상식 중계에 이 광고를 처음 공개했음. 전 세계가 보는 큰 무대에서 브랜드 메시지를 한 번 더 강하게 보여줘야 하는 자리.","다만 공개된 자료에는 매출이나 이용자 수 같은 구체적인 비즈니스 문제가 나와 있지 않음. 기사들이 전하는 과제는 '기존 금융 시스템에서 벗어나라'는 브랜드 메시지를 사람들이 감정적으로 받아들이게 만드는 것."],"solIntro":["사람들을 '누군가 대신 컨트롤러를 쥐고 있는 게임 속 캐릭터'에 빗댔음. 기존 금융 시스템 안에서 정해진 대로 사는 사람을 비디오게임 속 NPC(플레이어가 조종하지 않는, 정해진 행동만 반복하는 캐릭터)로 그리고, 그 NPC가 스스로 규칙을 깨고 탈출하는 이야기로 '코인베이스가 당신의 탈출구'라는 메시지를 전함."],"sol":["아이디어의 출발점은 에이전시 공동 창업자 로리 하월의 생각. '인생은 다른 누군가가 컨트롤러를 쥔 게임'이라는 것","연출은 MJZ 소속 감독 오스카 허드슨. AI도, VFX도 쓰지 않는다는 원칙을 세우고 게임 같은 화면을 카메라로 직접 찍어서 만들었음. 주인공을 쫓아오는 화살표 정도만 디지털 효과","길이 80m짜리 세트 두 개와 미니어처를 지었고, 저해상도로 출력한 이미지를 세트 표면과 의상 원단에 입혔음. 얼굴에는 픽셀처럼 보이게 인쇄한 마스크와 분장을 씌움","배우들은 게임 캐릭터 특유의 뻣뻣하고 끊기는 움직임을 안무로 연습함. 촬영은 남아프리카공화국 케이프타운에서 진행","이야기가 진행될수록 화면이 게임 세계에서 실제 세계로 서서히 바뀌게 설계함. 주인공이 자기 삶의 통제권을 되찾는 과정을 화면의 질감 변화로 보여주려는 의도","음악은 'I Gotta Be Me'의 웅장한 편곡 버전. 자기 방식대로 살겠다는 노래가 탈출 장면을 이끔"],"stats":[["필름 크래프트 GP","칸 라이언즈 2026"],["블랙 펜슬","D&AD 2026"],["80m × 2","직접 지은 세트"]],"results":["아카데미 시상식 중계로 처음 공개됨. 이번 칸에서 필름 크래프트 그랑프리를 받았고, 앞서 D&AD 최고상인 블랙 펜슬도 받음. 프라임타임 에미상 광고 부문 후보에도 오름."],"analysis":["추상적인 금융 메시지를 누구나 아는 이미지로 바꿨음. '기존 금융 시스템에 묶여 있다'는 말은 와닿지 않지만, 정해진 길만 걷는 게임 NPC는 한눈에 이해됨. 화살표가 '틀린 방향'이라고 쫓아오는 장면 하나로 시스템의 압박을 보여줌.","AI로 무엇이든 만들 수 있는 시기에 굳이 모든 걸 손으로 지었다는 점이 크래프트 부문에서 높이 평가받은 이유. 실제 사람과 세트로 찍었기 때문에 게임처럼 보이면서도 묘하게 살아 있는 느낌이 나고, 그래서 주인공에게 감정이입이 됨.","형식과 메시지가 맞물림. 화면이 게임에서 현실로 바뀌는 것 자체가 '시스템에서 벗어나 내 삶의 주인이 된다'는 이야기를 그대로 보여주는 장치. 마지막 문구 '그들의 시스템에서 벗어나는 당신의 탈출구'로 코인베이스의 역할을 정리함."],"films":[{"kind":"메인 필름","title":"Your Way Out | Extended Cut (2분 9초)","url":"https://www.youtube.com/watch?v=HQJMzTpckPo"},{"kind":"메인 필름","title":"Your Way Out (60초)","url":"https://www.youtube.com/watch?v=0V4CCxskN_0"}],"videoDesc":[{"h":"먼저 알아둘 맥락","p":["NPC는 비디오게임에서 플레이어가 조종하지 않는 캐릭터다. 정해진 길을 걷고 정해진 대사만 반복한다. 이 광고에서 NPC는 기존 금융 시스템 안에서 정해진 대로 사는 사람을 뜻한다. 영상은 거의 노래로만 진행되고, 노래 가사는 저작권 때문에 옮기지 않는다."]},{"h":"케이스 영상 (약 1분)","p":["칸 출품용으로 알려진 짧은 영상이다. 광고 본편 장면과 촬영 현장 모습을 섞어 보여줬다.","정장을 입은 주인공이 게임 화면처럼 보이는 거리를 걷는 장면으로 시작했다. ATM, 간판, 행인 모두 게임 그래픽처럼 보이지만 실제로 지은 세트와 사람.","주인공이 정해진 길을 벗어나 고가도로 위를 달리는 장면이 이어지고, 후반에는 카메라가 뒤로 빠지면서 사막 언덕을 달리는 배우와 그 모습을 지켜보는 촬영 스태프가 드러났다.","'좋아, 컷. 꽤 괜찮았어'라는 목소리로 끝났다. 게임처럼 보였던 장면이 전부 실제 촬영이었다는 걸 보여주는 마무리했다."]},{"h":"메인 필름: Extended Cut (약 2분)","p":["게임 속 도시. 주인공은 다른 캐릭터들과 똑같이 정해진 길을 따라 걷고, 머리 위에는 갈 방향을 알려주는 화살표가 떠 있었다. 누군가 '빨리 좀 가, 굼벵이'라고 핀잔을 줬다.","관리자 캐릭터가 게임 대화창으로 '환영합니다, 플레이어 3984. 줄을 서시겠습니까?'라고 묻는 장면이 나왔다. 주인공에게 붙은 번호가 시스템 속 한 명일 뿐이라는 걸 보여줬다.","주인공이 정해진 동선을 벗어나 춤추듯 움직이기 시작하자 '잘못된 방향'이라는 경고와 함께 화살표가 그를 쫓아왔다. 관리자는 '플레이어 3984, 최근 행동은 절대 용납할 수 없다'고 경고했다.","주인공은 멈추지 않고 달려 나갔다. 장면이 바뀔수록 게임 그래픽 같던 화면이 점점 햇빛 비치는 실제 도시 풍경으로 변했다.","마지막에 푸른 화면 위로 '그들의 시스템에서 벗어나는 당신의 탈출구(Your way out of their system)'라는 문구가 뜨며 끝났다."]}],"videoNote":"실제 영상의 화면과 대사 자막을 확인해 정리했다. 노래 가사는 저작권 때문에 옮기지 않았다. 케이스 영상은 공식 채널이 아닌 공개 업로드본.","sources":[["Adweek","https://www.adweek.com/creativity/coinbases-oscars-ad-turns-a-video-game-npc-into-a-financial-rebel/"],["Creative Review","https://www.creativereview.co.uk/coinbase-oscars-ad-oscar-hudson-isle-of-any/"],["CJC (제작 과정)","https://cjc.org.za/2026/08/03/crafting-a-cannes-winner-the-human-way/"],["Reason Why (필름 크래프트 수상)","https://www.reasonwhy.es/actualidad/anuncios-mejor-hechos-film-craft-cannes-lions-2026"],["D&AD","https://www.dandad.org/work/d-ad-awards-archive/your-way-out"]]},
 {"id":"a-time-and-a-place","tier":"grand-prix","title":"A Time and a Place","brand":"Claude (Anthropic)","agency":"Mother London","country":"영국 / 미국","cat":"Film","awards":["필름 그랑프리"],"video":"https://www.youtube.com/watch?v=X4i0k68wOGU","videoKind":"케이스 영상","ko":"AI 챗봇에 광고가 들어오면 어떻게 될까? 진지한 상담 도중 갑자기 광고를 늘어놓는 'AI'를 사람이 연기해 보여준 클로드의 슈퍼볼 캠페인. 'Can I Get a Six Pack Quickly?'와 'How Can I Communicate Better With My Mom?' 두 편이 필름 그랑프리를 받음","bg":["2026년 1월 오픈AI가 챗GPT 무료 이용자와 저가 요금제(월 8달러 'Go')에 광고를 시험 도입하겠다고 발표했음. 답변 아래에 광고를 붙이는 방식. AI 챗봇도 검색엔진이나 SNS처럼 광고로 돈을 버는 시대가 오고 있었음.","앤트로픽은 클로드에 광고를 넣지 않겠다고 블로그로 공식 발표함. AI와의 대화에서는 사람들이 검색보다 훨씬 많은 개인적인 맥락을 털어놓기 때문에 광고의 영향에 취약하다는 이유. 광고 수익 없이 무료 이용을 유지하는 데 따르는 비용 부담도 인정했음.","비즈니스 측면의 과제는 인지도. 당시 챗GPT의 주간 이용자는 9억 명 가까이 됐고, 클로드의 월간 이용자는 약 3,000만 명 수준. 기업 고객에게는 알려져 있었지만 일반 소비자에게는 존재감이 약했음. 케이스 영상도 스스로를 '눈에 띄지 않던 도전자'라고 표현함."],"solIntro":["광고계에서 가장 큰 무대인 슈퍼볼을 골라 '광고에 반대하는' 광고를 냈음. 경쟁사를 직접 공격하는 대신, AI가 광고 모델을 따르면 어떤 장면이 펼쳐질지를 우스꽝스럽게 극단까지 밀어붙였음. 캠페인 이름은 'A Time and a Place'. 광고에도 때와 장소가 있다는 뜻."],"sol":["총 네 편의 광고를 2026년 2월 4일에 공개. 그중 'Can I Get a Six Pack Quickly?'는 2월 8일 제60회 슈퍼볼 1쿼터에, 'How Can I Communicate Better With My Mom?'은 킥오프 전 30분 사이에 방송됨. 칸 필름 그랑프리는 이 두 편에 주어짐","AI 챗봇을 사람 배우가 연기하는 설정. 사용자가 질문하면 화면 속 'AI'가 친절하게 상담해 주다가, 대화 흐름을 타고 자연스럽게 광고를 끼워 넣음","식스팩 편에서는 근육질 트레이너가 AI 역할. 맞춤 운동 계획을 짜준다며 나이, 키, 몸무게를 묻고는, 키가 작은 남성에게 키높이 깔창 광고와 할인 코드를 읊음. 엄마 편에서는 상담사 같은 여성이 그럴듯한 대화법을 조언하다가 '관계를 회복할 수 없다면'이라며 연상 여성 데이트 사이트를 권함","광고마다 같은 문구로 끝남. '광고는 AI에 들어온다. 하지만 클로드에는 아니다.' 그리고 클로드의 슬로건 'Keep thinking.'","연출은 비스킷 필름웍스의 제프 로우. 같은 캠페인은 필름 부문 골드·실버, 크리에이티브 스트래티지 실버도 받음"],"stats":[["+305%","일일 가입자 증가(케이스 영상)"],["15% → 28%","AI 분야 화제 점유율(케이스 영상)"],["2,127건","전 세계 언론 보도(케이스 영상)"],["+11%","슈퍼볼 이후 일간 이용자 증가(BNP 파리바 데이터)"]],"results":["케이스 영상에 따르면 언론 보도 2,127건, 언론 노출 도달 83억 회, AI 분야 화제 점유율이 15%에서 28%로 두 배 가까이 늘었고, 일일 가입자는 305% 증가함. 클로드 앱은 애플 앱스토어 무료 앱 상위 10위에 들었고, 슈퍼볼 직후 미국 구글 검색 관심도에서 하프타임 공연자 배드 버니를 앞선 순간도 있었음.","샘 올트먼 오픈AI CEO가 X에 '재밌지만 명백히 부정직하다'고 공개
