' '좋아 보이네.' '너도.' '밖은 추워. 여긴 좀 따뜻하네.'","나이 드는 것에 대해 웃으며 말한다. '어쩌겠어.' '코트 입어야지. 그게 인생이지. 점점 좋아지다가… 나빠지다가…' 테이블 위에서 서로의 손을 잡는다. 몽클레르 로고."]}],"sources":[["CB News (심사평·출품 수)","https://www.cbnews.fr/node/101986"],["Contagious (럭셔리 수상)","https://www.contagious.com/article/cannes-lions-2026-luxury-winners-89446dd0699d414491e99676b1b12d75"],["Luxury Tribune (2025 실적·캠페인 공개)","https://www.luxurytribune.com/en/moncler-remains-steady-in-the-third-quarter-of-2025"],["llllitl (제작 정보)","https://www.llllitl.fr/2026/07/moncler-warmer-together/"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"build-your-own-super-bowl","tier":"grand-prix","title":"Build Your Own Super Bowl Commercial","brand":"Uber Eats","agency":"Special (미국 & 호주)","country":"미국 / 호주","cat":"Media","awards":["미디어 그랑프리","다이렉트 골드"],"video":"https://www.youtube.com/watch?v=ftlLzZKzU1U","ko":"음식을 주문하듯 앱에서 장면을 골라 '나만의 슈퍼볼 광고'를 만들게 한 우버이츠 캠페인. 1,000편이 넘는 광고 조합을 만들고, 완성할 때마다 할인 혜택을 줘 주문으로 연결함","bg":["우버이츠를 모르는 미국인은 거의 없지만(인지도 91%), 실제 사용자는 경쟁사 도어대시의 절반에도 못 미쳤음(월간 사용자 2,100만 명 대 4,900만 명). 2025년 도어대시 사용자가 14% 늘 때 우버이츠는 3% 줄었음.","문제는 인지도가 아니라 주문. 우버이츠는 2년째 '미식축구는 음식을 팔려고 만든 것'이라는 음모론 콘셉트로 슈퍼볼 광고를 해왔지만, 광고를 재밌게 봐도 그게 바로 주문으로 이어지지는 않았음. (미식축구 용어에 음식 단어가 숨어 있다는 말장난이 웃음 포인트. 쿼터백이 뛰는 '스크램블'은 스크램블드에그, 상대를 납작하게 눕히는 '팬케이크 블록'은 팬케이크.)"],"solIntro":["광고를 앱 안으로 옮겼음. 음모론의 '증거'들을 우버이츠 앱에 모두 넣고, 사람들이 포케볼이나 부리토볼 메뉴를 고르듯 재료(장면)를 골라 자기만의 슈퍼볼 광고를 '주문'하게 했음. 광고를 보는 곳이 곧 주문하는 곳이 되도록 만든 것."],"sol":["TV 광고는 슈퍼볼 LX 2쿼터에 방송. 매튜 매커너히가 '미식축구는 음식을 팔려는 음모'라고 주장하고, 브래들리 쿠퍼가 반박하는 구성","앱에서는 선택할 때마다 새로운 증거 장면과 유명인 카메오가 열림. 40개가 넘는 증거, 1,000개가 넘는 광고 조합","광고를 하나 완성할 때마다 다음 주문에 쓸 수 있는 할인 혜택을 줌"],"stats":[["3,600만 달러+","역대 슈퍼볼 매출 기록 경신 폭"],["370만","신규 앱 방문"],["1,000편+","제작한 광고 조합"]],"results":["우버이츠는 역대 최고의 슈퍼볼 매출을 기록해 이전 기록을 3,600만 달러 넘게 경신함. 370만 건의 신규 앱 방문을 끌어냈고, 전환율도 사상 최고를 기록함. 이번 칸에서 미디어 그랑프리를 받음."],"analysis":["광고를 봐도 주문으로 이어지지 않는 건, 보는 곳과 주문하는 곳이 달라서. 광고를 앱 안으로 옮겨 그 거리를 없앴음. 심사위원장은 이를 '퍼널을 무너뜨렸다'고 표현함.","메뉴를 고르듯 장면을 고르는 경험이 곧 앱 사용 경험이고, 마지막 할인 혜택이 실제 주문으로 마무리함. 2년간 쌓은 음모론 세계관이 있어서 가능한 확장이었음."],"films":[{"kind":"메인 필름","title":"슈퍼볼 LX TV 광고 (60초)","url":"https://www.youtube.com/watch?v=vEFUlSYbzM8"}],"videoDesc":[{"h":"케이스 영상 (약 2분 10초)","p":["미국 최대의 스포츠 엔터테인먼트 날이 어떻게 우버이츠의 기록적인 매출의 날이 됐을까.","우버이츠는 2년 동안 '미식축구는 음식을 팔기 위해 만들어졌다'는 음모론을 파헤쳐 왔고, 증거는 계속 늘어났다. 선수 이름이 '양고기, 농어, 레드와인'이라면? 그건 선수 명단이 아니라 프랑스 코스 요리다.","이번 슈퍼볼에는 모든 증거를 앱에 넣었다. 팬들은 포케볼이나 부리토볼을 고르듯 자기만의 '진실'을 주문한다. 재료를 고를 때마다 새로운 증거가 열린다. '명예의 전당 건물은 사실 착즙기다' 같은 새 장면과 농담, 새 등장인물이 나타난다.","우버이츠 앱이 처음으로 엔터테인먼트 공간이 됐고, 1년 중 가장 치열한 주간에 신규 방문 370만 건을 만들었다. 이를 위해 1,000편이 넘는 맞춤형 슈퍼볼 광고를 만들었다. 모든 장면을 사람이 직접 만들어, 어떤 조합이든 자연스럽게 이어진다.","광고를 완성할 때마다 할인 혜택이 열려 재미가 주문으로 이어졌다. 이전 기록을 3,600만 달러 넘게 경신한 역대 최고 슈퍼볼 매출. 다른 브랜드들이 광고에 시간을 쓰게 할 때, 우리는 앱에 시간을 쓰게 했다. 슈퍼볼 온 우버이츠."]},{"h":"메인 필름: 슈퍼볼 TV 광고 (약 1분)","p":["아침 식탁. 매커너히가 브래들리 쿠퍼에게 음모론을 꺼낸다. '쿼터백이 뛰면 스크램블이라고 하지. 아침으로 스크램블 어때?' 쿠퍼가 귀찮아한다. '다른 데 갈 데 없어?'","매커너히는 '증거'를 줄줄이 내민다. 골대는 포크 모양이다. 선수 이름에 햄(Ham), 체리(Cherry)가 들어간다. 쿠퍼가 '골라서 말하는 거잖아(cherry picking)'라고 하자, 그것마저 체리라고 받아친다.","파커 포지가 끼어든다. '팬케이크 블록 얘기는 했어?' 그리고 프로 미식축구 명예의 전당 건물을 보여준다. '저건 착즙기야.'","결국 쿠퍼가 '그만 싸우자(squash this beef)'고 하자, 매커너히가 또 받아친다. '비프(beef)도 음식이네.' 미식축구가 배고프게 만들면, 우버이츠로 주문하세요."]}],"sources":[["LBB Online (수상·심사평·성과)","https://lbbonline.com/news/uber-eats-special-cannes-grand-prix-2026"],["B&T (호주 첫 그랑프리)","https://www.bandt.com.au/special-australia-delivers-australias-first-2026-cannes-grand-prix/"],["Uber 뉴스룸 (캠페인 구성)","https://uber.com/newsroom/super-bowl-lx-from-app-to-endzone/"],["Chowhound (1,000개 버전)","https://www.chowhound.com/2094892/uber-eats-superbowl-2026-commercial-thousand-versions"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"field-barcode","tier":"grand-prix","title":"Field Barcode","brand":"Mercado Livre","agency":"GUT, São Paulo","country":"브라질","cat":"Outdoor","awards":["아웃도어 그랑프리","아웃도어 브론즈"],"video":"https://www.youtube.com/watch?v=KATqp4QLnS8","ko":"축구장 잔디를 길이 104m짜리 바코드 모양으로 깎아, TV 중계 화면을 스캔하면 할인 쿠폰이 나오게 만든 메르카도 리브레의 경기장 캠페인","bg":["메르카도 리브레는 중남미 최대 이커머스 기업. 상파울루 파카엥부 경기장의 이름 사용권을 샀음.","하지만 경기장 스폰서십은 보통 로고 노출에서 끝남. 과제는 이를 실제 구매로 연결하는 것."],"solIntro":["경기장 자체를 '결제 페이지'로 만들었음. 축구장 잔디를 깎는 방향에 따라 생기는 밝고 어두운 줄무늬에 착안해, 잔디 전체를 하나의 거대한 바코드로 깎았음. TV로 경기를 보는 사람이 휴대폰으로 화면 속 잔디를 스캔하면 바로 할인 쿠폰을 받는 구조."],"sol":["잔디를 밝은 줄과 어두운 줄로 번갈아 깎아 길이 104m의 바코드를 만듦. 대부분의 TV 카메라 각도에서도 인식되도록 설계","데뷔 무대는 코린치안스 대 보카 주니어스 경기. 2012년 코파 리베르타도레스 결승을 재현한 매치로 큰 관심을 모은 경기","TV, 디즈니+, 유튜브로 경기를 보던 팬들이 전용 웹앱으로 화면 속 잔디를 스캔하면, 메르카도 리브레에서 쓸 수 있는 25% 할인 쿠폰이 열림. 중계를 끄지 않고도 바로 쇼핑할 수 있게 함","축구 유니폼, 골키퍼 장갑처럼 경기를 보며 사고 싶어지는 상품과 연결"],"stats":[["53,000장+","사용된 쿠폰"],["150만 유로+","발생한 매출"],["813개 도시","쿠폰을 쓴 지역(25개 주)"]],"results":["5만 3,000장이 넘는 쿠폰이 사용됐고 150만 유로가 넘는 매출이 발생함. 브라질 25개 주 813개 도시에서 접속함. 이번 칸 아웃도어 그랑프리. 심사위원장은 이 아이디어를 '필연적(inevitable)'이라고 표현함."],"analysis":["경기장 스폰서십은 로고 노출에서 끝난다는 문제를, 경기장 바닥 자체를 구매 버튼으로 만들어 풀었음. 이커머스 기업의 스폰서십이 노출이 아니라 매출로 성과를 증명한 것.","누구나 본 적 있는 잔디 줄무늬를 바코드로 바꾸기만 했음. 경기도 시야도 해치지 않으면서 TV를 통해 수백만 거실로 들어가는 옥외 광고. '왜 이제야 나왔나' 싶은 자연스러움이 심사위원장이 말한 '필연적'의 의미."],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["축구장마다 잔디 무늬가 있다. 잔디를 깎는 방식에 따라 체크무늬도, 줄무늬도 생긴다.","메르카도 리브레가 새로 문을 연 파카엥부 경기장의 이름 사용권을 샀다. 경기장의 새 이름은 '메르카도 리브르 아레나 파카엥부'.","드론 화면 속 잔디가 굵고 가는 줄무늬로 깎여 거대한 바코드가 된다. 길이 104m.","코린치안스 대 보카 주니어스 경기 중계. 해설진이 말한다. '잔디가 바코드처럼 보이지 않나요?' 관중과 시청자가 휴대폰으로 화면 속 잔디를 스캔하자, 골키퍼 장갑과 유니폼 등에 쓸 수 있는 25% 할인 쿠폰이 뜬다.","집집마다 TV 화면을 스캔하는 SNS 영상들. 25개 주 813개 도시에서 접속했다. 언론은 '파카엥부가 바코드가 됐다'고 보도했다.","실제 중계 장면과 유명 축구인의 반응으로 끝난다."]}],"sources":[["Propmark (그랑프리·심사)","https://propmark.com.br/cannes/2026/outdoor/gut-conquista-grand-prix-em-outdoor-lions/"],["WeRSM (실행·성과)","https://wersm.com/mercado-libre-turned-a-soccer-field-into-a-giant-barcode/"],["LBB Online (브라질 수상작)","https://lbbonline.com/news/brazil-cannes-lions-winners-2026-grand-prix"]],"videoKind":"케이스 영상 · 한글 자막","films":[]},
 {"id":"relax-your-tight-end","tier":"grand-prix","title":"Relax Your Tight End","brand":"Novartis","agency":"Fallon, Minneapolis","country":"미국","cat":"Pharma","awards":["파마 그랑프리","파마 실버"],"video":"https://www.youtube.com/watch?v=6qntVs_kftA","ko":"전립선암 검사는 '불편한 직장 검사'가 아니라 간단한 피검사로 시작할 수 있다는 걸, NFL 타이트엔드 선수들이 편하게 '힘을 빼는' 모습으로 알린 노바티스의 슈퍼볼 광고","bg":["노바티스는 전립선암 치료제(플루빅토)를 가진 제약사. 그런데 미국에서 검사 대상 나이의 남성 4,030만 명이 PSA 검사를 한 번도 받지 않았음. 일찍 발견하면 5년 생존율이 99%를 넘지만, 검사를 피하면 그만큼 늦게 발견됨.","남성의 약 60%는 전립선암 검사가 곧 '손가락 직장 검사'라고 잘못 알고 있었고, 그게 싫어서 검사를 미뤘음. 실제로는 피를 뽑는 간단한 혈액검사(PSA 검사)로 시작할 수 있음."],"solIntro":["'긴장 풀어, 피검사야.' 남자들이 검사를 피하는 진짜 이유, 직장 검사에 대한 두려움을 웃기게 정면으로 다뤘음. 미식축구 포지션 '타이트엔드(tight end)'가 '꽉 조인 엉덩이'로도 들린다는 말장난이 출발점."],"sol":["슈퍼볼 LX에서 60초 광고 공개. NFL 타이트엔드들이 마사지를 받거나 수영장에 둥둥 떠 있는 등 한껏 이완한 모습으로 등장하고, '손가락이 필요 없는 간단한 혈액검사'라고 말함","전립선암을 이겨낸 브루스 에어리언스 감독이 출연하고, 롭 그롱코프스키가 마지막 문구 '타이트엔드에 힘 빼'를 말함","NFL 경기장 현장 검사, 슈퍼볼 행사장 교육 부스, 온라인 정보 허브와 위험도 자가 진단 도구로 확장"],"stats":[["9.8배","온라인 장바구니에 담긴 PSA 검사 증가"],["#2","디 애슬레틱 선정 슈퍼볼 최고 광고"],["236편","파마 부문 출품작 중 유일한 그랑프리"]],"results":["온라인 장바구니에 담긴 PSA 검사가 9.8배 늘었음. 디 애슬레틱 '슈퍼볼 최고 광고' 2위에 올랐음. 이번 칸 파마 그랑프리. 심사위원장은 '공감 가는 인간적 진실, 진정성 있는 유명인 활용, 채널 전반의 통합'을 높이 평가함."],"analysis":["남자들이 검사를 피한 건 정보가 없어서가 아니라 '그 검사'가 싫어서였음. 캠페인은 그 두려움을 웃음으로 꺼내고 '피검사로 시작하면 된다'는 해결책을 바로 붙였음.","말장난 하나로 메시지와 모델이 동시에 정해졌음. 타이트엔드 선수들이 '힘 뺀 엉덩이'를 보여주는 설정이 슈퍼볼을 보는 남성 시청자에게 정확히 맞았고, 현장 검사와 자가 진단으로 실제 검사까지 이어지게 했음."],"films":[{"kind":"메인 필름","title":"Relax your tight end. 슈퍼볼 광고 (60초)","url":"https://www.youtube.com/watch?v=lMTcZb48aVU"},{"kind":"메인 필름","title":"Relax, it's a blood test (30초)","url":"https://www.youtube.com/watch?v=z5FGLIGjnKA"}],"videoDesc":[{"h":"케이스 영상 (약 2분)","p":["남성 8명 중 1명은 전립선암 진단을 받는다. 그런데 검사받지 않는 남성이 4,000만 명이다. 실제 남성들이 털어놓는다. 그 검사(손가락 검사)가 싫어서 안 받는다고.","하지만 시작은 간단한 PSA 혈액검사다. 그래서 남자들에게 말하기로 했다. 긴장 풀라고. 경기 속 타이트엔드와 꽉 조인 엉덩이 그림이 나란히 나온다.","슈퍼볼 광고. 선수들이 얼굴 마사지를 받고, 물 위에 둥둥 떠 있고, 화이트보드에 적어 보여준다. 남성 8명 중 1명은 평생 전립선암 진단을 받는다.","슈퍼볼 현장 이벤트, 검사 정보를 담은 웹사이트, 선수 가족과 친구들이 참여한 소셜 영상, 경기장 검사 부스와 이동 검진 차량으로 이어진다.","언론이 뽑은 '최고의 슈퍼볼 광고'. 온라인 장바구니에 담긴 PSA 검사는 9.8배 늘었다. 비뇨기과 학회 가이드라인도 PSA를 첫 번째 검사로 권고한다. 그롱코프스키는 투데이 쇼에 출연했다."]},{"h":"메인 필름: 슈퍼볼 광고 (약 1분)","p":["엔야의 'Only Time'이 흐른다. '살면서 이렇게 느긋한 타이트엔드를 본 적 있는가?' NFL 타이트엔드들이 얼굴 마사지를 받고, 수영장에 둥둥 떠 있고, 말을 타고 들판을 걷는다.","걱정 없고, 차분하고, 평온하다. 이들은 왜 이렇게 느긋할까? 전립선암 검사 때문이다. '손가락이 필요 없는' 간단한 혈액검사가 있다는 걸 알게 됐다.","브루스 에어리언스 감독. '남성 약 8명 중 1명이 전립선암 진단을 받습니다. 나도 그중 한 명이었죠. 일찍 발견해서 지금 여기 있습니다. 그롱크, 내가 뭘 가르쳐줬지?'","롭 그롱코프스키. '타이트엔드에 힘 빼.' 전립선암 검사는 간단한 혈액검사로 시작한다. 검사 정보 사이트 주소."]}],"sources":[["Fierce Pharma (수상·광고 구성)","https://www.fiercepharma.com/marketing/novartis-relax-your-tight-end-cancer-campaign-wins-cannes-lions-pharma-grand-prix"],["Contagious (파마 수상)","https://www.contagious.com/article/cannes-lions-2026-pharma-winners-6c090db2d3134c75ba55a61f0fc5426c"],["Campaign (미국 수상작)","https://campaignlive.com/article/whos-leading-cannes-lions-2026-every-us-winner-ranked/1962450"]],"videoKind":"케이스 영상 · 한글 자막"},
 {"id":"periodic-fable","tier":"grand-prix","title":"The Periodic Fable","brand":"The Ordinary","agency":"Uncommon Creative Studio, London","country":"영국 / 캐나다","cat":"Health & Wellness","awards":["헬스 & 웰니스 그랑프리"],"video":"https://www.youtube.com/watch?v=KzzcVMa7gY4","videoKind":"메인 필름 · 한글 자막","ko":"원소 주기율표의 원소들을 '모공 제로', '주름 삭제' 같은 뷰티 광고 문구 49개로 바꾼 '가짜 주기율표'로, 과학처럼 포장된 화장품 마케팅을 비꼰 디 오디너리 캠페인","bg":["뷰티 업계에는 '안티에이징', '주름 삭제'처럼 과학인 척하지만 근거 없는 표현이 넘쳐남.","성분과 과학을 투명하게 공개하는 것이 정체성인 디 오디너리에게, 과제는 이런 과장 광고와의 차이를 분명히 하는 것."],"solIntro":["과학의 상징인 주기율표를 패러디했음. 원소 자리에 뷰티 업계의 근거 없는 유행어 49개를 넣은 '주기율 우화(The Periodic Fable)'를 만들어, 과학처럼 보이는 말들이 사실은 지어낸 이야기라는 걸 보여줌. 주기율표(Periodic Table)와 우화(Fable)를 합친 말장난."],"sol":["감독 올리비아 드 캠프스가 차갑고 미래적인 교실을 배경으로 필름을 연출","흰 옷을 입은 '학생들'이 주문에 걸린 듯 얼굴을 문지르고 당기는 관리법을 반복함. 모두 실제로 판매되는 관리법","과학자들과 협업해 과학적 정확성을 확인","옥외, 소셜, 인플루언서로 확장하고 웹사이트에서 '주기율 우화'를 볼 수 있게 함"],"stats":[["49개","주기율표에 넣은 뷰티 유행어"],["51%","'럭셔리' 표현 제품을 더 신뢰하는 영국 소비자"],["블랙 펜슬","D&AD 2026"]],"results":["이번 칸 헬스 & 웰니스 그랑프리. 심사위원장은 '이견 없는 수상작'이라며 '통제 불능이 되어가는 피부 트렌드 집착에 대한 뛰어난 논평'이라고 평가함. D&AD 블랙 펜슬도 받음."],"analysis":["과장 광고가 과학처럼 보이려고 쓰는 형식(실험실, 원소, 주기율표)을 그대로 가져와 그 안을 유행어로 채우니, 과장 광고의 허술함이 저절로 드러났음.","성분을 투명하게 공개하는 디 오디너리가 하는 비판이라 설득력이 있고, 비판 자체가 곧 '우리는 다르다'는 브랜드 광고가 됨."],"films":[{"kind":"메인 필름","title":"The Periodic Fable™ 15초 버전","url":"https://www.youtube.com/watch?v=k3yOJw3wnXI"}],"videoDesc":[{"h":"메인 필름 (약 1분)","p":["하늘색 조명이 비치는 텅 빈 교실. 흰 실험복 같은 옷을 입은 사람들이 책상에 줄지어 앉아 있다. '시작.'","한 사람씩 얼굴에 손을 대고 문지르기 시작한다. '모공 제로.' '주름 삭제.' '비밀.' 단어가 들릴 때마다 학생들은 얼굴을 당기고, 두드리고, 굴리는 동작을 기계적으로 반복한다.","동작은 점점 기괴해진다. 머리에 이상한 기구를 쓴 학생, 얼굴을 비틀어 당긴 채 멍하니 앞을 보는 학생.","교실이 어두워지고, 학생들이 일어나 앞쪽 스크린을 바라본다. 스크린에는 원소 대신 뷰티 유행어로 채워진 '주기율 우화'.","디 오디너리 로고. 디 오디너리 웹사이트에서 주기율 우화를 확인하라."]}],"sources":[["Adweek (헬스 & 웰니스 GP)","https://www.adweek.com/creativity/the-ordinary-wins-big-among-8-grand-prix-winners-from-cannes-lions-2026-day-1/"],["More About Advertising (심사평)","https://www.moreaboutadvertising.com/news/uncommon-wins-its-first-grand-prix-cannes-day-one-winners/"],["Creative Review (캠페인 공개)","https://www.creativereview.co.uk/the-ordinary-periodic-fable-campaign/"],["D&AD (제작 배경)","https://www.dandad.org/work/annual-2026/behind-the-work/how-the-ordinary-created-a-twisted-science-lesson-to-expose-beauty-industry-myths"]]},
 {"id":"kitkat-heist","tier":"grand-prix","title":"The KitKat Heist","brand":"KitKat (Nestlé)","agency":"VML UK & Burson, London","country":"영국 / 유럽","cat":"PR","awards":["PR 그랑프리"],"video":"https://www.youtube.com/watch?v=5IafVHGyk-g","videoKind":"케이스 영상 · 한글 자막","ko":"부활절 직전 킷캣 12톤(약 41만 개)이 트럭째 도난당하자, 숨기는 대신 공개하고 누구나 포장지 제조번호로 도난품인지 확인할 수 있는 '킷캣 트래커'를 만들어 세계적인 화제로 바꾼 위기 대응 캠페인","bg":["2026년 3월 말, 부활절 대목을 일주일 앞두고 킷캣 12톤(약 41만 개)이 트럭째 도난당했음.","보통 기업은 이런 사고를 조용히 처리함. 과제는 공급망 위기를 브랜드에 상처 없이 넘기는 것. 마침 킷캣의 오랜 슬로건은 '해브 어 브레이크, 해브 어 킷캣(잠깐 쉬어, 킷캣 먹고)'이었음."],"solIntro":["숨기지 않고 먼저 공개했음. 슬로건을 비튼 유머로 도난 사실을 알리고, 사람들이 직접 도난품 추적에 참여하는 '도난 킷캣 트래커'를 만들어 위기를 범인 찾기 놀이로 바꿨음."],"sol":["공식 성명에서 도난을 확인하고 '소비자 안전에는 문제가 없다'고 밝히면서, '늘 쉬어 가라고 말해왔지만 범인들이 너무 곧이곧대로 들은 것 같다. 그래도 그들의 탁월한 취향은 인정한다'는 농담을 섞었음","포장 뒷면의 8자리 제조번호를 입력하면 도난품인지 확인할 수 있는 웹 트래커 공개. 모인 증거는 경찰에 전달됨","사건 발생에 맞춰 에이전시가 실시간으로 대응"],"stats":[["31%","93개 시장 화제 점유율(첫 10일)"],["2억 2,400만 달러","획득 미디어 가치"],["220만 명","트래커 참여"]],"results":["첫 10일 동안 93개 시장에서 화제 점유율 31%, 획득 미디어 가치 2억 2,400만 달러를 기록함. 220만 명이 트래커에 참여했고, 미스터비스트가 '나 아니야'라고 답하는 등 유명인과 다른 브랜드까지 화제에 올라탔음. 이번 칸 PR 그랑프리. 심사위원장은 '위험을 없애지 않았다. 위험을 연출했다'고 평가함."],"analysis":["숨기면 소문이 되고, 먼저 말하면 이야기가 됨. '휴식'을 말해온 브랜드가 통째로 털렸다는 상황 자체가 이미 농담거리였기에, 킷캣은 그 농담을 먼저 꺼내 주도권을 잡았음.","트래커는 재미와 실용을 함께 잡았음. 사람들은 놀이처럼 참여했지만 실제로는 도난품 유통을 막고 수사 증거를 모으는 도구였음. 소비자 안전을 먼저 밝혀 유머가 가볍게 보이지 않게 한 것도 위험 관리의 일부."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초, 한글 자막)","p":["부활절을 일주일 앞둔, 초콜릿 업계의 대목. 킷캣에 공급망 위기가 닥쳤다. 숨기는 대신, 킷캣은 세상에 알렸다.","공식 성명. 킷캣 12톤이 이탈리아 중부 공장에서 폴란드로 가던 중 도난당했다. 현지 당국, 공급망 파트너와 긴밀히 협조하고 있다. 다행히 소비자 안전에는 문제가 없다. 성명은 1억 4,300만 회 조회됐다.","'우리는 늘 사람들에게 쉬어 가라고 말해왔지만, 범인들이 그 말을 너무 곧이곧대로 들은 것 같다. 그래도 그들의 탁월한 취향은 인정한다.'","뉴스가 쏟아진다. 대규모 초콜릿 도난 사건. 초콜릿을 가득 실은 트럭이 사라졌다. 이른바 '킷캣 대도난 사건.' 수천 개의 밈과 패러디가 뒤따랐다.","세상의 관심이 쏠린 그때, 킷캣은 그 관심을 행동으로 바꿨다. 도난 킷캣 트래커. 41만 개가 넘는 킷캣이 도난당했다. 당신의 킷캣도 그중 하나일까? 포장 뒷면의 8자리 제조번호를 입력하면 바로 확인할 수 있다.","사람들이 직접 킷캣을 확인한다. 뉴스 앵커가 말한다. '범인을 잡는 기발한 방법이네요.' 범죄 사건으로 시작한 일이 재미있는 놀이가 됐다.","220만 명이 트래커에 참여했고, 모인 증거는 경찰에 전달됐다. 하나의 아이디어가 수사의 실마리를 열었다.","사람들은 킷캣 노래를 만들고, 다른 브랜드들은 킷캣 광고를 대신 만들어줬다. 그리고 사람들은 킷캣을 샀다. 이렇게 재앙이 마케팅 성공으로 바뀌었다.","93개 시장에서 화제 점유율 31%. 기사 6,522건, 도달 8억 840만. 포브스는 '기발하다', 패스트컴퍼니는 '달콤한 PR 승리'. 마지막으로 미스터비스트의 한마디. '나 아니야!'"]}],"sources":[["LBB Online (수상·성과·심사평)","https://lbbonline.com/news/kitkat-heist-grand-prix-cannes-lions"],["ABC/AP (도난 사건)","https://abc13.com/post/nestl-says-413793-kitkat-candy-bars-stolen-en-route-italy-poland/18802601/"],["CB News (PR 그랑프리)","https://www.cbnews.fr/node/101953"],["Media & Marketing (게레티 그랑프리)","https://www.media-marketing.com/en/news/kitkat-heist-wins-two-grand-prix-awards-at-the-2026-gerety-awards/"]]},
 {"id":"look-familiar","tier":"grand-prix","title":"Look Familiar?","brand":"Heinz","agency":"Rethink, Toronto","country":"캐나다 / 글로벌","cat":"Print & Publishing","awards":["프린트 & 퍼블리싱 그랑프리"],"video":"https://www.youtube.com/watch?v=Y_uSSmgEb-M","videoKind":"케이스 영상 · 한글 자막","ko":"전 세계 패스트푸드점의 감자튀김 상자가 하인즈 로고의 윤곽과 똑같이 생겼다는 데서 출발해, 브랜드 이름 없이 '감자튀김엔 하인즈'를 떠올리게 만든 캠페인","bg":["물가가 오르면서 케첩 가격이 1년 사이 30% 가까이 뛰었고, 소비자들은 더 싼 PB 케첩으로 옮겨 가며 하인즈의 점유율이 떨어졌음.","사람들에게 감자튀김에 어울리는 건 '케첩'이지 꼭 하인즈는 아니었음. 과제는 이 생각을 '감자튀김엔 하인즈'로 바꾸는 것."],"solIntro":["이미 눈앞에 있던 연결고리를 찾아냈음. 하인즈 병 라벨의 '키스톤' 로고(위가 넓고 아래가 좁은 방패 모양)가 어느 패스트푸드점의 감자튀김 상자와도 똑같이 생겼다는 것. 감자튀김 상자 자체를 하인즈 로고로 보이게 만들었음."],"sol":["감자튀김 상자에 하인즈 로고 윤곽선만 얹은 비주얼에 '어디서 많이 본 모양이죠?(Look Familiar?)'라는 질문 하나","시카고, 멕시코시티, 두바이 등 세계 곳곳의 실제 감자튀김 상자를 활용. 어느 브랜드 상자든 하인즈 로고처럼 보인다는 걸 보여줌","8개 시장에서 신문, 옥외, 디지털, 소셜로 동시 진행","우버이츠와 제휴해, 하인즈를 쓰지 않는 식당에서 주문해도 하인즈 케첩을 추가할 수 있게 함"],"stats":[["16억","노출"],["+222%","미국 플랫폼 내 판매 증가"],["415편","출품작 중 그랑프리"]],"results":["16억 회 노출을 기록했고, 미국 배달 플랫폼에서 하인즈 판매가 222% 늘었음. 이번 칸 프린트 & 퍼블리싱 그랑프리. 심사위원장은 '모두가 더하는 데 집중한 해에 최고의 작품은 덜어낼 줄 아는 자신감을 가졌다'고 평가함."],"analysis":["문제는 '감자튀김엔 케첩'이지 '하인즈'가 아니라는 것. 감자튀김 상자와 하인즈 로고가 닮았다는 걸 짚어주는 순간, 경쟁사 상자까지 하인즈를 떠올리게 하는 광고판이 됨.","수십 년간 키스톤 로고를 지켜온 덕분에 이름 없이도 알아보는 아이디어가 가능했고, 우버이츠 제휴로 그 연상이 바로 주문으로 이어지게 했음."],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["클래식한 광고 회의실. 감자튀김 그림을 앞에 두고 한 남자가 말한다. '깔끔하고 단순하죠.'","누구나 안다. 감자튀김엔 케첩이다. 하지만 식료품 가격이 오르자 케첩 가격은 1년 사이 30% 가까이 뛰었고, 사람들은 고민하기 시작했다. 하인즈를 계속 살까, PB 제품을 고를까? 하인즈의 시장 점유율이 떨어지기 시작했다.","그래서 증명해야 했다. 감자튀김엔 그냥 케첩이 아니라 하인즈라는 걸. 늘 눈앞에 있었지만 알아채지 못했던 연결고리로.","패스트푸드점 테이블 위의 빨간 감자튀김 상자. 그 위에 하인즈 키스톤 로고의 윤곽선이 겹쳐진다. 어디서 많이 본 모양이죠?","어느 브랜드든 상관없다. 감자튀김 상자는 하인즈 로고와 꼭 닮았다. 시카고, 멕시코시티, 두바이. 이 발견을 글로벌 캠페인으로 만들었다.","멕시코시티 광장의 대형 설치물, 두바이 건물 외벽의 전광판, 일본·브라질·아랍에미리트의 SNS 콘텐츠. 전 세계를 뒤져 감자튀김 상자를 찾았다. 버거킹 같은 다른 브랜드의 상자까지.","하인즈를 쓰지 않는 식당이라도 괜찮다. 우버이츠와의 글로벌 제휴로, 감자튀김을 주문할 때 하인즈 케첩을 함께 담을 수 있다.","사람들의 반응이 쏟아진다. '와, 은근히 각인시키네. 잘 만들었다.' 언론은 '단순한 진실', '하인즈의 힘을 증명했다'고 평가했다.","하인즈여야 하니까. It Has to Be Heinz."]}],"sources":[["Reason Why (수상·전략·성과)","https://www.reasonwhy.es/actualidad/heinz-look-familiar-grand-prix-print-publishing-cannes-lions-2026"],["CB News (심사평·출품 수)","https://www.cbnews.fr/node/101867"],["Contagious (프린트 수상)","https://www.contagious.com/article/cannes-lions-2026-print-publishing-winners-b8be93a4aa344bc792c3c00923e4271a"],["llllitl (캠페인 구성)","https://www.llllitl.fr/2026/07/heinz-look-familiar/"]]},
 {"id":"coqui-alarmed","tier":"grand-prix","title":"Coquí Alarmed","brand":"Hyundai Puerto Rico","agency":"BBDO Puerto Rico, Guaynabo","country":"푸에르토리코","cat":"Audio & Radio","awards":["오디오 & 라디오 그랑프리"],"video":"https://www.youtube.com/watch?v=7c3lwGVq8zs","videoKind":"케이스 영상 · 한글 자막","ko":"관광객이 '시끄럽다'고 한 푸에르토리코의 상징, 코키 개구리 울음소리를 렌터카 잠금 알림음으로 바꿔, 섬에 도착한 모든 여행자가 그 소리로 환영받게 만든 현대자동차 푸에르토리코의 캠페인","bg":["코키는 푸에르토리코 사람들에게 '집에 왔다'는 뜻으로 통하는 개구리 울음소리. 그런데 2025년 5월, 레딧에 '시끄러운 개구리를 조용히 시킬 스프레이가 없냐'는 관광객 이야기가 올라오며 전국적인 분노가 일었음.","현대는 이 순간에 푸에르토리코 사람들 편에 서서, 단순히 차를 파는 회사가 아니라 이 섬의 브랜드라는 걸 보여주고 싶었음."],"solIntro":["관광객이 섬에서 가장 먼저 만나는 것 중 하나가 렌터카. 그 렌터카의 잠금·해제 '삑' 소리를 코키 울음소리로 바꿨음. 소리를 시끄럽다고 하던 관광객들이, 이제 차 문을 열고 잠글 때마다 그 소리를 듣게 됨."],"sol":["AVIS, 엔터프라이즈, 찰리 카 렌탈 등 렌터카 회사와 손잡고 현대 렌터카의 기본 알림음을 코키 울음소리로 교체","차량마다 코키의 문화적 의미와 생태적 중요성을 알리는 안내문을 비치. 코키 14종 중 3종이 멸종 위기라는 사실도 함께 알림","렌터카를 '푸에르토리코 문화를 알리는 홍보대사'로 만든다는 콘셉트"],"stats":[["3종","멸종 위기에 놓인 코키(전체 14종 중)"]],"results":["현지 방송과 SNS에서 화제가 됐고, 렌터카가 아닌 자기 차에도 같은 소리를 넣어달라는 요청이 이어졌음. 이번 칸 오디오 & 라디오 그랑프리. 심사위원장 오리엘 데이비스-라이언스는 '이 부문을 새로운 방식으로 생각하게 만들었다'며, 아주 지역적인 이야기인데도 심사위원 모두가 감탄했다고 평가함."],"analysis":["관광객과 현지인의 갈등에서 현지인의 편을 들되, 관광객을 비난하지 않았음. 대신 관광객이 매일 쓰는 렌터카에 그 소리를 넣어, 싫어하던 소리를 '이 섬에 왔다는 신호'로 바꿔 들리게 했음.","라디오 광고가 아니라 제품 기능(알림음) 자체를 오디오 매체로 썼다는 점이 이 부문에서 새로웠음. 매일 수십 번 울리는 소리라 광고비 없이도 반복 노출되는 구조."],"videoDesc":[{"h":"케이스 영상 (약 2분, 한글 자막)","p":["밤의 숲, 코키 한 마리가 운다. 푸에르토리코 사람들에게 이 소리는 '집에 왔다'는 뜻이다. 거리 곳곳의 벽화에도 코키가 그려져 있다.","그런데 2025년 5월, 레딧 게시글 하나가 전국적인 분노를 일으켰다. 콘다도의 식당에서 한 커플이 에어비앤비 숙소 주변에 스프레이를 뿌려 개구리를 조용히 시킨다는 이야기를 들었다는 글이다. '시끄러운 개구리를 조용히 시킬 스프레이가 없나요?'","모든 건 레딧에 올라온 이 글에서 시작됐다. 뉴스와 SNS가 들끓었고, 푸에르토리코 사람들은 한목소리로 응답했다.","현대도 자부심을 갖고 응답했다. 현대 렌터카를 푸에르토리코 문화를 알리는 홍보대사로 바꿨다. 엔터프라이즈, AVIS의 현대 차량들이 나온다.","현대가 선보이는 '코키 알람(Coquí Alarmed)'. 전에는 차 문을 잠그면 '삑' 소리가 났다. 이제는 열쇠 버튼을 누르면 코키가 운다.","찰리 카 렌탈의 호세 마르티네스는 이 소리를 듣는 관광객들이 푸에르토리코의 아름다운 경험을 가져가게 될 거라고 말한다. 현대 푸에르토리코의 기예르모 로드리게스는 현대가 단순히 차를 파는 브랜드가 아니라고, 이것이 푸에르토리코의 정체성이자 자부심이라고 말한다.","현지 방송과 SNS에 '현대가 코키 편에 섰다'는 반응이 쏟아진다. 렌터카를 빌린 여행자들도 차 알림음이 코키 소리라 신기하다는 후기를 남긴다.","화면 가득 코키들이 모인다. '이제 섬의 심장 소리는 우리를 가장 크게 알리는 소리가 됐다.'"]}],"sources":[["Branding in Asia (수상·심사평)","https://www.brandinginasia.com/hyundais-coqui-alarmed-campaign-wins-cannes-grand-prix/"],["Hyundai Motor Group (수상·멸종 위기 종)","https://www.hyundaimotorgroup.com/en/news/hyundai-motor-company-cannes-lions-grand-prix-awards"],["Contagious (오디오 & 라디오 수상)","https://www.contagious.com/article/cannes-lions-2026-audio-radio-winners-f3b44be1beab469b97a71fc6c5d53934"],["llllitl (캠페인 구성)","https://www.llllitl.fr/2026/07/hyundai-coqui-alarmed/"]]},
 {"id":"could-have-been-a-heineken","tier":"grand-prix","title":"Could Have Been a Heineken","brand":"Heineken","agency":"LePub, Milan & São Paulo","country":"브라질 / 이탈리아","cat":"Social & Creator","awards":["소셜 & 크리에이터 그랑프리","미디어 골드 2개","다이렉트 골드","다이렉트 실버"],"video":"https://www.youtube.com/watch?v=ZEjMBG0Ifzs","videoKind":"케이스 영상","ko":"3분 넘는 긴 음성 메시지를 왓츠앱 봇에 전달하면 맥주 쿠폰을 줘서, '이럴 거면 만나서 하이네켄 한잔하면서 얘기하자'로 바꾼 하이네켄 캠페인","bg":["사람들은 1년에 150시간 가까이를 음성 메시지에 씀. 절반 넘는 사람이 음성 메시지가 직접 만나는 대화를 대신하고 있다고 느꼈지만, 54%는 여전히 얼굴 보고 하는 대화가 더 좋다고 답함.","친구와 만나 맥주 마시는 자리가 줄어든다는 건, 하이네켄이 마시는 순간이 줄어든다는 뜻."],"solIntro":["누구나 받아본 '친구의 끝없는 음성 메시지'를 만남의 초대장으로 바꿨음. 3분 넘는 음성 메시지를 하이네켄 왓츠앱 봇에 전달하면 맥주 쿠폰과 근처 바 추천을 보내줌. 메시지가 길어질 만큼 할 얘기가 많다면, 차라리 만나서 하라는 것."],"sol":["왓츠앱과 함께 전용 봇을 만들어 음성 메시지 사용량이 세계 평균의 4배인 브라질에서 먼저 시작","3분 이상의 음성 메시지를 봇에 전달하면 무료 하이네켄 쿠폰과 만날 수 있는 근처 바를 추천","'긴 음성 메시지 보내는 친구' 밈을 활용한 크리에이터 콘텐츠, 소셜 트렌드 리믹스, 지하철역 옥외 광고로 확산","메시지 내용은 암호화된 비공개 봇에서 처리"],"stats":[["150시간","1년간 음성 메시지에 쓰는 시간"],["4배","브라질의 음성 메시지 사용량(세계 평균 대비)"]],"results":["더 버지, 파이낸셜 타임스 등이 소개했고, 하이네켄은 이 캠페인으로 소셜 & 크리에이터 그랑프리를 포함해 라이언 5개를 받음. 하이네켄은 2026년 칸 '올해의 크리에이티브 브랜드'로 선정됐고, LePub 밀라노는 '올해의 에이전시'가 됨. 심사위원단은 새로운 이벤트를 만들지 않고 이미 수많은 사람이 하는 행동에 들어갔다는 점을 높이 평가함."],"analysis":["하이네켄의 적은 다른 맥주가 아니라 '안 만나도 되는 습관'이었음. 그 습관의 상징인 긴 음성 메시지를 정확히 짚어, 메시지가 길어지는 순간을 만나자는 신호로 바꿨음.","새로운 앱을 깔게 하지 않고 사람들이 이미 쓰는 왓츠앱 안에서 '전달' 한 번으로 끝나게 했음. 밈으로 공감을 얻고, 쿠폰과 바 추천으로 실제 만남까지 이어지는 구조."],"videoDesc":[{"h":"케이스 영상 (약 1분 50초)","p":["SNS 영상들이 이어진다. '긴 음성 메시지 보내는 그 친구.' 메시지를 녹음하다 카드로 탑을 쌓고, 하던 말을 잊어버린다. '잠깐, 무슨 말 하려고 했지?' 9분짜리 음성 메시지를 받고 '이건 팟캐스트잖아'라고 투덜대는 사람도 나온다.","소파에 앉은 남자가 '긴 음성 메시지 미안, 근데…' 하며 말을 이어간다. 화면에 문구가 뜬다. '하이네켄이었을 수도 있었는데(Could have been a Heineken).' 길에서 끝없이 녹음하는 사람들에게도 같은 문구가 붙는다.","방법은 간단하다. 3분 넘는 음성 메시지를 하이네켄 봇에 전달한다. 그러면 바에서 쓸 수 있는 맥주 쿠폰을 받는다.","지하철역 대형 전광판에 끝없이 이어지는 음성 메시지 파형과 '하이네켄이었을 수도 있었는데' 문구가 걸렸다. 브라질에서는 포르투갈어로 'Podia ser uma Heineken.'","'하이네켄이 끝없는 음성 메시지를 줄이고 진짜 만남을 되살린다.' 더 버지, 파이낸셜 타임스 같은 매체의 기사와 '천재적이다'라는 댓글이 쏟아진다. 크리에이터들도 직접 봇을 써보는 영상을 올린다.","마지막 질문. '뭘 듣고 싶나요?' 끝없는 음성 메시지, 아니면 친구들이 바에서 하이네켄 병을 부딪치는 소리?"]}],"sources":[["Contagious (리서치·작동 방식)","https://www.contagious.com/article/cannes-lions-2026-social-creator-winners-a7d0faec13bb409d906232a1ea7f6988"],["Meio & Mensagem (수상 내역·메커니즘)","https://www.meioemensagem.com.br/cannes/lepub-e-heineken-recebem-grand-prix-de-social-creator"],["CB News (심사평)","https://www.cbnews.fr/node/101958"],["Ads of the World (캠페인 개요)","https://www.adsoftheworld.com/campaigns/could-have-been-a-heineken-case-study"]]},
 {"id":"paid-sick-leave-for-cows","tier":"grand-prix","title":"Paid Sick Leave for Cows","brand":"Too Good","agency":"The Partnership Agency, Nairobi","country":"케냐","cat":"Sustainable Development Goals","awards":["지속가능발전목표(SDG) 그랑프리","크리에이티브 전략 브론즈"],"video":"https://www.youtube.com/watch?v=FyDBnJOmXYw","videoKind":"케이스 영상","ko":"항생제 치료로 우유를 팔 수 없는 며칠 동안 젖소에게 '유급 병가'를 줘서, 농가가 소득을 잃지 않고도 안전한 우유만 내놓게 만든 케냐 유제품 브랜드의 캠페인","bg":["케냐에서 젖소가 항생제 치료를 받으면 3~5일간 우유를 팔 수 없음. 그동안의 소득을 잃는 게 부담스러운 농가들이 항생제가 남은 우유를 그대로 내다 팔았고, 우유 샘플 4개 중 1개에서 항생제가 검출됐음.","유제품 회사가 우유값을 올려 보전해주면 시장 전체가 흔들림. 농가의 양심에 기대지 않고 구조를 바꿀 방법이 필요했음."],"solIntro":["사람은 아프면 유급 병가를 받는데, 우유를 만드는 젖소는 '일꾼'이 아니라 '가축'이라 보호받지 못함. 그래서 젖소를 일꾼으로 보고, 항생제 치료 기간을 '유급 병가'로 처리해 그동안의 우유 소득을 투굿이 대신 보전해줬음."],"sol":["농가가 왓츠앱으로 젖소의 병가를 신청","투굿이 간단한 대시보드로 신청을 확인하고, 우유를 팔 수 없는 휴약 기간만큼 하루 단위로 보상","우유에서 항생제가 나와도 숨기지 않고 병가로 처리하는 문화를 만듦"],"stats":[["2만 7,000달러","8개월간 농가에 돌려준 보상금"],["4개 중 1개","항생제가 검출된 우유 샘플"],["3~5일","항생제 치료 후 우유를 팔 수 없는 기간"]],"results":["8개월 동안 농가가 팔지 않고 폐기한 우유에 대해 2만 7,000달러를 보상함. 이번 칸 SDG 그랑프리로, 케냐가 받은 첫 칸 그랑프리. 심사위원장 가즈 사토는 '사람에게 회복이 중요하다면 소에게는 왜 안 되는가'라며, '서로 손해처럼 보이던 문제를 사람과 기업, 다른 생명 모두를 위한 가치로 바꿨다'고 평가함."],"analysis":["항생제 우유가 시장에 나오는 건 농가가 나빠서가 아니라, 안전하게 하면 손해를 보는 구조 때문이었음. 투굿은 그 손해를 대신 떠안아, 안전하게 하는 쪽이 손해 보지 않게 만들었음.","'젖소의 유급 병가'라는 이름이 복잡한 식품 안전 제도를 누구나 바로 이해하게 만들었음. 단순한 프레임 하나로 동물 복지, 농가 소득, 소비자 안전을 한꺼번에 묶었음."],"videoDesc":[{"h":"케이스 영상 (약 2분 15초)","p":["케냐는 사하라 이남 아프리카에서 1인당 우유 소비가 가장 많은 나라다. 매일 180만 명의 케냐 낙농가가 어려운 선택을 한다. 소득을 지킬 것인가, 국민 건강을 지킬 것인가.","뉴스가 우유 품질 문제를 보도한다. 케냐 낙농위원회는 우유 생산과 관리 기준이 무너졌다고 말한다.","낙농 관계자가 설명한다. 젖소가 항생제 처방을 받으면 3~5일의 휴약 기간을 지켜야 하고, 그동안 우유는 버려야 한다. 농가에는 소득 손실이다. 그래서 항생제가 남은 우유가 시장에 흘러들었다.","투굿 관계자가 말한다. 농가에 돈을 더 주면 항생제 우유를 막을 수 있지만, 제조사가 우유값을 계속 올리면 시장 전체가 무너진다. 그래서 다른 해법을 찾아야 했다.","다른 모든 산업에서는 일하는 사람이 아프면 소득이 보호된다. 그런데 낙농업에서 우유 1리터를 만드는 일꾼은 '일꾼'이 아니라 '가축'으로 불린다. 노동법은 가치를 만드는 이들을 보호하지만, 종(種)은 언급하지 않는다.","투굿이 선보이는 '젖소를 위한 유급 병가'. 노동 제도를 다시 만들어, 젖소를 일꾼처럼 대하고 농가에 젖소의 유급 병가를 제공했다.","농가는 왓츠앱으로 병가를 신청했다. 투굿은 간단한 대시보드로 신청을 승인하고, 휴약 기간을 유급 병가로 보상했다.","우유를 버리는 데는 비용이 든다. 투굿은 그 비용을 위로 옮겨, 우유뿐 아니라 안전한 관행을 벌주던 구조를 고쳤다. '이제 우유에서 항생제가 나와도 숨기지 않아요. 젖소는 병가를 받고 농부는 그날 몫을 받죠. 그러니 위험한 우유를 팔 이유가 없어요.'","마지막 말. 이건 하루짜리 해결책이 아니라, 소득이 위험에 기대지 않고 안전이 희생에 기대지 않는, 일의 가치를 매기는 새로운 방식이다."]}],"sources":[["African Marketing Confederation (문제·성과·심사평)","https://africanmarketingconfederation.org/kenyan-agency-wins-first-cannes-lions-grand-prix-in-nations-history/"],["CB News (SDG 그랑프리)","https://www.cbnews.fr/node/102024"],["LBB Online (수상 내역)","https://lbbonline.com/news/MEA-Cannes-Lions-Winners-2026"],["Ads of the World (캠페인 개요)","https://www.adsoftheworld.com/campaigns/paid-sick-leave-for-cows-case-study"]]},

const isDone = e => !!e.bg;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = u => { try { const h = new URL(u).hostname.replace("www.",""); return h.includes("youtu") ? "YouTube" : h.includes("vimeo") ? "Vimeo" : h; } catch(e){ return "링크"; } };

/* 일반 웹사이트(깃허브)에서만 실제 썸네일·페이지 내 재생 사용. Claude 아티팩트는 외부 이미지·영상을 막기 때문 */
const LIVE = !/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname) && location.protocol.startsWith("http");
function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/shorts\/)([\w-]{11})/); return m?m[1]:null; }
function vmId(u){ const m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/); return m?m[1]:null; }
function thumbOf(u){ const y=ytId(u); if(y) return `https://i.ytimg.com/vi/${y}/hqdefault.jpg`; const v=vmId(u); if(v) return `https://vumbnail.com/${v}.jpg`; return null; }
function embedOf(u){ const y=ytId(u); if(y) return `yt:${y}`; const v=vmId(u); if(v) return `https://player.vimeo.com/video/${v}?autoplay=1&title=0&byline=0&portrait=0&badge=0&dnt=1`; return null; }
let ytApi=null;
function loadYT(){ if(ytApi) return ytApi; ytApi=new Promise(res=>{ if(window.YT&&YT.Player) return res(); window.onYouTubeIframeAPIReady=()=>res(); const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc); }); return ytApi; }
const fmtT=t=>{t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
async function mountYT(btn,id){
  const w=document.createElement("div"); w.className="yt"; w.innerHTML=`<div class="yt-stage"><div class="yt-frame"><div></div></div><div class="yt-poster" style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)"><span class="yt-big"></span></div><div class="yt-hit" aria-hidden="true"></div></div><div class="yt-bar"><button type="button" class="yt-pp" aria-label="재생/일시정지"></button><input class="yt-seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치"><span class="yt-time">0:00</span><button type="button" class="yt-mute" aria-label="음소거"></button><button type="button" class="yt-fs" aria-label="전체 화면"></button></div>`;
  btn.replaceWith(w);
  await loadYT();
  const host=w.querySelector(".yt-frame div"), pp=w.querySelector(".yt-pp"), seek=w.querySelector(".yt-seek"), time=w.querySelector(".yt-time"), mute=w.querySelector(".yt-mute");
  let dragging=false, timer=null;
  const pl=new YT.Player(host,{videoId:id,host:"https://www.youtube-nocookie.com",playerVars:{autoplay:1,controls:0,rel:0,iv_load_policy:3,playsinline:1,disablekb:1,cc_load_policy:0,fs:0,modestbranding:1},events:{
    onReady:e=>{ try{pl.unloadModule("captions");}catch(_){} e.target.playVideo(); timer=setInterval(()=>{ const d=pl.getDuration?.()||0, c=pl.getCurrentTime?.()||0; if(d&&!dragging) seek.value=Math.round(c/d*1000); time.textContent=fmtT(c)+" / "+fmtT(d); },250); },
    onStateChange:e=>{ w.classList.toggle("playing",e.data===1); if(e.data===1) w.classList.add("started"); if(e.data===0) w.classList.remove("started"); if(e.data===1){ try{pl.unloadModule("captions");}catch(_){} } if(e.data===0){ w.classList.remove("playing"); } }
  }});
  const toggle=()=>{ const st=pl.getPlayerState?.(); st===1?pl.pauseVideo():pl.playVideo(); };
  w.querySelector(".yt-hit").addEventListener("click",toggle); pp.addEventListener("click",toggle);
  seek.addEventListener("input",()=>{dragging=true;}); seek.addEventListener("change",()=>{ const d=pl.getDuration()||0; pl.seekTo(seek.value/1000*d,true); dragging=false; });
  mute.addEventListener("click",()=>{ if(pl.isMuted()){pl.unMute();w.classList.remove("muted");}else{pl.mute();w.classList.add("muted");} });
  w.querySelector(".yt-fs").addEventListener("click",()=>{ document.fullscreenElement?document.exitFullscreen():(w.requestFullscreen||w.webkitRequestFullscreen).call(w); });
  w.tabIndex=0; w.addEventListener("keydown",ev=>{ if(ev.key===" "||ev.key==="k"){ev.preventDefault();toggle();} });
}
function plate(e, big, label, url){
  const cls = TIERS[e.tier].cls;
  const th = LIVE ? thumbOf(url||e.video) : null;
  return `<div class="plate p-${cls} ${th?"has-thumb":""}">${th?`<img class="thumb" src="${esc(th)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-thumb');this.remove()">`:""}<span class="rings"></span>
    <span class="cat">${esc(label||e.cat||"")}</span>
    <span class="mark">${esc(e.brand)}</span>
    ${e.noVideo ? "" : '<span class="play" aria-hidden="true"></span>'}</div>`;
}

function renderNav(route){
  const nav = document.getElementById("nav");
  const cur = route.startsWith("c-") ? (E.find(x => "c-"+x.id === route)||{}).tier : route;
  nav.innerHTML = Object.entries(TIERS).map(([k,t]) =>
    `<a href="#${k}" ${cur===k?'aria-current="page"':""}><span class="dot" style="background:var(--${t.cls})"></span>${t.short}</a>`).join("");
}

function home(){
  const tiles = Object.entries(TIERS).map(([k,t]) => {
    const list = E.filter(e => e.tier===k), done = list.filter(isDone).length;
    const meta = list.length ? `${done} / ${list.length}편 정리 완료` : "정리 예정";
    const pct = list.length ? Math.round(done/list.length*100) : 0;
    return `<a class="tiertile t-${t.cls} ${list.length?"":"soon"}" href="#${k}">
      <span class="meta">${k==="grand-prix"?"GRAND PRIX · TITANIUM":k.toUpperCase()}</span>
      <h2>${t.name}</h2>
      <div><div class="meta" style="margin-bottom:8px">${meta}</div><div class="bar"><i style="width:${pct}%"></i></div></div></a>`;
  }).join("");
  return `<section class="hero">
    <span class="eyebrow">Cannes Lions International Festival of Creativity · 2026</span>
    <h1>2026 칸 라이언즈 수상작을<br>한국어로 읽는 아카이브</h1>
    <p>수상 등급별로 작품을 모았음. 각 작품은 배경 및 문제, 해결, 영상, 성과, 분석 순서로 정리.</p>
  </section>
  <div class="tiergrid">${tiles}</div>
  <p class="note">수상작 목록은 Love The Work More의 2026 정리 페이지를 기준으로 함. 배경과 전략은 각 작품 페이지 하단에 표기한 업계 매체·심사 자료를 바탕으로 정리했음. 영상은 보안상 페이지 안에서 바로 재생되지 않아, 썸네일을 누르면 YouTube·Vimeo 원본이 새 탭으로 열림.</p>`;
}

let filter = "all";
function tierPage(k){
  const t = TIERS[k], list = E.filter(e => e.tier===k);
  if(!list.length) return `<div class="listhead"><h1>${t.name}</h1></div><div class="pendingbox">${t.name} 수상작은 그랑프리 정리가 끝난 뒤 순서대로 추가할 예정임.</div>`;
  const shown = filter==="done" ? list.filter(isDone) : list;
  const cards = shown.map(e => `<a class="card ${isDone(e)?"":"pending"}" href="#c-${e.id}">
      ${plate(e,false,null,e.video)}
      <div><div class="ttl">${esc(e.title)}</div><div class="sub">${esc(e.brand)}${e.awards?" · "+esc(e.awards.join(", ")):""}</div></div>
      <div>${isDone(e)?'':'<span class="chip">정리 예정</span>'}</div></a>`).join("");
  return `<div class="listhead"><div><span class="eyebrow">${k==="grand-prix"?"Grand Prix · Titanium":k}</span><h1>${t.name}</h1></div>
    <span class="count">${list.filter(isDone).length} / ${list.length}편 정리 완료</span></div>
    <div class="filters" role="group" aria-label="보기">
      <button type="button" id="f-all" aria-pressed="${filter==="all"}" data-f="all">전체</button>
      <button type="button" id="f-done" aria-pressed="${filter==="done"}" data-f="done">정리 완료만</button>
    </div>
    <div class="cards">${cards}</div>`;
}

function paras(arr){ return arr.map(p => `<p>${esc(p)}</p>`).join(""); }
function detail(e){
  const t = TIERS[e.tier], list = E.filter(x => x.tier===e.tier), i = list.indexOf(e);
  const prev = list[i-1], next = list[i+1];
  const awards = (e.awards||[]).map(a => `<span class="award p-${t.cls}">${esc(a)}</span>`).join("");
  const vids = [{kind: e.videoKind || (e.noVideo ? "케이스 자료" : "케이스 영상"), url:e.video}].concat(e.films||FILMS[e.id]||[]);
  let body, body2 = "";
  if(isDone(e)){
    body = `<article>
      <section><h2>배경 및 문제</h2><div>${paras(e.bg)}</div></section>
      <section><h2>해결</h2><div>${paras(e.solIntro)}<ul style="margin-top:4px">${e.sol.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
    </article>`;
    body2 = `<article>
      <section><h2>성과</h2><div>${e.stats?`<div class="stats">${e.stats.map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>`:""}${paras(e.results)}</div></section>
      <section><h2>분석</h2><div>${paras(e.analysis)}</div></section>
    </article>`;
  } else {
    body = `<div class="pendingbox">이 작품의 배경과 전략은 아직 정리 전임. 영상과 수상 정보만 먼저 확인할 수 있음.</div>`;
  }
  const facts = `<aside class="facts"><dl>
      <div><dt>브랜드</dt><dd>${esc(e.brand)}</dd></div>
      <div><dt>캠페인</dt><dd>${esc(e.title)}</dd></div>
      <div><dt>에이전시</dt><dd>${esc(e.agency)}</dd></div>
      ${e.country?`<div><dt>국가</dt><dd>${esc(e.country)}</dd></div>`:""}
      <div><dt>수상</dt><dd>${esc((e.awards||["골드"]).join(" / "))}</dd></div>
    </dl>
    ${e.sources?`<div class="sources"><span class="eyebrow">출처</span><ol>${e.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ol></div>`:""}
  </aside>`;
  const head = `<a class="back" href="#${e.tier}">← ${t.name} 목록</a>
    <header class="dhead"><div class="awards">${awards}</div><h1>${esc(e.title)}</h1>${e.ko?`<p class="ko">${esc(e.ko)}</p>`:""}</header>`;
  const media = `<section class="media ${e.videoDesc?"with-desc":""}">
      <div class="vids ${vids.length>1?"two":""}">${vids.map(v=>{ const em = LIVE ? embedOf(v.url) : null; const meta=`<span class="vmeta"><b>${esc(v.kind)}</b><span>${v.title?esc(v.title)+" · ":""}<a href="${esc(v.url)}" target="_blank" rel="noopener">${host(v.url)}에서 보기 ↗</a></span></span>`; return em ? `<div class="video"><button type="button" class="vplay" data-embed="${esc(em)}" aria-label="${esc(v.kind)} 재생">${plate(e,true,v.kind,v.url)}</button>${meta}</div>` : `<div class="video"><a class="vlink" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(v.kind)} 열기">${plate(e,true,v.kind,v.url)}</a>${meta}</div>`; }).join("")}</div>
      ${e.videoDesc?`<details class="vdesc" id="vd-${e.id}"><summary>영상 내용</summary><div class="vbody">${e.videoDesc.map(sec=>typeof sec==="string"?`<p>${esc(sec)}</p>`:`<h4>${esc(sec.h)}</h4>${paras(sec.p)}`).join("")}${e.videoNote?`<p class="vnote">${esc(e.videoNote)}</p>`:""}<button type="button" class="vclose">접기 ▲</button></div></details>`:""}
    </section>`;
  const pager = `<nav class="pager">${prev?`<a href="#c-${prev.id}">← 이전<b>${esc(prev.title)}</b></a>`:"<span></span>"}${next?`<a href="#c-${next.id}" style="text-align:right">다음 →<b>${esc(next.title)}</b></a>`:""}</nav>`;
  // 정리 완료 작품: 배경·해결 → 영상 → 성과·분석
  if(isDone(e)){
    return `${head}
    <div class="dgrid"><div style="min-width:0">${body}</div>${facts}</div>
    ${media}
    <div class="dgrid"><div style="min-width:0">${body2}${pager}</div><div></div></div>`;
  }
  return `${head}
    ${media}
    <div class="dgrid"><div style="min-width:0">
      ${body}${body2}
      ${pager}
    </div>${facts}</div>`;
}

function route(keepScroll){
  const r = location.hash.replace("#","");
  const app = document.getElementById("app");
  let html;
  if(TIERS[r]) html = tierPage(r);
  else if(r.startsWith("c-") && E.find(e => "c-"+e.id===r)) html = detail(E.find(e => "c-"+e.id===r));
  else html = home();
  app.innerHTML = html;
  renderNav(r);
  if (matchMedia("(min-width: 861px)").matches) app.querySelectorAll(".media.with-desc .vdesc").forEach(d => d.open = true);
  app.querySelectorAll(".vclose").forEach(b => b.addEventListener("click", () => {
    const d = b.closest("details"); d.open = false;
    const r = d.getBoundingClientRect();
    if (r.top < 80) window.scrollBy({top: r.top - 90, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  app.querySelectorAll(".vplay").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.embed.startsWith("yt:")) return mountYT(b, b.dataset.embed.slice(3));
    const f = document.createElement("iframe");
    f.src = b.dataset.embed; f.className = "vframe"; f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; f.title = b.getAttribute("aria-label");
    b.replaceWith(f);
  }));
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; route(true); }));
  if(keepScroll !== true) window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => route());
route();
</script>
